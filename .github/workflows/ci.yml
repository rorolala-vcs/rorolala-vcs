name: CI

# Every way work reaches this repository is checked the same way, and a tag only adds the release to
# what was already checked: a push to `main`, a push to any other branch, a pull request into `main`,
# and a tag. The shape is deliberately one workflow rather than several — what a branch and a tag are
# held to must not be able to drift apart.
on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:
    branches: [main]

# A tag publishes a release, and only a tag does.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The cheap gate in front of the matrices: the run must leave the tree exactly as it found it. The
  # `git-lock` / `git-unlock` pair around the regeneration is what measures that — the unlock fails
  # when anything tracked moved — so a source generated into the tree and left stale is caught here
  # rather than after a full matrix has run.
  #
  # What is regenerated is the chunking crate's own registry and module list, which its build script
  # writes into `src/`. The `generated` step of `cargo ci check` additionally measures the chunking
  # corpus, and the corpus is deliberately not carried by this repository (see
  # `modules/chunking/corpus/.gitignore`): on a clean runner it is absent, and a score taken over
  # nothing would rewrite each `SCORE.md` while saying nothing about the policy. That half stays a
  # check for a machine that has the corpus; this is the half a runner can make.
  fast-check:
    name: Fast-Check
    runs-on: ubuntu-latest
    steps:
      # The runner checks out CRLF on Windows (the tree's own files are LF). A build rewrites a
      # generated file as LF, and `git-unlock` would read the difference between the two as a change
      # the run made. Setting this before the checkout is what makes the working tree the one the
      # build writes.
      - name: Use the tree's own line endings
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # The action brings rust-cache, which covers the registry and the dependency artifacts. It
          # has to be told where they are: cargo's output is `.cache/rs-target` rather than `target/`.
          cache-workspaces: |
            . -> .cache/rs-target
          cache-on-failure: true

      - name: Install the musl toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl musl-tools
          rustup target add x86_64-unknown-linux-musl
          {
            echo 'CARGO_BUILD_TARGET=x86_64-unknown-linux-musl'
            echo 'CC=musl-gcc'
          } >> "$GITHUB_ENV"

      - name: Configure git identity
        run: |
          git config --global user.email "ci@rorolala.invalid"
          git config --global user.name "rola CI"

      - name: Check formatting and translations
        run: |
          cargo ci fmt-check
          cargo ci i18n

      - name: Lock workspace for CI
        run: cargo ci git-lock

      - name: Regenerate the sources the build writes
        run: cargo build --quiet -p rorolala-chunking

      - name: Unlock workspace (idempotency check)
        if: always()
        run: cargo ci git-unlock --show-diff

  # Compiles, once per platform, what every job of that platform after this one would otherwise
  # compile on its own. The two are separate jobs rather than one matrix on purpose: a job waits for
  # everything it names in `needs`, so one pre-warm over both platforms would make the Linux jobs wait
  # for the Windows build, and Windows is the slower of the two.
  #
  # What is shared is the dependency artifacts, through rust-cache with a key that is the same in every
  # job of a platform — `cache-shared-key` replaces rust-cache's automatic per-job key. The workspace's
  # own crates are not shared: a fresh checkout gives them new mtimes, so cargo rebuilds them whatever
  # the cache holds, and caching them would only take space. What they are built against — `jj-lib`
  # above all — is the expensive part and is the same for all of them.
  #
  # The C ABI library is built by the same step the packaging uses, so what a musl target can make
  # there — the static library alone, see `dev/build/src/ops/library.rs` — is what this job produces
  # too, rather than a `cdylib` the target cannot make on a glibc machine.
  #
  # What this job does not share is the binaries themselves. A later job that needs a program gets it
  # by building it, as `cargo ci integration-test` does, because a cargo artifact is tied to the
  # checkout it was built from (cargo compares source mtimes); the cache is worth what it is worth
  # for dependencies, which do not change from job to job.
  #
  # A run whose dependency cache is already there has nothing to compile here: the cache restores
  # under its exact key, and the builds below are skipped. Only a run that has to make a new cache —
  # a changed `Cargo.toml`/`Cargo.lock`, a new toolchain, or an evicted cache — builds. That is what
  # keeps the warm path from serializing the matrix behind work whose output it never sees.
  #
  # The integration suites are a workspace of their own (`tests/`), so their dependencies are not in
  # the root target directory the builds above write. Without a build there, the integration job
  # compiles every suite's dependencies again on each run: the shared key is already taken, so what
  # it builds cannot be added to the cache.
  prewarm-windows:
    name: Pre-Warm (windows)
    needs: [fast-check]
    runs-on: windows-latest
    env:
      MUSL: "false"
    steps: &prewarm-steps
      - name: Use the tree's own line endings
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
      # The toolchain is set up without its own cache step, because that step does not say whether
      # the cache it found was the exact key. rust-cache is run directly below so that its
      # `cache-hit` can decide whether there is anything to warm; its inputs must stay the ones the
      # other jobs' `setup-rust-toolchain` passes, or the two would agree on no key at all.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        id: toolchain
        with:
          cache: false

      - id: rustcache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Stable over every job of this platform, so the matrix and the packaging job restore what
          # this job built instead of each building it again.
          shared-key: rola-${{ runner.os }}
          workspaces: |
            . -> .cache/rs-target
          cache-on-failure: true

      # The packages are what the .NET side needs, and restoring them does not need the SDK. The
      # cache is asked first so that a warm run can skip the SDK install and the restore below; what
      # those are for is filling the cache when it is not there.
      - name: Cache the NuGet packages
        id: nuget
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json', 'Directory.Build.props', 'RorolalaSharp.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - uses: actions/setup-dotnet@v4
        if: steps.nuget.outputs.cache-hit != 'true'
        with:
          dotnet-version: "10.0.x"

      - name: Install the musl toolchain
        if: env.MUSL == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl musl-tools
          rustup target add x86_64-unknown-linux-musl
          {
            echo 'CARGO_BUILD_TARGET=x86_64-unknown-linux-musl'
            echo 'CC=musl-gcc'
          } >> "$GITHUB_ENV"

      # Debug is what the tests and the documentation checks compile; release is what the programs
      # and the integration suites need, and what an export lays down.
      - name: Build the dependencies in debug
        if: steps.rustcache.outputs.cache-hit != 'true'
        run: cargo build --workspace --exclude rorolala-ffi --all-targets --all-features

      - name: Build what ships, in release
        if: steps.rustcache.outputs.cache-hit != 'true'
        run: cargo dev build

      # The two build tools are workspaces of their own, and every later step runs one of them.
      - name: Build the build tools
        if: steps.rustcache.outputs.cache-hit != 'true'
        run: |
          cargo build --manifest-path dev/build/Cargo.toml
          cargo build --manifest-path dev/ci/Cargo.toml

      # The suites are their own workspace and write their own target directory. Their cache is
      # kept apart from the root one: a change to a test manifest then invalidates only the suites,
      # and the root dependencies stay where they are.
      - name: Cache the integration suites' target
        id: tests-cache
        uses: actions/cache@v4
        with:
          path: tests/.cache/rs-target
          key: it-target-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('tests/Cargo.lock', 'Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', 'tests/.cargo/config.toml', 'rust-toolchain', 'rust-toolchain.toml') }}
          restore-keys: |
            it-target-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

      # Debug is what `cargo ci integration-test` runs.
      - name: Warm the integration suites
        if: steps.tests-cache.outputs.cache-hit != 'true'
        working-directory: tests
        run: cargo build --workspace --all-targets

      - name: Restore the .NET side
        if: steps.nuget.outputs.cache-hit != 'true'
        run: dotnet restore RorolalaSharp.sln

  prewarm-linux:
    name: Pre-Warm (linux)
    needs: [fast-check]
    runs-on: ubuntu-latest
    env:
      MUSL: "true"
    steps: *prewarm-steps

  # The gate itself, one check to a job so a failure is the failure of that check rather than of the
  # runner it happened to share. Each platform waits for its own pre-warm and for nothing of the
  # other's.
  #
  # Linux is built with the musl toolchain — `musl-gcc` is the linker (see the root
  # `.cargo/config.toml`) and the C runtime is static, which is what lets a musl binary run on a
  # machine with no musl installed.
  #
  # The one suite that does not run on that target is `tests/ffi-c`: it compiles C against the built
  # shared library, and a musl build has none (a `cdylib` needs a dynamic C runtime, and `musl-tools`
  # carries no `libgcc_s` to link one on a glibc machine). The gate skips it there and says so; see
  # `dev/ci/src/task/integration_test.rs`.
  #
  # `cargo ci check` is deliberately not what runs here: one of its steps is `generated`, which cannot
  # run without the corpus (see Fast-Check above), and a gate run in a shape of its own would be a
  # second gate. The steps below are that gate's own commands.
  check-windows:
    name: Check (windows / ${{ matrix.item }})
    needs: [fast-check, prewarm-windows]
    strategy:
      fail-fast: false
      matrix:
        item: [build, test, clippy, fmt, doc, integration, dotnet]
    runs-on: windows-latest
    env:
      MUSL: "false"
    steps: &check-steps
      - name: Use the tree's own line endings
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        id: toolchain
        with:
          # The key Pre-Warm saved under, so this job restores its dependencies rather than building
          # them again.
          cache-shared-key: rola-${{ runner.os }}
          cache-workspaces: |
            . -> .cache/rs-target
          cache-on-failure: true
      - uses: actions/setup-dotnet@v4
        with:
          # The version `global.json` pins; the projects themselves target `net8.0`.
          dotnet-version: "10.0.x"

      - name: Cache the NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json', 'Directory.Build.props', 'RorolalaSharp.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Only the integration job builds the suites, and their target is kept apart from the root
      # one (see Pre-Warm).
      - name: Restore the integration suites' target
        if: matrix.item == 'integration'
        uses: actions/cache@v4
        with:
          path: tests/.cache/rs-target
          key: it-target-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('tests/Cargo.lock', 'Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', 'tests/.cargo/config.toml', 'rust-toolchain', 'rust-toolchain.toml') }}
          restore-keys: |
            it-target-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

      - name: Install the musl toolchain
        if: env.MUSL == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl musl-tools
          rustup target add x86_64-unknown-linux-musl
          {
            echo 'CARGO_BUILD_TARGET=x86_64-unknown-linux-musl'
            echo 'CC=musl-gcc'
          } >> "$GITHUB_ENV"

      - name: Configure git identity
        run: |
          git config --global user.email "ci@rorolala.invalid"
          git config --global user.name "rola CI"

      # The C# bindings are generated from the header the Rust side writes, and the two items that
      # touch .NET — the .NET checks and the integration suites, whose projects reach the plugins that
      # bind the C ABI — are the ones that do not build Rust on their way there. It writes into cargo's
      # output only; the binding it generates is checked in, and the lock below is what says whether
      # what was generated is what is committed.
      - name: Build the C ABI header
        if: "matrix.item == 'dotnet' || matrix.item == 'integration'"
        run: cargo dev lib

      # Every check runs inside a lock / unlock pair: the final unlock doubles as the idempotency
      # check, failing the job when the check left the working tree dirty.
      - name: Lock workspace for CI
        run: cargo ci git-lock

      - name: Run the check
        id: check
        shell: bash
        continue-on-error: true
        run: |
          case "${{ matrix.item }}" in
            build) cargo dev build ;;
            test) cargo ci test ;;
            clippy) cargo ci clippy ;;
            fmt) cargo ci fmt-check && cargo ci i18n ;;
            doc) cargo ci doc ;;
            integration) cargo ci integration-test ;;
            dotnet) cargo ci dotnet-lint && cargo ci dotnet-check ;;
          esac

      - name: Unlock workspace (idempotency check)
        if: always()
        run: cargo ci git-unlock --show-diff

      - name: Fail when the check failed
        if: steps.check.outcome == 'failure'
        run: exit 1

      # Collected reports are uploaded even on failure, so the report job can render them.
      - name: Upload collected reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-collect-${{ github.job }}-${{ matrix.item }}
          path: .cache/reports/collect/
          if-no-files-found: ignore

  check-linux:
    name: Check (linux / ${{ matrix.item }})
    needs: [fast-check, prewarm-linux]
    strategy:
      fail-fast: false
      matrix:
        item: [build, test, clippy, fmt, doc, integration, dotnet]
    runs-on: ubuntu-latest
    env:
      MUSL: "true"
    steps: *check-steps

  # What a person is handed, built on the platform it is for. Windows is given the installer. Linux
  # is given the all-in-one package, the AppImage, and a complete package whose command-line
  # programs are built against musl; the split packages and the meta package stay for repositories.
  # A tag publishes what all of them collected.
  package-windows:
    name: Package (windows)
    needs: [fast-check, prewarm-windows]
    runs-on: windows-latest
    steps:
      - name: Use the tree's own line endings
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # The key Pre-Warm saved under, so the export is built against dependencies already compiled.
          cache-shared-key: rola-${{ runner.os }}
          cache-workspaces: |
            . -> .cache/rs-target
          cache-on-failure: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache the NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json', 'Directory.Build.props', 'RorolalaSharp.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Read the workspace version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::Cargo.toml declares no workspace version"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # The compiler the installer is made with is the one `dev/build/src/iscc.rs` names, laid out
      # where it looks for it first (`.cache/toolchains/innosetup`). Nothing is fetched by the build
      # itself, so fetching it is the workflow's to do — and the hash is checked, because what a
      # package is built with decides what is in it.
      - name: Install the pinned Inno Setup
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $expected = '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732'
          Invoke-WebRequest -Uri $url -OutFile innosetup.exe
          $actual = (Get-FileHash innosetup.exe -Algorithm SHA256).Hash
          if ($actual -ne $expected) {
            throw "innosetup.exe hashed to $actual, not $expected"
          }
          $directory = Join-Path (Get-Location) '.cache\toolchains\innosetup'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          Start-Process -FilePath .\innosetup.exe -Wait -ArgumentList '/VERYSILENT', '/CURRENTUSER', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/NOICONS', "/DIR=$directory"
          Remove-Item innosetup.exe

      - name: Build the Windows installer
        run: cargo dev publish

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: rola-windows-package
          path: build/rorolala-*-setup.exe
          if-no-files-found: error

  package-linux:
    name: Package (linux)
    needs: [fast-check]
    runs-on: ubuntu-latest
    steps:
      - name: Use the tree's own line endings
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: rola-linux-glibc
          cache-workspaces: |
            . -> .cache/rs-target
          cache-on-failure: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache the NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json', 'Directory.Build.props', 'RorolalaSharp.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install GTK and pkg-config
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev pkg-config

      - name: Install the pinned nFPM
        shell: bash
        run: |
          url='https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz'
          expected='6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750'
          directory='.cache/toolchains/nfpm'
          mkdir -p "$directory"
          curl -sSL -o "$directory/nfpm.tar.gz" "$url"
          echo "$expected  $directory/nfpm.tar.gz" | sha256sum -c -
          tar -xzf "$directory/nfpm.tar.gz" -C "$directory"
          chmod +x "$directory/nfpm"

      - name: Install the pinned appimagetool
        shell: bash
        run: |
          url='https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage'
          expected='ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0'
          directory='.cache/toolchains/appimagetool'
          mkdir -p "$directory"
          curl -sSL -o "$directory/appimagetool-x86_64.AppImage" "$url"
          echo "$expected  $directory/appimagetool-x86_64.AppImage" | sha256sum -c -
          chmod +x "$directory/appimagetool-x86_64.AppImage"

      - name: Read the workspace version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::Cargo.toml declares no workspace version"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # Nothing names a target: the machine is the target, and the window over the daemon is compiled
      # by `cc` as its script does by default. A musl package is the job below.
      - name: Build the Linux packages
        run: cargo dev publish

      - name: Collect the all-in-one package and the AppImage
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p dist
          cp "build/rorolala-${VERSION}.deb" "build/rorolala-${VERSION}.rpm" "build/rorolala-${VERSION}.pkg.tar.zst" dist/
          cp "build/rola-launcher-${VERSION}.appimage" dist/

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: rola-linux-package
          path: dist/*
          if-no-files-found: error

  package-linux-musl:
    name: Package (linux / musl)
    needs: [fast-check]
    runs-on: ubuntu-latest
    steps:
      - name: Use the tree's own line endings
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: rola-linux-musl
          cache-workspaces: |
            . -> .cache/rs-target
          cache-on-failure: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache the NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json', 'Directory.Build.props', 'RorolalaSharp.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Install the musl toolchain and GTK
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl musl-tools libgtk-4-dev pkg-config
          rustup target add x86_64-unknown-linux-musl
          {
            echo 'CARGO_BUILD_TARGET=x86_64-unknown-linux-musl'
            echo 'CC=musl-gcc'
          } >> "$GITHUB_ENV"

      - name: Install the pinned nFPM
        shell: bash
        run: |
          url='https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz'
          expected='6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750'
          directory='.cache/toolchains/nfpm'
          mkdir -p "$directory"
          curl -sSL -o "$directory/nfpm.tar.gz" "$url"
          echo "$expected  $directory/nfpm.tar.gz" | sha256sum -c -
          tar -xzf "$directory/nfpm.tar.gz" -C "$directory"
          chmod +x "$directory/nfpm"

      - name: Read the workspace version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::Cargo.toml declares no workspace version"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build the musl package
        # `CC` is `musl-gcc` from the toolchain step above. The window over the daemon and the C ABI's
        # shared library are the glibc machine's either way — GTK and the .NET runtime are glibc — so
        # the build gives those two runs `cc` of its own.
        run: cargo dev publish

      - name: Collect the musl package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p dist
          cp "build/rorolala-musl-${VERSION}.deb" "build/rorolala-musl-${VERSION}.rpm" "build/rorolala-musl-${VERSION}.pkg.tar.zst" dist/

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: rola-linux-musl-package
          path: dist/*
          if-no-files-found: error

  # Every matrix run's reports, rendered as one page and written into the job summary. It runs even
  # when checks failed, so what failed is still what a reader is shown.
  report:
    name: Report
    needs: [check-windows, check-linux]
    # No reports exist when Fast-Check stopped the matrices.
    if: always() && (needs.check-windows.result != 'skipped' || needs.check-linux.result != 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Download collected reports
        uses: actions/download-artifact@v4
        with:
          path: .cache/reports/collect
          pattern: ci-collect-*
          merge-multiple: true

      - name: Render the report
        run: cargo ci report-collect

      - name: Publish the report to the step summary
        run: cat .cache/reports/result.md >> "$GITHUB_STEP_SUMMARY"

  # A tag is released only once both the checks and the packages succeeded, and what is released is
  # the tag's own commit: the version's own section of `CHANGELOG.md` is the body, its date and short
  # hash are the heading, and the people whose commits made up the range since the previous tag are
  # named below it. The section's links point at `dev/CHANGELOG-DETAILS.md` beside it; a release body
  # has no repository to resolve a relative link against, so they are made absolute at the tag.
  release:
    name: Release
    needs:
      [
        check-windows,
        check-linux,
        package-windows,
        package-linux,
        package-linux-musl,
      ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The previous tag has to be here for the range that names the co-authors.
          fetch-depth: 0

      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          # The collected reports are artifacts of this run as well, and what a release carries is
          # the packages alone.
          pattern: rola-*-package
          merge-multiple: true

      - name: Write the release body
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          commit="$(git rev-parse "${tag}^{commit}")"
          short="$(git rev-parse --short=7 "${tag}^{commit}")"
          date="$(git log -1 --format=%cd --date=format:%Y-%m-%d "${tag}")"

          # The tag before this one, when there is one: that is what the range of commit authors is
          # taken over. An empty range is the tag itself, which is the first release.
          previous="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          range="${tag}"
          if [ -n "$previous" ]; then
            range="${previous}..${tag}"
          fi
          co="$(git log "$range" --format=%an | sort -u | paste -sd ', ' -)"

          # The version's own section of the summary, heading and all. A heading is the only thing
          # at the document's first level, so the next one ends the section.
          fragment="$(awk -v heading="# ${version} (" '
            index($0, heading) == 1 { printing = 1 }
            printing && /^# / && index($0, heading) != 1 { exit }
            printing { print }
          ' CHANGELOG.md)"

          if [ -z "$fragment" ]; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi

          if printf '%s\n' "$fragment" | head -n 1 | grep -q '(Unreleased)'; then
            echo "the ${version} section of CHANGELOG.md is still Unreleased; archive it first" >&2
            exit 1
          fi

          # The summary links each entry to its paragraph in the details, relative to the repository
          # root. A release body is rendered away from the repository, so every such link is made
          # absolute at the tagged commit before it is published.
          base="https://github.com/rorolala-vcs/rorolala-vcs/blob/${commit}/"
          fragment="$(printf '%s\n' "$fragment" | sed "s|](dev/CHANGELOG-DETAILS.md#|](${base}dev/CHANGELOG-DETAILS.md#|g")"

          {
            echo "Release ${tag} - (${date}-${short})"
            echo
            printf '%s\n' "$fragment"
            echo
            echo "Co: ${co}"
          } > release.md

          cat release.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: release.md
          files: dist/*
          make_latest: true
          draft: false
          prerelease: false
