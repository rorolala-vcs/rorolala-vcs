<!doctype html>
<!--
  Written by `cargo dev icons` (`dev/icons`) beside the clone of the set, from the pin's own data.json.
  Do not edit: the next run writes it again from the pin.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Material icons</title>
        <style>
            :root {
                color-scheme: dark;
                --bg: #151719;
                --panel: #1c1f23;
                --line: #2b3036;
                --fg: #e7e9ec;
                --dim: #939ba6;
                --accent: #7aa7ff;
                /* The set is drawn in black, so the dark page turns it over rather than recolouring 2191 files. */
                --invert: 1;
                --size: 32px;
            }

            :root[data-theme="light"] {
                color-scheme: light;
                --bg: #ffffff;
                --panel: #f4f5f7;
                --line: #dfe3e8;
                --fg: #17191c;
                --dim: #697180;
                --accent: #1b62cc;
                --invert: 0;
            }

            * {
                box-sizing: border-box;
            }

            [hidden] {
                display: none !important;
            }

            body {
                margin: 0;
                background: var(--bg);
                color: var(--fg);
                font:
                    13px/1.45 system-ui,
                    -apple-system,
                    "Segoe UI",
                    Roboto,
                    sans-serif;
            }

            header {
                position: sticky;
                top: 0;
                z-index: 2;
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                align-items: center;
                padding: 10px 14px;
                background: var(--panel);
                border-bottom: 1px solid var(--line);
            }

            #search {
                flex: 1 1 260px;
                min-width: 180px;
                padding: 7px 10px;
                color: inherit;
                background: var(--bg);
                border: 1px solid var(--line);
                border-radius: 7px;
                font: inherit;
            }

            select,
            .range,
            #theme {
                padding: 6px 8px;
                color: inherit;
                background: var(--bg);
                border: 1px solid var(--line);
                border-radius: 7px;
                font: inherit;
            }

            #theme {
                cursor: pointer;
            }

            .range {
                display: flex;
                gap: 6px;
                align-items: center;
            }

            .range input {
                accent-color: var(--accent);
            }

            #search:focus-visible,
            select:focus-visible,
            button:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 1px;
            }

            #count {
                margin-left: auto;
                color: var(--dim);
                font-variant-numeric: tabular-nums;
            }

            #grid {
                display: grid;
                grid-template-columns: repeat(
                    auto-fill,
                    minmax(calc(var(--size) + 40px), 1fr)
                );
                gap: 6px;
                padding: 14px;
            }

            .tile {
                display: flex;
                flex-direction: column;
                gap: 6px;
                align-items: center;
                min-width: 0;
                padding: 8px 4px 6px;
                color: inherit;
                background: none;
                border: 1px solid transparent;
                border-radius: 8px;
                font: inherit;
                cursor: pointer;
            }

            .tile:hover {
                background: var(--panel);
                border-color: var(--line);
            }

            .tile img {
                width: var(--size);
                height: var(--size);
                filter: invert(var(--invert));
            }

            .tile .label {
                max-width: 100%;
                overflow: hidden;
                color: var(--dim);
                font-size: 11px;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .empty {
                margin: 40px 14px;
                color: var(--dim);
            }

            #detail {
                position: relative;
                width: min(580px, calc(100vw - 32px));
                padding: 18px 20px 20px;
                color: var(--fg);
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 12px;
            }

            #detail::backdrop {
                background: rgb(0 0 0 / 55%);
            }

            #detail h2 {
                margin: 0 0 14px;
                font:
                    600 15px/1.3 ui-monospace,
                    SFMono-Regular,
                    Menlo,
                    monospace;
                overflow-wrap: anywhere;
            }

            .variants {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
            }

            .variants figure {
                width: 92px;
                margin: 0;
                padding: 10px 6px 6px;
                text-align: center;
                background: var(--bg);
                border: 1px solid var(--line);
                border-radius: 8px;
            }

            .variants img {
                width: 64px;
                height: 64px;
                filter: invert(var(--invert));
            }

            .variants figcaption {
                margin-top: 4px;
                color: var(--dim);
                font-size: 11px;
            }

            #detail-meta {
                margin: 14px 0 0;
                color: var(--dim);
                font-size: 12px;
            }

            .actions {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-top: 14px;
            }

            .actions button,
            .close {
                padding: 6px 12px;
                color: inherit;
                background: var(--bg);
                border: 1px solid var(--line);
                border-radius: 7px;
                font: inherit;
                cursor: pointer;
            }

            .actions button:hover,
            .close:hover {
                border-color: var(--accent);
            }

            .close {
                position: absolute;
                top: 10px;
                right: 12px;
                padding: 2px 8px;
                font-size: 16px;
            }

            .toast {
                position: fixed;
                bottom: 20px;
                left: 50%;
                max-width: calc(100vw - 40px);
                padding: 8px 14px;
                color: var(--bg);
                background: var(--fg);
                border-radius: 999px;
                font-size: 12px;
                overflow-wrap: anywhere;
                transform: translateX(-50%);
            }
        </style>
    </head>
    <body>
        <header>
            <input
                id="search"
                type="search"
                placeholder="Search name, tag or category"
                autofocus
                spellcheck="false"
                aria-label="Search icons"
            />
            <select id="family" aria-label="Icon family">
                <option value="baseline">baseline</option>
                <option value="outline">outline</option>
                <option value="round">round</option>
                <option value="sharp">sharp</option>
                <option value="twotone">twotone</option>
            </select>
            <label class="range"
                >size
                <input id="size" type="range" min="16" max="64" step="4" />
                <output id="size-value"></output
            ></label>
            <button
                id="theme"
                type="button"
                title="Switch the page between dark and light"
            >
                ◐
            </button>
            <span id="count"></span>
        </header>
        <main id="grid"></main>
        <p id="empty" class="empty" hidden></p>
        <dialog id="detail">
            <button
                class="close"
                id="detail-close"
                type="button"
                aria-label="Close"
            >
                ×
            </button>
            <h2 id="detail-name"></h2>
            <div id="detail-variants" class="variants"></div>
            <p id="detail-meta"></p>
            <div class="actions">
                <button type="button" data-copy="name">Copy name</button>
                <button type="button" data-copy="path">Copy path</button>
            </div>
        </dialog>
        <div id="toast" class="toast" hidden></div>
        <script>
            // One entry per icon, as `[name, tags, categories]` — the set's own index, inlined because a page
            // opened from disk may not fetch it. Written by `cargo dev icons`.
            const ICONS = __ICONS__;

            const FAMILIES = [
                "baseline",
                "outline",
                "round",
                "sharp",
                "twotone",
            ];
            const PREFS_KEY = "material-icon-preview";
            const SVGS = "../material-icons/svg/";
            const REPO_PATH = "THIRD-PARTY/material-icons/svg/";

            const html = document.documentElement;
            const grid = document.getElementById("grid");
            const search = document.getElementById("search");
            const family = document.getElementById("family");
            const size = document.getElementById("size");
            const sizeValue = document.getElementById("size-value");
            const themeButton = document.getElementById("theme");
            const count = document.getElementById("count");
            const empty = document.getElementById("empty");
            const detail = document.getElementById("detail");
            const toastNode = document.getElementById("toast");

            const state = {
                family: "baseline",
                size: 32,
                theme: prefersLight() ? "light" : "dark",
                query: "",
            };

            // Every icon's searchable text, and where each sits in ICONS: built once, so that a keystroke costs
            // one pass over 2191 strings rather than a rebuild of the grid and 2191 image requests.
            const PLACE = new Map();
            const HAYSTACK = ICONS.map(([name, tags, categories], index) => {
                PLACE.set(name, index);
                return [name, ...tags, ...categories].join(" ").toLowerCase();
            });

            // The tiles live for the life of the page; filtering only flips `hidden` on them.
            const tiles = [];

            const iconUrl = (name, variant) =>
                SVGS + name + "/" + variant + ".svg";
            const repoPath = (name, variant) =>
                REPO_PATH + name + "/" + variant + ".svg";

            function prefersLight() {
                return window.matchMedia("(prefers-color-scheme: light)")
                    .matches;
            }

            function readPrefs() {
                try {
                    const saved = JSON.parse(
                        localStorage.getItem(PREFS_KEY) || "{}",
                    );
                    if (FAMILIES.includes(saved.family))
                        state.family = saved.family;
                    if (Number.isFinite(saved.size))
                        state.size = Math.min(64, Math.max(16, saved.size));
                    if (saved.theme === "light" || saved.theme === "dark")
                        state.theme = saved.theme;
                } catch (error) {
                    // Preferences are a convenience; a browser that refuses local storage simply forgets them.
                }
            }

            function writePrefs() {
                try {
                    localStorage.setItem(
                        PREFS_KEY,
                        JSON.stringify({
                            family: state.family,
                            size: state.size,
                            theme: state.theme,
                        }),
                    );
                } catch (error) {
                    // As above: forgetting a preference must never cost the page.
                }
            }

            function apply() {
                html.dataset.theme = state.theme;
                html.style.setProperty("--size", state.size + "px");
                family.value = state.family;
                size.value = state.size;
                sizeValue.textContent = state.size + "px";
            }

            function buildTiles() {
                const fragment = document.createDocumentFragment();
                for (const [name] of ICONS) {
                    const tile = document.createElement("button");
                    tile.type = "button";
                    tile.className = "tile";
                    tile.title = name;
                    tile.dataset.name = name;

                    const image = document.createElement("img");
                    image.alt = "";
                    image.loading = "lazy";
                    image.decoding = "async";
                    image.src = iconUrl(name, state.family);

                    const label = document.createElement("span");
                    label.className = "label";
                    label.textContent = name;

                    tile.append(image, label);
                    tile.addEventListener("click", () => openDetail(name));
                    fragment.append(tile);
                    tiles.push(tile);
                }
                grid.append(fragment);
            }

            function filter() {
                const terms = state.query
                    .toLowerCase()
                    .split(/\s+/)
                    .filter(Boolean);
                let shown = 0;

                for (let index = 0; index < tiles.length; index += 1) {
                    const hit = terms.every((term) =>
                        HAYSTACK[index].includes(term),
                    );
                    tiles[index].hidden = !hit;
                    if (hit) shown += 1;
                }

                count.textContent =
                    terms.length === 0
                        ? String(tiles.length)
                        : shown + " / " + tiles.length;

                empty.hidden = shown !== 0;
                if (shown === 0) {
                    empty.textContent =
                        "No icon matches \u201c" + state.query + "\u201d.";
                }
            }

            function setFamily(next) {
                state.family = next;
                for (const tile of tiles) {
                    tile.firstElementChild.src = iconUrl(
                        tile.dataset.name,
                        next,
                    );
                }
                if (detail.open) {
                    openDetail(detail.dataset.name);
                }
                writePrefs();
            }

            function openDetail(name) {
                detail.dataset.name = name;
                document.getElementById("detail-name").textContent = name;

                const variants = document.getElementById("detail-variants");
                variants.textContent = "";
                for (const variant of FAMILIES) {
                    const figure = document.createElement("figure");
                    const image = document.createElement("img");
                    image.src = iconUrl(name, variant);
                    image.alt = variant;
                    image.loading = "lazy";
                    const caption = document.createElement("figcaption");
                    caption.textContent = variant;
                    figure.append(image, caption);
                    variants.append(figure);
                }

                const [, tags, categories] = ICONS[PLACE.get(name)];
                document.getElementById("detail-meta").textContent = [
                    categories.join(", "),
                    tags.join(", "),
                ]
                    .filter(Boolean)
                    .join("  \u00b7  ");

                if (!detail.open) {
                    detail.showModal();
                }
            }

            let toastTimer = 0;

            function toast(message) {
                toastNode.textContent = message;
                toastNode.hidden = false;
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toastNode.hidden = true;
                }, 1600);
            }

            async function copyText(text) {
                try {
                    await navigator.clipboard.writeText(text);
                } catch (error) {
                    // A page on file:// is not a secure context, so the clipboard API is absent or refused; the
                    // selection copy is what a click is still allowed to drive.
                    const area = document.createElement("textarea");
                    area.value = text;
                    area.setAttribute("readonly", "");
                    area.style.position = "fixed";
                    area.style.opacity = "0";
                    document.body.append(area);
                    area.select();
                    document.execCommand("copy");
                    area.remove();
                }
                toast("Copied " + text);
            }

            search.addEventListener("input", () => {
                state.query = search.value;
                filter();
            });

            family.addEventListener("change", () => {
                setFamily(family.value);
            });

            size.addEventListener("input", () => {
                state.size = Number(size.value);
                apply();
                writePrefs();
            });

            themeButton.addEventListener("click", () => {
                state.theme = state.theme === "dark" ? "light" : "dark";
                apply();
                writePrefs();
            });

            document
                .getElementById("detail-close")
                .addEventListener("click", () => {
                    detail.close();
                });

            detail.addEventListener("click", (event) => {
                const button = event.target.closest("button[data-copy]");
                if (button) {
                    const name = detail.dataset.name;
                    copyText(
                        button.dataset.copy === "path"
                            ? repoPath(name, state.family)
                            : name,
                    );
                } else if (event.target === detail) {
                    detail.close();
                }
            });

            document.addEventListener("keydown", (event) => {
                if (event.key === "/" && document.activeElement !== search) {
                    event.preventDefault();
                    search.focus();
                    search.select();
                } else if (
                    event.key === "Escape" &&
                    document.activeElement === search &&
                    search.value
                ) {
                    search.value = "";
                    state.query = "";
                    filter();
                }
            });

            readPrefs();
            apply();
            buildTiles();
            filter();
        </script>
    </body>
</html>
