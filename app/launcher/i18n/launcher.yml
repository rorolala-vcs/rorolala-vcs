      zh-CN: 可连接
    failed:
      en: No answer
      zh-CN: 无响应
    checking:
      en: Handshaking
      zh-CN: 正在握手
    unchecked:
      en: Not checked
      zh-CN: 尚未检查
    reachable_tip:
