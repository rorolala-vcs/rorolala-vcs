      zh-CN: "%{path} 已经不是一个工作区了"
    launch_failed:
      en: "The Desktop program could not be started from %{program}"
      zh-CN: "无法从 %{program} 启动桌面程序"
    opening:
      en: Opening
      zh-CN: 正在打开
    launch_timeout:
      en: The Desktop program is taking longer than expected to open
      zh-CN: 桌面程序打开得比预期更久
    launch_ended:
      en: "The Desktop program ended before its window opened (%{code})"
      zh-CN: "桌面程序在窗口出现之前就结束了（%{code}）"

  import:
    title:
      en: Add a Workspace
      zh-CN: 导入工作区
    not_a_workspace:
      en: "%{path} is neither a Workspace nor a git repository with a rola.toml"
      zh-CN: "%{path} 既不是工作区，也不是带 `rola.toml` 的 git 仓库"

  account:
    title:
      en: Your account
      zh-CN: 你的账户
    title_new:
      en: Set up your account
      zh-CN: 设置账户
    hello:
      en: "Hello, %{name}"
      zh-CN: "你好，%{name}"
    greeting:
      en: Your account is set. Export its public key and hand the file to whoever runs your Vault.
      zh-CN: 账户已经设置好。导出它的公钥，把文件交给你所在保险库的管理员。
    intro:
      en: Enter your account name
      zh-CN: 输入你的账户名称
    name:
      en: Account name
      zh-CN: 账户名称
    confirm_title:
      en: Confirm the account name
      zh-CN: 确认账户名称
    warning:
      en: |
        It is hard to change a name once a Vault has been told it,
        so please check it is written the way you want.
      zh-CN: |
        名字一旦被保险库知道就很难更改，请确认没有写错。
    create:
      en: Create account
      zh-CN: 创建账户
    creating:
      en: Creating
      zh-CN: 正在创建
    empty:
      en: Please write a name first.
      zh-CN: 请先写一个名字。
    forbidden:
      en: "`%{name}` is a word `rola account` reads as its own, so it cannot be an account"
      zh-CN: "`%{name}` 是 `rola account` 自己使用的词，不能作为账户名"
    exists:
      en: "There is already an account called `%{name}`"
      zh-CN: "已经有一个叫 `%{name}` 的账户了"
    failed:
      en: "The account could not be made: %{reason}"
      zh-CN: "无法创建账户：%{reason}"
    export:
      en: Export public key
      zh-CN: 导出公钥
    exporting:
      en: Exporting
      zh-CN: 正在导出
    export_type:
      en: Public key
      zh-CN: 公钥
    export_failed:
      en: "The key could not be saved: %{reason}"
      zh-CN: "无法保存公钥：%{reason}"
    no_key:
      en: "No public key was found for `%{name}`"
      zh-CN: "没有找到 `%{name}` 的公钥"
    exported:
      en: The public key was exported
      zh-CN: 公钥已导出
    exported_help:
      en: Please hand this file to whoever runs your Vault.
      zh-CN: 请把这个文件交给你所在保险库的管理员。

  create:
    title:
      en: Create a Workspace
      zh-CN: 创建工作区
    vault_address:
