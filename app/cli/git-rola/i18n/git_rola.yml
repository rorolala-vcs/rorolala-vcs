_version: 2

git_rola:
  usage:
    en: |
      %{usage}git rola <command> [<args>]

      The rola commands are:
        init       Set up git support in this project
        hook       Keep the materials in step after a git operation
        check      Report the materials that differ from rola.lock
        bring      Sign a Vault's entries in to this project
        restore    Put named materials back from rola.lock
        refresh    Put the working tree back in step with rola.lock
        update     Resolve rola.toml through the Vaults and rewrite rola.lock
        help       Print this list, or the usage of one command
        version    Print the version of this program

      See 'git rola <command>' to read about a specific command.
    zh-CN: |
      %{usage}git rola <命令> [<参数>]

      rola 命令：
        init       在工作树内建立 rola 项目的 git 支持
        hook       在 git 操作后让素材保持同步
        check      报告与 `rola.lock` 不同的素材
        bring      把保险库布局里的条目签入本项目
        restore    从 `rola.lock` 把指名的素材放回去
        refresh    按 `rola.lock` 让工作区回到正轨
        update     通过保险库解析 `rola.toml` 并重写 `rola.lock`
        help       打印这份列表，或某个命令的用法
        version    打印这个程序的版本

      见 'git rola <命令>' 读某个命令的说明。
  version:
    en: git rola version %{version}
    zh-CN: git rola 版本 %{version}
  err_unknown_command:
    en: "git rola: '%{typed}' is not a rola command. See 'git rola --help'."
    zh-CN: "git rola：'%{typed}' 不是 rola 命令。见 'git rola --help'。"
  similar_command:
    en: The most similar command is
    zh-CN: 最相似的命令是
  similar_commands:
    en: The most similar commands are
    zh-CN: 最相似的命令是
  err_unknown_option:
    en: "unknown option: %{word}"
    zh-CN: "未知选项：%{word}"
  err_no_such_option:
    en: "unknown option `%{word}'"
    zh-CN: "未知选项 `%{word}'"
  err_no_such_switch:
    en: "unknown switch `%{word}'"
    zh-CN: "未知开关 `%{word}'"
  err_option_value:
    en: "option '--%{option}' requires a value"
    zh-CN: "选项 '--%{option}' 需要一个值"
  err_option_no_value:
    en: "option '--%{option}' takes no value"
    zh-CN: "选项 '--%{option}' 不接值"
  err_write_stdout:
    en: write failure on standard output
    zh-CN: 写标准输出失败
  err_cwd:
    en: "cannot read the current directory: %{error}"
    zh-CN: "无法读取当前目录：%{error}"
  err_no_project:
    en: not inside a rola project
    zh-CN: 不在任何 rola 项目内
  err_lock:
    en: "cannot read rola.lock: %{error}"
    zh-CN: "无法读取 `rola.lock`：%{error}"
  err_git:
    en: "cannot run git: %{error}"
    zh-CN: "无法运行 git：%{error}"
