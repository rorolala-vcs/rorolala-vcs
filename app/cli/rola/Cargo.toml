[package]
name = "rola"
version.workspace = true
edition.workspace = true

[dependencies]
librorolala.workspace = true
rorolala-cli-setups.workspace = true
rorolala-utils-cli-theme.workspace = true
rorolala-utils-constants.workspace = true
rorolala-utils-location.workspace = true
rorolala-utils-progress.workspace = true
rorolala-vault.workspace = true
rorolala-workspace.workspace = true
annotate-snippets.workspace = true
colored.workspace = true
console.workspace = true
globset.workspace = true
mingling.workspace = true
minus.workspace = true
rust-i18n.workspace = true
indicatif.workspace = true
rorolala-errors.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

# Restoring the default `SIGPIPE` disposition is a Unix concern; Windows has no such signal and
# reports a closed pipe as an error to the write instead.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[build-dependencies]
just_template.workspace = true

# The program's own icon, linked into the Windows executable and nowhere else: the resource compiler
# is the platform's, so the build script reaches for this only where there is one. The icon itself is
# drawn by `rorolala-utils-icons`'s build script, which is depended on so that it has run before this
# program's build script links one in.
[target.'cfg(windows)'.build-dependencies]
embed-resource.workspace = true
rorolala-utils-icons.workspace = true
