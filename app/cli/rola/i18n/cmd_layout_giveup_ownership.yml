_version: 2

cmd_layout_giveup_ownership:
  help:
    en: |
        # Ask the Vault to clear the holders of the named entries
        **Usage**: rola layout [[GREEN]]__giveup-ownership__[[/]] [VAULT] <UUID>...
    zh-CN: |
        # 请求保险库把指定条目的持有者清空
        **用法**：rola layout [[GREEN]]__giveup-ownership__[[/]] [保险库名] <UUID>...
  description:
    en: Ask the Vault to clear the holders of the named entries
    zh-CN: 请求保险库将指定条目的持有者清空

  result_given_up:
    en: "The entry `%{uuid}` is no longer held"
    zh-CN: "条目 `%{uuid}` 已不再被持有"
