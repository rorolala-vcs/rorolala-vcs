_version: 2

docs:
  help:
    en: |
      **Usage**: rola [[GREEN]]__docs__[[/]] [--search] [--limit <N>] <text>

      **Flags**:
           __--search__       Search the articles; support multi keywords
           __--limit__ <N>    Show at most N results
           __--no-pager__     Do not use a pager; write the results out directly
           __--raw__          Output the raw article content

      **When searching, if only one entry matches, its content is printed directly**

    zh-CN: |
      **用法**：rola [[GREEN]]__docs__[[/]] [--search] [--limit <N>] <文本>

      **标识**：
           __--search__       搜索文章，支持多个关键词缩小范围
           __--limit__ <N>    显示最多 N 条结果
           __--no-pager__     不使用分页器，直接写出结果
           __--raw__          输出原始文章内容

      **搜索时，若只命中一个条目，将直接打印文章内容**

  cmd_docs_description:
    en: Read or search an article
    zh-CN: 阅读或搜索一篇文章

  table_name:
    en: ARTICLE
    zh-CN: 文章

  table_description:
    en: DESCRIPTION
    zh-CN: 描述

  table_snippet:
    en: MATCHED
    zh-CN: 匹配

  no_match:
    en: No article matched
    zh-CN: 没有匹配的文章

  err_no_book:
    en: The articles could not be found
    zh-CN: 找不到文章

  err_no_book_help:
    en: Make the book in a checkout with `cargo dev book`
    zh-CN: 在源码树中运行 `cargo dev book` 生成它

  err_unknown_article:
    en: "There is no article named `%{name}`"
    zh-CN: "没有名为 `%{name}` 的文章"

  err_unknown_article_help:
    en: Run the command with `--search` to search the articles instead of naming one article
    zh-CN: 加上 `--search` 可按查询搜索文章，而不是指定一篇文章

  err_missing_text:
    en: "`--search` needs the words to search for"
    zh-CN: "`--search` 需要给出要搜索的文字"

  err_missing_text_help:
    en: Write the query after the command, as in `rola docs --search install`
    zh-CN: 把查询写在命令后面，例如 `rola docs --search 安装`

  err_unexpected_argument:
    en: "`%{word}` is not an option `rola docs` accepts"
    zh-CN: "`%{word}` 不是 `rola docs` 接受的选项"

  err_unexpected_argument_help:
    en: Run `rola docs --help` to see what it accepts
    zh-CN: 运行 `rola docs --help` 看看它能接受什么

  err_limit_without_search:
    en: "`--limit` is only meaningful with `--search`"
    zh-CN: "`--limit` 只在带 `--search` 时有意义"

  err_limit_without_search_help:
    en: Add `--search` to search the articles, or leave `--limit` out to name one article
    zh-CN: 加上 `--search` 来搜索文章，或去掉 `--limit` 来指定一篇文章

  complete:
    search:
      en: Search the articles instead of naming one article
      zh-CN: 搜索文章，而不是指定一篇文章
    limit:
      en: How many search answers to show at most
      zh-CN: 最多显示多少条搜索结果
