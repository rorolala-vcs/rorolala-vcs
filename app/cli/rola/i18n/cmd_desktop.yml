_version: 2

desktop:
  help:
    en: |
        Open the Desktop program that sits beside rola

        **Usage**: rola desktop
        **Flags**:
            --window-style <STYLE>    Choose the window frame style, one of windows, mac or tillingwm

        Open the Desktop program that sits beside the `rola` that was run
        `--window-style` chooses the window frame style

        This run waits for the window to close and ends with the window's own exit code
    zh-CN: |
        打开与 rola 并排的桌面程序

        **用法**：rola desktop
        **标识**：
            --window-style <样式>    选择窗口边框的样式，可选 windows、mac 或 tillingwm

        打开与所运行的 `rola` 并排的桌面程序
        `--window-style` 选择窗口边框的样式

        本次运行一直等待窗口关闭并以窗口自己的退出码结束

  cmd_desktop_description:
    en: Open the companion Desktop program
    zh-CN: 打开配套的桌面程序

  complete:
    window_style:
      en: Choose the window frame style
      zh-CN: 选择窗口边框的样式

  called:
    en: |
        The Desktop program is already running, and was asked to come forward
    zh-CN: |
        桌面程序已在运行，已请求它切到前台

  err_window_style:
    en: "No window style is named `%{written}`"
    zh-CN: "没有名为 `%{written}` 的窗口样式"

  err_window_style_help:
    en: |
        Please write one of `windows`, `mac` or `tillingwm`, or leave `--window-style` out
    zh-CN: |
        请写 `windows`、`mac` 或 `tillingwm` 之一，或者不写 `--window-style`

  err_not_found:
    en: There is no Desktop program beside this one
    zh-CN: 本程序旁边没有桌面程序

  err_not_found_help:
    en: |
        [DEV_ONLY] Please run `./run.sh export`, which lays the Desktop program out beside this one
    zh-CN: |
        [DEV_ONLY] 请运行 `./run.sh export`，它会把桌面程序导出到本程序旁边

  err_launch_failed:
    en: "The Desktop program would not start — %{reason}"
    zh-CN: "桌面程序无法启动 —— %{reason}"

  err_launch_failed_help:
    en: |
        Please check that the Desktop program can be run where it sits, then try again
    zh-CN: |
        请确认桌面程序在其所在位置可以运行，然后重试
