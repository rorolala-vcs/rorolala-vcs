_version: 2

cmd_fetch:
  help:
    en: |
        # Bring back a read-only copy of the Vault's Layout
        **Usage**: rola [[GREEN]]__fetch__[[/]] <VAULT>
        **Flags**:
             __--no-ignore-rules__    Fetch only the Layout, leaving the Vault's ignore rules unfetched
    zh-CN: |
        # 取回保险库的布局只读副本
        **用法**：rola [[GREEN]]__fetch__[[/]] <保险库>
        **标识**：
             __--no-ignore-rules__    只取回布局，不取保险库的忽略规则

  description:
    en: Bring back a read-only copy of the Vault's Layout
    zh-CN: 取回保险库的布局只读副本
