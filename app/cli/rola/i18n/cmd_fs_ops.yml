_version: 2

# What `rola fs-ops` and the three words under it say. These are the file operations the Desktop
# program hands its work to, so what is written here is read both by a person at a terminal and by
# that program through its agent: the words are short because the act is, and what is *meant* by an
# operation — whether to replace, to skip or to rename — was settled before this is reached.

fs_ops:
  help:
    en: |
        Move, copy or remove a path

        **Usage**: rola fs-ops <SUBCOMMAND>
        **Commands**:
            mv <FROM> <TO>    Move or rename
            cp <FROM> <TO>    Copy
            rm <PATH>         Remove
    zh-CN: |
        移动、复制或删除路径

        **用法**：rola fs-ops <子命令>
        **命令**：
            mv <源路径> <目标路径>    移动或重命名
            cp <源路径> <目标路径>    复制
            rm <路径>                 删除

  cmd_fs_ops_description:
    en: Move, copy or remove a path
    zh-CN: 移动、复制或删除路径

  mv_help:
    en: |
        Put a path at another position

        **Usage**: rola fs-ops mv <FROM> <TO>

        `TO` is the new position it is to land at
        Either side may be a file or a directory
        Moving a directory moves everything under it

        When both paths are in the same Workspace, the Layout moves with them
        Moving out of the Workspace lets the corresponding entries leave the Layout
        When the target position is already named by the Layout, it is refused rather than overwritten

        A cross-device rename is done as copy first, then remove
    zh-CN: |
        把路径放到另一个位置

        **用法**：rola fs-ops mv <源路径> <目标路径>

        `目标路径` 是要落到的新位置
        两侧都可以是文件或目录
        移动目录连同其下的一切

        两条路径同属一个工作区时布局随之移动
        移出工作区则让相应条目离开布局
        目标位置已被布局命名时会被拒绝而不覆盖

        跨设备的改名改为先复制、再删除

  mv_description:
    en: Put a path at another position
    zh-CN: 把路径放到另一个位置

  cp_help:
    en: |
        Put a copy of a path at another position

        **Usage**: rola fs-ops cp <FROM> <TO>

        `TO` is the position the copy is to have
        The source path stays where it is
        Either side may be a file or a directory
        Copying a directory copies everything under it

        Only content and structure are promised
        Permissions, ownership and times are decided by the destination
    zh-CN: |
        把路径的副本放到另一个位置

        **用法**：rola fs-ops cp <源路径> <目标路径>

        `目标路径` 是副本应有的位置
        源路径留在原处
        两侧都可以是文件或目录
        复制目录连同其下的一切

        只承诺内容与结构
        权限、属主与时间由目标处决定

  cp_description:
    en: Put a copy of a path at another position
    zh-CN: 把路径的副本放到另一个位置

  rm_help:
    en: |
        Take a path away

        **Usage**: rola fs-ops rm <PATH>

        Whether it is a file or a directory is read from the path itself
        Deleting a directory removes everything under it
        A symbolic link is unlinked rather than followed

        There is no more confirmation
        Whether to remove is decided by the caller first

        When the path is in a Workspace, the Layout there is handled with it
        The entries it names are let go of
        Who holds the entry upstream is no longer read
    zh-CN: |
        把路径移除

        **用法**：rola fs-ops rm <路径>

        文件还是目录从路径本身读取
        删除目录连同其下的一切
        符号链接被解除而不是被跟随

        不会再有确认
        删除与否由调用方先行决定

        路径在工作区内时，那里的布局会随之处理
        其命名的条目被让出
        上游谁持有该条目不再查看

  rm_description:
    en: Take a path away
    zh-CN: 把路径移除

  err_blocked_named:
    en: "An entry for this path already exists in this Layout: `%{path}`"
    zh-CN: "本布局中已存在该路径的条目：`%{path}`"

  err_blocked_variant:
    en: "`%{path}` is a variant file, and a place outside the Workspace is one no merge can hold"
    zh-CN: "`%{path}` 是变体文件，而工作区之外的位置无法承载合并"

  err_blocked_help:
    en: |
        Please keep the change within what the Layout allows
        The file operations keep the Layout consistent
        A change the Layout refuses is stopped rather than half made
    zh-CN: |
        请让改动落在布局允许的范围内
        文件操作会保持布局一致
        布局拒绝的改动会被拦下，而不是只做一半

  result_two:
    en: "%{verb}: %{from} -> %{to}"
    zh-CN: "%{verb}：%{from} → %{to}"

  result_one:
    en: "%{verb}: %{from}"
    zh-CN: "%{verb}：%{from}"

  err_argument_two:
    en: "`%{verb}` needs the two paths it works on: `%{verb} <FROM> <TO>`"
    zh-CN: "`%{verb}` 需要它所作用的两条路径：`%{verb} <源路径> <目标路径>`"

  err_argument_one:
    en: "`%{verb}` needs the path it works on: `%{verb} <PATH>`"
    zh-CN: "`%{verb}` 需要它所作用的路径：`%{verb} <路径>`"

  err_argument_help:
    en: |
        Please name the path to move, copy or remove, and where to put it when it is being moved or
        copied
    zh-CN: |
        请给出要移动、复制或删除的路径
        若是移动或复制，再给出要放到哪里

  err_failed:
    en: "`%{verb}` could not be done — %{reason}"
    zh-CN: "`%{verb}` 执行失败：%{reason}"

  err_failed_help:
    en: |
        Please check that the paths can be read and written and that they are indeed what is said, then try again
    zh-CN: |
        请确认这些路径可读可写，且确实是所说的路径，然后重试
