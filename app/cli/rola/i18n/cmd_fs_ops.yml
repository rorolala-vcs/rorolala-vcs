_version: 2

# What `rola fs-ops` and the three words under it say. These are the file operations the Desktop
# program hands its work to, so what is written here is read both by a person at a terminal and by
# that program through its agent: the words are short because the act is, and what is *meant* by an
# operation (whether to replace, to skip or to rename) was settled before this is reached.

fs_ops:
  help:
    en: |
        Move, copy or remove a path

        **Usage**: rola fs-ops <SUBCOMMAND>
        **Commands**:
            mv <FROM> <TO>    Move or rename
            cp <FROM> <TO>    Copy
            rm <PATH>         Remove
    zh-CN: |
        移动、复制或删除路径

        **用法**：rola fs-ops <子命令>
        **命令**：
            mv <源路径> <目标路径>    移动或重命名
            cp <源路径> <目标路径>    复制
            rm <路径>                 删除

  cmd_fs_ops_description:
    en: Move, copy or remove a path
    zh-CN: 移动、复制或删除路径

  mv_help:
    en: |
        Put a path at another position

        **Usage**: rola fs-ops mv <FROM> <TO>
    zh-CN: |
        把路径放到另一个位置

        **用法**：rola fs-ops mv <源路径> <目标路径>

  mv_description:
    en: Put a path at another position
    zh-CN: 把路径放到另一个位置

  cp_help:
    en: |
        Put a copy of a path at another position

        **Usage**: rola fs-ops cp <FROM> <TO>
    zh-CN: |
        把路径的副本放到另一个位置

        **用法**：rola fs-ops cp <源路径> <目标路径>

  cp_description:
    en: Put a copy of a path at another position
    zh-CN: 把路径的副本放到另一个位置

  rm_help:
    en: |
        Take a path away

        **Usage**: rola fs-ops rm <PATH>
    zh-CN: |
        把路径移除

        **用法**：rola fs-ops rm <路径>

  rm_description:
    en: Take a path away
    zh-CN: 把路径移除

  err_blocked_named:
    en: "An entry for this path already exists in this Layout: `%{path}`"
    zh-CN: "本布局中已存在该路径的条目：`%{path}`"

  err_blocked_variant:
    en: "`%{path}` is a variant file, and a place outside the Workspace is one no merge can hold"
    zh-CN: "`%{path}` 是变体文件，而工作区之外的位置无法承载合并"

  err_blocked_help:
    en: |
        Please keep the change within what the Layout allows
        The file operations keep the Layout consistent
        A change the Layout refuses is stopped rather than half made
    zh-CN: |
        请让改动落在布局允许的范围内
        文件操作会保持布局一致
        布局拒绝的改动会被拦下，而不是只做一半

  result_two:
    en: "%{verb}: %{from} -> %{to}"
    zh-CN: "%{verb}：%{from} → %{to}"

  result_one:
    en: "%{verb}: %{from}"
    zh-CN: "%{verb}：%{from}"

  err_argument_two:
    en: "`%{verb}` needs the two paths it works on: `%{verb} <FROM> <TO>`"
    zh-CN: "`%{verb}` 需要它所作用的两条路径：`%{verb} <源路径> <目标路径>`"

  err_argument_one:
    en: "`%{verb}` needs the path it works on: `%{verb} <PATH>`"
    zh-CN: "`%{verb}` 需要它所作用的路径：`%{verb} <路径>`"

  err_argument_help:
    en: |
        Please name the path to move, copy or remove, and where to put it when it is being moved or
        copied
    zh-CN: |
        请给出要移动、复制或删除的路径
        若是移动或复制，再给出要放到哪里

  err_failed:
    en: "`%{verb}` could not be done: %{reason}"
    zh-CN: "`%{verb}` 执行失败：%{reason}"

  err_failed_help:
    en: |
        Please check that the paths can be read and written and that they are indeed what is said, then try again
    zh-CN: |
        请确认这些路径可读可写，且确实是所说的路径，然后重试
