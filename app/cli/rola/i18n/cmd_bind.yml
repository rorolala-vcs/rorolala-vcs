_version: 2

bind:
  help:
    en: |
      # Bind a Vault link quickly

      **Usage**: rola [[GREEN]]__bind__[[/]] <LINK> [NAME]
      **Flags**:
           __--no-set-default-vault__    Do not set the default Vault
    zh-CN: |
      # 快捷绑定保险库链接
      **用法**：rola [[GREEN]]__bind__[[/]] <链接> [名字]
      **标识**：
           __--no-set-default-vault__    不设置默认保险库

  description:
    en: Bind a Vault link quickly
    zh-CN: 快捷绑定保险库链接

  complete:
    no_set_default_vault:
      en: Do not set the default Vault
      zh-CN: 不设置默认保险库

  err_name_invalid:
    en: "`%{name}` is not a name a Vault may be bound under"
    zh-CN: "`%{name}` 不是保险库可以使用的绑定名"

  err_name_invalid_help:
    en: Give a name of letters and digits joined by `-`, as in `rola bind rola://127.0.0.1:7000/ upstream`
    zh-CN: 请给出由字母数字组成的词以 `-` 相连的名字，例如 `rola bind rola://127.0.0.1:7000/ upstream`

  result_bound:
    en: "`%{name}` is bound to %{address}"
    zh-CN: "`%{name}` 已绑定到 %{address}"

  result_tracking:
    en: "The Layout now tracks `%{name}`"
    zh-CN: "布局现在跟踪 `%{name}`"
