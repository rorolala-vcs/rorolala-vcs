_version: 2

bind:
  help:
    en: |
        Bind a Vault link quickly

        **Usage**: rola bind <LINK> [NAME]
        **Flags**:
            --no-set-default-vault    Do not set the default Vault
            --no-set-layout           Do not set a Layout automatically when there is none

        Bind the Vault link to the Workspace
        By default, automatically set the default Vault for the current Workspace, and create and set a base Layout connected to it
    zh-CN: |
        快捷绑定保险库链接

        **用法**：rola bind <链接> [名字]
        **标识**：
            --no-set-default-vault    不设置默认保险库
            --no-set-layout           不在无布局时自动设置布局

        将保险库链接绑定至工作区
        默认情况下，会自动为当前工作区设置默认保险库，并创建和设置一个基础布局与之连接

  description:
    en: Bind a Vault link quickly
    zh-CN: 快捷绑定保险库链接

  complete:
    no_set_default_vault:
      en: Do not set the default Vault
      zh-CN: 不设置默认保险库
    no_set_layout:
      en: Do not set a Layout automatically when there is none
      zh-CN: 不在无布局时自动设置布局

  err_name_invalid:
    en: "`%{name}` is not a name a Layout may be given"
    zh-CN: "`%{name}` 不是布局可以使用的名字"

  err_name_invalid_help:
    en: |
        Please make sure the given name is words of letters and digits joined by `-`, and is not empty

        **Example**: `rola bind rola://127.0.0.1:7000/ upstream`
    zh-CN: |
        请确保给出的名字由字母数字组成的词以 `-` 相连，且不为空

        **例如**：`rola bind rola://127.0.0.1:7000/ upstream`

  result_bound:
    en: "`%{name}` is bound to %{address}"
    zh-CN: "`%{name}` 已绑定到 %{address}"

  result_working:
    en: "The Layout `%{name}` was made, and is now the one worked in"
    zh-CN: "已建立布局 `%{name}`，并已成为当前使用的布局"
