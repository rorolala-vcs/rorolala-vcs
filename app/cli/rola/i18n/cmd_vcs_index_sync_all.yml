_version: 2

vcs_index_sync_all:
  help:
    en: |
        Make the indexes at both ends hold the same objects

        **Usage**: rola vcs-index sync-all [VAULT]
        **Flags**:
            --confirm    Run without asking for confirmation beforehand
    zh-CN: |
        让两端索引持有相同的对象

        **用法**：rola vcs-index sync-all [保险库]
        **标识**：
            --confirm    运行前不征求确认，直接执行

  cmd_vcs_index_sync_all_description:
    en: Make the indexes at both ends hold the same objects
    zh-CN: 让两端索引持有相同的对象

  confirm:
    en: "Both indexes will be changed, so that each holds everything the other has. Continue? [y/n] "
    zh-CN: "两个索引都会被改动，各自将持有对方所持有的全部对象。是否继续？[y/n] "

  result_synced:
    en: The indexes at both ends now hold the same objects
    zh-CN: 两端索引现在持有相同的对象

  result_declined:
    en: "Nothing was done: the sync was not confirmed"
    zh-CN: 未做任何改动，同步未获确认
