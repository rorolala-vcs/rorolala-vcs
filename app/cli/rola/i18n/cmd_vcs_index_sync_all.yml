_version: 2

vcs_index_sync_all:
  help:
    en: |
        Make the indexes at both ends hold the same keys

        **Usage**: `rola vcs-index sync-all [VAULT]`

        `VAULT` names the Vault to reach: a name the Workspace has bound with `rola vault bind`, or
        an ip, with the port a Vault listens on by default when none is written. Naming none reaches
        for the one the Workspace reaches for by default.

        What crosses is what only one end holds, in whichever direction that is: this is neither an
        upload nor a download, and one run leaves each index holding every object either of them had.
        An index object is one object and is never cut, so a key crosses as its bytes and the other
        side keeps it under the hash it hashes to.

        Both indexes are changed, so the run asks before it starts; `--confirm` answers in advance.
    zh-CN: |
        让两端的索引持有相同的对象

        **用法**：`rola vcs-index sync-all [VAULT]`

        `VAULT` 指定要连接的保险库：工作区已用 `rola vault bind` 绑定的名字，或一个 ip（不写端口时用
        保险库默认监听的端口）。不指定则连接工作区默认使用的那个。

        传输的是「只有一端持有」的对象，方向由谁持有决定：既不是上传也不是下载，一次运行会让两个索引都
        持有它们原本合计持有的全部对象。索引对象是单个对象、从不分块，因此一个 key 就以它的字节传输，
        对方按它的哈希原样保存。

        两个索引都会被改动，所以运行前会先征求确认；`--confirm` 可预先作答。

  cmd_vcs_index_sync_all_description:
    en: Make the indexes at both ends hold the same keys
    zh-CN: 让两端的索引持有相同的对象

  confirm:
    en: "Both indexes will be changed, so that each holds everything the other has. Continue? [y/n] "
    zh-CN: "两个索引都会被改动，使各自持有对方所持有的全部对象。是否继续？[y/n] "

  result_synced:
    en: The indexes at both ends now hold the same keys
    zh-CN: 两端索引现在持有相同的对象

  result_declined:
    en: Nothing was done — the sync was not confirmed
    zh-CN: 未做任何改动 —— 同步未获确认
