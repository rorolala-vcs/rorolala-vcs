_version: 2

init:
  help:
    en: |
        Create a workspace or vault in the current directory

        **Usage**: `rola init`

        This is `rola create <current directory>`: the path does not have to be written
        out. With `--vault`, a Vault is created instead of a Workspace.
    zh-CN: |
        将当前目录创建为工作区或保险库

        **用法**：`rola init`

        等价于 `rola create <当前目录>`，只是不用手写路径。
        加上 `--vault` 时创建的是保险库而不是工作区。

  cmd_init_description:
    en: Create a workspace or vault in the current directory
    zh-CN: 在当前目录创建工作区或保险库
