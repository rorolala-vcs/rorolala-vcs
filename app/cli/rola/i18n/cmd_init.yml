_version: 2

init:
  help:
    en: |
        # Create a Workspace or Vault in the current directory
        **Usage**: rola [[GREEN]]__init__[[/]]
        **Flags**:
             __--vault__ __-v__    Create a Vault instead of a Workspace
    zh-CN: |
        # 将当前目录创建为工作区或保险库
        **用法**：rola [[GREEN]]__init__[[/]]
        **标识**：
             __--vault__ __-v__    创建保险库而不是工作区

  cmd_init_description:
    en: Create a Workspace or Vault in the current directory
    zh-CN: 在当前目录创建工作区或保险库
