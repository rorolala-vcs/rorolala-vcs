_version: 2

rola:
  welcome:
    en: |
      Welcome to Rorolala CLI

      Run `rola -h` to see the available commands
    zh-CN: |
      欢迎使用 Rorolala CLI

      使用 `rola -h` 查看可用的命令
  help:
    en: |
      **Usage**: rola <command> [arguments]

      **Global flags**:
          [-v | --vault] [--rebuild] [--no-color] [--no-progress]
          [--json | --json-pretty] [--format <TEMPLATE>] [--workspace-dir <PATH>]
          [--vault-dir <PATH>] [--theme-choice <NAME>] [--lang <LOCALE>]
          [--offline] [--force] [--no-pager]
          [-V | --version] [-h | --help]

      **Initialization:**
          init                      Create a workspace or vault in the **current directory**
          create <path>             Create a workspace or vault in the **specified directory**
          bind   <link> [name]      Bind a vault to the **current workspace**
      **Identity:**
          account <account>         Query or switch the available accounts on this machine
          key [--pem]               List available keys, or generate a pair
      **Daily use:**
        **Status queries:**
          status                    Check the status of the **current target**
          entries [--remote]        List **local or remote entries**
        **Fetching:**
          fetch [vault]             Fetch indexes or contents from the **vault** over the network
          bring <upstream> [path]   Materialize **known entries** into the workspace
          sync --down-only          Update files from the **vault** over the network
        **Ownership operations:**
          hold   <path>             Request ownership of the **target entry** over the network
          giveup <path>             Give up ownership of the **target entry** over the network
        **Version operations:**
          track   <file>            Track a **modified state** as a definite version
          retrack <file>            Retrack to another state
        **Sharing:**
          sync                      Upload leading entries and update lagging entries
          sync --up-only            Upload leading entries
        **Tree objects:**
          tree init [dir]           Convert a directory into a tree object
          tree [add|rm|reset]       Operate on the tree's contents
          tree --help               Learn more!
      **Help:**
          docs <text> [--search]    Read or search an article
          explain                   Explain the meaning of numbers or names left by the program
      **Housekeeping and maintenance:**
          vault                     Query and operate on vaults known to the current workspace
          align <path>              Fix inconsistencies between the filesystem and records
          tweak <file> [target]     Adjust a version's record and rebuild what follows it
          cut <file> [target]       Cut the old history away and start the file again at a version
          collapse <file> [target]  Fold the local versions above the tracked Vault's version into one
          opslog                    List the operations this Workspace recorded, newest first
          undo [count]              Put back what the last recorded operations changed
          pack                      Pack and tidy stored objects
          fsck                      Check the integrity of the storage
      **Low-level operations:**
          storage                   Read and write content held by the repository
          vcs-index                 Read and write the version control index
          inv-idx                   Build and query the reverse index
          layout                    Operate on the layout held by this run
      **Desktop:**
          desktop                   Open the `rola` desktop application
          fs-ops                    Move, copy, or delete a path
    zh-CN: |
      **用法**：rola <命令> [参数]

      **全局标识**：
          [-v | --vault] [--rebuild] [--no-color] [--no-progress]
          [--json | --json-pretty] [--format <TEMPLATE>] [--workspace-dir <PATH>]
          [--vault-dir <PATH>] [--theme-choice <NAME>] [--lang <LOCALE>]
          [--offline] [--force] [--no-pager]
          [-V | --version] [-h | --help]

      **初始化：**
          init                      在 **当前目录** 创建工作区或保险库
          create <路径>             在 **指定目录** 创建工作区或保险库
          bind   <链接> [名字]      为 **当前工作区** 绑定保险库
      **身份：**
          account <账户名>          查询或切换本机的可用账户
          key [--pem]               列出可用密钥，或生成一对
      **日常使用：**
        **状态查询：**
          status                    检查 **所在目标** 的状态
          entries [--remote]        列出 **本地或远程的条目**
        **获取：**
          fetch [保险库名]          联网从 **保险库** 获取索引或内容
          bring <上游> [路径]       实体化 **已知条目** 到工作区
          sync --down-only          联网从 **保险库** 更新文件
        **所有权操作：**
          hold   <路径>             联网申请 **目标条目** 的所有权
          giveup <路径>             联网放弃 **目标条目** 的所有权
        **版本操作：**
          track   <文件>            将 **修改状态** 追踪为确定的版本
          retrack <文件>            重追踪到其他的状态
        **共享：**
          sync                      上传领先的条目，更新落后的条目
          sync --up-only            上传领先的条目
        **树对象：**
          tree init [目录]          将目录转换为树对象
          tree [add|rm|reset]       操作树的内容
          tree --help               了解更多！
      **帮助：**
          docs <文本> [--search]    阅读或搜索一篇文章
          explain                   解释程序留下的数字或名字的含义
      **整理与维护：**
          vault                     查询和操作当前工作区已知的保险库
          align <路径>              修复文件系统和记录不一致的情况
          tweak <文件> [目标]       调整某个版本的记录，并重建它之后的版本
          cut <文件> [目标]        截掉老历史，从某个版本重新开始这个文件
          collapse <文件> [目标]   把所追踪保险库版本之上的本地版本折成一个
          opslog                   列出本工作区记录的操作，最新的在前
          undo [数量]              撤回最近记录的操作，最新的先撤
          pack                      打包、整理所存储的对象
          fsck                      检查所在存储的完整性
      **底层操作：**
          storage                   读写仓库持有的内容
          vcs-index                 读写版本控制索引
          inv-idx                   建立并查询反向索引
          layout                    操作本次运行所持有的布局
      **桌面：**
          desktop                   打开 `rola` 的桌面端程序
          fs-ops                    移动、复制或删除一个路径
  err_unknown_command:
    en: Unknown command `%{command}`
    zh-CN: 未知命令 `%{command}`

  err_unknown_command_similar:
    en: Found similar command `%{command}`
    zh-CN: 找到类似命令：`%{commands}`

  err_unknown_command_help:
    en: Run `rola -h` to see the available commands
    zh-CN: 运行 `rola -h` 查看可用的命令
