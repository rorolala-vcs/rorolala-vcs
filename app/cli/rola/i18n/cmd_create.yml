_version: 2

create:
  help:
    en:
    zh-CN:

  cmd_create_description:
    en: Create workspace or vault
    zh-CN: 创建工作区或保险库

  path_not_provided:
    en: Path not provided, `rola create` cannot create the target
    zh-CN: 路径未指定，`rola create` 无法创建目标

  path_not_provided_help:
    en: |
        Please provide a path to complete the creation

        **Example**: `rola create my-workspace`
                  `rola create our-vault --vault`
    zh-CN: |
        请提供路径以完成创建

        **例如**：`rola create my-workspace`
                `rola create our-vault --vault`

  result_workspace_created:
    en: Workspace created at %{path}
    zh-CN: 工作区已创建于 %{path}

  result_vault_created:
    en: Vault created at %{path}
    zh-CN: 保险库已创建于 %{path}
