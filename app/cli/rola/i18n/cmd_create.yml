_version: 2

create:
  help:
    en: |
        Create a Workspace or a Vault

        **Usage**: rola create <PATH>
        **Flags**:
            --vault, -v    Create a Vault instead of a Workspace

        Create a Workspace at the given path, or use `--vault` to create a Vault
    zh-CN: |
        创建工作区或保险库

        **用法**：rola create <路径>
        **标识**：
            --vault, -v    创建保险库而不是工作区

        在给定路径创建工作区，或使用 `--vault` 指定创建保险库

  cmd_create_description:
    en: Create a Workspace or a Vault
    zh-CN: 创建工作区或保险库

  path_not_provided:
    en: Path not provided, `rola create` cannot create the target
    zh-CN: 没有给出路径，`rola create` 无法创建目标

  path_not_provided_help:
    en: |
        Please provide a path to complete the creation

        **Example**: `rola create my-workspace`
                  `rola create our-vault --vault`
    zh-CN: |
        请提供一个路径以完成创建

        **例如**：`rola create my-workspace`
                `rola create our-vault --vault`

  result_workspace_created:
    en: Workspace created at %{path}
    zh-CN: 工作区已创建于 %{path}

  sub_vault_name_is_path:
    en: "A vault inside a vault is named, not pathed: `%{name}` is a path"
    zh-CN: 保险库内的保险库应当给出名字而非路径，但 `%{name}` 是一个路径

  sub_vault_name_is_path_help:
    en: |
        Give the vault a name, and it is made under the current vault's `vaults/`

        **Example**: `rola create alpha --vault`
    zh-CN: |
        请给出保险库的名字，它会被创建在当前保险库的 `vaults/` 下

        **例如**：`rola create alpha --vault`

  result_vault_created:
    en: Vault created at %{path}
    zh-CN: 保险库已创建于 %{path}
