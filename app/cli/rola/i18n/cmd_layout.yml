_version: 2

cmd_layout:
  help:
    en: |
        Work with the Layout a run keeps

        **Usage**: rola layout <COMMAND>
        **Flags**:
            --vault, -v     Work on the Vault's Layout, rather than the Workspace's
        **Commands**:
            ls              List the Layout a run works in
            set-track       Name the Vault upstream the Layout tracks
            un-track        Make the Layout track no Vault
            tree-diff       Show what the working tree holds beside a Layout
            entry           Work with the entries in a Layout
            path            Work with the paths in a Layout
            entries         List what a Layout's entries hold
    zh-CN: |
        操作本运行所持有的布局

        **用法**：rola layout <子命令>
        **标识**：
            --vault, -v     在保险库的布局上操作，而非工作区的布局
        **命令**：
            ls              列出本运行所使用的布局
            set-track       指定布局追踪的上游保险库
            un-track        让布局不再追踪任何保险库
            tree-diff       展示工作树相对于布局的内容
            entry           操作布局中的条目
            path            操作布局中的路径
            entries         列出布局中各条目所持有的内容

  description:
    en: Work with the Layout a run keeps
    zh-CN: 操作本运行所持有的布局

  err_no_layouts:
    en: This run is in neither a Workspace nor a Vault, so it has no Layout
    zh-CN: 当前不在工作区，也不在保险库中，因此没有任何布局

  err_no_layouts_help:
    en: |
        Run this inside a Workspace or a Vault, then try again
    zh-CN: |
        请在工作区或保险库内运行本命令，然后重试

  err_layout_failed:
    en: "The Layout could not be worked on: %{reason}"
    zh-CN: "无法操作该布局：%{reason}"

  err_layout_failed_help:
    en: |
        Please check the Layout's directory and its permissions, then try again
    zh-CN: |
        请检查该布局的目录及其权限，然后重试

  err_layout_argument:
    en: "`rola layout` was given arguments it cannot use"
    zh-CN: "`rola layout` 收到了无法使用的参数"

  err_layout_argument_help:
    en: |
        Run `rola layout --help` to see what it takes
    zh-CN: |
        请运行 `rola layout --help` 查看它接受哪些参数

  err_layout_hash:
    en: "`%{hash}` is not a valid hash"
    zh-CN: "`%{hash}` 不是有效的哈希"

  err_layout_hash_help:
    en: |
        Please give a hash as hex, or as `blake3:<hex>`
    zh-CN: |
        请给出十六进制的哈希，或 `blake3:<hex>` 形式的哈希

  err_layout_no_current:
    en: This Workspace has no Layout to work in
    zh-CN: 本工作区没有可使用的布局

  err_layout_no_current_help:
    en: |
        A Workspace has one Layout and it is made with the Workspace: a Workspace made by an older version has the Layout it worked in adopted the next time it is opened
    zh-CN: |
        每个工作区只有一个布局，且随工作区一同创建：旧版本创建的工作区会在下次打开时接续它当时使用的布局

  err_layout_exists:
    en: There is already something by that name
    zh-CN: 该名字下已经存在内容

  err_layout_exists_help:
    en: |
        Please choose another name, or take what is there away first
    zh-CN: |
        请改用其他名字，或先移除已有的内容

  err_layout_missing:
    en: There is nothing by that name
    zh-CN: 该名字下没有任何内容

  err_layout_missing_help:
    en: |
        A Workspace's own Layout is the one it works in; a fetched copy of a Vault's is named `truth@VAULT`
    zh-CN: |
        工作区自身的布局就是它在使用的布局；保险库布局的取回副本写作 `truth@保险库`

  err_track_not_bound:
    en: "`%{track}` is not a Vault this Workspace has bound"
    zh-CN: "`%{track}` 不是本工作区已绑定的保险库"

  err_track_not_bound_help:
    en: |
        Please bind it first with `rola vault bind`
    zh-CN: |
        请先用 `rola vault bind` 绑定它

  err_not_cached:
    en: "The Layout `%{layout}` of `%{vault}` has not been fetched here"
    zh-CN: "尚未在此取回 `%{vault}` 的布局 `%{layout}`"

  err_not_cached_help:
    en: |
        Run `rola layout fetch %{vault}` to bring it down, then try again
    zh-CN: |
        请运行 `rola layout fetch %{vault}` 将其取回，然后重试

  err_read_only:
    en: "The Layout `%{layout}` is a fetched copy of a Vault's Layout, and cannot be changed"
    zh-CN: "布局 `%{layout}` 是保险库布局的取回副本，无法修改"

  err_read_only_help:
    en: |
        A name written `NAME@VAULT` reads the copy `rola layout fetch` brought back
        Please work on the Workspace's own Layout instead
    zh-CN: |
        写成 `NAME@VAULT` 的名字读取的是 `rola layout fetch` 取回的副本
        请改为操作工作区自身的布局

  err_path_taken:
    en: That path already names an entry of the Vault's Layout
    zh-CN: 该路径已经指向保险库布局中的一个条目

  err_path_taken_help:
    en: |
        Please choose another path, or move what is there first
    zh-CN: |
        请改用其他路径，或先移动那里的内容

  err_ownership_unknown:
    en: "The fetched Layout names no entry `%{uuid}`"
    zh-CN: "取回的布局中没有名为 `%{uuid}` 的条目"

  err_ownership_unknown_help:
    en: |
        The copy may be out of date: run `rola layout fetch` to get the new state
    zh-CN: |
        副本可能已过期：请运行 `rola layout fetch` 获取新状态

  err_ownership_missing:
    en: "The Vault holds no entry `%{uuid}`"
    zh-CN: "保险库中没有名为 `%{uuid}` 的条目"

  err_ownership_missing_help:
    en: |
        Please check the `Uuid`, and fetch the Layout again to see the new state
    zh-CN: |
        请检查 `Uuid`，并重新取回布局以查看新状态

  err_ownership_held:
    en: "The entry `%{uuid}` is held by `%{owner}`"
    zh-CN: "条目 `%{uuid}` 由 `%{owner}` 持有"

  err_ownership_held_help:
    en: |
        The holder has to give it up first before it can be taken
        `rola layout read-ownership` can read the holder from the fetched copy
    zh-CN: |
        需要持有者先放弃，才能取得它
        `rola layout read-ownership` 可以从取回的副本中读取持有者

cmd_layout_ls:
  help:
    en: |
        List the Layout a run works in

        **Usage**: rola layout ls
        **Flags**:
            --vault, -v    List the Vault's Layout, rather than the Workspace's
    zh-CN: |
        列出本运行所使用的布局

        **用法**：rola layout ls
        **标识**：
            --vault, -v    列出保险库的布局，而非工作区的布局

  description:
    en: List the Layout a run works in
    zh-CN: 列出本运行所使用的布局

cmd_layout_set_track:
  help:
    en: |
        Name the Vault upstream the Layout tracks

        **Usage**: rola layout set-track <VAULT>

        `VAULT` must be the name of a Vault the Workspace has bound
    zh-CN: |
        指定布局所追踪的上游保险库

        **用法**：rola layout set-track <保险库>

        `保险库` 须是工作区已绑定的保险库名字

  description:
    en: Name the Vault upstream the Layout tracks
    zh-CN: 指定布局所追踪的上游保险库

  result_set:
    en: "The Layout now tracks `%{track}`"
    zh-CN: "布局现已追踪 `%{track}`"

cmd_layout_un_track:
  help:
    en: |
        Make the Layout track no Vault

        **Usage**: rola layout un-track
    zh-CN: |
        让布局不再追踪任何保险库

        **用法**：rola layout un-track

  description:
    en: Make the Layout track no Vault
    zh-CN: 让布局不再追踪任何保险库

  result_untracked:
    en: The Layout now tracks no Vault
    zh-CN: 布局现已不再追踪任何保险库

cmd_layout_tree_diff:
  complete:
    alike:
      en: How alike two text files must be to count as the same move, from 0 to 1
      zh-CN: 两个文本文件要多相似才算作同一次移动，取值 0 到 1
  help:
    en: |
        Show what the working tree holds beside a Layout

        **Usage**: rola layout tree-diff [LAYOUT]
        **Flags**:
            --alike <0.0-1.0>    The similarity threshold for two text files to count as moved, `0.6` by default
            --include-ignored    Show what the ignore rules govern as well

        Each line is a mode and a path: `lost`, `untagged`, `modified`, `rename <FROM> -> <TO>` or `failed`
        What the tree gained is left out when the ignore rules govern it; a move the reading found is not
    zh-CN: |
        展示工作树相对于布局的内容

        **用法**：rola layout tree-diff [布局]
        **标识**：
            --alike <0.0-1.0>    两个文本文件算作移动的相似度门槛，默认为 0.6
            --include-ignored    连被忽略规则管辖的条目一并显示

        每行是一个模式加一个路径：`lost`、`untagged`、`modified`、`rename <FROM> -> <TO>` 或 `failed`
        工作树新增的条目被忽略规则管辖时不显示；已被识别为移动的条目不受影响

  description:
    en: Show what the working tree holds beside a Layout
    zh-CN: 展示工作树相对于布局的内容

cmd_layout_entry:
  complete:
    owner:
      en: The account the entry is held by
      zh-CN: 持有该条目的账户
    description:
      en: What the entry says about itself
      zh-CN: 条目对自身的描述
    layout:
      en: The Layout to work on; the one being worked in when none is named
      zh-CN: 要操作的布局，未指定时用当前使用的布局
  create_help:
    en: |
        Make an entry hold data

        **Usage**: rola layout entry create <UUID> <VERSION>
        **Flags**:
            --vault, -v             Edit the Vault's Layout, rather than the Workspace's
            --owner <ACCOUNT>       Name the account that holds the entry
            --description <TEXT>    Write a description for the entry

        `VERSION` is `blake3:<hex>` or the bare digest
        Nothing beyond the Layout's own checks is checked
    zh-CN: |
        让条目持有数据

        **用法**：rola layout entry create <UUID> <版本>
        **标识**：
            --vault, -v             编辑保险库的布局，而非工作区的布局
            --owner <账户>          指定持有该条目的账户
            --description <文本>    给该条目写一段说明

        `版本` 为 `blake3:<hex>` 或裸摘要
        除布局自身的检查外不做别的检查

  create_description:
    en: Make an entry hold data
    zh-CN: 让条目持有数据

  update_help:
    en: |
        Change what an entry holds

        **Usage**: rola layout entry update <UUID> <VERSION>
        **Flags**:
            --vault, -v             Edit the Vault's Layout, rather than the Workspace's
            --owner <ACCOUNT>       Name the account that holds the entry
            --description <TEXT>    Write a description for the entry

        The data is replaced whole: an option left out means the entry has no account and no description
    zh-CN: |
        修改条目所持有的数据

        **用法**：rola layout entry update <UUID> <版本>
        **标识**：
            --vault, -v             编辑保险库的布局，而非工作区的布局
            --owner <账户>          指定持有该条目的账户
            --description <文本>    给该条目写一段说明

        数据被整体替换：省略选项即表示该条目没有账户、也没有说明

  update_description:
    en: Change what an entry holds
    zh-CN: 修改条目所持有的数据

  remove_help:
    en: |
        Drop an entry, and the path that named it

        **Usage**: rola layout entry remove <UUID>
        **Flags**:
            --vault, -v    Edit the Vault's Layout, rather than the Workspace's
    zh-CN: |
        删除条目，以及命名它的路径

        **用法**：rola layout entry remove <UUID>
        **标识**：
            --vault, -v    编辑保险库的布局，而非工作区的布局

  remove_description:
    en: Drop an entry, and the path that named it
    zh-CN: 删除条目，以及命名它的路径

  result_created:
    en: "The entry `%{what}` was made"
    zh-CN: "条目 `%{what}` 已创建"

  result_updated:
    en: "The entry `%{what}` was changed"
    zh-CN: "条目 `%{what}` 已修改"

  result_removed:
    en: "The entry `%{what}` was dropped"
    zh-CN: "条目 `%{what}` 已删除"

cmd_layout_path:
  complete:
    layout:
      en: The Layout to work on; the one being worked in when none is named
      zh-CN: 要操作的布局，未指定时用当前使用的布局
  create_help:
    en: |
        Make a path name an entry

        **Usage**: rola layout path create <PATH> <UUID>
        **Flags**:
            --vault, -v    Edit the Vault's Layout, rather than the Workspace's

        An entry is at only one path, and naming it elsewhere is moving it
        The entry may not yet hold data
    zh-CN: |
        让路径指向条目

        **用法**：rola layout path create <路径> <UUID>
        **标识**：
            --vault, -v    编辑保险库的布局，而非工作区的布局

        一个条目只位于一个路径，在别处命名它等于移动它
        该条目可以尚未持有数据

  create_description:
    en: Make a path name an entry
    zh-CN: 让路径指向条目

  remove_help:
    en: |
        Make a path name nothing

        **Usage**: rola layout path remove <PATH>
        **Flags**:
            --vault, -v    Edit the Vault's Layout, rather than the Workspace's
    zh-CN: |
        让路径不再指向任何条目

        **用法**：rola layout path remove <路径>
        **标识**：
            --vault, -v    编辑保险库的布局，而非工作区的布局

  remove_description:
    en: Make a path name nothing
    zh-CN: 让路径不再指向任何条目

  move_help:
    en: |
        Move the entry at one path to another

        **Usage**: rola layout path move <FROM> <TO>
        **Flags**:
            --layout <NAME[@VAULT]>    Move the path in that Layout, the Vault's own when written `truth@VAULT`
            --offline                  Do not reach the Vault when moving, using only what was fetched locally
    zh-CN: |
        把条目从旧路径移到新路径

        **用法**：rola layout path move <源路径> <目标路径>
        **标识**：
            --layout <布局名[@保险库]>    在该布局中移动路径，写成 `truth@保险库` 时移动保险库自身的布局
            --offline                     移动时不连接保险库，仅使用本地已取回的内容

  move_description:
    en: Move the entry at one path to another
    zh-CN: 把条目从旧路径移到新路径

  change_uuid_help:
    en: |
        Make a path name another entry

        **Usage**: rola layout path change-uuid <PATH> <UUID>
        **Flags**:
            --vault, -v        Edit the Vault's Layout, rather than the Workspace's
            --layout <NAME>    Change the path in that Layout, the Vault's own when written `truth@VAULT`

        The entry the path named is dropped, and the entry given takes its place
        `UUID` must be one the Layout holds at no path
    zh-CN: |
        让路径改指另一个条目

        **用法**：rola layout path change-uuid <路径> <UUID>
        **标识**：
            --vault, -v          编辑保险库的布局，而非工作区的布局
            --layout <布局名>    在该布局中修改路径，写成 `truth@保险库` 时修改保险库自身的布局

        路径原本指向的条目会被删除，改由给出的条目占据该路径
        `UUID` 须是布局持有、但没有任何路径指向的条目

  change_uuid_description:
    en: Make a path name another entry
    zh-CN: 让路径改指另一个条目

  new_uuid_help:
    en: |
        Give a path's entry a new Uuid

        **Usage**: rola layout path new-uuid <PATH>
        **Flags**:
            --vault, -v        Edit the Vault's Layout, rather than the Workspace's
            --layout <NAME>    Change the path in that Layout, the Vault's own when written `truth@VAULT`

        The entry the path named is dropped and made again under a new Uuid, holding what it held
    zh-CN: |
        给路径上的条目换一个新的 Uuid

        **用法**：rola layout path new-uuid <路径>
        **标识**：
            --vault, -v          编辑保险库的布局，而非工作区的布局
            --layout <布局名>    在该布局中修改路径，写成 `truth@保险库` 时修改保险库自身的布局

        路径原本指向的条目会被删除，并以新的 Uuid 重新创建，所持有的内容不变

  new_uuid_description:
    en: Give a path's entry a new Uuid
    zh-CN: 给路径上的条目换一个新的 Uuid

  err_same_uuid:
    en: "The path already names the entry `%{uuid}`"
    zh-CN: "该路径已经指向条目 `%{uuid}`"

  err_same_uuid_help:
    en: |
        A change of Uuid is only a change when it is another Uuid
        Please give the Uuid of an entry that has no path
    zh-CN: |
        只有换成另一个 Uuid 才算修改
        请给出一个没有路径的条目的 Uuid

  err_uuid_named:
    en: "The entry `%{uuid}` is already named by `%{path}`"
    zh-CN: "条目 `%{uuid}` 已由 `%{path}` 命名"

  err_uuid_named_help:
    en: |
        An entry is at one path, so the path that names it has to let go first
        Run `rola layout path remove` on that path, then try again
    zh-CN: |
        一个条目只位于一个路径，须先让指向它的路径放手
        请先对该路径运行 `rola layout path remove`，然后重试

  err_uuid_missing:
    en: "The Layout holds no entry `%{uuid}`"
    zh-CN: "布局中没有条目 `%{uuid}`"

  err_uuid_missing_help:
    en: |
        Please check the Uuid, or make the entry first with `rola layout entry create`
    zh-CN: |
        请检查该 Uuid，或先用 `rola layout entry create` 创建该条目

  result_bound:
    en: "The path now names the entry: %{what}"
    zh-CN: "该路径现已指向条目：%{what}"

  result_unbound:
    en: "The path names nothing now: %{what}"
    zh-CN: "该路径不再指向任何条目：%{what}"

  result_moved:
    en: "The entry was moved: %{what}"
    zh-CN: "条目已移动：%{what}"

  result_uuid_changed:
    en: "The path now names another entry: %{what}"
    zh-CN: "该路径现已指向另一个条目：%{what}"

  result_uuid_new:
    en: "The entry at the path was given a new Uuid: %{what}"
    zh-CN: "该路径上的条目已换用新的 Uuid：%{what}"

cmd_layout_entries:
  complete:
    layout:
      en: The Layout to work on; the one being worked in when none is named
      zh-CN: 要操作的布局，未指定时用当前使用的布局
    uuid:
      en: The entry to list alone; every entry when none is named
      zh-CN: 只列出该条目，未指定时列出全部条目
  help:
    en: |
        List what a Layout's entries hold

        **Usage**: rola layout entries
        **Flags**:
            --vault, -v        List the Vault's Layout, rather than the Workspace's
            --layout <NAME>    List the Vault's Layout when written `truth@VAULT`
            --uuid <UUID>      List only the entry with this UUID
    zh-CN: |
        列出布局中各条目所持有的内容

        **用法**：rola layout entries
        **标识**：
            --vault, -v        列出保险库的布局，而非工作区的布局
            --layout <布局>    指定要列出的布局，写成 `名字@保险库` 时指定保险库的布局
            --uuid <UUID>      只列出该 UUID 的条目

  description:
    en: List what a Layout's entries hold
    zh-CN: 列出布局中各条目所持有的内容
