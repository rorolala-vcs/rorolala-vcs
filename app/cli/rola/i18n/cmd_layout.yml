_version: 2

cmd_layout:
  help:
    en: |
        # Work with the Layout a run keeps
        **Usage**: rola [[GREEN]]__layout__[[/]] <COMMAND>
        **Flags**:
             __--vault__ __-v__    Work on the Vault's Layout, rather than the Workspace's
        **Commands**:
            ls              List the Layout a run works in
            set-track       Name the Vault upstream the Layout tracks
            un-track        Make the Layout track no Vault
            tree-diff       Show what the working tree holds beside a Layout
            entry           Work with the entries in a Layout
            path            Work with the paths in a Layout
            entries         List what a Layout's entries hold
    zh-CN: |
        # 操作本运行所持有的布局
        **用法**：rola [[GREEN]]__layout__[[/]] <子命令>
        **标识**：
             __--vault__ __-v__    在保险库的布局上操作，而非工作区的布局
        **命令**：
            ls              列出本运行所使用的布局
            set-track       指定布局追踪的上游保险库
            un-track        让布局不再追踪任何保险库
            tree-diff       展示工作树相对于布局的内容
            entry           操作布局中的条目
            path            操作布局中的路径
            entries         列出布局中各条目所持有的内容

  description:
    en: Work with the Layout a run keeps
    zh-CN: 操作本运行所持有的布局

  err_no_layouts:
    en: This run is in neither a Workspace nor a Vault, so it has no Layout
    zh-CN: 当前不在工作区，也不在保险库中，因此没有任何布局

  err_no_layouts_help:
    en: |
        Run this inside a Workspace or a Vault, then try again
    zh-CN: |
        请在工作区或保险库内运行本命令，然后重试

  err_layout_failed:
    en: "The Layout could not be worked on: %{reason}"
    zh-CN: "无法操作该布局：%{reason}"

  err_layout_failed_help:
    en: |
        Please check the Layout's directory and its permissions, then try again
    zh-CN: |
        请检查该布局的目录及其权限，然后重试

  err_layout_argument:
    en: "`rola layout` was given arguments it cannot use"
    zh-CN: "`rola layout` 收到了无法使用的参数"

  err_layout_argument_help:
    en: |
        Run `rola layout --help` to see what it takes
    zh-CN: |
        请运行 `rola layout --help` 查看它接受哪些参数

  err_layout_hash:
    en: "`%{hash}` is not a valid hash"
    zh-CN: "`%{hash}` 不是有效的哈希"

  err_layout_hash_help:
    en: |
        Please give a hash as hex, or as `blake3:<hex>`
    zh-CN: |
        请给出十六进制的哈希，或 `blake3:<hex>` 形式的哈希

  err_layout_no_current:
    en: This Workspace has no Layout to work in
    zh-CN: 本工作区没有可使用的布局

  err_layout_no_current_help:
    en: |
        A Workspace has one Layout and it is made with the Workspace: a Workspace made by an older version has the Layout it worked in adopted the next time it is opened
    zh-CN: |
        每个工作区只有一个布局，且随工作区一同创建：旧版本创建的工作区会在下次打开时接续它当时使用的布局

  err_layout_exists:
    en: There is already something by that name
    zh-CN: 该名字下已经存在内容

  err_layout_exists_help:
    en: |
        Please choose another name, or take what is there away first
    zh-CN: |
        请改用其他名字，或先移除已有的内容

  err_layout_missing:
    en: There is nothing by that name
    zh-CN: 该名字下没有任何内容

  err_layout_missing_help:
    en: |
        A Workspace's own Layout is the one it works in; a fetched copy of a Vault's is named `truth@VAULT`
    zh-CN: |
        工作区自身的布局就是它在使用的布局；保险库布局的取回副本写作 `truth@保险库`

  err_track_not_bound:
    en: "`%{track}` is not a Vault this Workspace has bound"
    zh-CN: "`%{track}` 不是本工作区已绑定的保险库"

  err_track_not_bound_help:
    en: |
        Please bind it first with `rola vault bind`
    zh-CN: |
        请先用 `rola vault bind` 绑定它

  err_not_cached:
    en: "The Layout `%{layout}` of `%{vault}` has not been fetched here"
    zh-CN: "尚未在此取回 `%{vault}` 的布局 `%{layout}`"

  err_not_cached_help:
    en: Run `rola fetch %{vault}` to bring it down, then try again
    zh-CN: 请运行 `rola fetch %{vault}` 将其取回，然后重试

  err_read_only:
    en: "The Layout `%{layout}` is a fetched copy of a Vault's Layout, and cannot be changed"
    zh-CN: "布局 `%{layout}` 是保险库布局的取回副本，无法修改"

  err_read_only_help:
    en: Work on the Workspace's own Layout, since a `NAME@VAULT` name reads the fetched copy alone
    zh-CN: 请改为操作工作区自身的布局，`NAME@VAULT` 读到的是取回的只读副本

  err_path_taken:
    en: That path already names an entry of the Vault's Layout
    zh-CN: 该路径已经指向保险库布局中的一个条目

  err_path_taken_help:
    en: |
        Please choose another path, or move what is there first
    zh-CN: |
        请改用其他路径，或先移动那里的内容

  err_ownership_unknown:
    en: "The fetched Layout names no entry `%{uuid}`"
    zh-CN: "取回的布局中没有名为 `%{uuid}` 的条目"

  err_ownership_unknown_help:
    en: "The copy may be out of date: run `rola fetch` to get the new state"
    zh-CN: 副本可能已过期：请运行 `rola fetch` 获取新状态

  err_ownership_missing:
    en: "The Vault holds no entry `%{uuid}`"
    zh-CN: "保险库中没有名为 `%{uuid}` 的条目"

  err_ownership_missing_help:
    en: |
        Please check the `Uuid`, and fetch the Layout again to see the new state
    zh-CN: |
        请检查 `Uuid`，并重新取回布局以查看新状态

  err_ownership_held:
    en: "The entry `%{uuid}` is held by `%{owner}`"
    zh-CN: "条目 `%{uuid}` 由 `%{owner}` 持有"

  err_ownership_held_help:
    en: Ask the holder to give it up with `rola giveup <PATH>`
    zh-CN: 请让持有者用 `rola giveup <路径>` 让出它

  err_layout_held:
    en: "The entry `%{path}` is held by `%{owner}`, so this account may not remove it"
    zh-CN: "`%{path}` 的条目由 `%{owner}` 持有，本账户不能删除它"

  err_layout_held_help:
    en: Ask the holder to let go with `rola giveup <PATH>`, or have an administrator of the Vault remove it
    zh-CN: 请让持有者用 `rola giveup <路径>` 放手，或由保险库管理员删除

  err_layout_unheld:
    en: "The entry `%{path}` is held by nobody, so only an administrator of the Vault may remove it"
    zh-CN: "`%{path}` 的条目无人持有，只有保险库管理员才能删除它"

  err_layout_unheld_help:
    en: Have an administrator of the Vault remove it
    zh-CN: 请由保险库管理员删除它

cmd_layout_ls:
  help:
    en: |
        # List the Layout a run works in
        **Usage**: rola layout [[GREEN]]__ls__[[/]]
        **Flags**:
             __--vault__ __-v__    List the Vault's Layout, rather than the Workspace's
    zh-CN: |
        # 列出本运行所使用的布局
        **用法**：rola layout [[GREEN]]__ls__[[/]]
        **标识**：
             __--vault__ __-v__    列出保险库的布局，而非工作区的布局

  description:
    en: List the Layout a run works in
    zh-CN: 列出本运行所使用的布局

cmd_layout_set_track:
  help:
    en: |
        # Name the Vault upstream the Layout tracks
        **Usage**: rola layout [[GREEN]]__set-track__[[/]] <VAULT>

        `VAULT` must be the name of a Vault the Workspace has bound
    zh-CN: |
        # 指定布局所追踪的上游保险库
        **用法**：rola layout [[GREEN]]__set-track__[[/]] <保险库>

        `保险库` 须是工作区已绑定的保险库名字

  description:
    en: Name the Vault upstream the Layout tracks
    zh-CN: 指定布局所追踪的上游保险库

  result_set:
    en: "The Layout now tracks `%{track}`"
    zh-CN: "布局现已追踪 `%{track}`"

cmd_layout_un_track:
  help:
    en: |
        # Make the Layout track no Vault
        **Usage**: rola layout [[GREEN]]__un-track__[[/]]
    zh-CN: |
        # 让布局不再追踪任何保险库
        **用法**：rola layout [[GREEN]]__un-track__[[/]]

  description:
    en: Make the Layout track no Vault
    zh-CN: 让布局不再追踪任何保险库

  result_untracked:
    en: The Layout now tracks no Vault
    zh-CN: 布局现已不再追踪任何保险库

cmd_layout_tree_diff:
  complete:
    alike:
      en: How alike two text files must be to count as the same move, from 0 to 1
      zh-CN: 两个文本文件要多相似才算作同一次移动，取值 0 到 1
  help:
    en: |
        # Show what the working tree holds beside a Layout
        **Usage**: rola layout [[GREEN]]__tree-diff__[[/]] [LAYOUT]
        **Flags**:
             __--alike__ <0.0-1.0>    The similarity threshold for two text files to count as moved, `0.6` by default
             __--include-ignored__    Show what the ignore rules govern as well
    zh-CN: |
        # 展示工作树相对于布局的内容
        **用法**：rola layout [[GREEN]]__tree-diff__[[/]] [布局]
        **标识**：
             __--alike__ <0.0-1.0>    两个文本文件算作移动的相似度门槛，默认为 0.6
             __--include-ignored__    连被忽略规则管辖的条目一并显示

  description:
    en: Show what the working tree holds beside a Layout
    zh-CN: 展示工作树相对于布局的内容

cmd_layout_entry:
  complete:
    owner:
      en: The account the entry is held by
      zh-CN: 持有该条目的账户
    description:
      en: What the entry says about itself
      zh-CN: 条目对自身的描述
    layout:
      en: The Layout to work on; the one being worked in when none is named
      zh-CN: 要操作的布局，未指定时用当前使用的布局
  create_help:
    en: |
        # Make an entry hold data
        **Usage**: rola layout entry [[GREEN]]__create__[[/]] <UUID> <VERSION>
        **Flags**:
             __--vault__ __-v__              Edit the Vault's Layout, rather than the Workspace's
             __--owner__ <ACCOUNT>       Name the account that holds the entry
             __--description__ <TEXT>    Write a description for the entry
    zh-CN: |
        # 让条目持有数据
        **用法**：rola layout entry [[GREEN]]__create__[[/]] <UUID> <版本>
        **标识**：
             __--vault__ __-v__              编辑保险库的布局，而非工作区的布局
             __--owner__ <账户>          指定持有该条目的账户
             __--description__ <文本>    给该条目写一段说明

  create_description:
    en: Make an entry hold data
    zh-CN: 让条目持有数据

  update_help:
    en: |
        # Change what an entry holds
        **Usage**: rola layout entry [[GREEN]]__update__[[/]] <UUID> <VERSION>
        **Flags**:
             __--vault__ __-v__              Edit the Vault's Layout, rather than the Workspace's
             __--owner__ <ACCOUNT>       Name the account that holds the entry
             __--description__ <TEXT>    Write a description for the entry
    zh-CN: |
        # 修改条目所持有的数据
        **用法**：rola layout entry [[GREEN]]__update__[[/]] <UUID> <版本>
        **标识**：
             __--vault__ __-v__              编辑保险库的布局，而非工作区的布局
             __--owner__ <账户>          指定持有该条目的账户
             __--description__ <文本>    给该条目写一段说明

  update_description:
    en: Change what an entry holds
    zh-CN: 修改条目所持有的数据

  remove_help:
    en: |
        # Drop an entry, and the path that named it
        **Usage**: rola layout entry [[GREEN]]__remove__[[/]] <UUID>
        **Flags**:
             __--vault__ __-v__    Edit the Vault's Layout, rather than the Workspace's
    zh-CN: |
        # 删除条目，以及命名它的路径
        **用法**：rola layout entry [[GREEN]]__remove__[[/]] <UUID>
        **标识**：
             __--vault__ __-v__    编辑保险库的布局，而非工作区的布局

  remove_description:
    en: Drop an entry, and the path that named it
    zh-CN: 删除条目，以及命名它的路径

  result_created:
    en: "The entry `%{what}` was made"
    zh-CN: "条目 `%{what}` 已创建"

  result_updated:
    en: "The entry `%{what}` was changed"
    zh-CN: "条目 `%{what}` 已修改"

  result_removed:
    en: "The entry `%{what}` was dropped"
    zh-CN: "条目 `%{what}` 已删除"

cmd_layout_path:
  complete:
    layout:
      en: The Layout to work on; the one being worked in when none is named
      zh-CN: 要操作的布局，未指定时用当前使用的布局
  create_help:
    en: |
        # Make a path name an entry
        **Usage**: rola layout path [[GREEN]]__create__[[/]] <PATH> <UUID>
        **Flags**:
             __--vault__ __-v__    Edit the Vault's Layout, rather than the Workspace's
        > [!Note]
        > An entry is at only one path, and naming it elsewhere is moving it
        > The entry may not yet hold data
    zh-CN: |
        # 让路径指向条目
        **用法**：rola layout path [[GREEN]]__create__[[/]] <路径> <UUID>
        **标识**：
             __--vault__ __-v__    编辑保险库的布局，而非工作区的布局
        > [!Note]
        > 一个条目只位于一个路径，在别处命名它等于移动它
        > 该条目可以尚未持有数据

  create_description:
    en: Make a path name an entry
    zh-CN: 让路径指向条目

  remove_help:
    en: |
        # Make a path name nothing, or take an entry out of the Vault's Layout
        **Usage**: rola layout path [[GREEN]]__remove__[[/]] <PATH>
        **Flags**:
             __--layout__ <NAME[@VAULT]>    Remove the path in that Layout
                                    Write `truth@VAULT` to point at the Vault's Layout
             __--vault__ __-v__                 Switch to editing the Vault's Layout
             __--offline__                  Do not reach the Vault, using only what was fetched locally

    zh-CN: |
        # 让路径不再指向任何条目，或从保险库的布局中删除条目
        **用法**：rola layout path [[GREEN]]__remove__[[/]] <路径>
        **标识**：
             __--layout__ <名称[@保险库]>    在指定布局中删除路径
                                     以 `truth@VAULT` 指向保险库布局
             __--vault__ __-v__                  切换为编辑保险库的布局
             __--offline__                   不访问保险库，仅使用本地已取回的内容

  remove_description:
    en: Make a path name nothing, or take an entry out of the Vault's Layout
    zh-CN: 让路径不再指向任何条目，或从保险库的布局中删除条目

  move_help:
    en: |
        # Move the entry at one path to another
        **Usage**: rola layout path [[GREEN]]__move__[[/]] <FROM> <TO>
        **Flags**:
             __--layout__ <NAME[@VAULT]>    Move the path in that Layout
                                    Write `truth@VAULT` to point at the Vault's Layout
             __--vault__ __-v__                 Switch to editing the Vault's Layout
             __--offline__                  Do not reach the Vault when moving, using only what was fetched locally
    zh-CN: |
        # 把条目从旧路径移到新路径
        **用法**：rola layout path [[GREEN]]__move__[[/]] <源路径> <目标路径>
        **标识**：
             __--layout__ <名称[@保险库]>    在指定布局中移动路径
                                     以 `truth@VAULT` 指向保险库布局
             __--vault__ __-v__                  切换为编辑保险库的布局
             __--offline__                   移动时不连接保险库，仅使用本地已取回的内容


  move_description:
    en: Move the entry at one path to another
    zh-CN: 把条目从旧路径移到新路径

  change_uuid_help:
    en: |
        # Make a path name another entry
        **Usage**: rola layout path [[GREEN]]__change-uuid__[[/]] <PATH> <UUID>
        **Flags**:
             __--layout__ <NAME[@VAULT]>    Change the path in that Layout
                                    Write `truth@VAULT` to point at the Vault's Layout
             __--vault__ __-v__                 Switch to editing the Vault's Layout
             __--offline__                  Do not reach the Vault, using only what was fetched locally

        > [!Note]
        > The entry the path named is dropped, and the entry given takes its place
        > `UUID` must be one the Layout holds at no path
    zh-CN: |
        # 让路径改指另一个条目
        **用法**：rola layout path [[GREEN]]__change-uuid__[[/]] <路径> <UUID>
        **标识**：
             __--layout__ <名称[@保险库]>    在指定布局中修改路径
                                     以 `truth@VAULT` 指向保险库布局
             __--vault__ __-v__                  切换为编辑保险库的布局
             __--offline__                   不访问保险库，仅使用本地已取回的内容
        > [!Note]
        > 路径原本指向的条目会被删除，改由给出的条目占据该路径
        > `UUID` 须是布局持有、但没有任何路径指向的条目

  change_uuid_description:
    en: Make a path name another entry
    zh-CN: 让路径改指另一个条目

  new_uuid_help:
    en: |
        # Give a path's entry a new Uuid
        **Usage**: rola layout path [[GREEN]]__new-uuid__[[/]] <PATH>
        **Flags**:
             __--layout__ <NAME[@VAULT]>    Change the path in that Layout
                                    Write `truth@VAULT` to point at the Vault's Layout
             __--vault__ __-v__                 Switch to editing the Vault's Layout
             __--offline__                  Do not reach the Vault, using only what was fetched locally
        > [!Note]
        > The entry the path named is dropped and made again under a new Uuid, holding what it held
    zh-CN: |
        # 给路径上的条目换一个新的 Uuid
        **用法**：rola layout path [[GREEN]]__new-uuid__[[/]] <路径>
        **标识**：
             __--layout__ <名称[@保险库]>    在指定布局中修改路径
                                     以 `truth@VAULT` 指向保险库布局
             __--vault__ __-v__                  切换为编辑保险库的布局
             __--offline__                   不访问保险库，仅使用本地已取回的内容
        > [!Note]
        > 路径原本指向的条目会被删除，并以新的 Uuid 重新创建，所持有的内容不变


  new_uuid_description:
    en: Give a path's entry a new Uuid
    zh-CN: 给路径上的条目换一个新的 Uuid

  err_same_uuid:
    en: "The path already names the entry `%{uuid}`"
    zh-CN: "该路径已经指向条目 `%{uuid}`"

  err_same_uuid_help:
    en: Give the Uuid of an entry no path names
    zh-CN: 请给出一个没有被任何路径指向的条目的 Uuid

  err_uuid_named:
    en: "The entry `%{uuid}` is already named by `%{path}`"
    zh-CN: "条目 `%{uuid}` 已由 `%{path}` 命名"

  err_uuid_named_help:
    en: Let the other path go first with `rola layout path remove`, then try again
    zh-CN: 请先用 `rola layout path remove` 让另一条路径放手，然后重试

  err_uuid_missing:
    en: "The Layout holds no entry `%{uuid}`"
    zh-CN: "布局中没有条目 `%{uuid}`"

  err_uuid_missing_help:
    en: |
        Please check the Uuid, or make the entry first with `rola layout entry create`
    zh-CN: |
        请检查该 Uuid，或先用 `rola layout entry create` 创建该条目

  result_bound:
    en: "The path now names the entry: %{what}"
    zh-CN: "该路径现已指向条目：%{what}"

  result_unbound:
    en: "The path names nothing now: %{what}"
    zh-CN: "该路径不再指向任何条目：%{what}"

  result_moved:
    en: "The entry was moved: %{what}"
    zh-CN: "条目已移动：%{what}"

  result_uuid_changed:
    en: "The path now names another entry: %{what}"
    zh-CN: "该路径现已指向另一个条目：%{what}"

  result_uuid_new:
    en: "The entry at the path was given a new Uuid: %{what}"
    zh-CN: "该路径上的条目已换用新的 Uuid：%{what}"

cmd_layout_entries:
  complete:
    layout:
      en: The Layout to work on; the one being worked in when none is named
      zh-CN: 要操作的布局，未指定时用当前使用的布局
    uuid:
      en: The entry to list alone; every entry when none is named
      zh-CN: 只列出该条目，未指定时列出全部条目
  help:
    en: |
        # List what a Layout's entries hold
        **Usage**: rola layout [[GREEN]]__entries__[[/]]
        **Flags**:
             __--vault__ __-v__                 List the Vault's Layout, rather than the Workspace's
             __--layout__ <NAME[@VAULT]>    List that Layout
                                    Write `truth@VAULT` to point at the Vault's Layout
             __--uuid__ <UUID>              List only the entry with this UUID
    zh-CN: |
        # 列出布局中各条目所持有的内容
        **用法**：rola layout [[GREEN]]__entries__[[/]]
        **标识**：
             __--vault__ __-v__                  列出保险库的布局，而非工作区的布局
             __--layout__ <名称[@保险库]>    列出指定布局
                                     以 `truth@VAULT` 指向保险库布局
             __--uuid__ <UUID>               只列出该 UUID 的条目


  description:
    en: List what a Layout's entries hold
    zh-CN: 列出布局中各条目所持有的内容
