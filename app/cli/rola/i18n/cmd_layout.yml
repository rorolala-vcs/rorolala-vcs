_version: 2

cmd_layout:
  help:
    en: |
        Work with the Layouts a run keeps

        **Usage**: `rola layout <COMMAND>`

        A Workspace holds many Layouts and works in one at a time; a Vault holds one. Naming no
        command lists them, the same as `rola layout ls`.
    zh-CN: |
        操作本运行所持有的布局

        **用法**：`rola layout <COMMAND>`

        工作区持有多个布局，且一次只使用其中一个；保险库只持有一个。不指定子命令即列出它们，
        与 `rola layout ls` 相同。

  description:
    en: Work with the Layouts a run keeps
    zh-CN: 操作本运行所持有的布局

  err_no_layouts:
    en: This run is in neither a Workspace nor a Vault, so it has no Layouts
    zh-CN: 本运行既不在工作区也不在保险库中，因此没有任何布局

  err_no_layouts_help:
    en: |
        Run this inside a Workspace or a Vault, then try again
    zh-CN: |
        请在某个工作区或保险库内运行本命令，然后重试

  err_layout_failed:
    en: "The Layout could not be worked on: %{reason}"
    zh-CN: "无法操作该布局：%{reason}"

  err_layout_failed_help:
    en: |
        Please check the Layout's directory and its permissions, then try again
    zh-CN: |
        请检查该布局的目录及其权限，然后重试

  err_layout_argument:
    en: "A `rola layout` command was given arguments it cannot use"
    zh-CN: "`rola layout` 收到了无法使用的参数"

  err_layout_argument_help:
    en: |
        Run `rola layout --help` to see what it takes
    zh-CN: |
        运行 `rola layout --help` 查看它接受什么

  err_not_cached:
    en: "The Layout `%{layout}` of `%{vault}` has not been fetched here"
    zh-CN: "尚未在此取回 `%{vault}` 的布局 `%{layout}`"

  err_not_cached_help:
    en: |
        Run `rola layout fetch %{vault}` to bring it down, then try again
    zh-CN: |
        请运行 `rola layout fetch %{vault}` 将其取回，然后重试

  err_read_only:
    en: "The Layout `%{layout}` is a fetched copy of a Vault's Layout, and cannot be changed"
    zh-CN: "布局 `%{layout}` 是保险库布局的取回副本，无法修改"

  err_read_only_help:
    en: |
        A name written `NAME@VAULT` reads the copy a `rola layout fetch` brought here; work on a
        Layout of the Workspace's own instead
    zh-CN: |
        写成 `NAME@VAULT` 的名字读取的是 `rola layout fetch` 取回的副本；请改为操作工作区自身的布局

  err_ownership_unknown:
    en: "The fetched Layout names no entry `%{uuid}`"
    zh-CN: "取回的布局中没有条目 `%{uuid}`"

  err_ownership_unknown_help:
    en: |
        The copy may be out of date: run `rola layout fetch` to get the new state
    zh-CN: |
        副本可能已过期：请运行 `rola layout fetch` 获取新状态

  err_ownership_missing:
    en: "The Vault holds no entry `%{uuid}`"
    zh-CN: "保险库中没有条目 `%{uuid}`"

  err_ownership_missing_help:
    en: |
        Please check the `Uuid`, and fetch the Layout again to see the new state
    zh-CN: |
        请检查 `Uuid`，并重新取回布局以查看新状态

  err_ownership_held:
    en: "`%{uuid}` is held by `%{owner}`"
    zh-CN: "`%{uuid}` 由 `%{owner}` 持有"

  err_ownership_held_help:
    en: |
        The holder has to let go of it before it can be taken; `rola layout read-ownership`
        reads the holder from the fetched copy
    zh-CN: |
        需要持有者先放弃，才能取得它；`rola layout read-ownership` 可以从取回的副本中读取持有者

cmd_layout_ls:
  help:
    en: |
        List the Layouts a run works in

        **Usage**: `rola layout ls`

        A Workspace's Layouts are listed, each with its name and the Vault it tracks; a Vault's one
        is listed as `truth`. The one that is checked out is marked.
    zh-CN: |
        列出本运行所使用的布局

        **用法**：`rola layout ls`

        工作区的各个布局会被列出，各带其名字与所追踪的保险库；保险库的那一个列为 `truth`。
        当前已签出的那个会被标记。

  description:
    en: List the Layouts a run works in
    zh-CN: 列出本运行所使用的布局

  result_current:
    en: "%{layout}  (checked out)"
    zh-CN: "%{layout}  （当前签出）"

cmd_layout_new:
  help:
    en: |
        Make an empty Layout

        **Usage**: `rola layout new <NAME> [--track <VAULT>]`

        `NAME` is the name of a directory, so it is words of letters and digits joined by `-`.
        `--track` names a Vault the Workspace has bound, which the new Layout is to track. What is
        worked in does not change; `rola layout force-switch` is what switches.
    zh-CN: |
        新建一个空布局

        **用法**：`rola layout new <NAME> [--track <VAULT>]`

        `NAME` 是目录名，因此由字母数字组成的词以 `-` 相连。`--track` 指定工作区已绑定的保险库，
        新布局将追踪它。当前使用的布局不会改变；切换请用 `rola layout force-switch`。

  description:
    en: Make an empty Layout
    zh-CN: 新建一个空布局

  result_created:
    en: "The Layout `%{name}` was made"
    zh-CN: "已创建布局 `%{name}`"

cmd_layout_cp:
  help:
    en: |
        Copy a Layout to a new name

        **Usage**: `rola layout cp <LAYOUT> <NAME> [--track <VAULT>]`

        What the Layout tracked is not copied: a copy tracks only what `--track` names. What is
        worked in does not change; `rola layout force-switch` is what switches.
    zh-CN: |
        复制布局为新名字

        **用法**：`rola layout cp <LAYOUT> <NAME> [--track <VAULT>]`

        原布局所追踪的东西不会被复制：副本只追踪 `--track` 指定的内容。当前使用的布局不会改变；
        切换请用 `rola layout force-switch`。

  description:
    en: Copy a Layout to a new name
    zh-CN: 复制布局为新名字

  result_copied:
    en: "The copy `%{name}` was made"
    zh-CN: "已创建副本 `%{name}`"

cmd_layout_force_switch:
  help:
    en: |
        Work in another Layout

        **Usage**: `rola layout force-switch <NAME>`

        Only which Layout is worked in changes. No file is touched: the tree is left as it is,
        whether or not it is what the Layout names.
    zh-CN: |
        切换到另一个布局

        **用法**：`rola layout force-switch <NAME>`

        只改变工作区所使用的布局。不会改动任何文件：工作树原样保留，无论它是否与该布局相符。

  description:
    en: Work in another Layout
    zh-CN: 切换到另一个布局

  result_switched:
    en: "The Layout worked in is now `%{name}`"
    zh-CN: "当前使用的布局已切换为 `%{name}`"

cmd_layout_set_track:
  help:
    en: |
        Name the Vault upstream a Layout tracks

        **Usage**: `rola layout set-track <LAYOUT> <VAULT>`

        `VAULT` has to be one the Workspace has bound with `rola vault bind`.
    zh-CN: |
        指定布局所追踪的上游保险库

        **用法**：`rola layout set-track <LAYOUT> <VAULT>`

        `VAULT` 必须是工作区已用 `rola vault bind` 绑定的名字。

  description:
    en: Name the Vault upstream a Layout tracks
    zh-CN: 指定布局所追踪的上游保险库

  result_set:
    en: "The Layout `%{name}` now tracks `%{track}`"
    zh-CN: "布局 `%{name}` 现在追踪 `%{track}`"

cmd_layout_un_track:
  help:
    en: |
        Make a Layout track no Vault

        **Usage**: `rola layout un-track <LAYOUT>`
    zh-CN: |
        让布局不再追踪任何保险库

        **用法**：`rola layout un-track <LAYOUT>`

  description:
    en: Make a Layout track no Vault
    zh-CN: 让布局不再追踪任何保险库

  result_untracked:
    en: "The Layout `%{name}` now tracks no Vault"
    zh-CN: "布局 `%{name}` 现在不再追踪保险库"

cmd_layout_rm:
  help:
    en: |
        Take a Layout away, or empty the one a Vault keeps

        **Usage**: `rola layout rm [NAME]`

        In a Workspace the named Layout is taken away; the one being worked in is not, so choose
        another first. In a Vault, `NAME` is left empty or is `truth`, and the Layout is emptied
        rather than taken away.
    zh-CN: |
        移除布局，或清空保险库唯一的布局

        **用法**：`rola layout rm [NAME]`

        在工作区中，指定的布局会被移除；当前正在使用的不会被移除，请先切换。在保险库中，
        `NAME` 留空或写 `truth`，布局会被清空而非移除。

  description:
    en: Take a Layout away, or empty the one a Vault keeps
    zh-CN: 移除布局，或清空保险库唯一的布局

  confirm_remove:
    en: "Take the Layout `%{name}` away, and everything it holds, with it?"
    zh-CN: "移除布局 `%{name}` 及其持有的一切？"

  confirm_clean:
    en: Empty the Vault's Layout, dropping every path it names?
    zh-CN: 清空保险库的布局，删除它命名的所有路径？

  err_current:
    en: The Layout being worked in cannot be taken away
    zh-CN: 正在使用的布局无法被移除

  err_current_help:
    en: |
        Switch to another Layout first with `rola layout force-switch`
    zh-CN: |
        请先用 `rola layout force-switch` 切换到别的布局

  result_removed:
    en: "The Layout `%{name}` was taken away"
    zh-CN: "已移除布局 `%{name}`"

  result_cleaned:
    en: The Vault's Layout was emptied
    zh-CN: 已清空保险库的布局

  result_declined:
    en: Nothing was done
    zh-CN: 未做任何更改

cmd_layout_tree_diff:
  help:
    en: |
        Show what the working tree holds beside a Layout

        **Usage**: `rola layout tree-diff [LAYOUT] [--alike <0.0-1.0>]`

        Each line is a mode and a path: `lost`, `untagged`, `modified`, `rename <FROM> -> <TO>`,
        or `failed`. `--alike` is how alike two text files have to be to count as moved, and is
        `0.6` when nothing is said.
    zh-CN: |
        展示工作树相对于某个布局的内容

        **用法**：`rola layout tree-diff [LAYOUT] [--alike <0.0-1.0>]`

        每行为一个模式加一个路径：`lost`、`untagged`、`modified`、`rename <FROM> -> <TO>`
        或 `failed`。`--alike` 是两个文本文件算作移动的相似度门槛，默认 `0.6`。

  description:
    en: Show what the working tree holds beside a Layout
    zh-CN: 展示工作树相对于某个布局的内容

cmd_layout_shot:
  help:
    en: |
        Write a Layout down as a `.rolayout` file

        **Usage**: `rola layout shot <OUTPUT> [LAYOUT]`

        The Layout is the one being worked in, or the one named. Written beside the index and the
        store, it names every key a checkout needs, so a Layout that cannot be checked out whole is
        not written at all.
    zh-CN: |
        把布局写成 `.rolayout` 文件

        **用法**：`rola layout shot <OUTPUT> [LAYOUT]`

        布局是当前正在使用的那个，或指定的那个。连同索引与仓库一起书写时，它会记下签出所需的
        全部键，因此无法整体签出的布局不会写出。

  description:
    en: Write a Layout down as a `.rolayout` file
    zh-CN: 把布局写成 `.rolayout` 文件

  err_no_store:
    en: This run works on no store or index to pack the Layout against
    zh-CN: 本运行没有可用于打包该布局的仓库或索引

  result_written:
    en: "The Layout was written to `%{path}`"
    zh-CN: "布局已写入 `%{path}`"

cmd_layout_import:
  help:
    en: |
        Make a Layout from a `.rolayout` file

        **Usage**: `rola layout import <INPUT> [--name <NAME>] [--no-check]`

        `NAME` is the file's own name when none is given. A file that names the keys a checkout
        needs is checked to have them all here, unless `--no-check`.
    zh-CN: |
        从 `.rolayout` 文件建立布局

        **用法**：`rola layout import <INPUT> [--name <NAME>] [--no-check]`

        `NAME` 缺省时取文件自身的名字。若文件记下了签出所需的键，会先检查这些键是否都在，
        除非给出 `--no-check`。

  description:
    en: Make a Layout from a `.rolayout` file
    zh-CN: 从 `.rolayout` 文件建立布局

  err_no_store:
    en: This run works on no store or index to check the file against
    zh-CN: 本运行没有可用于核对文件的仓库或索引

  err_incomplete:
    en: "The file needs %{count} keys that are not here: %{keys}"
    zh-CN: "该文件需要 %{count} 个此处没有的键：%{keys}"

  err_incomplete_help:
    en: |
        Fetch the content first, or import with `--no-check`
    zh-CN: |
        请先取回这些内容，或用 `--no-check` 导入

  result_imported:
    en: "The Layout `%{name}` was made, naming %{count} paths"
    zh-CN: "已建立布局 `%{name}`，命名了 %{count} 条路径"

cmd_layout_entry:
  create_help:
    en: |
        Make an entry hold data

        **Usage**: `rola layout entry create <UUID> <VERSION> [--owner <ACCOUNT>] [--description <TEXT>]`

        `VERSION` is `blake3:<hex>` or the digest alone. Nothing beyond what the Layout checks is
        checked: this is the layer for writing content by hand.
    zh-CN: |
        让某个条目持有数据

        **用法**：`rola layout entry create <UUID> <VERSION> [--owner <ACCOUNT>] [--description <TEXT>]`

        `VERSION` 为 `blake3:<hex>` 或裸摘要。除了布局自身的检查之外不做别的检查：这一层就是用来手写内容的。

  create_description:
    en: Make an entry hold data
    zh-CN: 让某个条目持有数据

  update_help:
    en: |
        Change what an entry holds

        **Usage**: `rola layout entry update <UUID> <VERSION> [--owner <ACCOUNT>] [--description <TEXT>]`

        The data is replaced whole: an option left out means the entry holds no account and says
        nothing.
    zh-CN: |
        修改某个条目所持有的数据

        **用法**：`rola layout entry update <UUID> <VERSION> [--owner <ACCOUNT>] [--description <TEXT>]`

        数据整体替换：省略选项意味着条目无持有者且无描述。

  update_description:
    en: Change what an entry holds
    zh-CN: 修改某个条目所持有的数据

  remove_help:
    en: |
        Drop an entry, and the path that named it

        **Usage**: `rola layout entry remove <UUID>`
    zh-CN: |
        删除某个条目，以及命名它的路径

        **用法**：`rola layout entry remove <UUID>`

  remove_description:
    en: Drop an entry, and the path that named it
    zh-CN: 删除某个条目，以及命名它的路径

  result_created:
    en: "The entry `%{what}` was made"
    zh-CN: "已创建条目 `%{what}`"

  result_updated:
    en: "The entry `%{what}` was changed"
    zh-CN: "已修改条目 `%{what}`"

  result_removed:
    en: "The entry `%{what}` was dropped"
    zh-CN: "已删除条目 `%{what}`"

cmd_layout_path:
  create_help:
    en: |
        Make a path name an entry

        **Usage**: `rola layout path create <PATH> <UUID>`

        An entry is at one path, so naming it elsewhere moves it. The entry need not hold anything
        yet.
    zh-CN: |
        让某个路径指向某个条目

        **用法**：`rola layout path create <PATH> <UUID>`

        一个条目只位于一个路径，因此在别处命名它等于移动它。该条目可以尚未持有数据。

  create_description:
    en: Make a path name an entry
    zh-CN: 让某个路径指向某个条目

  remove_help:
    en: |
        Make a path name nothing

        **Usage**: `rola layout path remove <PATH>`
    zh-CN: |
        让某个路径不再指向任何条目

        **用法**：`rola layout path remove <PATH>`

  remove_description:
    en: Make a path name nothing
    zh-CN: 让某个路径不再指向任何条目

  move_help:
    en: |
        Move the entry at one path to another

        **Usage**: `rola layout path move <FROM> <TO>`
    zh-CN: |
        把某个路径上的条目移到另一个路径

        **用法**：`rola layout path move <FROM> <TO>`

  move_description:
    en: Move the entry at one path to another
    zh-CN: 把某个路径上的条目移到另一个路径

  result_bound:
    en: "The path now names the entry: %{what}"
    zh-CN: "该路径已指向该条目：%{what}"

  result_unbound:
    en: "The path names nothing now: %{what}"
    zh-CN: "该路径不再指向任何条目：%{what}"

  result_moved:
    en: "The entry was moved: %{what}"
    zh-CN: "条目已移动：%{what}"

cmd_layout_entries:
  help:
    en: |
        List what a Layout's entries hold

        **Usage**: `rola layout entries [--layout <NAME>]`

        One entry a line: its path, the `Uuid` it is known by, and the version it is at. What it is
        held by and what it says are in the data a template or `--json` reads.

        `--layout` names a Layout of the Workspace's own, or a Vault's when it is written
        `NAME@VAULT` — as in `rola layout entries --layout truth@origin`. A Vault's Layout is read
        from the copy `rola layout fetch` brought here, so one that was never fetched has nothing to
        read.
    zh-CN: |
        列出布局中各条目所持有的内容

        **用法**：`rola layout entries [--layout <NAME>]`

        每行一个条目：它的路径、标识它的 `Uuid`、以及它所在的版本。持有者与描述在模板或 `--json`
        所读取的数据中。

        `--layout` 指定工作区自身的布局；写成 `NAME@VAULT`（例如
        `rola layout entries --layout truth@origin`）时则指定保险库的布局。保险库的布局读取的是
        `rola layout fetch` 取回的副本，因此未曾取回时没有内容可读。

        每行一个条目：它的路径、标识它的 `Uuid`、以及它所在的版本。持有者与描述在模板或 `--json`
        所读取的数据中。

  description:
    en: List what a Layout's entries hold
    zh-CN: 列出布局中各条目所持有的内容
