_version: 2

pack:
  complete:
    no_index:
      en: Do not tidy the index
      zh-CN: 不整理索引
    no_storage:
      en: Do not tidy the store
      zh-CN: 不整理仓库
  help:
    en: |
        Tidy the objects of the store and the index into packs

        **Usage**: `rola pack`
        **Flags**:
            --no-index      Do not tidy the index, leave it as it is
            --no-storage    Do not tidy the store, leave it as it is

        Tidy the objects of the store and the index into packs, laid as several once `max_pack_size` is exceeded
        Both are tidied by default, and giving `--no-index` and `--no-storage` together is refused
    zh-CN: |
        把仓库与索引中的对象整理进 pack

        **用法**：rola pack
        **标识**：
            --no-index      不整理索引，保持原样
            --no-storage    不整理仓库，保持原样

        将仓库与索引中的对象整理成 pack，超过 `max_pack_size` 时落成多个
        默认两者都整理，同时给出 `--no-index` 与 `--no-storage` 会被拒绝

  cmd_pack_description:
    en: Tidy the objects of the store and the index
    zh-CN: 整理仓库与索引中的对象

  result_packed:
    en: The objects have been tidied again
    zh-CN: 对象已重新整理

  result_nothing:
    en: The objects are already laid out like this
    zh-CN: 对象已经是这样的布局

  err_no_storage:
    en: This run is not inside any store or index
    zh-CN: 当前不在任何仓库或索引之中

  err_no_storage_help:
    en: |
        Please run `rola pack` inside a store or an index, or inside the Vault or Workspace that keeps them
    zh-CN: |
        请在仓库或索引内运行 `rola pack`，或在保有它们的保险库或工作区内运行

  err_nothing_to_pack:
    en: "`--no-index` and `--no-storage` were both given, so there are no objects to tidy"
    zh-CN: 同时给出了 `--no-index` 与 `--no-storage`，没有可整理的对象

  err_nothing_to_pack_help:
    en: |
        Please leave out at least one of `--no-index` and `--no-storage`, so that the store or the index is tidied
    zh-CN: |
        请至少省略 `--no-index` 与 `--no-storage` 其中之一，以便整理仓库或索引

  err_pack_failed:
    en: "The objects in the store could not be packed: %{reason}"
    zh-CN: "无法打包仓库中的对象：%{reason}"

  err_pack_failed_help:
    en: |
        Please make sure the store is readable and writable, then try again
    zh-CN: |
        请确认仓库可读可写，然后重试

  err_pack_locked:
    en: "The store could not be locked: %{reason}"
    zh-CN: "无法锁定仓库：%{reason}"

  err_pack_locked_help:
    en: |
        Please make sure no other run is packing this store, and that no run that ended midway left a lock file behind
    zh-CN: |
        请确认没有其他运行正在打包该仓库，也没有中途结束的运行留下锁文件
