_version: 2

pack:
  help:
    en: |
        Gather a store's loose objects into a pack

        **Usage**: `rola pack`

        Every object a store holds sits on its own until it is packed. This gathers the ones still
        loose into a pack — one file with an index beside it — so that fewer files carry the same
        objects. What each object is does not change: a pack holds its entries exactly as they sat
        loose, so every read that worked before works after.

        An object a pack already names is left where it is, so packing a store that is already
        packed changes nothing, and neither does packing one with nothing loose.

        The run has to be somewhere a store can be found: inside one, or inside a Vault or
        Workspace that keeps one.
    zh-CN: |
        将仓库中的松散对象打包

        **用法**：`rola pack`

        仓库持有的每个对象在被打包前都是单独存放的。本命令把仍然松散的对象收进一个 pack——一个文件，
        旁边带一份索引——于是同样的对象由更少的文件承载。对象本身不受影响：pack 按它们在松散时的样子
        原样存放条目，所以此前能读的，之后照样能读。

        已被某个 pack 记录的对象会留在原处，因此对已打包的仓库再打包不会有变化；对没有松散对象的仓库
        打包同样没有变化。

        运行必须处在能发现仓库的地方：仓库内、或保有仓库的保险库／工作区内。

  cmd_pack_description:
    en: Gather a store's loose objects into a pack
    zh-CN: 将仓库中的松散对象打包

  result_packed:
    en: Packed the store's loose objects
    zh-CN: 已将仓库中的松散对象打包

  result_nothing:
    en: There was nothing loose to pack
    zh-CN: 没有可打包的松散对象

  err_no_storage:
    en: This run is nowhere a store is
    zh-CN: 当前运行不处于任何仓库中

  err_no_storage_help:
    en: |
        Please run this inside a store, or inside the Vault or Workspace that keeps one
    zh-CN: |
        请在仓库内运行，或在保有仓库的保险库／工作区内运行

  err_pack_failed:
    en: "The store's objects could not be packed — %{reason}"
    zh-CN: "无法打包仓库中的对象 —— %{reason}"

  err_pack_failed_help:
    en: |
        Please check that the store can be read and written, then try again
    zh-CN: |
        请确认仓库可读可写，然后重试
