_version: 2

pack:
  complete:
    garbage_collect:
      en: Collect what the layout does not reference
      zh-CN: 收集 Layout 未引用的对象
    grace:
      en: How long to keep what nothing references, like 24h; 0 keeps nothing
      zh-CN: 无引用对象的保留时长，如 24h；0 表示不保留
    no_index:
      en: Do not tidy the index
      zh-CN: 不整理索引
    no_storage:
      en: Do not tidy the store
      zh-CN: 不整理仓库
  help:
    en: |
        # Tidy the objects of the store and the index into packs
        **Usage**: rola [[GREEN]]__pack__[[/]]
        **Flags**:
             __--garbage-collect__    Collect what the Layout does not reference, then tidy the rest
             __--grace__              How long to keep what nothing references, like `24h`; `0` keeps nothing
             __--no-index__           Do not tidy the index, leave it as it is
             __--no-storage__         Do not tidy the store, leave it as it is

        > [!Note]
        > The `--garbage-collect` flag makes irreversible deletions, so it will ask first
        > Suppress the questions with `--force`
    zh-CN: |
        # 把仓库与索引中的对象整理进 pack
        **用法**：rola [[GREEN]]__pack__[[/]]
        **标识**：
             __--garbage-collect__    剔除 Layout 未引用的对象，然后整理余下对象
             __--grace__              无引用对象的保留时长，如 `24h`；`0` 表示不保留
             __--no-index__           不整理索引，保持原样
             __--no-storage__         不整理仓库，保持原样

        > [!Note]
        > `--garbage-collect` 标识会做出不可逆删除，所以会做出询问
        > 可用 `--force` 抑制

  cmd_pack_description:
    en: Tidy the objects of the store and the index, or collect what the Layout does not reference
    zh-CN: 整理仓库与索引中的对象，或收集 Layout 未引用的对象

  err_grace_without_collect:
    en: "`--grace` was given, and this run is not collecting"
    zh-CN: "给出了 `--grace`，但本次运行不是收集"

  err_grace_without_collect_help:
    en: |
        Please give `--garbage-collect` beside it, or leave `--grace` out
    zh-CN: |
        请与 `--garbage-collect` 一同给出，或省略 `--grace`

  err_grace_format:
    en: "`%{value}` is not a grace the run can hold"
    zh-CN: "`%{value}` 不是可用的保留时长"

  err_grace_format_help:
    en: |
        Please write a number with its unit, like `2h`, `30m`, `2d` or `600s`; a number alone counts seconds, and `0` keeps nothing
    zh-CN: |
        请写成数字加单位的形式，如 `2h`、`30m`、`2d` 或 `600s`；单独的数字按秒计，`0` 表示不保留

  result_packed:
    en: The objects have been tidied again
    zh-CN: 对象已重新整理

  result_nothing:
    en: The objects are already laid out like this
    zh-CN: 对象已经是这样的布局

  gc_confirm:
    en: "Will remove %{index_entries} index entries and %{storage_entries} store entries, %{index_bytes} and %{storage_bytes} bytes. Continue?"
    zh-CN: "将从索引剔除 %{index_entries} 条，从仓库剔除 %{storage_entries} 条，分别占 %{index_bytes} 与 %{storage_bytes} 字节。继续吗？"

  result_gc:
    en: "Removed %{index_entries} index entries (%{index_bytes} bytes) and %{storage_entries} store entries (%{storage_bytes} bytes)"
    zh-CN: 已从索引剔除 %{index_entries} 条（%{index_bytes} 字节），从仓库剔除 %{storage_entries} 条（%{storage_bytes} 字节）

  result_gc_nothing:
    en: Nothing is unreferenced
    zh-CN: 没有 0 引用的对象

  result_gc_grace:
    en: "%{kept} entries were kept because they were written recently; the next collecting decides them"
    zh-CN: 有 %{kept} 条因刚写入而被保留，由下一次收集再作决定

  result_declined:
    en: Declined, nothing was removed
    zh-CN: 已取消，未删除任何对象

  err_no_storage:
    en: This run is not inside any store or index
    zh-CN: 当前不在任何仓库或索引之中

  err_no_storage_help:
    en: |
        Please run `rola pack` inside a store or an index, or inside the Vault or Workspace that keeps them
    zh-CN: |
        请在仓库或索引内运行 `rola pack`，或在保有它们的保险库或工作区内运行

  err_nothing_to_pack:
    en: "`--no-index` and `--no-storage` were both given, so there are no objects to tidy"
    zh-CN: 同时给出了 `--no-index` 与 `--no-storage`，没有可整理的对象

  err_nothing_to_pack_help:
    en: |
        Please leave out at least one of `--no-index` and `--no-storage`, so that the store or the index is tidied
    zh-CN: |
        请至少省略 `--no-index` 与 `--no-storage` 其中之一，以便整理仓库或索引

  err_gc_failed:
    en: "Garbage collection failed: %{reason}"
    zh-CN: "垃圾收集失败：%{reason}"

  err_gc_failed_help:
    en: |
        See the reason above; a failed run removes nothing, so it is safe to retry
    zh-CN: |
        看上面的原因；失败的一轮什么也没删，重试是安全的

  err_gc_no_layout:
    en: No Layout was found to collect from
    zh-CN: 没有找到可作为根集合的 Layout

  err_gc_no_layout_help:
    en: |
        Please run `rola pack --garbage-collect` inside a Vault or a Workspace
    zh-CN: |
        请在保险库或工作区内运行 `rola pack --garbage-collect`

  err_gc_merging:
    en: "`%{path}` has merges waiting"
    zh-CN: "`%{path}` 有等待中的合并"

  gc_lost_binding:
    en: "Binding `%{path}` is gone, so its Layout is not used for this collection"
    zh-CN: "绑定 `%{path}` 已不在，本次收集不使用它的布局"

  gc_binding_readonly:
    en: "Binding `%{path}` is gone, and the store is read-only, so the record is left as it is"
    zh-CN: "绑定 `%{path}` 已不在，而存储是只读的，记录保持原样"

  gc_binding_not_removed:
    en: "Binding `%{path}` is gone and could not be removed: %{error}"
    zh-CN: "绑定 `%{path}` 已不在，且无法移除：%{error}"

  err_gc_no_roots:
    en: The roots reach no content, and collecting would take the whole store away
    zh-CN: 根集合没有到达任何内容，收集会清空整个存储

  err_gc_no_roots_help:
    en: |
        Check the places the store records, or use `--force` if the store really is to be emptied
    zh-CN: |
        请检查存储记录的位置，或者确实要清空存储时使用 `--force`

  err_gc_read_only:
    en: "`%{path}` is read-only, so nothing can be collected from it"
    zh-CN: "`%{path}` 是只读的，无法从它回收内容"

  err_gc_merging_help:
    en: |
        Please finish or give up the waiting merges first, then collect again
    zh-CN: |
        请先完成或放弃等待中的合并，再执行收集

  err_pack_failed:
    en: "The objects in the store could not be packed: %{reason}"
    zh-CN: "无法打包仓库中的对象：%{reason}"

  err_pack_failed_help:
    en: |
        Please make sure the store is readable and writable, then try again
    zh-CN: |
        请确认仓库可读可写，然后重试

  err_pack_locked:
    en: "The store could not be locked: %{reason}"
    zh-CN: "无法锁定仓库：%{reason}"

  err_pack_locked_help:
    en: |
        Please make sure no other run is packing this store, and that no run that ended midway left a lock file behind
    zh-CN: |
        请确认没有其他运行正在打包该仓库，也没有中途结束的运行留下锁文件
