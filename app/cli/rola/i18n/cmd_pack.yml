_version: 2

pack:
  help:
    en: |
        Lay a store's objects out in as few packs as its size limit allows

        **Usage**: `rola pack`

        Everything the store holds is written again: the entries of every pack are gathered up with
        the loose objects, and the whole of it is laid down as one pack — or as several, once one
        would pass the store's `max_pack_size`, which is `[storage] max_pack_size` in the store's
        configuration and two gibibytes when that says nothing.

        What each object is does not change: a pack holds its entries exactly as they sat loose, so
        every read that worked before works after. A store already laid out this way is left alone, so
        running this twice in a row changes nothing the second time.

        The store is locked for the whole of the work, so a store another run is packing is not packed
        at the same time: the run is told, and nothing is changed.

        The run has to be somewhere a store can be found: inside one, or inside a Vault or Workspace
        that keeps one.
    zh-CN: |
        将仓库中的对象整理进尽可能少的 pack，受其大小上限约束

        **用法**：`rola pack`

        仓库持有的全部内容都会被重新写出：各 pack 的条目与松散对象一并收集，整体落成一个 pack——若某个
        pack 将超过仓库的 `max_pack_size`，则落成多个。`max_pack_size` 来自仓库配置中的
        `[storage] max_pack_size`，未配置时为 2 GiB。

        对象本身不受影响：pack 按它们在松散时的样子原样存放条目，所以此前能读的，之后照样能读。已经
        是这样布局的仓库会保持原样，因此连续运行两次不会有第二次改动。

        整个过程中仓库会被锁定，因此另一个运行正在打包时不会同时打包：本次运行会被告知，且什么都不
        改动。

        运行必须处在能发现仓库的地方：仓库内、或保有仓库的保险库／工作区内。

  cmd_pack_description:
    en: Lay a store's objects out in as few packs as its size limit allows
    zh-CN: 将仓库中的对象整理进尽可能少的 pack

  result_packed:
    en: Laid the store's objects out afresh
    zh-CN: 已重新整理仓库中的对象

  result_nothing:
    en: The store was already laid out that way
    zh-CN: 仓库已是这样的布局

  err_no_storage:
    en: This run is nowhere a store is
    zh-CN: 当前运行不处于任何仓库中

  err_no_storage_help:
    en: |
        Please run this inside a store, or inside the Vault or Workspace that keeps one
    zh-CN: |
        请在仓库内运行，或在保有仓库的保险库／工作区内运行

  err_pack_failed:
    en: "The store's objects could not be packed — %{reason}"
    zh-CN: "无法打包仓库中的对象 —— %{reason}"

  err_pack_failed_help:
    en: |
        Please check that the store can be read and written, then try again
    zh-CN: |
        请确认仓库可读可写，然后重试

  err_pack_locked:
    en: "The store could not be locked — %{reason}"
    zh-CN: "无法锁定仓库 —— %{reason}"

  err_pack_locked_help:
    en: |
        Please check that no other run is packing this store, and that no lock was left behind by
        one that did not finish
    zh-CN: |
        请确认没有其他运行正在打包该仓库，也没有未结束的运行留下锁文件
