_version: 2

align:
  complete:
    delete:
      en: Consider the lost entry already removed
      zh-CN: 认定丢失项已经移除
    rename:
      en: Confirm and record the named move
      zh-CN: 确认并记录指定的移动项
    break:
      en: Break the move into a separate lost entry and untracked entry
      zh-CN: 断开移动项，将其变为独立的丢失项和未标记项
    move:
      en: Consider a pair of a lost entry and an untracked entry as a move
      zh-CN: 将一对丢失项和未标记项认定为移动项
    restore_move:
      en: Reject the named move, and restore it to its original position
      zh-CN: 否决指定的移动项，将其还原回开始的位置
    restore_modify:
      en: Revert the content change, which loses the edited content
      zh-CN: 撤回内容变更，这会丢失已编辑的内容
    restore_delete:
      en: Rebuild the lost entry's file
      zh-CN: 重建丢失项的文件
    restore:
      en: Automatically choose and restore the move, the lost entry or the modification
      zh-CN: 自动选择并还原移动项、丢失项或修改项
    completely:
      en: Fully restore what is named
      zh-CN: 完全还原所指内容
  help:
    en: |
        Bring the file structure under the Workspace into agreement with what is recorded

        **Usage**: rola align <PATH>
        **Flags**:
            --delete            Confirm the **lost entry** is gone
            --rename            Confirm the **move**, and update the record to the new position
            --break             For a **non-deterministic move**, break it into a **lost entry** and an **untracked entry**
            --move <FILE>       Assert that PATH moved to FILE, forming a **non-deterministic move**

            --restore-move      Confirm the **move**, and restore it to its original position
            --restore-modify    Restore the file's content change
            --restore-delete    Rebuild a **lost entry**'s file
            --restore           Do one of the three above, as PATH needs
            --completely        Restore the content as well as the position, meaningful only for restoring a move

            --vault             Include this Vault as a Layout source during alignment
            --offline           Look for the content needed to restore only locally without asking the Vault
    zh-CN: |
        让工作区下的文件结构与记录的保持一致

        **用法**：rola align <路径>
        **标识**：
            --delete            确认该 **丢失项** 已丢失
            --rename            确认该 **移动项**，并更新记录至到新位置
            --break             对于 **非确定性移动**，可以断开为 **丢失项** 和 **未标记项**
            --move <FILE>       断言 PATH 移动到了 FILE，形成一个 **非确定性移动**

            --restore-move      确认该 **移动项**，并还原至原来的位置
            --restore-modify    还原该文件的内容变更
            --restore-delete    重建某条 **丢失项** 的文件
            --restore           按 PATH 需要，执行上面三者中的一个
            --completely        在还原位置的同时还原内容，只对还原移动有意义

            --vault             在校准时把该保险库作为布局来源一起纳入
            --offline           还原需要的内容只从本地查找，不向保险库请求

  description:
    en: Bring the file structure under the Workspace into agreement with what is recorded
    zh-CN: 让工作区下的文件结构与记录的保持一致

  result_deleted:
    en: "Path %{what} is gone"
    zh-CN: "路径 %{what} 已消失"

  result_moved:
    en: "Path %{what} has moved"
    zh-CN: "路径 %{what} 已移动"

  result_broke:
    en: "Path %{what} has been taken back"
    zh-CN: "路径 %{what} 已撤销"

  result_asserted:
    en: "Path %{what} has been asserted"
    zh-CN: "路径 %{what} 已断言"

  result_restored_move:
    en: "Path %{what} has been put back"
    zh-CN: "路径 %{what} 已放回"

  result_restored_completely:
    en: "Path %{what} has been fully put back"
    zh-CN: "路径 %{what} 已完整还原"

  result_restored_modify:
    en: "Path %{what} has been restored"
    zh-CN: "路径 %{what} 已还原"

  result_restored_delete:
    en: "Path %{what} has been recovered"
    zh-CN: "路径 %{what} 已恢复"

  result_restored_merge:
    en: "Variant for path %{what} has been recovered"
    zh-CN: "路径 %{what} 的变体已恢复"

  result_unmerged:
    en: "Merge for path %{what} has ended"
    zh-CN: "路径 %{what} 的合并已结束"

  err_argument:
    en: The path and mode given do not match
    zh-CN: 给出的路径与模式不匹配

  err_argument_help:
    en: |
        A path is needed and exactly one mode for it, and the mode must suit what the path is:
        run `rola align --help` for the modes, and `rola status` to see what the path is
    zh-CN: |
        需要给出一个路径和恰好一个模式，且模式要与该路径的实际情况相称：
        运行 `rola align --help` 查看各个模式，运行 `rola status` 查看该路径的情况

  err_completely:
    en: "`--completely` only means something for a move being put back"
    zh-CN: "`--completely` 只对还原移动有意义"

  err_completely_help:
    en: |
        Use it with `--restore` or `--restore-move`
    zh-CN: |
        请与 `--restore` 或 `--restore-move` 一起使用

  err_not_lost:
    en: "`%{path}` is not a path the Layout names and the tree lacks"
    zh-CN: "`%{path}` 不是「布局命名、工作树缺失」的路径"

  err_not_lost_help:
    en: |
        Run `rola layout tree-diff` to see what is lost
    zh-CN: |
        运行 `rola layout tree-diff` 查看哪些路径已丢失

  err_no_rename:
    en: "`%{path}` is not a side of any move the reading found"
    zh-CN: "`%{path}` 不是任何一次已发现移动的某一侧"

  err_no_rename_help:
    en: |
        Run `rola layout tree-diff` to see the moves, or assert one with `--move`
    zh-CN: |
        运行 `rola layout tree-diff` 查看移动，或用 `--move` 断言一次移动

  err_real_move:
    en: "`%{from}` and `%{to}` have exactly the same content, this is a real move and it cannot be taken back"
    zh-CN: "`%{from}` 与 `%{to}` 内容完全相同，这是真实的移动，无法撤销"

  err_real_move_help:
    en: |
        Confirm it with `--rename`, or remove the path with `--delete`
    zh-CN: |
        用 `--rename` 确认它，或用 `--delete` 移除该路径

  err_move_missing:
    en: "`%{path}` is not a file inside this Workspace"
    zh-CN: "`%{path}` 不是本工作区内的文件"

  err_move_tracked:
    en: "The Layout already names `%{path}`"
    zh-CN: "布局已经命名了 `%{path}`"

  err_move_help:
    en: |
        `--move` names the file a lost path moved to, which must be a file the Layout does not know
    zh-CN: |
        `--move` 指定丢失路径移动到的文件，该文件必须是布局尚不认识的

  err_not_modified:
    en: "`%{path}` is not a change against a version the Layout names"
    zh-CN: "`%{path}` 不是相对于布局所记录版本的改动"

  err_not_modified_help:
    en: |
        A move's destination has no version of its own
        Put the move back first with `--restore-move`
    zh-CN: |
        移动的目的地没有自己的版本
        请先用 `--restore-move` 把移动放回

  err_restore_exists:
    en: "Putting the file back would land on `%{path}`, which is already there"
    zh-CN: "放回文件会落在已存在的 `%{path}` 上"

  err_restore_exists_help:
    en: |
        Move or remove what is there first, then put the file back
    zh-CN: |
        请先移走或删除那里的文件，然后再放回

  err_not_restorable:
    en: "`%{path}` is not a move, a change, or a deletion the Layout names, so there is nothing to put back"
    zh-CN: "`%{path}` 既不是移动，也不是布局命名文件上的改动或删除，没有可还原的内容"

  err_not_restorable_help:
    en: |
        Run `rola status` to see what can be put back
    zh-CN: |
        运行 `rola status` 查看哪些可以还原

  err_no_store:
    en: This run works on no store to take the recorded version from
    zh-CN: 本运行没有可取出所记录版本的仓库

  err_no_index:
    en: This run works on no version control index to read the recorded version from
    zh-CN: 本运行没有可读取所记录版本的版本控制索引

  err_failed:
    en: "The alignment could not be made: %{reason}"
    zh-CN: "无法完成对齐：%{reason}"

  err_failed_help:
    en: |
        Check the Workspace, the Layout and the analysis cache, then try again
    zh-CN: |
        请检查工作区、布局与分析缓存，然后重试
