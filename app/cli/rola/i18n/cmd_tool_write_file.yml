_version: 2

tool_write_file:
  help:
    en: |
        Store a file's content, and print the hash it is kept under

        **Usage**: `rola tool-write-file <FILE>`

        `FILE` names a file, not a directory. How the content is kept — whether it is
        compressed, whether it is cut into chunks — is the store's own decision, made from the
        content itself, so what is said here is a path and nothing else.

        What is printed is the hash, on a line of its own. It is the same hash
        `rola tool-extract-file` takes, so what one command answers is what the other is asked.

        The run has to be somewhere a store can be found: inside one, or inside a Vault or
        Workspace that keeps one.
    zh-CN: |
        将文件内容存入仓库，并打印它所用的哈希

        **用法**：`rola tool-write-file <FILE>`

        `FILE` 是文件，不是目录。内容如何保存——是否压缩、是否分块——由仓库根据内容自行决定，
        所以这里给的只是一个路径。

        打印出来的是哈希，单独一行。它与 `rola tool-extract-file` 接受的是同一个哈希，
        所以一条命令给出的正是另一条命令所要的。

        运行必须处在能发现仓库的地方：仓库内、或保有仓库的保险库／工作区内。

  cmd_tool_write_file_description:
    en: Store a file's content and print its hash
    zh-CN: 存储文件内容并打印其哈希

  err_file_missing:
    en: No file was named
    zh-CN: 未指定文件

  err_file_missing_help:
    en: |
        Please name the file whose content is to be stored, for example
        `rola tool-write-file ./notes.txt`
    zh-CN: |
        请指定要存入内容的文件，例如 `rola tool-write-file ./notes.txt`

  err_no_storage:
    en: This run is nowhere a store is
    zh-CN: 当前运行不处于任何仓库中

  err_no_storage_help:
    en: |
        Please run this inside a store, or inside the Vault or Workspace that keeps one
    zh-CN: |
        请在仓库内运行，或在保有仓库的保险库／工作区内运行

  err_not_a_file:
    en: "%{path} is not a file"
    zh-CN: "%{path} 不是文件"

  err_not_a_file_help:
    en: |
        What is stored is a file's content, so the path has to name a file that is there — a
        directory is not something there is content to take
    zh-CN: |
        存入的是文件内容，所以路径必须指向一个确实存在的文件——目录里没有可取的内容

  err_write_failed:
    en: "The store would not take the content of %{path} — %{reason}"
    zh-CN: "仓库未能接收 %{path} 的内容 —— %{reason}"

  err_write_failed_help:
    en: |
        Please check that the file can be read and that the store can be written to, then try
        again
    zh-CN: |
        请确认该文件可读、仓库可写，然后重试
