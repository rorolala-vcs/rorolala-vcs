_version: 2

common:
  err_hash_unknown:
    en: "`%{hash}` names no hash here"
    zh-CN: "`%{hash}` 在此没有对应的哈希"

  err_hash_ambiguous:
    en: "`%{hash}` corresponds to more than one hash: %{candidates}"
    zh-CN: "`%{hash}` 对应多个哈希：%{candidates}"

  err_hash_help:
    en: |
        When only one hash here starts with a prefix, you may write only that prefix, at least four hex digits
        Please add more digits, or write the hash in full
    zh-CN: |
        若此处的哈希中只有一个哈希以某前缀开头，可以只写该前缀，至少四位十六进制
        请补足位数，或写出完整哈希
