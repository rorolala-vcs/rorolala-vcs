_version: 2

inv_idx:
  help:
    en: |
        Build and ask the inverse index, by hand

        **Usage**: `rola inv-idx <COMMAND>`

        **Commands**
            rebuild                  Build the inverse index from the index's objects
            store-dep <STORE>        List the variants made from a stored entry
            variant-dep <HASH>       List the versions that fix a variant
            version-dep <HASH>       List the variants based on a version
            creator-dep <HASH>       List the variants made by a creator
            msg-dep <HASH>           List the variants that carry a message
            version-num <HASH>       Print a version's number

        The version control index answers "what is stored under this hash"; the inverse index
        answers the other way — which objects depend on a key. It is derived data: a rebuild is what
        makes it, and a read falls back to reading the objects when it does not describe the index
        as it stands. So nothing here is needed to use `rola`, and a stale index costs speed rather
        than correctness.

        The run has to be somewhere an index can be found — inside a Vault or a Workspace.
    zh-CN: |
        手工建立并查询反向索引

        **用法**：`rola inv-idx <命令>`

        **命令**
            rebuild                  由索引中的对象建立反向索引
            store-dep <STORE>        列出基于某存储条目建立的 variant
            variant-dep <HASH>       列出固定某 variant 的 version
            version-dep <HASH>       列出基于某 version 的 variant
            creator-dep <HASH>       列出某 creator 创建的 variant
            msg-dep <HASH>           列出携带某 message 的 variant
            version-num <HASH>       输出某 version 的号

        版本控制索引回答「这个哈希下存着什么」；反向索引回答另一边——哪些对象依赖某个 key。它是派生
        数据：靠 rebuild 建立，当它不再描述索引现状时，读取回退为直接读对象。因此使用 `rola` 并不需要
        这些命令，索引过期只损失速度，不影响正确性。

        运行必须处在能发现索引的地方：保险库或工作区内。

  cmd_inv_idx_description:
    en: Build and ask the inverse index, by hand
    zh-CN: 手工建立并查询反向索引

  err_no_index:
    en: This run is nowhere a version control index is
    zh-CN: 当前运行不处于任何版本控制索引中

  err_no_index_help:
    en: |
        Please run this inside a Vault or Workspace
    zh-CN: |
        请在保险库或工作区内运行

  err_read:
    en: "The inverse index could not be made — %{reason}"
    zh-CN: "无法建立反向索引 —— %{reason}"

  err_read_help:
    en: |
        Please check that the index can be read, then try again
    zh-CN: |
        请确认索引可读，然后重试

  err_argument:
    en: "the `%{argument}` argument is missing"
    zh-CN: "缺少 `%{argument}` 参数"

  err_argument_help:
    en: |
        Please give the argument and try again
    zh-CN: |
        请补上该参数后重试

  err_bad_hash:
    en: "`%{hash}` is not a hash"
    zh-CN: "`%{hash}` 不是哈希"

  err_bad_hash_help:
    en: |
        Please give a hash as hex, or as `blake3:<hex>`
    zh-CN: |
        请给出十六进制哈希，或 `blake3:<hex>` 形式的哈希

  err_not_found:
    en: "Nothing is stored under `%{hash}`"
    zh-CN: "`%{hash}` 下没有存储任何对象"

  err_not_found_help:
    en: |
        Please create what is missing first, then try again
    zh-CN: |
        请先创建缺少的对象，然后重试

inv_idx_rebuild:
  help:
    en: |
        Build the inverse index from the index's objects

        **Usage**: `rola inv-idx rebuild [--json]`

        Every object is read once and what each points at is written down, so the records afterwards
        describe exactly the index they were built from. Nothing is printed on stdout: what was
        produced is a file, and `--json` is answered with the report of what it holds.
    zh-CN: |
        由索引中的对象建立反向索引

        **用法**：`rola inv-idx rebuild [--json]`

        每个对象只读一次，记录下它指向谁，因此建立之后的记录精确描述它据以建立的那个索引。stdout 不打
        印任何内容：产物是一个文件，`--json` 则以报告作答。

  description:
    en: Build the inverse index from the index's objects
    zh-CN: 由索引中的对象建立反向索引

inv_idx_store_dep:
  help:
    en: |
        List the variants made from a stored entry

        **Usage**: `rola inv-idx store-dep <STORE> [--json]`

        A variant names the content it was made of by its hash, so this lists the variants that name
        the given one. One hash a line.
    zh-CN: |
        列出基于某存储条目建立的 variant

        **用法**：`rola inv-idx store-dep <STORE> [--json]`

        variant 以哈希指明它所依据的内容，因此这里列出指明该哈希的 variant。每行一个哈希。

  description:
    en: List the variants made from a stored entry
    zh-CN: 列出基于某存储条目建立的 variant

inv_idx_variant_dep:
  help:
    en: |
        List the versions that fix a variant

        **Usage**: `rola inv-idx variant-dep <HASH> [--json]`

        A version fixes a variant by pointing at it, so this lists the versions that point at the
        given variant. One hash a line.
    zh-CN: |
        列出固定某 variant 的 version

        **用法**：`rola inv-idx variant-dep <HASH> [--json]`

        version 通过指向 variant 来固定它，因此这里列出指向该 variant 的 version。每行一个哈希。

  description:
    en: List the versions that fix a variant
    zh-CN: 列出固定某 variant 的 version

inv_idx_version_dep:
  help:
    en: |
        List the variants based on a version

        **Usage**: `rola inv-idx version-dep <HASH> [--json]`

        A variant is based on a version by naming it, so this lists the variants that name the given
        version. One hash a line.
    zh-CN: |
        列出基于某 version 的 variant

        **用法**：`rola inv-idx version-dep <HASH> [--json]`

        variant 以命名的方式基于某个 version，因此这里列出命名该 version 的 variant。每行一个哈希。

  description:
    en: List the variants based on a version
    zh-CN: 列出基于某 version 的 variant

inv_idx_creator_dep:
  help:
    en: |
        List the variants made by a creator

        **Usage**: `rola inv-idx creator-dep <HASH> [--json]`

        Who made a change belongs to the variant, so this lists the variants that carry the given
        creator. One hash a line.
    zh-CN: |
        列出某 creator 创建的 variant

        **用法**：`rola inv-idx creator-dep <HASH> [--json]`

        「谁做的」属于 variant，因此这里列出携带该 creator 的 variant。每行一个哈希。

  description:
    en: List the variants made by a creator
    zh-CN: 列出某 creator 创建的 variant

inv_idx_msg_dep:
  help:
    en: |
        List the variants that carry a message

        **Usage**: `rola inv-idx msg-dep <HASH> [--json]`

        What was done belongs to the variant, so this lists the variants that carry the given
        message. One hash a line.
    zh-CN: |
        列出携带某 message 的 variant

        **用法**：`rola inv-idx msg-dep <HASH> [--json]`

        「做了什么」属于 variant，因此这里列出携带该 message 的 variant。每行一个哈希。

  description:
    en: List the variants that carry a message
    zh-CN: 列出携带某 message 的 variant

inv_idx_version_num:
  help:
    en: |
        Print a version's number

        **Usage**: `rola inv-idx version-num <HASH> [--json]`

        The number is derived rather than stored, so what answers is the records when they hold it
        and a walk of the chain otherwise. The root version is numbered `u64::MAX`, one before the
        first.
    zh-CN: |
        输出某 version 的号

        **用法**：`rola inv-idx version-num <HASH> [--json]`

        号是推导出来的而非存储的，因此记录里有时由记录作答，否则沿链回溯求得。root version 的号是
        `u64::MAX`，即第一个版本之前。

  description:
    en: Print a version's number
    zh-CN: 输出某 version 的号
