_version: 2

inv_idx:
  help:
    en: |
        Build and ask the inverse index, by hand

        **Usage**: rola inv-idx <COMMAND>
        **Commands**:
            rebuild               Build the inverse index from the index's objects
            store-dep <STORE>     List the variants made from a stored entry
            variant-dep <HASH>    List the versions that fix a variant
            version-dep <HASH>    List the variants based on a version
            creator-dep <HASH>    List the variants made by a creator
            msg-dep <HASH>        List the variants that carry a message
            version-num <HASH>    Print a version's number

        The inverse index is made by the `rebuild` command
        A stale index falls back to ordinary queries, and does not affect correctness
    zh-CN: |
        手工建立并查询反向索引

        **用法**：rola inv-idx <子命令>
        **命令**：
            rebuild                 由索引中的对象建立反向索引
            store-dep <存储条目>    列出基于某存储条目建立的变体
            variant-dep <哈希>      列出固定某变体的版本
            version-dep <哈希>      列出基于某版本的变体
            creator-dep <哈希>      列出某 Creator 创建的变体
            msg-dep <哈希>          列出携带某 Message 的变体
            version-num <哈希>      输出某版本的号

        反向索引由 `rebuild` 子命令建立
        索引过期会回退到普通的查询，不影响正确性

  cmd_inv_idx_description:
    en: Build and ask the inverse index, by hand
    zh-CN: 手工建立并查询反向索引

  err_no_index:
    en: This run is not in any version control index
    zh-CN: 当前运行不在任何版本控制索引中

  err_no_index_help:
    en: |
        Please run this command inside a Vault or Workspace
    zh-CN: |
        请在保险库或工作区内运行该命令

  err_read:
    en: "The inverse index could not be made: %{reason}"
    zh-CN: "无法建立反向索引：%{reason}"

  err_read_help:
    en: |
        Please check that the index can be read, then try again
    zh-CN: |
        请确认索引可读后重试

  err_argument:
    en: "Missing argument: `%{argument}`"
    zh-CN: "缺少参数：`%{argument}`"

  err_argument_help:
    en: |
        Please give the argument and try again
    zh-CN: |
        请补上该参数后重试

  err_bad_hash:
    en: "`%{hash}` is not a valid hash"
    zh-CN: "`%{hash}` 不是有效的哈希"

  err_bad_hash_help:
    en: |
        Please give a hash as hex, or as `blake3:<hex>`
    zh-CN: |
        请给出十六进制哈希，或 `blake3:<hex>` 形式的哈希

  err_not_found:
    en: "No stored object found: `%{hash}`"
    zh-CN: "未发现存储对象：`%{hash}`"

  err_not_found_help:
    en: |
        Please create what is missing first, then try again
    zh-CN: |
        请先创建缺少的对象，然后重试

inv_idx_rebuild:
  help:
    en: |
        Build the inverse index from the index's objects

        **Usage**: rola inv-idx rebuild
        **Flags**:
            --json    Write the report of this build as JSON

        The product is a file, nothing is printed on stdout, and `--json` answers with the report
    zh-CN: |
        由索引中的对象建立反向索引

        **用法**：rola inv-idx rebuild
        **标识**：
            --json    以 JSON 输出本次构建的报告

        产物是一个文件，stdout 不打印任何内容，`--json` 则以报告作答

  description:
    en: Build the inverse index from the index's objects
    zh-CN: 由索引中的对象建立反向索引

inv_idx_store_dep:
  help:
    en: |
        List the variants made from a stored entry

        **Usage**: rola inv-idx store-dep <STORE>
        **Flags**:
            --json    Write as JSON

        List the variants made from that stored entry, one hash a line
    zh-CN: |
        列出基于某存储条目建立的变体

        **用法**：rola inv-idx store-dep <存储条目>
        **标识**：
            --json    以 JSON 输出

        列出基于该存储条目建立的变体，每行一个哈希

  description:
    en: List the variants made from a stored entry
    zh-CN: 列出基于某存储条目建立的变体

inv_idx_variant_dep:
  help:
    en: |
        List the versions that fix a variant

        **Usage**: rola inv-idx variant-dep <HASH>
        **Flags**:
            --json    Write as JSON

        List the versions that point at that variant, one hash a line
    zh-CN: |
        列出固定某变体的版本

        **用法**：rola inv-idx variant-dep <哈希>
        **标识**：
            --json    以 JSON 输出

        列出指向该变体的版本，每行一个哈希

  description:
    en: List the versions that fix a variant
    zh-CN: 列出固定某变体的版本

inv_idx_version_dep:
  help:
    en: |
        List the variants based on a version

        **Usage**: rola inv-idx version-dep <HASH>
        **Flags**:
            --json    Write as JSON

        List the variants that name that version, one hash a line
    zh-CN: |
        列出基于某版本的变体

        **用法**：rola inv-idx version-dep <哈希>
        **标识**：
            --json    以 JSON 输出

        列出命名该版本的变体，每行一个哈希

  description:
    en: List the variants based on a version
    zh-CN: 列出基于某版本的变体

inv_idx_creator_dep:
  help:
    en: |
        List the variants made by a creator

        **Usage**: rola inv-idx creator-dep <HASH>
        **Flags**:
            --json    Write as JSON

        List the variants that carry that creator, one hash a line
    zh-CN: |
        列出某 Creator 创建的变体

        **用法**：rola inv-idx creator-dep <哈希>
        **标识**：
            --json    以 JSON 输出

        列出携带该 Creator 的变体，每行一个哈希

  description:
    en: List the variants made by a creator
    zh-CN: 列出某 Creator 创建的变体

inv_idx_msg_dep:
  help:
    en: |
        List the variants that carry a message

        **Usage**: rola inv-idx msg-dep <HASH>
        **Flags**:
            --json    Write as JSON

        List the variants that carry that message, one hash a line
    zh-CN: |
        列出携带某 Message 的变体

        **用法**：rola inv-idx msg-dep <哈希>
        **标识**：
            --json    以 JSON 输出

        列出携带该 Message 的变体，每行一个哈希

  description:
    en: List the variants that carry a message
    zh-CN: 列出携带某 Message 的变体

inv_idx_version_num:
  help:
    en: |
        Print a version's number

        **Usage**: rola inv-idx version-num <HASH>
        **Flags**:
            --json    Write as JSON
    zh-CN: |
        输出某版本的号

        **用法**：rola inv-idx version-num <哈希>
        **标识**：
            --json    以 JSON 输出

  description:
    en: Print a version's number
    zh-CN: 输出某版本的号
