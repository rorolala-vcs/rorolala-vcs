_version: 2

inv_idx:
  help:
    en: |
        Build and ask the inverse index, by hand

        **Usage**: rola inv-idx <COMMAND>
        **Commands**:
            rebuild               Build the inverse index from the index's objects
            list                  List the variants and versions the records name
            store-dep <STORE>     List the variants made from a stored entry
            variant-dep <HASH>    List the versions that fix a variant
            version-dep <HASH>    List the variants based on a version
            creator-dep <HASH>    List the variants made by a creator
            msg-dep <HASH>        List the variants that carry a message
            version-num <HASH>    Print a version's number

        The inverse index is made by the `rebuild` command
        A stale index falls back to ordinary queries, and does not affect correctness
    zh-CN: |
        手工建立并查询反向索引

        **用法**：rola inv-idx <子命令>
        **命令**：
            rebuild                 由索引中的对象建立反向索引
            list                    列出记录中保存的变体与版本
            store-dep <存储条目>    列出基于某存储条目建立的变体
            variant-dep <哈希>      列出固定某变体的版本
            version-dep <哈希>      列出基于某版本的变体
            creator-dep <哈希>      列出某 Creator 创建的变体
            msg-dep <哈希>          列出携带某 Message 的变体
            version-num <哈希>      输出某版本的号

        反向索引由 `rebuild` 子命令建立
        索引过期会回退到普通的查询，不影响正确性

  cmd_inv_idx_description:
    en: Build and ask the inverse index, by hand
    zh-CN: 手工建立并查询反向索引

  err_no_index:
    en: This run is not in any version control index
    zh-CN: 当前运行不在任何版本控制索引中

  err_no_index_help:
    en: |
        Please run this command inside a Vault or Workspace
    zh-CN: |
        请在保险库或工作区内运行该命令

  err_read:
    en: "The inverse index could not be made: %{reason}"
    zh-CN: "无法建立反向索引：%{reason}"

  err_read_help:
    en: |
        Please check that the index can be read, then try again
    zh-CN: |
        请确认索引可读后重试

  err_argument:
    en: "Missing argument: `%{argument}`"
    zh-CN: "缺少参数：`%{argument}`"

  err_argument_help:
    en: |
        Please give the argument and try again
    zh-CN: |
        请补上该参数后重试

  err_bad_hash:
    en: "`%{hash}` is not a valid hash"
    zh-CN: "`%{hash}` 不是有效的哈希"

  err_bad_hash_help:
    en: |
        Please give a hash as hex, or as `blake3:<hex>`
    zh-CN: |
        请给出十六进制哈希，或 `blake3:<hex>` 形式的哈希

  err_not_found:
    en: "No stored object found: `%{hash}`"
    zh-CN: "未发现存储对象：`%{hash}`"

  err_not_found_help:
    en: |
        Please create what is missing first, then try again
    zh-CN: |
        请先创建缺少的对象，然后重试

  err_kind:
    en: "`%{kind}` is not a kind of object the inverse index holds"
    zh-CN: "`%{kind}` 不是反向索引持有的对象种类"

  err_kind_help:
    en: |
        Please name one of `variant`, `version` or `all`
    zh-CN: |
        请给出 `variant`、`version` 或 `all` 之一

inv_idx_list:
  help:
    en: |
        List the variants and versions the inverse index holds

        **Usage**: rola inv-idx list
        **Flags**:
            --kind <KIND>      List `variant`, `version` or `all`
            --limit <ROWS>     Stop after this many rows
            --json             Write as JSON

        A variant is a row with its key and what it is made of; a version is a row with the variant it fixes and its number
        The rows are the variants and then the versions, each in key order
        The objects are read instead of the records when the records do not describe the index
        `--format` draws each row through a template, with the fields `--json` writes under `objects`
    zh-CN: |
        列出反向索引持有的变体与版本

        **用法**：rola inv-idx list
        **标识**：
            --kind <种类>      只列出 `variant`、`version` 或 `all`
            --limit <行数>     最多列出这么多行
            --json             以 JSON 输出

        变体一行，含其哈希与构成它的各部分；版本一行，含它固定的变体与它的号
        先列变体、再列版本，各自按哈希顺序
        记录不再描述索引时，改为读取对象
        `--format` 按模板绘制每一行，字段与 `--json` 的 `objects` 相同

  description:
    en: List the variants and versions the inverse index holds
    zh-CN: 列出反向索引持有的变体与版本

  complete:
    kind:
      en: List the variants, the versions, or both
      zh-CN: 列出变体、版本或两者
    limit:
      en: Stop after this many rows
      zh-CN: 最多列出多少行

inv_idx_rebuild:
  help:
    en: |
        Bring the inverse index up to date with the index's objects

        **Usage**: rola inv-idx rebuild
        **Flags**:
            --json    Write the report of this build as JSON

        Only the objects written since the last build are read, and a build whose records already describe the index reads nothing
        The product is a file, nothing is printed on stdout, and `--json` answers with the report: what it had to do, what it read, and what it numbered
    zh-CN: |
        让反向索引跟上索引中的对象

        **用法**：rola inv-idx rebuild
        **标识**：
            --json    以 JSON 输出本次构建的报告

        只读取上次构建之后写入的对象，记录已描述索引时什么都不读
        产物是一个文件，stdout 不打印任何内容，`--json` 则以报告作答：做了什么、读了多少、编号了多少

  description:
    en: Bring the inverse index up to date with the index's objects
    zh-CN: 让反向索引跟上索引中的对象

inv_idx_store_dep:
  help:
    en: |
        List the variants made from a stored entry

