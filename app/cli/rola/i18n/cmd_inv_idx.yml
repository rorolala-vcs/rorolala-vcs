_version: 2

inv_idx:
  help:
    en: |
      # Build and ask the inverse index, by hand
      **Usage**: rola [[GREEN]]__inv-idx__[[/]] <COMMAND>
      **Commands**:
          rebuild               Build the inverse index from the index's objects
          list                  List the variants and versions the records name
          store-dep <STORE>     List the variants made from a stored entry
          variant-dep <HASH>    List the versions that fix a variant
          version-dep <HASH>    List the variants based on a version
          creator-dep <HASH>    List the variants made by a creator
          msg-dep <HASH>        List the variants that carry a message
          version-num <HASH>    Print a version's number
      > [!Note]
      > The inverse index is built by the `rebuild` subcommand
      > A stale index falls back to ordinary queries and does not affect correctness
    zh-CN: |
      # 手工建立并查询反向索引
      **用法**：rola [[GREEN]]__inv-idx__[[/]] <子命令>
      **命令**：
          rebuild                 由索引中的对象建立反向索引
          list                    列出记录中保存的变体与版本
          store-dep <存储条目>    列出基于某存储条目建立的变体
          variant-dep <哈希>      列出固定某变体的版本
          version-dep <哈希>      列出基于某版本的变体
          creator-dep <哈希>      列出某 Creator 创建的变体
          msg-dep <哈希>          列出携带某 Message 的变体
          version-num <哈希>      输出某版本的号
      > [!Note]
      > 反向索引由 `rebuild` 子命令建立
      > 索引过期会回退到普通的查询，不影响正确性

  cmd_inv_idx_description:
    en: Build and ask the inverse index, by hand
    zh-CN: 手工建立并查询反向索引

  err_no_index:
    en: This run is not in any version control index
    zh-CN: 当前运行不在任何版本控制索引中

  err_no_index_help:
    en: |
      Please run this command inside a Vault or Workspace
    zh-CN: |
      请在保险库或工作区内运行该命令

  err_read:
    en: "The inverse index could not be made: %{reason}"
    zh-CN: "无法建立反向索引：%{reason}"

  err_read_help:
    en: |
      Please check that the index can be read, then try again
    zh-CN: |
      请确认索引可读后重试

  err_argument:
    en: "Missing argument: `%{argument}`"
    zh-CN: "缺少参数：`%{argument}`"

  err_argument_help:
    en: |
      Please give the argument and try again
    zh-CN: |
      请补上该参数后重试

  err_bad_hash:
    en: "`%{hash}` is not a valid hash"
    zh-CN: "`%{hash}` 不是有效的哈希"

  err_bad_hash_help:
    en: |
      Please give a hash as hex, or as `blake3:<hex>`
    zh-CN: |
      请给出十六进制哈希，或 `blake3:<hex>` 形式的哈希

  err_not_found:
    en: "No stored object found: `%{hash}`"
    zh-CN: "未发现存储对象：`%{hash}`"

  err_not_found_help:
    en: |
      Please create what is missing first, then try again
    zh-CN: |
      请先创建缺少的对象，然后重试

  err_kind:
    en: "`%{kind}` is not a kind of object the inverse index holds"
    zh-CN: "`%{kind}` 不是反向索引持有的对象种类"

  err_kind_help:
    en: |
      Please name one of `variant`, `version` or `all`
    zh-CN: |
      请给出 `variant`、`version` 或 `all` 之一

inv_idx_list:
  help:
    en: |
      # List the variants and versions the inverse index holds
      **Usage**: rola inv-idx [[GREEN]]__list__[[/]]
      **Flags**:
           __--kind__ <KIND>     List `variant`, `version` or `all`
           __--limit__ <ROWS>    Stop after this many rows
           __--json__            Write as JSON
    zh-CN: |
      # 列出反向索引持有的变体与版本
      **用法**：rola inv-idx [[GREEN]]__list__[[/]]
      **标识**：
           __--kind__ <种类>     只列出 `variant`、`version` 或 `all`
           __--limit__ <行数>    最多可以列出的行数
           __--json__            写为 JSON

  description:
    en: List the variants and versions the inverse index holds
    zh-CN: 列出反向索引持有的变体与版本

  complete:
    kind:
      en: List the variants, the versions, or both
      zh-CN: 列出变体、版本或两者
    limit:
      en: Stop after this many rows
      zh-CN: 最多列出多少行

inv_idx_rebuild:
  help:
    en: |
      # Bring the inverse index up to date with the index's objects
      **Usage**: rola inv-idx [[GREEN]]__rebuild__[[/]]
      **Flags**:
           __--json__    Write the report of this build as JSON
    zh-CN: |
      # 让反向索引跟上索引中的对象
      **用法**：rola inv-idx [[GREEN]]__rebuild__[[/]]
      **标识**：
           __--json__    以 JSON 输出本次构建的报告

  description:
    en: Bring the inverse index up to date with the index's objects
    zh-CN: 让反向索引跟上索引中的对象

