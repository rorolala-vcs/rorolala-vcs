_version: 2

status:
  complete:
    compact:
      en: Only draw the versions, not the variants between them
      zh-CN: 只画版本，不画中间的变体
    no_message:
      en: Do not show each version's message
      zh-CN: 不显示每个版本的说明
    no_creator:
      en: Do not show who created each version
      zh-CN: 不显示每个版本由谁创建
    max_message_length:
      en: The number of characters shown before the message is cut short
      zh-CN: 说明截断前显示的字符数
    no_graph:
      en: Do not draw that version chain
      zh-CN: 不画出那条版本链
    no_hint:
      en: Do not show the two lines for origin and state
      zh-CN: 不显示来源与状态两行
  help:
    en: |
      Show the state of the working tree relative to the Layout, or look back from one item in it

      **Usage**: `rola status [TARGET]`
      **Flags**:
          --compact                 Only draw the versions, not the variants between them
          --no-creator              Do not show who created each version
          --no-message              Do not show each version's message
          --max-message-length <N> The number of characters shown before the message is cut short
          --no-graph                Do not draw that version chain
          --no-hint                 Do not show the two lines for origin and state
          --show-unjoined-variants  Show every unjoined variant of the named file

      With no target named, the working tree's differences are shown line by line: a `>` beginning means a moved path, a `-` a path the Layout records and the working tree lacks, a `+` a path the working tree has and the Layout does not record, and the rest are paths with content changes in place, while `(*)` marks a line that also has a content change

      With a target named, the version chain at the top of it is drawn instead
      A target may be a path in the Layout, a `Uuid`, or the hash of an index object
    zh-CN: |
      查看工作区相对布局的状态，或从其中某一项往回查看

      **用法**：rola status [目标]
      **标识**：
          --compact                只画版本，不画中间的变体
          --no-creator             不显示每个版本由谁创建
          --no-message             不显示每个版本的说明
          --max-message-length <N> 说明截断前显示的字符数
          --no-graph               不画出那条版本链
          --no-hint                不显示来源与状态两行
          --show-unjoined-variants 显示指定文件未合并的所有变体

      不指定目标时，逐行展示工作区的差异：`>` 开头是移动的路径，`-` 是布局记录而工作区缺失的路径，`+` 是工作区有而布局未记录的路径，其余行是原地发生内容变化的路径，`(*)` 表示该行同时也有内容变化

      指定目标时，改为画出以它为目标的那条版本链
      目标可为布局中的路径、`Uuid` 或索引对象的哈希

  description:
    en: Show the state of the working tree relative to the Layout
    zh-CN: 查看工作区相对布局的状态

  source:
