  clean:
    en: Your workspace has nothing unrecorded
    zh-CN: 你的工作区没有未记录的内容

  header_merging:
    en: "Your workspace has %{count} merges in progress:"
    zh-CN: "你的工作区有 %{count} 项正在进行的合并："

  body_merging:
    en: "These files have a variant waiting to be joined into them:"
    zh-CN: "这些文件有变体正在等待并入："

  merging_line:
    en: "& %{target} <- %{variant} (%{path})"
    zh-CN: "& %{target} <- %{variant}（%{path}）"

  merging_line_moved:
    en: "& %{target} <- %{variant}"
    zh-CN: "& %{target} <- %{variant}"

  merging_line_moved_to:
    en: "> %{from} -> %{to}"
    zh-CN: "> %{from} -> %{to}"

  help_merging:
    en: "Record a merge with `rola track <FILE>`, or cancel it with `rola align --delete`"
    zh-CN: "用 `rola track <文件>` 记录合并，或用 `rola align --delete` 取消"

  help_merging_moved:
    en: "Confirm where the variant file moved to with `rola align --rename`, or assert this move with `rola align --move`"
    zh-CN: "用 `rola align --rename` 确认变体文件移到何处，或用 `rola align --move` 断言这次移动"

  merging_into:
    en: "Variant %{variant} in %{path} is being joined into the current file"
    zh-CN: "变体 %{variant}（%{path}）正在并入当前文件"

  merge_variant_from:
    en: "The current variant comes from %{variant}"
    zh-CN: "当前变体来自 %{variant}"

  merge_variant_into:
    en: "Preparing to join into %{target}"
    zh-CN: "正准备并入 %{target}"

  merge_no_target:
    en: "merge %{variant}: the file it is to be joined into is no longer named by the Layout"
    zh-CN: "合并 %{variant}：它要并入的文件已不再被布局命名"

  merge_no_place:
