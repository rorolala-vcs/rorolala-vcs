_version: 2

track:
  complete:
    message:
      en: Give the whole group one commit message
      zh-CN: 为整组文件指定提交信息
    file_message:
      en: Give each file its own commit message
      zh-CN: 为每个文件分别指定提交信息
    no_editor:
      en: Record only what is already known, without opening an editor
      zh-CN: 只记录已知信息，不打开编辑器
    replace:
      en: Redo the version the file is at, like `git commit --amend`
      zh-CN: 重做文件当前所在的版本，如同 `git commit --amend`
    policy:
      en: Cut these files with the named chunking policy, and prefer it for them from now on
      zh-CN: 用指定的分块策略切分这些文件，并在此后沿用
  help:
    en: |
      Record files into the current Layout

      **Usage**: rola track <FILE>...
      **Flags**:
          --message <MESSAGE>         Give the whole group one commit message
          --file-message <MESSAGE>    Give each file its own commit message, one per file

          --policy <NAME>             Cut these files with the named chunking policy, and prefer it from now on
          --no-editor                 Record only what is already known, without opening an editor
          --replace                   Redo the version the file is at, like `git commit --amend`
          --force                     Record files that belong to another account
          --include-ignored           Record files the ignore rules govern as well
    zh-CN: |
      将文件记录到当前布局

      **用法**：rola track <路径>...
      **标识**：
          --message <信息>         为整组文件指定提交信息
          --file-message <信息>    为单个文件指定提交信息，每个文件一个

          --policy <名称>          用指定的分块策略切分这些文件，并在此后沿用
          --no-editor              只记录已知信息，不打开编辑器
          --replace                重做文件当前所在的版本，如同 `git commit --amend`
          --force                  记录属于其他账户的文件
          --include-ignored        连被忽略规则管辖的文件一并记录

  # What a recording says it is doing while it does it, one line each: the three parts of the run in the
  # order it goes through them. They are said both to a person watching — on a bar — and to a program
  # reading, so they are plain words rather than a bar's drawing.
  enumerating:
    en: Enumerating entries to track
    zh-CN: 枚举待追踪条目中
  writing:
    en: Writing content
    zh-CN: 写入内容中
  recording:
    en: Recording versions
    zh-CN: 记录版本中

  description:
    en: Record files into the current Layout
    zh-CN: 将文件记录到当前布局

  editing_header:
    en: |
      You are recording the files below, so write what each change was

      Lines starting with `#` are ignored
      Every section needs a message
    zh-CN: |
      你正在记录下列文件，请写出每一处更改的内容

      以 `#` 开头的行会被忽略
      每一节都需要填写信息

  editing_global:
    en: "What this whole group did:"
    zh-CN: "这一组整体做了什么："

  editing_file:
    en: "What this file's change was"
    zh-CN: "这个文件的更改内容"

  editing_warning:
    en: "== `%{path}`'s description is past the limit at %{length} bytes, please shorten it"
    zh-CN: "== `%{path}` 的描述超出上限，已达 %{length} 字节，请缩短"

  editing_missing:
    en: "== `%{path}` has no description, please write a message for it"
    zh-CN: "== `%{path}` 没有任何描述，请为它填写信息"

  result_added:
    en: "added  %{path}"
    zh-CN: "路径 %{path} 已加入"

  result_updated:
    en: "updated  %{path}"
    zh-CN: "路径 %{path} 已更新"

  result_replaced:
    en: "replaced  %{path}"
    zh-CN: "路径 %{path} 已替换"

  err_replace_unrecorded:
    en: "`%{path}` has no version to replace: the Layout records none for it"
    zh-CN: "`%{path}` 没有可替换的版本：布局没有记录过它"

  err_replace_merge:
    en: "`%{path}` is at a merge, which cannot be replaced"
    zh-CN: "`%{path}` 当前是一个合并版本，无法替换"

  err_replace_merging:
    en: "`%{path}` has a variant waiting to be merged, which `--replace` would drop"
    zh-CN: "`%{path}` 有变体正在等待合并，`--replace` 会把它丢掉"

  err_replace_help:
    en: |
      Please record the file first, and do not replace a merge
    zh-CN: |
      请先记录该文件，也不要替换合并版本

  err_merge_changed:
    en: "the variant file `%{path}` no longer holds the variant's content"
    zh-CN: "变体文件 `%{path}` 已不再持有该变体的内容"

  err_merge_changed_help:
    en: |
      Put the variant file back with `rola align --restore`, or end the merge with `rola align --delete`, then try again
    zh-CN: |
      请用 `rola align --restore` 把变体文件放回，或用 `rola align --delete` 结束合并，然后重试

  err_no_files:
    en: No file was named to record
    zh-CN: 请指定要记录的文件

  err_lost:
    en: "%{count} paths the Layout names are missing from the tree: %{paths}"
    zh-CN: "有 %{count} 个布局命名、工作树缺失的路径：%{paths}"

  err_lost_help:
    en: |
      Settle it first with `rola align <PATH> --delete`, `rola layout tree-diff` shows what is lost
    zh-CN: |
      请先用 `rola align <路径> --delete` 处理，`rola layout tree-diff` 可查看丢失项

  err_unowned:
    en: "%{count} files named are not yours to record: %{paths}"
    zh-CN: "指定的 %{count} 个文件不属于你，无法记录：%{paths}"

  err_unowned_help:
    en: |
      Record them anyway with `rola track --force`, or ask the holder to give ownership up with `rola layout giveup-ownership`
    zh-CN: |
      请用 `rola track --force` 强制记录，或请持有者用 `rola layout giveup-ownership` 让出所有权

  err_ignored:
    en: "%{count} files named are governed by the ignore rules: %{paths}"
    zh-CN: "指定的 %{count} 个文件被忽略规则管辖：%{paths}"

  err_ignored_help:
    en: |
      Leave them out, or record them anyway with `rola track --include-ignored`
    zh-CN: |
      请略过这些文件，或用 `rola track --include-ignored` 一并记录

  err_no_files_help:
    en: |
      Name one or more files, see `rola track --help` for how they are recorded
    zh-CN: |
      请指定一个或多个文件，记录方式见 `rola track --help`

  err_not_a_file:
    en: "`%{path}` is not a file"
    zh-CN: "`%{path}` 不是文件"

  err_outside_workspace:
    en: "`%{path}` is not inside this Workspace"
    zh-CN: "`%{path}` 不在本工作区之内"

  err_inside_data:
    en: "`%{path}` is part of the Workspace's own data, not its work"
    zh-CN: "`%{path}` 属于工作区自身的数据，而非其工作内容"

  err_file_help:
    en: |
      Name files that sit inside the Workspace and are not under `.rola`
    zh-CN: |
      请指定位于工作区内且不在 `.rola` 之下的文件

  err_message_mismatch:
    en: The files and `--file-message` values do not line up one to one
    zh-CN: 文件与 `--file-message` 未一一对应

  err_message_missing:
    en: "`%{path}` would carry no message"
    zh-CN: "`%{path}` 没有任何提交信息"

  err_message_too_long:
    en: "The message for `%{path}` is %{length} bytes, past the limit"
    zh-CN: "`%{path}` 的提交信息为 %{length} 字节，超出上限"

  err_message_unresolved:
    en: No message that may be kept was written
    zh-CN: 未能写出可保留的提交信息

  err_aborted:
    en: No commit message was written, so nothing was recorded
    zh-CN: 未撰写任何提交信息，因此未记录任何内容

  err_aborted_help:
    en: |
      Write a message for the group, or for each file, and try again
    zh-CN: |
      请为整组或每个文件写入提交信息，然后重试

  err_message_help:
    en: |
      Give one `--file-message` per file, or write the messages in the editor
    zh-CN: |
      请为每个文件各给一个 `--file-message`，或在编辑器中撰写提交信息

  err_no_store:
    en: This run works on no store to put the content into
    zh-CN: 本运行没有可用于写入内容的仓库

  err_no_index:
    en: This run works on no version control index to record the version in
    zh-CN: 本运行没有可用于记录版本的版本控制索引

  err_failed:
    en: "The file could not be recorded: %{reason}"
    zh-CN: "无法记录该文件：%{reason}"

  err_failed_help:
    en: |
      Check that the store, the index and the Layout are writable, then try again
    zh-CN: |
      请检查仓库、索引与布局是否可写，然后重试

  err_policy_unknown:
    en: "`%{name}` is not a chunking policy this build carries"
    zh-CN: "`%{name}` 不是本构建携带的分块策略"

  err_policy_unknown_help:
    en: "Policies this build carries: %{known}"
    zh-CN: "本构建携带的策略：%{known}"

  err_policy_none:
    en: This build carries no chunking policy of its own
    zh-CN: 本构建不携带任何自带的分块策略

  err_preference:
    en: "`%{path}` is written with the chunking policy `%{name}`, and this build does not carry it"
    zh-CN: "`%{path}` 约定用分块策略 `%{name}` 写入，而本构建不携带它"

  err_preference_help:
    en: |
      Choose another one with `rola track --policy <NAME>`, or use a build that carries `%{name}`. Policies this build carries: %{known}
    zh-CN: |
      用 `rola track --policy <名称>` 换一个策略，或改用携带 `%{name}` 的构建。本构建携带的策略：%{known}
