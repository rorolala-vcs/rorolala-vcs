_version: 2

vault_set_default:
  help:
    en: |
        Choose the Vault the Workspace reaches for by default

        **Usage**: rola vault set-default <NAME>

        The name chosen must be one the Workspace has bound
        It becomes the default when no Vault is named
        Choosing the current one again is not an error
    zh-CN: |
        选择工作区默认使用的保险库

        **用法**：rola vault set-default <名字>

        所选名字必须是工作区已绑定的名字
        它成为未指定保险库时的默认选择
        重复指定当前的选择不算错误

  cmd_vault_set_default_description:
    en: Choose the Vault the Workspace reaches for
    zh-CN: 选择工作区默认使用的保险库

  result_chosen:
    en: The Vault reached for by default is now `%{name}`
    zh-CN: 默认使用的保险库已设为 `%{name}`

  result_changed:
    en: The Vault reached for by default is now `%{name}`, in place of `%{previous}`
    zh-CN: 默认使用的保险库已从 `%{previous}` 改为 `%{name}`

  result_cleared:
    en: Nothing is reached for by default now
    zh-CN: 现在不再有默认使用的保险库
