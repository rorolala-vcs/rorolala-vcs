_version: 2

key_generate:
  complete:
    install:
      en: Put the pair in the user's key directory
      zh-CN: 将密钥对写入用户密钥目录
  help:
    en: |
        Generate an Ed25519 key pair under a name

        **Usage**: rola key generate <NAME>
        **Flags**:
            --install    Write the pair into this machine's user key directory

        Write the private key `<NAME>.pem` and the public key `<NAME>.pub` in the current directory
        An extension on the name is treated as a boundary, and `alice`, `alice.pem` and `alice.pub` name the same two files

        With `--install` it is written into the user key directory, `~/.local/share/rola/keys` on a machine that follows XDG, created when it is not there
    zh-CN: |
        按名字生成一对 Ed25519 密钥

        **用法**：rola key generate <名字>
        **标识**：
            --install    将密钥对写入本机用户密钥目录

        在当前目录写出私钥 `<名字>.pem` 与公钥 `<名字>.pub`
        名字上的扩展名当作分界，`alice`、`alice.pem`、`alice.pub` 表示同样的两个文件

        `--install` 时写入用户密钥目录，遵循 XDG 的机器上是 `~/.local/share/rola/keys`，目录不存在时创建

  cmd_key_generate_description:
    en: Generate an Ed25519 key pair under a name
    zh-CN: 按名字生成一对 Ed25519 密钥

  success:
    en: Key pair written to %{private} and %{public}
    zh-CN: 密钥对已写入 %{private} 与 %{public}

  err_name_missing:
    en: No name was given for the key pair
    zh-CN: 未给出密钥对的名字

  err_name_missing_help:
    en: Please give the name of the key pair, for example `rola key generate alice`
    zh-CN: 请给出密钥对的名字，例如 `rola key generate alice`

  err_no_openssl:
    en: Could not run `openssl`
    zh-CN: 无法运行 `openssl`

  err_no_openssl_help:
    en: |
        `rola key generate` makes keys with OpenSSL
        Please install OpenSSL, and make sure `openssl` is on PATH, then try again
    zh-CN: |
        `rola key generate` 使用 OpenSSL 生成密钥
        请安装 OpenSSL，并确认 `openssl` 在 PATH 中，然后重试

  err_keygen_failed:
    en: OpenSSL ran, but did not produce a complete key pair
    zh-CN: OpenSSL 已运行，但未能生成完整密钥对

  err_keygen_failed_help:
    en: |
        Please run `openssl genpkey -algorithm ed25519 -out alice.pem` by hand to see the specific reason
    zh-CN: |
        请手动运行 `openssl genpkey -algorithm ed25519 -out alice.pem` 查看具体原因

  err_no_key_dir:
    en: Could not determine the user's key directory
    zh-CN: 无法确定用户密钥目录

  err_no_key_dir_help:
    en: |
        `--install` needs to write into the local data directory, but this machine does not name that directory
        Please generate in the current directory instead, or set `XDG_DATA_HOME`
    zh-CN: |
        `--install` 需要写入本地数据目录，但本机未指明该目录
        请改为在当前目录生成，或设置 `XDG_DATA_HOME`

  err_install_dir:
    en: Could not create the install directory %{path} — %{reason}
    zh-CN: 无法创建安装目录 %{path} —— %{reason}

  err_install_dir_help:
    en: |
        Please check the write permission of the local data directory, then try again
    zh-CN: |
        请检查本地数据目录的写权限，然后重试
