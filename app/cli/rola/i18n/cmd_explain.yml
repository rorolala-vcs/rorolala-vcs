_version: 2

explain:
  help:
    en: |
        Explain what a number or a name the program left behind means

        **Usage**: rola explain <COMMAND>
        **Commands**:
            exit-code [N]    Explain exit code N, or the last failing exit code when N is omitted

        What can be explained is decided by the subcommand

        The meaning of an exit code is spoken in the language chosen for this run
    zh-CN: |
        解释程序留下的数字或名字的含义

        **用法**：rola explain <命令>
        **命令**：
            exit-code [N]    解释退出码 N，省略 N 时解释上次失败的退出码

        能解释什么由子命令决定

        退出码的含义以本次运行所选的语言说出

  cmd_explain_description:
    en: Explain what a number or a name the program left behind means
    zh-CN: 解释程序留下的数字或名字的含义

explain_exit_code:
  help:
    en: |
        Explain an exit code

        **Usage**: rola explain exit-code [N]

        `N` must be an exit code this program has stated
        They are listed below

        When `N` is omitted, explain the exit code of the last failing run, which is kept under the user's local data directory, at `~/.local/share/rola/lastec` on an XDG machine

        A code the program has not stated is reported as an error, rather than quietly passed over

        **Exit codes**
    zh-CN: |
        解释一个退出码

        **用法**：rola explain exit-code [N]

        `N` 须是本程序声明过的退出码
        它们列在下方

        省略 `N` 时解释上一次失败运行的退出码，该退出码保存在用户的本地数据目录下，XDG 机器上位于 `~/.local/share/rola/lastec`

        程序没有声明的码会报错，而不是默默略过

        **退出码**

  cmd_explain_exit_code_description:
    en: Explain an exit code
    zh-CN: 解释一个退出码

  result:
    en: "Exit code %{code}: %{meaning}"
    zh-CN: "退出码 %{code}：%{meaning}"

  err_no_lastec:
    en: No failing run has been recorded to explain
    zh-CN: 还没有记录任何可供解释的失败运行

  err_no_lastec_help:
    en: |
        Please name the code to explain, as in `rola explain exit-code 84`; one is recorded
        as each run that fails ends
    zh-CN: |
        请给出要解释的退出码，例如 `rola explain exit-code 84`
        每次运行以失败结束时都会记录一个退出码

  err_unknown_code:
    en: "`%{code}` is not an exit code `rola` states"
    zh-CN: "`%{code}` 不是 `rola` 声明过的退出码"

  err_unknown_code_help:
    en: Run `rola explain exit-code -h` to see the exit codes there are
    zh-CN: 运行 `rola explain exit-code -h` 查看可用的退出码

  err_lastec_unknown:
    en: "The last run that failed ended with `%{code}`, which is not an exit code `rola` states"
    zh-CN: "上一次失败运行以 `%{code}` 结束，而它不是 `rola` 声明过的退出码"

  err_lastec_unknown_help:
    en: Run `rola explain exit-code -h` to see the exit codes there are
    zh-CN: 运行 `rola explain exit-code -h` 查看可用的退出码
