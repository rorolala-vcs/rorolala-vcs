_version: 2

vcs_index_ls_remote:
  variants_help:
    en: |
        # List the variants the index at the other end holds
        **Usage**: rola vcs-index [[GREEN]]__ls-remote-variants__[[/]] [VAULT]
        **Flags**:
             __--json__    Output as JSON
    zh-CN: |
        # 列出对端索引持有的变体
        **用法**：rola vcs-index [[GREEN]]__ls-remote-variants__[[/]] [保险库]
        **标识**：
             __--json__    以 JSON 输出

  variants_description:
    en: List the variants the index at the other end holds
    zh-CN: 列出对端索引持有的变体

  versions_help:
    en: |
        # List the versions the index at the other end holds
        **Usage**: rola vcs-index [[GREEN]]__ls-remote-versions__[[/]] [VAULT]
        **Flags**:
             __--json__    Output as JSON
    zh-CN: |
        # 列出对端索引持有的版本
        **用法**：rola vcs-index [[GREEN]]__ls-remote-versions__[[/]] [保险库]
        **标识**：
             __--json__    以 JSON 输出

  versions_description:
    en: List the versions the index at the other end holds
    zh-CN: 列出对端索引持有的版本

  str_help:
    en: |
        # List the hashes of the text objects in the index at the other end
        **Usage**: rola vcs-index [[GREEN]]__ls-remote-str__[[/]] [VAULT]
        **Flags**:
             __--json__    Output as JSON
    zh-CN: |
        # 列出对端索引中文本对象的哈希
        **用法**：rola vcs-index [[GREEN]]__ls-remote-str__[[/]] [保险库]
        **标识**：
             __--json__    以 JSON 输出

  str_description:
    en: List the hashes of the text objects the index at the other end holds
    zh-CN: 列出对端索引中文本对象的哈希
