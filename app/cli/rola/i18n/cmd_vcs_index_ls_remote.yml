        **用法**：`rola vcs-index ls-remote-versions [VAULT] [--json]`

        即 `rola vcs-index ls-versions` 问向对端：那条命令列出本次运行所在索引持有的内容，而这条连上
        保险库、列出**它**的索引持有的内容。打印出来的是 version 的哈希，每行一个——不计算号，因为号
