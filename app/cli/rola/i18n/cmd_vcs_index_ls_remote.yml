  str_help:
    en: |
        List the hashes of the text objects the index at the other end holds

        **Usage**: `rola vcs-index ls-remote-str [VAULT] [--json]`

        It is `rola vcs-index ls-str` asked of the other end: where that lists the text objects the
        index the run is inside holds, this reaches the Vault and lists what *its* index holds. What
        is printed is those hashes, one per line, so a line read here is one to hand to
        `rola vcs-index read-remote`, which reads the text itself.

        `VAULT` names the Vault to reach, as `rola vcs-index sync-all` reads it, with none naming the
        one the Workspace reaches for by default. Nothing changes — the Vault is asked and answers.
    zh-CN: |
        列出对端索引中文本对象的哈希

        **用法**：`rola vcs-index ls-remote-str [VAULT] [--json]`

        即 `rola vcs-index ls-str` 问向对端：那条命令列出本次运行所在索引持有的文本对象，而这条连上
        保险库、列出**它**的索引持有的内容。打印出来的是这些哈希，每行一个，因此这里读到的一行可以直接
        交给 `rola vcs-index read-remote`，由它读取文本本身。

        `VAULT` 指向要连接的保险库，读法与 `rola vcs-index sync-all` 相同；不填则用工作区默认的那个。
        什么都不改变——只是询问保险库并得到回答。

  str_description:
    en: List the hashes of the text objects the index at the other end holds
    zh-CN: 列出对端索引中文本对象的哈希
