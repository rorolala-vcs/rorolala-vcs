        `rola vcs-index read-remote`, which reads the version and traces its number there.

        `VAULT` names the Vault to reach, as `rola vcs-index sync-all` reads it, with none naming the
        one the Workspace reaches for by default. Nothing changes — the Vault is asked and answers.
    zh-CN: |
