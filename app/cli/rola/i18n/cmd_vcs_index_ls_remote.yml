_version: 2

vcs_index_ls_remote:
  variants_help:
    en: |
        List the variants the index at the other end holds

        **Usage**: `rola vcs-index ls-remote-variants [VAULT]`
        **Flags**:
            --json    Output as JSON

        List on the Vault the variant hashes its index holds, one per line, the numbers are not worked out
        `[VAULT]` names the Vault to reach, and with none given, the Vault the Workspace uses by default
        The command only reads and changes nothing
    zh-CN: |
        列出对端索引持有的变体

        **用法**：rola vcs-index ls-remote-variants [保险库]
        **标识**：
            --json    以 JSON 输出

        在保险库上列出其索引持有的变体哈希，每行一个，不计算号
        `[保险库]` 指定要连接的保险库，不填时用工作区默认的保险库
        该命令只读取，不做改动

  variants_description:
    en: List the variants the index at the other end holds
    zh-CN: 列出对端索引持有的变体

  versions_help:
    en: |
        List the versions the index at the other end holds

        **Usage**: `rola vcs-index ls-remote-versions [VAULT]`
        **Flags**:
