_version: 2

vault:
  help:
    en: |
        List the Vaults this Workspace knows

        **Usage**: `rola vault`

        **Commands**
            bind <NAME> <ADDR>   Bind a name to a Vault address, or change what it means
            unbind <NAME>        Let a name go
            set-default <NAME>   Choose the Vault the Workspace reaches for
            handshake [VAULT]    Speak the handshake action to a Vault daemon

        The names are the Workspace's own: the same Vault may be `origin` here and something
        else elsewhere. Each one is printed as its name and the address it answers at, in
        name order, and the one reached for by default is marked `(current)`.
    zh-CN: |
        列出当前工作区已知的保险库

        **用法**：`rola vault`

        **命令**
            bind <NAME> <ADDR>   将名字绑定到保险库地址，或修改其含义
            unbind <NAME>        解除名字的绑定
            set-default <NAME>   选择工作区默认使用的保险库
            handshake [VAULT]    向保险库守护进程发起握手

        名字属于工作区自身：同一个保险库在这里叫 `origin`，在别处可能另有其名。
        每个绑定按名字排序，依次输出名字与它对应的地址，默认使用的那个会标上 `（当前）`。

  cmd_vault_description:
    en: List the Vaults this Workspace knows
    zh-CN: 列出当前工作区已知的保险库

  result_none:
    en: No Vault is bound
    zh-CN: 尚未绑定任何保险库

  result_current:
    en: "%{vault} (current)"
    zh-CN: "%{vault}（当前）"
