_version: 2

sync:
  complete:
    up_only:
      en: Only what the local Layout holds goes up, which needs the Layout
      zh-CN: 只上传本地布局的内容，需要读取布局
    down_only:
      en: Only what the Vault holds comes down, which needs the Layout
      zh-CN: 只下拉保险库的内容，需要读取布局
    both:
      en: Sync in both directions
      zh-CN: 双向同步
    dry_run:
      en: Show the plan and change nothing
      zh-CN: 只显示计划，不做任何改动
    no_index:
      en: Leave the index alone; only the Layout and the store move
      zh-CN: 不动索引，只移动布局和仓库
    no_storage:
      en: Leave the store alone; only the Layout and the index move
      zh-CN: 不动仓库，只移动布局和索引
    no_layout:
      en: Leave the Vault's Layout alone; exchange the index and upload the store
      zh-CN: 不动保险库的布局，只双向交换索引并上传存储
  help:
    en: |
        Bring the local Layout and the Vault it tracks into agreement

        **Usage**: rola sync
        **Flags**:
            --up-only            Only what the local Layout holds goes up; cannot be used with --no-layout
            --down-only          Only what the Vault holds comes down; cannot be used with --no-layout
            --both               Sync in both directions, the default when no direction is given

            --dry-run            Show the plan and change nothing
            --no-index           Leave the index alone; only the Layout and the store move
            --no-storage         Leave the store alone; only the Layout and the index move
            --no-layout          Do not read or write the Vault's Layout; exchange the index both ways and upload storage
            --force              Go on uploading when the version chain has moved apart
            --concurrency <N>    Carry the content N units at a time (default 4)

        Bring the local Layout and the Vault it tracks into agreement
        The Vault is named by the Layout's `TRACK`, and the Workspace binds it first
        The run first fetches what the Vault holds now, then moves by the plan: a `Uuid` only the local side holds goes up, and the side that is behind is updated
        A file changed here that the Vault is ahead on is refused, so it is never overwritten
        --no-layout makes no plan and fetches nothing: the index is exchanged both ways and the stored content is uploaded, and a direction is refused beside it
    zh-CN: |
        让本地布局与它所追踪的保险库保持一致

        **用法**：rola sync
        **标识**：
            --up-only            只上传本地布局持有的内容；不能与 --no-layout 同用
            --down-only          只下拉保险库持有的内容；不能与 --no-layout 同用
            --both               双向同步，未指定方向时即此

            --dry-run            只显示计划，不做任何改动
            --no-index           不动索引，只移动布局和仓库
            --no-storage         不动仓库，只移动布局和索引
            --no-layout          不读写保险库布局；索引双向交换，存储只上传
            --force              版本链已分叉时仍然上传
            --concurrency <N>    每次同时搬运 N 份内容（默认 4）

        让本地布局与它所追踪的保险库保持一致
        保险库由布局的 `TRACK` 指定，须先由工作区绑定
        运行先取回保险库的当前内容，再按计划移动：本地独有的 `Uuid` 上传，落后的一端被更新
        本地已改动而保险库更前的文件会被拒绝，避免被覆盖
        --no-layout 不读取布局也不取回：索引双向交换、存储内容上传，且不能同时指定方向

  description:
    en: Bring the local Layout and the Vault it tracks into agreement
    zh-CN: 让本地布局与追踪的保险库保持一致

  err_no_track:
    en: The current Layout tracks no Vault
    zh-CN: 当前布局没有追踪任何保险库

  err_no_track_help:
    en: |
        Please name one with `rola layout set-track <LAYOUT> [VAULT]`, then try again
    zh-CN: |
        请用 `rola layout set-track <布局> <保险库>` 指定后再次运行该命令

  err_blocked:
    en: A file changed here is behind the Vault, so bringing the Vault's version down would overwrite it
    zh-CN: 有文件在本地被改动且落后于保险库，下拉保险库的版本会覆盖它

  err_blocked_help:
    en: |
        Please record the change with `rola track`, or set it aside, then try again
        Merging semantics are not implemented yet
    zh-CN: |
        请用 `rola track` 记录该改动，或将其放到一边，然后重试
        合并语义尚未实现

  err_failed:
    en: "The sync could not go on: %{cause}"
    zh-CN: "同步无法继续：%{cause}"

  err_failed_help:
    en: |
        Please check the Vault is reachable and the account is bound, then try again
    zh-CN: |
        请检查保险库是否可达、账户是否已绑定，然后重试

  err_argument:
    en: "`rola sync` was given arguments it cannot use"
    zh-CN: "`rola sync` 收到了无法使用的参数"

  err_argument_help:
    en: |
        Name at most one of `--up-only`, `--down-only`, and `--both`
    zh-CN: |
        请只给出 `--up-only`、`--down-only`、`--both` 中的一个

  err_no_layout_direction:
    en: "`--no-layout` cannot be used with `--up-only` or `--down-only`"
    zh-CN: "`--no-layout` 不能与 `--up-only` 或 `--down-only` 同时使用"

  err_no_layout_direction_help:
    en: |
        A run that reads no Layout has no plan for a direction to narrow: it exchanges the index both ways and uploads the stored content
        Leave out the direction, or carry the Layout by dropping `--no-layout`
    zh-CN: |
        不读布局的运行没有可缩小的方向计划：它双向交换索引，并上传存储内容
        请去掉方向标识，或去掉 `--no-layout` 以同步布局

  write_written:
    en: written
    zh-CN: 已写入

  write_exists:
    en: the Vault already holds an entry by that uuid
    zh-CN: 保险库已有该 uuid 的条目

  write_taken:
    en: the path already names something
    zh-CN: 该路径已被占用

  write_missing:
    en: the Vault holds no entry by that uuid
    zh-CN: 保险库没有该 uuid 的条目

  write_refused:
    en: held by another account
    zh-CN: 由其他账户持有

  write_force:
    en: the versions moved apart; `--force` is needed
    zh-CN: 版本链已分叉，需要 `--force`

  write_malformed:
    en: the name does not read
    zh-CN: 名称无法解读

  write_no_content:
    en: the content this version names is not here
    zh-CN: 本地没有该版本所指向的内容

  result_summary:
    en: "%{planned} to move, %{up_to_date} already at the Vault's version"
    zh-CN: "待移动 %{planned} 项，已有 %{up_to_date} 项与保险库同为当前版本"

  plan_no_layout:
    en: "The Vault's Layout was not read: the index is exchanged both ways and the store is uploaded"
    zh-CN: "未读取保险库布局：索引双向交换，存储只上传"

  plan_no_layout_index:
    en: "The Vault's Layout was not read and the store is left alone: the index is exchanged both ways"
    zh-CN: "未读取保险库布局，也不动存储：只双向交换索引"

  plan_no_layout_storage:
    en: "The Vault's Layout was not read and the index is left alone: the store is uploaded"
    zh-CN: "未读取保险库布局，也不动索引：只上传存储"

  plan_no_layout_nothing:
    en: "The Vault's Layout, the index and the store are all left behind: this run would move nothing"
    zh-CN: "保险库布局、索引和存储都不动：这次运行什么也不会搬"

  done_summary:
    en: "%{applied} written, %{received} brought down, %{up_to_date} already there, %{failed} not done"
    zh-CN: "已写入 %{applied} 项，已下拉 %{received} 项，本已同步 %{up_to_date} 项，未完成 %{failed} 项"

  done_no_layout:
    en: "index %{index} / storage %{storage} moved, %{failed} not done"
    zh-CN: "索引搬运 %{index} 项 / 存储搬运 %{storage} 项，未完成 %{failed} 项"

  warn_layout_not_fetched:
    en: "The Vault's Layout was not fetched: readings still use the copy from the last fetch"
    zh-CN: "未取回保险库的布局：读取仍使用上次取回的副本"

  warn_blocked:
    en: A file changed here is behind the Vault, so nothing would be brought down
    zh-CN: 有文件在本地被改动且落后于保险库，因此不会下拉任何内容

  warn_blocked_help:
    en: |
        Please record the change with `rola track`, or set it aside, then try again
        Merging semantics are not implemented yet
    zh-CN: |
        请用 `rola track` 记录该改动，或将其放到一边，然后重试
        合并语义尚未实现
