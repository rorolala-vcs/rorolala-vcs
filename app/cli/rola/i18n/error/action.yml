_version: 2

error:
  action:
    err_no_channel:
      en: The action had no channel to exchange over
      zh-CN: 该动作没有可用于交换的通道

    err_no_channel_help:
      en: |
        This is a fault in the program rather than in what was asked for
        Please report this
      zh-CN: |
        这是程序自身的问题，而不是所请求的内容有问题
        请反馈这个情况

    err_missing_value:
      en: The side holding the value had no value to send
      zh-CN: 持有值的一侧没有可发送的值

    err_missing_value_help:
      en: |
        This is a fault in the program rather than in what was asked for
        Please report this
      zh-CN: |
        这是程序自身的问题，而不是所请求的内容有问题
        请反馈这个情况

    err_missing_object:
      en: Neither side holds an object the exchange needs
      zh-CN: 交易所需要的对象两侧都没有

    err_missing_object_help:
      en: |
        Please check that the side asking for the key really holds it
      zh-CN: |
        请确认索要该 key 的一方确实持有它

    err_not_confirmed:
      en: The side that took it could not produce it again
      zh-CN: 接收方无法再次产出刚收到的内容

    err_not_confirmed_help:
      en: |
        What crossed was written, but reading it back did not work
        Please check the Vault's store and the disk it sits on
      zh-CN: |
        内容已经写出，但读回来时失败了
        请检查保险库的存储与其所在的磁盘

    err_store:
      en: The store failed — %{reason}
      zh-CN: 仓库失败 —— %{reason}

    err_store_help:
      en: |
        Please check that the store can be read and written, then try again
      zh-CN: |
        请确认仓库可读可写，然后重试

    err_local_file:
      en: A file could not be read or written — %{reason}
      zh-CN: 文件读写失败 —— %{reason}

    err_local_file_help:
      en: |
        Please check that the path can be read and written, then try again
      zh-CN: |
        请确认该路径可读可写，然后重试

    err_value_too_large:
      en: The value to send is too long to fit in a frame
      zh-CN: 要发送的值太长，放不下一帧

    err_value_too_large_help:
      en: |
        Please send less at a time, or raise the frame size both sides agree on
      zh-CN: |
        请减少一次发送的内容，或提高两侧约定的帧大小

    err_io:
      en: The channel failed — %{reason}
      zh-CN: 通道失败 —— %{reason}

    err_io_help:
      en: |
        Please check that the daemon is still running and reachable, then try again
      zh-CN: |
        请确认守护进程仍在运行且可达，然后重试

    err_codec:
      en: A value could not cross the channel — %{reason}
      zh-CN: 有值无法通过通道 —— %{reason}

    err_codec_help:
      en: |
        The two sides disagree about what is on the wire
        Please check that both are the same build
      zh-CN: |
        两侧对线上内容的约定不一致
        请确认双方是同一个构建

    err_unknown_action:
      en: No action responds to id %{id}
      zh-CN: 没有动作响应编号 %{id}

    err_unknown_action_help:
      en: |
        Please check that the daemon serves the action being asked for
      zh-CN: |
        请确认守护进程提供所请求的动作

    err_json:
      en: The action's output could not be encoded — %{reason}
      zh-CN: 动作的输出无法编码 —— %{reason}

    err_json_help:
      en: |
        This is a fault in the program rather than in what was asked for
        Please report this
      zh-CN: |
        这是程序自身的问题，而不是所请求的内容有问题
        请反馈这个情况

    err_addr:
      en: "`%{target}` is not an IP"
      zh-CN: "`%{target}` 不是 IP"

    err_addr_help:
      en: |
        Please write it as an IP, such as `127.0.0.1` or `127.0.0.1:7717`
      zh-CN: |
        请写成 IP，例如 `127.0.0.1` 或 `127.0.0.1:7717`

    err_auth:
      en: The session could not be established — %{reason}
      zh-CN: 无法建立会话 —— %{reason}

    err_auth_help:
      en: |
        Please check that the keys can be read, and that the daemon already counts the account's public key as a member
      zh-CN: |
        请确认密钥可读，且守护进程已把该账户的公钥认作成员
