_version: 2

error:
  placement:
    err_should_in_workspace:
      en: This command works on a Workspace, and this run is not inside one
      zh-CN: 该命令需要在工作区中运行，而当前不在任何工作区内

    err_should_in_workspace_help:
      en: Run it inside a Workspace, which `rola create <PATH>` makes or `--workspace-dir <PATH>` names
      zh-CN: 请在工作区内运行，可用 `rola create <路径>` 创建，或用 `--workspace-dir <路径>` 指定已有的

    err_should_in_vault:
      en: This command works on a Vault, and this run is not inside one
      zh-CN: 该命令需要在保险库中运行，而当前不在任何保险库内

    err_should_in_vault_help:
      en: Run it inside a Vault, which `rola create --vault <PATH>` makes or `--vault-dir <PATH>` names
      zh-CN: 请在保险库内运行，可用 `rola create --vault <路径>` 创建，或用 `--vault-dir <路径>` 指定已有的

    err_config_unreadable:
      en: "Could not read the Workspace configuration: %{path}"
      zh-CN: 无法读取工作区配置：%{path}

    err_config_unreadable_help:
      en: "Please fix the file and try again: \"%{reason}\""
      zh-CN: "请修复该文件后重试：“%{reason}”"

    err_not_chosen:
      en: No Vault was named to connect to, and the Workspace has no default choice
      zh-CN: 未给出要连接的保险库，工作区也没有默认选择

    err_not_chosen_help:
      en: Name the Vault, as in `rola vault handshake origin`, or choose a default with `rola vault set-default <NAME>`
      zh-CN: 请给出保险库名或地址，例如 `rola vault handshake origin`，或用 `rola vault set-default <名字>` 选定默认保险库

    err_not_address:
      en: "`%{name}` is not a Vault this Workspace knows, nor an address"
      zh-CN: "`%{name}` 既不是本工作区已知的保险库，也不是一个地址"

    err_not_address_help:
      en: |
        Please give the name of a Vault bound with `rola vault bind`, or write an address such as `127.0.0.1:7717` or `rola://127.0.0.1/alpha`
      zh-CN: |
        请给出已用 `rola vault bind` 绑定的保险库名字，或写成地址，例如 `127.0.0.1:7717` 或 `rola://127.0.0.1/alpha`

    err_not_bound:
      en: "`%{name}` is not a Vault this Workspace has bound"
      zh-CN: "`%{name}` 不是本工作区已绑定的保险库"

    err_not_bound_help:
      en: |
        This command keeps what it fetches under the Vault's name, so it needs a name bound with `rola vault bind`, not an address
      zh-CN: |
        该命令把取回的内容按保险库的名字存放，因此需要一个已用 `rola vault bind` 绑定的名字，而不是地址
