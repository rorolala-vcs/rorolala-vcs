_version: 2

error:
  placement:
    err_should_in_workspace:
      en: This command works on a Workspace, and this run is not inside one
      zh-CN: 该命令需要在工作区中运行，而当前不在任何工作区内

    err_should_in_workspace_help:
      en: |
        Please run it inside one — `rola create <PATH>` makes a Workspace, and
        `--workspace-dir <PATH>` works in one that is already there
      zh-CN: |
        请在某个工作区内运行 —— `rola create <PATH>` 可以创建工作区，
        `--workspace-dir <PATH>` 可以指定已有的工作区

    err_should_in_vault:
      en: This command works on a Vault, and this run is not inside one
      zh-CN: 该命令需要在保险库中运行，而当前不在任何保险库内

    err_should_in_vault_help:
      en: |
        Please run it inside one — `rola create --vault <PATH>` makes a Vault, and
        `--vault-dir <PATH>` works in one that is already there
      zh-CN: |
        请在某个保险库内运行 —— `rola create --vault <PATH>` 可以创建保险库，
        `--vault-dir <PATH>` 可以指定已有的保险库

    err_config_unreadable:
      en: Could not read the Workspace configuration at %{path}
      zh-CN: 无法读取工作区配置：%{path}

    err_config_unreadable_help:
      en: Please fix the file and try again — %{reason}
      zh-CN: 请修复该文件后重试 —— %{reason}

    err_not_chosen:
      en: No Vault was named to reach for, and the Workspace reaches for none
      zh-CN: 未给出要连接的保险库，工作区也没有默认选择

    err_not_chosen_help:
      en: |
        Please name one, as in `rola tool-handshake origin` or `rola tool-handshake
        127.0.0.1:7717`, or run `rola vault set-default <NAME>` to choose a Vault for the
        Workspace to reach for without naming it every time
      zh-CN: |
        请给出名字或地址，例如 `rola tool-handshake origin` 或 `rola tool-handshake 127.0.0.1:7717`；
        也可以运行 `rola vault set-default <NAME>` 为工作区选定默认保险库，以后就不必每次指定

    err_not_address:
      en: "`%{name}` is not a Vault this Workspace knows, nor an address"
      zh-CN: "`%{name}` 既不是本工作区已知的保险库，也不是一个地址"

    err_not_address_help:
      en: |
        Please name a Vault the Workspace has bound with `rola vault bind`, or write an
        address such as `127.0.0.1:7717` or `rola://127.0.0.1/alpha`
      zh-CN: |
        请给出已用 `rola vault bind` 绑定的保险库名字，或写成地址，例如
        `127.0.0.1:7717` 或 `rola://127.0.0.1/alpha`
