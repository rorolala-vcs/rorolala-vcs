_version: 2

collapse:
  help:
    en: |
      # Fold the local versions above the tracked Vault's version into one
      **Usage**: rola [[GREEN]]__collapse__[[/]] <path...> [target]
      A target may be given only when one path is named.
      **Flags**:
           __--keep-join__             Keep the merge versions in the range as separate versions
           __--keep__       <TARGET>   Keep a version from being folded, and repeatable
           __--offline__               Do not connect to the vault; use only existing local content and versions
           __--concurrency__ <N>       Transfer N pieces of content at a time (default 4)
    zh-CN: |
      # 把所追踪保险库版本之上的本地版本折成一个
      **用法**：rola [[GREEN]]__collapse__[[/]] <路径...> [目标]
      只有指定一个路径时才能给出目标。
      **标识**：
           __--keep-join__             把范围内的合并版本保留为独立版本
           __--keep__       <目标>     保留某个版本，不参与折叠，可重复
           __--offline__               不连接保险库，只使用本地已有的内容与版本
           __--concurrency__ <N>       每次同时搬运 N 份内容（默认 4）

  complete:
    keep:
      en: Keep a version from being folded
      zh-CN: 保留某个版本，不参与折叠
    keep_join:
      en: Keep the merge versions in the range as separate versions
      zh-CN: 把范围内的合并版本保留为独立版本

  description:
    en: Fold the local versions above the tracked Vault's version into one, keeping the content of the top
    zh-CN: 把所追踪保险库版本之上的本地版本折成一个，保留顶端版本的内容

  result:
    en: "Collapsed `%{file}`: `%{from}` became `%{to}`, %{count} versions folded"
    zh-CN: "已折叠 `%{file}`：`%{from}` 变为 `%{to}`，折入 %{count} 个版本"

  err_no_file:
    en: Please name the files whose local versions are to be folded
    zh-CN: 请指定要折叠本地版本的文件

  err_no_file_help:
    en: Please name one or more paths, see `rola collapse --help` for usage
    zh-CN: 请指定一个或多个路径，用法见 `rola collapse --help`

  err_target_many_files:
    en: "A target may be given only when one path is named, but %{count} paths were named"
    zh-CN: "只有指定一个路径时才能给出目标，却指定了 %{count} 个路径"

  err_target_many_files_help:
    en: Please name one path to fold a part of its chain, or leave the target out to fold every path
    zh-CN: 请只指定一个路径来折叠它的一部分链，或去掉目标来折叠每个路径

  err_nothing:
    en: "`%{file}` has no local version above the version the tracked Vault records"
    zh-CN: "`%{file}` 在所追踪保险库记录的版本之上没有本地版本"

  err_nothing_help:
    en: Please record a local version with `rola track` before folding it
    zh-CN: 请先用 `rola track` 记录一个本地版本，再折叠它

  err_not_local:
    en: "`%{file}` is not a local path of this Workspace"
    zh-CN: "`%{file}` 不是本工作区的本地路径"

  err_not_local_help:
    en: Please name a path inside this Workspace, the way `rola track` takes one
    zh-CN: 请指定本工作区内的路径，与 `rola track` 接受的一样

  err_not_recorded:
    en: "`%{file}` is not recorded in the Layout"
    zh-CN: "`%{file}` 没有被布局记录"

  err_not_recorded_help:
    en: Please record it with `rola track` first
    zh-CN: 请先用 `rola track` 记录它

  err_no_chain:
    en: The version `%{file}` records is not the top of a chain
    zh-CN: "`%{file}` 记录的版本不是一条链的顶端"

  err_no_chain_help:
    en: Please run `rola fsck` to check the index
    zh-CN: 请运行 `rola fsck` 检查索引

  err_merging:
    en: "`%{file}` has the variant `%{variant}` waiting to be joined into it"
    zh-CN: "`%{file}` 有变体 `%{variant}` 等待合并进来"

  err_merging_help:
    en: Please finish or end the merge with `rola track` before folding the chain
    zh-CN: 请先用 `rola track` 完成或结束这次合并，再折叠版本链

  err_target_none:
    en: Nothing on the chain of `%{file}` matches "%{target}"
    zh-CN: 在 `%{file}` 的链上没有找到 “%{target}”

  err_target_none_help:
    en: Please name a version hash, a variant hash, `~N`, or text of one creator or message
    zh-CN: 请给出至少 4 位的版本哈希、变体哈希、`~N`，或某个作者或描述的文本

  err_target_many:
    en: '"%{target}" matches %{count} versions of `%{file}`'
    zh-CN: "“%{target}” 命中了 `%{file}` 的 %{count} 个版本"

  err_target_many_help:
    en: Please narrow the target with a hash or a number of steps
    zh-CN: 请用哈希或回溯步数把目标写得更精确

  err_target_other:
    en: "`%{target}` belongs to another entry's chain"
    zh-CN: "`%{target}` 属于别的条目的链"

  err_target_other_help:
    en: Please name a version or a variant of the chain `%{file}` records
    zh-CN: 请给出 `%{file}` 所记录的那条链上的版本或变体

  err_failed:
    en: "Folding `%{file}` failed: %{cause}"
    zh-CN: "折叠 `%{file}` 失败：%{cause}"

  err_failed_help:
    en: Please check that the Layout and the index are writable, then try again
    zh-CN: 请检查布局与索引是否可写，然后重试
