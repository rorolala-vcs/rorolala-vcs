_version: 2

exit_codes:
  already_exist:
    en: The resource is already there
    zh-CN: 资源已存在

  not_exist:
    en: The resource is not there
    zh-CN: 资源不存在

  unknown_command:
    en: The run named a command the program does not have
    zh-CN: 本次运行给出的命令不属于本程序

  help:
    en: Help was asked for
    zh-CN: 请求了帮助

  cancelled:
    en: The run was cancelled before it did anything
    zh-CN: 本次运行在动手之前被取消

  creation_workspace:
    en: A Workspace could not be created
    zh-CN: 无法创建工作区

  creation_vault:
    en: A Vault could not be created
    zh-CN: 无法创建保险库

  creation_argument:
    en: "A `rola create` command was given arguments it cannot use"
    zh-CN: "`rola create` 收到了无法使用的参数"

  keygen_no_openssl:
    en: "`openssl` could not be run"
    zh-CN: 无法运行 `openssl`

  keygen_failed:
    en: "`openssl` ran but did not produce a key"
    zh-CN: "`openssl` 已运行，但未生成密钥"

  keygen_no_key_dir:
    en: "`--install` could not find the user's key directory"
    zh-CN: "`--install` 无法找到用户密钥目录"

  keygen_install_failed:
    en: The directory a key pair was to be installed into could not be created
    zh-CN: 无法创建用于安装密钥对的目录

  key_argument:
    en: "A `rola key` command was given arguments it cannot use"
    zh-CN: "`rola key` 收到了无法使用的参数"

  storage_write_file_argument:
    en: "A `rola storage write-file` command was given arguments it cannot use"
    zh-CN: "`rola storage write-file` 收到了无法使用的参数"

  storage_write_file_no_storage:
    en: This run is nowhere a store is
    zh-CN: 当前运行不处于任何仓库中

  storage_write_file_not_a_file:
    en: The path named is not a file
    zh-CN: 指定的路径不是文件

  storage_write_file_failed:
    en: The store would not take the content of a file
    zh-CN: 仓库未能接收某文件的内容

  storage_extract_file_argument:
    en: "A `rola storage extract-file` command was given arguments it cannot use"
    zh-CN: "`rola storage extract-file` 收到了无法使用的参数"

  storage_extract_file_no_storage:
    en: This run is nowhere a store is
    zh-CN: 当前运行不处于任何仓库中

  storage_extract_file_bad_hash:
    en: What was named does not read as a hash
    zh-CN: 指定的内容不是合法的哈希

  storage_extract_file_exists:
    en: A file is already under the name the content would be written as
    zh-CN: 内容将要写出的名字下已有文件

  storage_extract_file_failed:
    en: Stored content could not be written out
    zh-CN: 无法将存储的内容写出

  pack_no_storage:
    en: This run is nowhere a store or an index is
    zh-CN: 当前运行不处于任何仓库或索引中

  pack_failed:
    en: "The store's objects could not be packed"
    zh-CN: 无法打包仓库中的对象

  pack_locked:
    en: The store is locked
    zh-CN: 仓库已被锁定

  pack_nothing_to_pack:
    en: Nothing was named to pack
    zh-CN: 没有指定要整理的对象

  vcs_index_no_index:
    en: This run is nowhere a version control index is
    zh-CN: 当前运行不处于任何版本控制索引中

  vcs_index_read:
    en: The version control index could not be read
    zh-CN: 无法读取版本控制索引

  vcs_index_write:
    en: The version control index could not be written
    zh-CN: 无法写入版本控制索引

  vcs_index_argument:
    en: An argument the command needs is missing or does not read
    zh-CN: 缺少命令所需的参数，或参数无法解析

  vcs_index_not_found:
    en: What the command looked for is not in the version control index
    zh-CN: 命令要查找的对象不在版本控制索引中

  inv_idx_no_index:
    en: This run is nowhere a version control index is
    zh-CN: 当前运行不处于任何版本控制索引中

  inv_idx_read:
    en: The inverse index could not be built or read
    zh-CN: 无法建立或读取反向索引

  inv_idx_argument:
    en: An argument the command needs is missing or does not read
    zh-CN: 缺少命令所需的参数，或参数无法解析

  inv_idx_not_found:
    en: What the command looked for is not in the version control index
    zh-CN: 命令要查找的对象不在版本控制索引中

  storage_ls_storaged_no_storage:
    en: This run is nowhere a store is
    zh-CN: 当前运行不处于任何仓库中

  storage_ls_storaged_failed:
    en: "The store's objects could not be listed"
    zh-CN: 无法列出仓库中的对象

  storage_ls_manifests_no_storage:
    en: This run is nowhere a store is
    zh-CN: 当前运行不处于任何仓库中

  storage_ls_manifests_failed:
    en: "The store's manifests could not be listed"
    zh-CN: 无法列出仓库中的 manifest

  config_unreadable:
    en: The configuration the run works from could not be read
    zh-CN: 无法读取本次运行所依据的配置

  vault_argument:
    en: "A `rola vault` command was given arguments it cannot use"
    zh-CN: "`rola vault` 收到了无法使用的参数"

  vault_not_bound:
    en: "The name a `rola vault unbind` was given is not bound"
    zh-CN: "`rola vault unbind` 得到的名字并未绑定"

  vault_not_admin:
    en: The account is not an administrator of the Vault
    zh-CN: 该账户不是保险库的管理员

  account_not_found:
    en: The name given is not an account the work can act as
    zh-CN: 所给名字不是可作为身份使用的账户

  account_no_dir:
    en: The machine does not name where Rorolala keeps the user's files
    zh-CN: 本机未指明 Rorolala 存放用户文件的位置

  account_not_bound:
    en: The work acts as no account, which the command needs
    zh-CN: 尚未指定身份，而该命令需要

  should_in_workspace:
    en: The run is not inside a Workspace, which the command needs
    zh-CN: 本次运行不在任何工作区内，而该命令需要

  should_in_vault:
    en: The run is not inside a Vault, which the command needs
    zh-CN: 本次运行不在任何保险库内，而该命令需要

  no_remote_vault:
    en: The run has no Vault to reach for
    zh-CN: 本次运行没有可连接的保险库

  action_no_channel:
    en: An action had no channel to exchange over
    zh-CN: 动作没有可用于交换的通道

  action_missing_value:
    en: The side that owned a value held none to send
    zh-CN: 持有值的一方没有可发送的内容

  action_missing_object:
    en: An object the exchange needed is held by neither side
    zh-CN: 交易所需要的对象两侧都没有

  action_store:
    en: A store on one side failed while the exchange was being made
    zh-CN: 交换过程中一方的仓库失败

  action_value_too_large:
    en: A value was too long to frame
    zh-CN: 值过长，无法装帧

  action_io:
    en: The channel failed
    zh-CN: 通道失败

  action_codec:
    en: A value could not cross the channel
    zh-CN: 值无法通过通道

  action_unknown:
    en: No action answers to the id asked for
    zh-CN: 没有动作响应所请求的 id

  action_json:
    en: What an action produced would not encode
    zh-CN: 动作产生的值无法编码

  action_addr:
    en: A target would not read as an address
    zh-CN: 目标无法解析为地址

  action_auth:
    en: A session could not be established
    zh-CN: 无法建立会话

  explain_unknown:
    en: The exit code asked about is not one the program states
    zh-CN: 所询问的退出码不是本程序声明的

  explain_no_lastec:
    en: No exit code was recorded to explain
    zh-CN: 没有可供解释的历史退出码

  desktop_not_found:
    en: There is no Desktop program beside the program that was run
    zh-CN: 所运行的程序旁边没有桌面程序

  desktop_launch_failed:
    en: The Desktop program would not start
    zh-CN: 桌面程序无法启动

  desktop_ended:
    en: The Desktop program ended without an exit code of its own
    zh-CN: 桌面程序未给出自己的退出码就结束了

  fs_ops_argument:
    en: A file operation was named without the paths it works on
    zh-CN: 文件操作缺少它所作用的路径

  fs_ops_failed:
    en: The filesystem refused the operation
    zh-CN: 文件系统拒绝了该操作

  format:
    en: "The result could not be drawn through --format"
    zh-CN: "无法用 --format 绘制结果"

  layout:
    en: A layout could not be worked on
    zh-CN: 无法对布局进行操作

  layout_argument:
    en: "A `rola layout` command was given arguments it cannot use"
    zh-CN: "`rola layout` 收到了无法使用的参数"

  layout_not_cached:
    en: The Vault's Layout has not been fetched, or holds no such entry
    zh-CN: 尚未取回该保险库的布局，或该布局中没有此条目

  layout_ownership:
    en: An entry's ownership could not be taken or let go of
    zh-CN: 无法取得或放弃某个条目的所有权

  track:
    en: A file could not be recorded in the Layout
    zh-CN: 无法将文件记入布局

  track_argument:
    en: "`rola track` was given arguments it cannot use"
    zh-CN: "`rola track` 收到了无法使用的参数"

  track_ownership:
    en: A file the Vault says another account holds was not recorded
    zh-CN: 保险库显示属于其他账户的文件没有被记录

  editor:
    en: A message could not be written
    zh-CN: 无法撰写提交信息

  abort:
    en: The run was stopped without recording anything
    zh-CN: 本次运行已中止，未记录任何内容

  align:
    en: The tree could not be brought back into agreement with the Layout
    zh-CN: 无法让工作树与布局重新一致

  align_argument:
    en: "`rola align` was given arguments it cannot use"
    zh-CN: "`rola align` 收到了无法使用的参数"

  sync:
    en: A Layout could not be synced with the Vault it tracks
    zh-CN: 无法让布局与它所追踪的保险库同步

  sync_argument:
    en: "`rola sync` was given arguments it cannot use"
    zh-CN: "`rola sync` 收到了无法使用的参数"

  checkin:
    en: A `Uuid` the Vault holds could not be brought into the Layout
    zh-CN: 无法把保险库持有的 `Uuid` 带入布局

  checkin_argument:
    en: "`rola checkin` was given arguments it cannot use"
    zh-CN: "`rola checkin` 收到了无法使用的参数"

  retrack:
    en: A file's version pointer could not be moved back
    zh-CN: 无法回退文件的版本指针

  retrack_argument:
    en: "`rola retrack` was given arguments it cannot use"
    zh-CN: "`rola retrack` 收到了无法使用的参数"

  offline:
    en: The run was asked to reach no Vault, and what it asked for needs one
    zh-CN: 本次运行被要求不连接保险库，而它请求的操作需要保险库
