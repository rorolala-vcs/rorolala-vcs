_version: 2

storage:
  help:
    en: |
        Read and write the content a store holds, by hand

        **Usage**: `rola storage <COMMAND>`

        **Commands**
            write-file <FILE>          Store a file's content, and print the hash it is kept under
            extract-file <HASH> [DIR]  Write stored content out under its hash
            ls-storaged                List every object the store holds
            ls-manifests               List every content the store keeps cut
            sync-all [VAULT]           Make the stores at both ends hold the same keys

        None of this is version control: it is what sits under it — the store the content is
        kept in, and what two ends say to each other before either moves anything. Each
        command does one of those and nothing else, so this is for looking at what a store
        holds, or for putting one in order, by hand.

        Nothing here is needed to use `rola`: a Vault and a Workspace keep stores of their own,
        and what they hold is read and written for you.
    zh-CN: |
        手工读写仓库持有的内容

        **用法**：`rola storage <命令>`

        **命令**
            write-file <FILE>          存储文件内容，并打印它所用的哈希
            extract-file <HASH> [DIR]  按哈希将存储的内容写出
            ls-storaged                列出仓库持有的全部对象
            ls-manifests               列出仓库中分块保存的全部内容
            sync-all [VAULT]           让两端的仓库持有相同的 key

        这些都不是版本控制，而是它底下那一层——存放内容的仓库，以及两端在搬运任何东西之前
        先交换的话语。每条子命令只做其中一件事，用于检视仓库里有什么，或手工整理它。

        使用 `rola` 并不需要这些命令：保险库和工作区各自持有仓库，其内容的存取都由程序代劳。

  cmd_storage_description:
    en: Read and write the content a store holds, by hand
    zh-CN: 手工读写仓库持有的内容
