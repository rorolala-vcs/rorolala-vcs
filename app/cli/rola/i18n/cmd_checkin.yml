_version: 2

checkin:
  help:
    en: |
        Bring what the Vault holds but this Layout does not into it

        **Usage**: `rola checkin <FROM>... [TO]` — or `rola checkin <VARIANT> --join <FILE> [PLACE]`

        The operands read the way `mv`'s do: every word but the last is what is to come in — a path
        in the Vault's Layout, a glob over those paths, or a `Uuid` — and the last, when there is
        more than one word, is where it is to land here.

        A glob is matched against the paths the Vault's Layout names, so `Installers/*` names what
        is directly under `Installers` there and `Installers/**` everything below it. An entry
        several references name is brought in once.

        With no `TO` each one lands at the path the Vault's Layout names it by, which has to be
        somewhere nothing is. A `TO` that is an existing directory takes each `FROM` under it by the
        name the Vault gives it; any other `TO` names the whole landing path, so it takes exactly
        one `FROM`.

        What a reference names has to be something this Layout does not already hold, and where it
        is to land has to be somewhere nothing is: a name this Layout already gives, or a file
        already at the path, is refused rather than written over.

        The version the Vault holds is what comes with it — its content is taken out of the store
        and put at the path — and what the Layout then says is that version and the holder the
        Vault names.

        With `--join`, what is checked in is a variant the index holds rather than a path of the
        Vault's Layout, and it is to be joined into a file this Layout names. The variant's content
        is written beside that file as a **variant file** waiting to be merged, and `rola track` on
        the file records the merge; `rola status` shows it as merging until then. A `PLACE` of the
        run's own says where the variant file lies, relative to the file it is for, and it moves
        with that file. The variant has to be based on a version of the file's own chain — one from a
        history the file does not share is refused unless `--force` is given.
    zh-CN: |
        把保险库持有、而当前布局没有的内容带入当前布局

        **用法**：`rola checkin <FROM>... [TO]`——或 `rola checkin <变体HASH> --join <文件> [位置]`

        位置参数按 `mv` 的方式读：最后一个是落点，前面的都是要带入的内容——保险库布局中的路径、
        对这些路径的通配，或一个 `Uuid`；只有一个词时它就是要带入的内容，没有落点。

        通配是对保险库布局里的路径做匹配：`Installers/*` 是 `Installers` 直接下面的内容，
        `Installers/**` 是它下面所有层级。被多个引用同时选中的条目只带入一次。

        不给 `TO` 时，每一条都落在保险库布局给它命名的路径上，那里必须是空的。`TO` 是已存在的
        目录时，每个 `FROM` 按保险库给出的名字落到该目录下；其他 `TO` 就是完整的落点路径，因此
        只能有一个 `FROM`。

        引用所指的内容必须是当前布局尚未持有的；落点也必须是空的：当前布局已经给出的名字，或
        路径上已存在的文件，都会被拒绝而不是覆盖。

        随之而来的是保险库持有的那个版本——其内容会从存储中取出并写到该路径——之后本地布局
        记录的就是这个版本以及保险库给出的持有者。

        加上 `--join` 时，签入的不是保险库布局中的路径，而是索引持有的一个变体，它要并入当前布局
        命名的某个文件。变体的内容会写到该文件旁边，成为一个等待合并的**变体文件**，随后对该文件
        执行 `rola track` 才会记下这次合并；在此之前 `rola status` 会显示为合并中。自选的 `位置`
        给出变体文件相对目标文件的落点，它会随目标文件一起移动。变体必须基于该文件版本链上的某一版
        ——来自该文件并不共享的历史会被拒绝，除非加上 `--force`。

  description:
    en: Bring what the Vault holds but this Layout does not into it
    zh-CN: 把保险库持有而当前布局没有的内容带入当前布局

  complete:
    join:
      en: Check a variant in to be joined into a file this Layout names
      zh-CN: 签入一个变体，等待并入当前布局命名的文件

  err_join:
    en: "a variant cannot be joined into `%{target}`: %{cause}"
    zh-CN: "无法把变体并入 `%{target}`：%{cause}"

  err_join_help:
    en: |
        Name a variant the index holds and a file this Layout names: `rola checkin <VARIANT> --join
        <FILE>`. The variant comes from wherever the index has it, and is joined in when the file is
        recorded with `rola track`
    zh-CN: |
        给出索引持有的变体，以及当前布局命名的文件：`rola checkin <变体HASH> --join <文件>`。变体来自
        索引持有它的地方，并在用 `rola track` 记录该文件时才真正并入

  err_join_hash:
    en: what was named is no variant hash
    zh-CN: 给出的不是变体哈希

  err_join_target:
    en: it is no path this Layout names
    zh-CN: 它不是当前布局命名的路径

  err_join_merging:
    en: a variant is already waiting to be joined into it
    zh-CN: 已经有一个变体正在等待并入它

  err_join_checked_in:
    en: that variant was already checked in
    zh-CN: 该变体已经签入过

  err_join_off_chain:
    en: it is not based on a version of this file's own chain — pass `--force` to join it anyway
    zh-CN: 它并非基于该文件版本链上的某一版——确需并入请加 `--force`

  err_join_chain:
    en: the file's version chain could not be read
    zh-CN: 无法读取该文件的版本链

  err_join_unknown:
    en: the index holds no such variant, and no Vault could be asked for it
    zh-CN: 索引中没有该变体，也未能向保险库取到

  err_join_no_track:
    en: the variant is not here, and the Layout being worked in tracks no Vault to ask
    zh-CN: 本地没有该变体，而当前使用的布局没有追踪可询问的保险库

  err_join_no_account:
    en: the variant is not here, and the run acts as no account to ask a Vault as
    zh-CN: 本地没有该变体，而本次运行没有可用于询问保险库的账户

  err_join_no_vault:
    en: the variant is not here, and the Vault the Layout tracks cannot be named
    zh-CN: 本地没有该变体，而无法指出布局所追踪的保险库

  err_join_no_store:
    en: this run has no store to write the content out of
    zh-CN: 本次运行没有可写出内容的存储

  err_join_place:
    en: nowhere here can hold a variant file
    zh-CN: 本地没有可以放置变体文件的位置

  err_join_taken:
    en: "something is already at `%{path}` here"
    zh-CN: "`%{path}` 在本地已经有内容了"

  joined:
    en: "`%{variant}` was checked in as `%{path}`, waiting to be joined into `%{target}`"
    zh-CN: "`%{variant}` 已签入为 `%{path}`，等待并入 `%{target}`"

  err_no_track:
    en: The Layout being worked in tracks no Vault
    zh-CN: 当前使用的布局没有追踪任何保险库

  err_no_track_help:
    en: |
        Please name one with `rola layout set-track <LAYOUT> <VAULT>`, then try again
    zh-CN: |
        请用 `rola layout set-track <LAYOUT> <VAULT>` 指定一个，然后重试

  err_argument:
    en: "`rola checkin` was given operands it cannot use"
    zh-CN: "`rola checkin` 收到的参数无法使用"

  err_argument_help:
    en: |
        Name what is to come in and, when it is to land elsewhere, a `TO` after it: one path for one
        reference, or an existing directory for several. A path outside the Workspace cannot be a
        destination
    zh-CN: |
        写出要带入的内容；若要落到别处，在最后写一个 `TO`：一个引用给一个路径，多个引用给一个
        已存在的目录。工作区之外的路径不能作为落点

  err_unknown:
    en: "The Vault's Layout names nothing by `%{reference}`"
    zh-CN: "保险库的布局中没有名为 `%{reference}` 的内容"

  err_unknown_help:
    en: |
        Run `rola sync --dry-run` to see what the Vault holds that is not here yet
    zh-CN: |
        运行 `rola sync --dry-run` 查看保险库还持有哪些本地没有的内容

  err_unnamed:
    en: "The Vault's Layout gives `%{uuid}` no path, so there is no name to land it under"
    zh-CN: "保险库的布局没有给 `%{uuid}` 路径，因此没有可用的落点名字"

  err_unnamed_help:
    en: |
        Name the whole path it is to land at with a `TO`; a directory is not enough, since there is
        no name to put under it
    zh-CN: |
        用一个 `TO` 指明完整的落点路径；给目录不够，因为没有可以放到目录下的名字

  err_taken:
    en: "Something is already at `%{path}` here"
    zh-CN: "`%{path}` 在本地已经有内容了"

  err_taken_help:
    en: |
        Please name somewhere nothing is, or move what is there first
    zh-CN: |
        请换一个空路径，或先移动那里的内容

  err_known:
    en: "This Layout already holds `%{uuid}`"
    zh-CN: "当前布局已经持有 `%{uuid}`"

  err_known_help:
    en: |
        What is already here is brought up to date with `rola sync`, not checked in again
    zh-CN: |
        已经在本地的内容用 `rola sync` 更新，而不是再次签入

  err_failed:
    en: "The checkin could not go on: %{cause}"
    zh-CN: "签入无法继续：%{cause}"

  err_failed_help:
    en: |
        Please check the Vault is reachable and the account is bound, then try again
    zh-CN: |
        请检查保险库是否可达、账户是否已绑定，然后重试

  no_content:
    en: the content this version names is not here
    zh-CN: 本地没有该版本所指向的内容

  result_summary:
    en: "%{checked} checked in, %{failed} not done"
    zh-CN: "已签入 %{checked} 项，未完成 %{failed} 项"
