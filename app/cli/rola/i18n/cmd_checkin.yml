_version: 2

checkin:
  help:
    en: |
        Add the entries of an upstream Layout into the local Layout

        **Usage**:
            rola checkin <REF> [TO]
            rola checkin <VARIANT_HASH> --join <FILE>
        **Flags**:
            --join <FILE>    Name the file a checked-in variant is to be merged into
            --offline        Build the file only from content already stored locally
            --force          Skip the chain consistency check for a variant checkin

        **About merging**:
            When checking in a variant as a file, `--join` must be used to name the file to merge into
            After the merge starts, manually merge the variant file's content into the local file

            To confirm, simply track as usual with `rola track <FILE>`, and it will **automatically** be recorded as a merge
    zh-CN: |
        将上游布局的条目加入到本地布局中

        **用法**：
            rola checkin <上游条目> [本地路径]
            rola checkin <变体HASH> --join <本地文件>
        **标识**：
            --join <本地文件>    为签入的变体指定待合入的文件
            --offline            仅使用本地已存储的内容来构建文件
            --force              跳过变体签入的链一致性检查

        **关于合并**：
            签入变体作为文件时，必须使用 `--join` 来指定待合入的文件
            合并开始后，需手动将变体文件的内容合入本地文件

            若需要确认，请正常使用 `rola track <文件>` 追踪即可，它会 **自动** 记录为一次合并

  description:
    en: Add the entries of an upstream Layout into the local Layout
    zh-CN: 将上游布局的条目加入到本地布局中

  complete:
    join:
      en: Name the file a checked-in variant is to be merged into
      zh-CN: 为签入的变体指定待合入的文件

  err_join:
    en: "a variant cannot be joined into `%{target}`: %{cause}"
    zh-CN: "无法将变体并入 `%{target}`：%{cause}"

  err_join_help:
    en: |
        Give a variant the index holds, and the corresponding file in the current Layout
        The variant comes from wherever the index holds it, and is really merged in only when the file is recorded with `rola track`
    zh-CN: |
        给出索引持有的变体，以及当前布局中的对应文件
        变体来自其索引持有它的地方，并在用 `rola track` 记录该文件时才真正并入

  err_join_hash:
    en: what was named is no variant hash
    zh-CN: 给出的不是变体哈希

  err_join_target:
    en: it is no path this Layout names
    zh-CN: 它不是当前布局命名的路径

  err_join_merging:
    en: a variant is already waiting to be joined into it
    zh-CN: 已经有一个变体正在等待并入它

  err_join_checked_in:
    en: that variant was already checked in
    zh-CN: 该变体已经签入过

  err_join_off_chain:
    en: it is not based on a version of this file's own chain — pass `--force` to join it anyway
    zh-CN: 该变体并非基于所指文件版本链上的版本，若你确实需要并入，请使用 `--force`

  err_join_chain:
    en: the file's version chain could not be read
    zh-CN: 无法读取该文件的版本链

  err_join_unknown:
    en: the index holds no such variant, and no Vault could be asked for it
    zh-CN: 索引中没有该变体，也未能向保险库取到

  err_join_no_track:
    en: the variant is not here, and the Layout being worked in tracks no Vault to ask
    zh-CN: 本地没有该变体，而当前使用的布局没有追踪可询问的保险库

  err_join_no_account:
    en: the variant is not here, and the run acts as no account to ask a Vault as
    zh-CN: 本地没有该变体，而本次运行没有可用于询问保险库的账户

  err_join_no_vault:
    en: the variant is not here, and the Vault the Layout tracks cannot be named
    zh-CN: 本地没有该变体，而无法指出布局所追踪的保险库

  err_join_no_store:
    en: this run has no store to write the content out of
    zh-CN: 本次运行没有可写出内容的存储

  err_join_place:
    en: nowhere here can hold a variant file
    zh-CN: 本地没有可以放置变体文件的位置

  err_join_taken:
    en: "something is already at `%{path}` here"
    zh-CN: "`%{path}` 在本地已经有内容了"

  joined:
    en: "`%{variant}` was checked in as `%{path}`, waiting to be joined into `%{target}`"
    zh-CN: "`%{variant}` 已签入为 `%{path}`，等待并入 `%{target}`"

  err_no_track:
    en: The Layout being worked in tracks no Vault
    zh-CN: 当前布局没有追踪任何保险库

  err_no_track_help:
    en: |
        Please name one with `rola layout set-track <LAYOUT> <VAULT>`, then try again
    zh-CN: |
        请用 `rola layout set-track <布局> <保险库>` 指定后再次运行该命令

  err_argument:
    en: "`rola checkin` was given operands it cannot use"
    zh-CN: "`rola checkin` 收到的参数无法使用"

  err_argument_help:
    en: |
        Please name the upstream path to check in, and optionally the local path to check it in to
        If merging is needed, give the variant's Hash and use `--join` to name the one file to merge into
    zh-CN: |
        请指定需要签入的上游路径，并可选地给出要签入到的本地路径
        若需要合并，请给出变体的 Hash，并使用 `--join` 指定唯一的待合入文件

  err_unknown:
    en: "The Vault's Layout names nothing by `%{reference}`"
    zh-CN: "保险库的布局中没有名为 `%{reference}` 的条目"

  err_unknown_help:
    en: |
        Use `rola entries --remote` to see the entries recorded in the Vault
    zh-CN: |
        使用 `rola entries --remote` 查看保险库中记录的条目

  err_unnamed:
    en: "The Vault's Layout gives `%{uuid}` no path, so there is no name to land it under"
    zh-CN: "保险库的布局没有给 `%{uuid}` 路径，因此无法自动推断本地名字"

  err_unnamed_help:
    en: |
        Please give the local position this UUID is to be checked in to
    zh-CN: |
        请指定该 UUID 需要签入到的本地的位置

  err_taken:
    en: "Something is already at `%{path}` here"
    zh-CN: "`%{path}` 在本地已经有内容了"

  err_taken_help:
    en: |
        Please name another available path
    zh-CN: |
        请重新指定其他可用路径

  err_known:
    en: "The current Layout already holds this entry: `%{uuid}`"
    zh-CN: "当前布局已经持有该条目：`%{uuid}`"

  err_known_help:
    en: |
        A Layout cannot record multiple entries pointing at the same UUID
    zh-CN: |
        布局内无法记录多个指向同一 UUID 的条目

  err_failed:
    en: "The checkin could not go on: %{cause}"
    zh-CN: "签入无法继续：%{cause}"

  err_failed_help:
    en: |
        Please check the Vault is reachable and the account is bound, then try again
    zh-CN: |
        请检查保险库是否可达、账户是否已绑定，然后重试

  no_content:
    en: the content this version names is not here
    zh-CN: 本地没有该版本所指向的内容

  result_summary:
    en: "%{checked} checked in, %{failed} not done"
    zh-CN: "已签入 %{checked} 项，未完成 %{failed} 项"
