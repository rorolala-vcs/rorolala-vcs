_version: 2

cmd_layout_read_ownership:
  help:
    en: |
        Read an entry's holder from the fetched copy

        **Usage**: rola layout read-ownership [VAULT] <UUID>
    zh-CN: |
        从取回的副本中读取条目的持有者

        **用法**：rola layout read-ownership [保险库名] <UUID>

  description:
    en: Read an entry's holder from the fetched copy
    zh-CN: 从取回的副本中读取条目的持有者

  result_owner:
    en: "The entry `%{uuid}` is held by `%{owner}`"
    zh-CN: "条目 `%{uuid}` 由 `%{owner}` 持有"

  result_unowned:
    en: "The entry `%{uuid}` is held by nobody"
    zh-CN: "条目 `%{uuid}` 无人持有"
