_version: 2

storage_sync_all:
  help:
    en: |
        Make the stores at both ends hold the same keys

        **Usage**: rola storage sync-all [VAULT]
        **Flags**:
            --confirm    Confirm in advance that both stores will be changed
            --offline    This command needs to reach the Vault, and does not run when offline
    zh-CN: |
        让两端的仓库持有相同的密钥

        **用法**：rola storage sync-all [保险库]
        **标识**：
            --confirm    预先确认两个仓库都会被改动
            --offline    本命令需要访问保险库，离线时不执行

  cmd_storage_sync_all_description:
    en: Make the stores at both ends hold the same keys
    zh-CN: 让两端的仓库持有相同的密钥

  confirm:
    en: "Both stores will be changed, so that each holds all the content the other holds. Continue? [y/n] "
    zh-CN: "两个仓库都会被改动，使各自持有对方所持有的全部内容。是否继续？[y/n] "

  result_synced:
    en: "The stores at both ends now hold the same keys"
    zh-CN: 两端仓库现在持有相同的密钥

  result_declined:
    en: "Nothing was changed: the sync was not confirmed"
    zh-CN: 未做任何改动：同步未获确认
