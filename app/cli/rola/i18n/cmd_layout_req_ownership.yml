_version: 2

cmd_layout_req_ownership:
  help:
    en: |
        # Ask the Vault to record the named entries' holder as the account this run uses
        **Usage**: rola layout [[GREEN]]__req-ownership__[[/]] [VAULT] <UUID>...
    zh-CN: |
        # 请求保险库把指定条目的持有者记为本次运行所用的账户
        **用法**：rola layout [[GREEN]]__req-ownership__[[/]] [保险库名] <UUID>...

  description:
    en: Ask the Vault to record the named entries' holder as this account
    zh-CN: 请求保险库将指定条目的持有者记为本账户

  result_owned:
    en: "The entry `%{uuid}` is now held by `%{owner}`"
    zh-CN: "条目 `%{uuid}` 现在由 `%{owner}` 持有"

  result_taken:
    en: "The entry `%{uuid}` is now held by nobody"
    zh-CN: "条目 `%{uuid}` 现在无人持有"
