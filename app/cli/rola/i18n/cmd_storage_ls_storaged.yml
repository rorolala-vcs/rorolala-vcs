_version: 2

storage_ls_storaged:
  help:
    en: |
        List every object the store holds

        **Usage**: `rola storage ls-storaged`

        What is printed is one key per line: the same keys `rola storage extract-file` takes, so a line
        read here is a hash to hand to that command. Only what the store holds is listed — a
        manifest whose chunks have gone is not named, since it is not something there is content to
        read.

        The run has to be somewhere a store can be found: inside one, or inside a Vault or
        Workspace that keeps one.
    zh-CN: |
        列出仓库持有的全部对象

        **用法**：`rola storage ls-storaged`

        每行打印一个哈希，与 `rola storage extract-file` 接受的是同一种，因此这里读到的一行可以直接交给
        那条命令。只列出仓库确实持有的对象——块已丢失的 manifest 不会出现，因为那并没有内容可读。

        运行必须处在能发现仓库的地方：仓库内、或保有仓库的保险库／工作区内。

  cmd_storage_ls_storaged_description:
    en: List every object the store holds
    zh-CN: 列出仓库持有的全部对象

  err_no_storage:
    en: This run is nowhere a store is
    zh-CN: 当前运行不处于任何仓库中

  err_no_storage_help:
    en: |
        Please run this inside a store, or inside the Vault or Workspace that keeps one
    zh-CN: |
        请在仓库内运行，或在保有仓库的保险库／工作区内运行

  err_ls_failed:
    en: "The store's objects could not be listed — %{reason}"
    zh-CN: "无法列出仓库中的对象 —— %{reason}"

  err_ls_failed_help:
    en: |
        Please check that the store can be read, then try again
    zh-CN: |
        请确认仓库可读，然后重试
