_version: 2

vcs_index:
  help:
    en: |
        Build and read/write the version control index by hand

        **Usage**: rola vcs-index <COMMAND>
        **Commands**:
            create-rootver                Write the root version
            print-rootver                 Print the root version's hash
            my-creator-hash               Print the Creator hash of the current account
            ls-str                        List the text objects in the index
            ls-variants                   List the variants in the index
            ls-versions                   List the versions in the index
            ls-remote-str [VAULT]         List the text objects in the other end's index
            ls-remote-variants [VAULT]    List the variants in the other end's index
            ls-remote-versions [VAULT]    List the versions in the other end's index
            read <HASH>                   Read one index object
            read-remote <HASH> [VAULT]    Read one index object from the other end's index
            lookback <HASH>               Draw the version chain with an object on top
            write-creator <NAME>          Write a Creator
            write-msg <MESSAGE>           Write a Message
            write-variant <BASE_VERSION> <STORAGE> <CREATOR_HASH> <MESSAGE_HASH> [--join <JOIN>]
                                        Write a Variant
            write-version <VARIANT>       Write a Version
            sync-all [VAULT]              Make the indexes at both ends hold the same objects

        The index holds variants, versions, Creators and Messages, and the commands hand data over by hash
    zh-CN: |
        手工建立并读写版本控制索引

        **用法**：rola vcs-index <子命令>
        **命令**：
            create-rootver                 写入根版本
            print-rootver                  输出根版本的哈希
            my-creator-hash                输出当前账户对应的 Creator 哈希
            ls-str                         列出索引中的文本对象
            ls-variants                    列出索引中的变体
            ls-versions                    列出索引中的版本
            ls-remote-str [保险库]         列出对端索引中的文本对象
            ls-remote-variants [保险库]    列出对端索引中的变体
            ls-remote-versions [保险库]    列出对端索引中的版本
            read <哈希>                    读取一个索引对象
            read-remote <哈希> [保险库]    从对端索引读取一个索引对象
            lookback <哈希>                画出以某对象为顶的版本链
            write-creator <名称>           写入 Creator
            write-msg <消息>               写入 Message
            write-variant <基础版本> <存储条目> <Creator 哈希> <Message 哈希> [--join <变体>]
                                        写入变体
            write-version <变体>           写入版本
            sync-all [保险库]              让两端索引持有相同的对象

        索引保存变体、版本、Creator 与 Message，各命令之间以哈希交接数据

  cmd_vcs_index_description:
    en: Build and read/write the version control index by hand
    zh-CN: 手工建立并读写版本控制索引

  err_write:
    en: "The index could not be written: %{reason}"
    zh-CN: "无法写入索引：%{reason}"

  err_write_help:
    en: |
        Please check that the index can be written, then try again
    zh-CN: |
        请确认索引可写后重试

  err_argument:
    en: "the `%{argument}` argument is missing"
    zh-CN: "缺少参数：`%{argument}`"

  err_argument_help:
    en: |
        Please give the argument and try again
    zh-CN: |
        请补上该参数后重试

  err_bad_hash:
    en: "`%{hash}` is not a hash"
    zh-CN: "`%{hash}` 不是有效的哈希"

  err_bad_hash_help:
    en: |
        Please give a hash as hex, or as `blake3:<hex>`
    zh-CN: |
        请给出十六进制哈希，或 `blake3:<hex>` 形式的哈希

  err_not_found:
    en: "Nothing is stored under `%{hash}`"
    zh-CN: "未发现存储对象：`%{hash}`"

  err_not_found_help:
    en: |
        Please create what is missing first, then try again
    zh-CN: |
        请先创建缺少的对象，然后重试

vcs_index_ls_variants:
  help:
    en: |
        List the variants in the index

        **Usage**: rola vcs-index ls-variants
        **Flags**:
            --json    Output as JSON

        One per line: the variant's hash, the hash of the version it is based on and the storage entry's hash, and for a merge the joined variant's hash, with the version's number not worked out here
    zh-CN: |
        列出索引中的变体

        **用法**：rola vcs-index ls-variants
        **标识**：
            --json    以 JSON 输出

        每行输出变体的哈希、所基于版本的哈希与存储条目哈希，合并的变体还带并入的变体哈希，版本的号不在这里计算

  description:
    en: List the variants the index holds
    zh-CN: 列出索引中的变体

vcs_index_ls_versions:
  help:
    en: |
        List the versions in the index

        **Usage**: rola vcs-index ls-versions
        **Flags**:
            --json    Output as JSON

        One per line: the version's number and hash, and the hash of the variant it points at
    zh-CN: |
        列出索引中的版本

        **用法**：rola vcs-index ls-versions
        **标识**：
            --json    以 JSON 输出

        每行输出版本的号与哈希，以及它指向的变体的哈希

  description:
    en: List the versions the index holds
    zh-CN: 列出索引中的版本

vcs_index_read:
  help:
    en: |
        Read one index object by its hash

        **Usage**: rola vcs-index read <HASH>
        **Flags**:
            --json    Output as JSON

        A Creator and a Message print their text, and a variant and a version print in their listing form
    zh-CN: |
        按哈希读取一个索引对象

        **用法**：rola vcs-index read <哈希>
        **标识**：
            --json    以 JSON 输出

        Creator 与 Message 输出其文本，变体与版本输出各自的列表格式

  description:
    en: Read one index object by its hash
    zh-CN: 按哈希读取一个索引对象

vcs_index_write_creator:
  help:
    en: |
        Write a Creator into the index, and print its hash

        **Usage**: rola vcs-index write-creator <NAME>
    zh-CN: |
        将 Creator 写入索引，并输出其哈希

        **用法**：rola vcs-index write-creator <名称>

  description:
    en: Write a Creator into the index
    zh-CN: 将 Creator 写入索引

vcs_index_write_msg:
  help:
    en: |
        Write a Message into the index, and print its hash

        **Usage**: rola vcs-index write-msg <MESSAGE>
    zh-CN: |
        将 Message 写入索引，并输出其哈希

        **用法**：rola vcs-index write-msg <消息>

  description:
    en: Write a Message into the index
    zh-CN: 将 Message 写入索引

vcs_index_write_variant:
  complete:
    join:
      en: Name the variant this one merges in
      zh-CN: 指定本变体并入的变体
  help:
    en: |
        Write a Variant into the index, and print its hash

        **Usage**: rola vcs-index write-variant <BASE_VERSION> <STORAGE> <CREATOR_HASH> <MESSAGE_HASH>
        **Flags**:
            --join <JOIN>    Name the variant this one merges in

        The Creator and the Message are given when the variant is written, and the base version, the storage entry and the two text objects are taken as the given hashes without checking that they exist
    zh-CN: |
        将变体写入索引，并输出其哈希

        **用法**：rola vcs-index write-variant <基础版本> <存储条目> <Creator 哈希> <Message 哈希>
        **标识**：
            --join <变体>    指定本变体并入的变体

        Creator 与 Message 在写入变体时给出，基础版本、存储条目与两个文本对象按给定哈希直接采用，不校验是否已存在

  description:
    en: Write a Variant into the index
    zh-CN: 将变体写入索引

vcs_index_write_version:
  help:
    en: |
        Write a Version into the index, and print its hash

        **Usage**: rola vcs-index write-version <VARIANT>

        Existence is not checked, and the variant is taken as the given hash
    zh-CN: |
        将版本写入索引，并输出其哈希

        **用法**：rola vcs-index write-version <变体>

        不校验存在性，变体按给定的哈希直接采用

  description:
    en: Write a Version into the index
    zh-CN: 将版本写入索引

vcs_index_my_creator_hash:
  help:
    en: |
        Print the Creator hash of the current account

        **Usage**: rola vcs-index my-creator-hash
        **Flags**:
            --json    Output as JSON

        The Creator hash of the current account is printed, and the object is written into the index at the same time, with the same name being the same object, created once and read back the same each time
    zh-CN: |
        输出当前账户对应的 Creator 哈希

        **用法**：rola vcs-index my-creator-hash
        **标识**：
            --json    以 JSON 输出

        输出当前账户对应的 Creator 哈希，该对象同时写入索引，同名即同对象，创建一次后每次读取同一份

  description:
    en: Print the Creator hash of the current account
    zh-CN: 输出当前账户对应的 Creator 哈希

vcs_index_lookback:
  complete:
    compact:
      en: Draw the versions alone, without the variants between them
      zh-CN: 只画版本，不画中间的变体
    no_message:
      en: Leave out what each version says
      zh-CN: 省略每个版本的说明
    no_creator:
      en: Leave out who made each version
      zh-CN: 省略每个版本的创建者
    max_message_length:
      en: How much of a message is shown before it is cut short
      zh-CN: 说明截断前显示多少字符
  help:
    en: |
        Draw the version chain with an index object on top

        **Usage**: rola vcs-index lookback <HASH>
        **Flags**:
            --compact       Draw the versions alone, without the variants between them
            --no-creator    Do not show the creator of each version
            --no-message    Do not show what each version says
            --max-message-length <N> How many characters of a message are shown before it is cut short, 64 by default
            --json          Output as JSON

        Draw the version chain with the given object on top back to the first version, without drawing the root version
        An object that is a version is the top of the chain, and one that is a variant is drawn over the version it is based on
        Each version carries its creator and what it says
    zh-CN: |
        画出以索引对象为顶的版本链

        **用法**：rola vcs-index lookback <哈希>
        **标识**：
            --compact       只画版本，不画中间的变体
            --no-creator    不显示每个版本的创建者
            --no-message    不显示每个版本的说明
            --max-message-length <N> 说明截断前显示多少字符，默认为 64
            --json          以 JSON 输出

        画出以给定对象为顶、回溯到第一个版本的版本链，根版本不画
        对象是版本时作为链顶，是变体时画在其所基于的版本之上
        每个版本带上创建者与说明

  being_edited:
    en: being edited
    zh-CN: 编辑中的版本

  description:
    en: Draw the version chain with an object on top
    zh-CN: 画出以某对象为顶的版本链

  err_not_a_chain:
    en: The object named is neither a version nor a variant
    zh-CN: 所指对象既不是版本也不是变体

  err_broken:
    en: "The chain is broken: a link it names is not stored, or is not the kind it should be"
    zh-CN: "版本链已断裂：它指向的一环没有存储，或类型不对"

vcs_index_create_rootver:
  help:
    en: |
        Write the root version into the index, and print its hash

        **Usage**: rola vcs-index create-rootver
        **Flags**:
            --json    Output as JSON

        All version chains start from the root version, it is the same object in every index, and nothing is changed when it is already there
    zh-CN: |
        将根版本写入索引，并输出其哈希

        **用法**：rola vcs-index create-rootver
        **标识**：
            --json    以 JSON 输出

        所有版本链都从根版本开始，它在每个索引里是同一个对象，已存在时不做改动

  description:
    en: Put the root version into the index
    zh-CN: 将根版本写入索引

vcs_index_print_rootver:
  help:
    en: |
        Print the root version's hash

        **Usage**: rola vcs-index print-rootver
        **Flags**:
            --json    Output as JSON

        The root version's hash is the same in every index, and it is reported as an error when the index does not hold it
    zh-CN: |
        输出根版本的哈希

        **用法**：rola vcs-index print-rootver
        **标识**：
            --json    以 JSON 输出

        根版本的哈希在每个索引里相同，索引里没有它时报错

  description:
    en: Print the root version's hash
    zh-CN: 输出根版本的哈希
