_version: 2

vcs_index_ls_str:
  help:
    en: |
        List the hashes of the text objects the index holds

        **Usage**: `rola vcs-index ls-str`
        **Flags**:
            --json    Output as JSON

        List the hashes of the Creator and Message objects in the index, one per line, in hex
        The run has to be inside a Vault or a Workspace
    zh-CN: |
        列出索引中文本对象的哈希

        **用法**：rola vcs-index ls-str
        **标识**：
            --json    以 JSON 输出

        列出索引中 Creator 与 Message 对象的哈希，每行一个，十六进制
        运行必须处在保险库或工作区内

  cmd_vcs_index_ls_str_description:
    en: List the hashes of the creator and message objects the index holds
    zh-CN: 列出索引中 Creator 与 Message 对象的哈希

  err_no_index:
    en: This run is nowhere a version control index is
    zh-CN: 当前运行不在任何版本控制索引中

  err_no_index_help:
    en: |
        Please run this inside a Vault or Workspace
    zh-CN: |
        请在保险库或工作区内运行该命令

  err_read:
    en: "The index could not be read — %{reason}"
    zh-CN: "无法读取索引：%{reason}"

  err_read_help:
    en: |
        Please check that the index can be read, then try again
    zh-CN: |
        请确认索引可读后重试
