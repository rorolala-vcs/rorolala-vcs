_version: 2

account:
  help:
    en: |
        # Query or Set the account used by the current user
        **Query account**:rola [[GREEN]]__account__[[/]] [COMMAND]
        **  Set account**:rola [[GREEN]]__account__[[/]] <NAME>
        **Commands**:
            ls             List available accounts
            current        Print current account
        **Flags**:
             __--vault__ __-v__    Also show the account of the current vault
    zh-CN: |
        # 查询 或 设置 当前用户所使用的账户
        **查询账户**：rola [[GREEN]]__account__[[/]] [命令]
        **设置账户**：rola [[GREEN]]__account__[[/]] <账户名>
        **命令**：
            ls             列出可用账户
            current        输出当前账户
        **标识**：
             __--vault__ __-v__    同时显示当前所在保险库的账户

  cmd_account_description:
    en: Query or switch the available accounts on this machine
    zh-CN: 查询或切换本机的可用账户

  result_none:
    en: There are no available accounts on this machine
    zh-CN: 本机没有任何可用的账户

  result_current:
    en: "%{name} (CURRENT)"
    zh-CN: "%{name}（当前）"

  result_set:
    en: Set the machine's account to %{name}, recorded in %{path}
    zh-CN: 设置本机账户为 %{name}，记录在 %{path}

  err_not_found:
    en: "No account found: %{name}, please check the spelling"
    zh-CN: "未发现账户：%{name}，请检查拼写是否正确"

  err_not_found_help:
    en: |
      Run `rola account` to see the existing accounts, or you can use `rola key --generate` to make a new account key
    zh-CN: |
      运行 `rola account` 查看已有账户，你也可以使用 `rola key --generate` 来生成新的账户密钥

  err_no_user_dir:
    en: Cannot determine the directory where Rorolala keeps user files
    zh-CN: 无法确定 Rorolala 保存用户文件的目录

  err_no_user_dir_help:
    en: |
        Recording an account needs the local data directory, but this machine does not name it
    zh-CN: |
        记录账户需要本地数据目录，但本机未指明该目录

account_ls:
  help:
    en: |
        # List available accounts on this machine
        **Usage**: rola account current [[GREEN]]__ls__[[/]]
        **Flags**:
             __--vault__ __-v__    Also show the account of the current vault
        > [!Note]
        > This command behaves the same as `rola account`
    zh-CN: |
        # 列出本机可用账户
        **用法**：rola account current [[GREEN]]__ls__[[/]]
        **标识**：
             __--vault__ __-v__    同时显示当前所在保险库的账户
        > [!Note]
        > 该命令效果和 `rola account` 一致

  description:
    en: List the available accounts on this machine
    zh-CN: 列出本机可用账户

account_current:
  help:
    en: |
        # Output the account currently in use
        **Usage**: rola account [[GREEN]]__current__[[/]]
        > [!Note]
        > Writes only to stdout; completely silent if no account is set
    zh-CN: |
        # 直接输出当前使用的账户
        **用法**：rola account [[GREEN]]__current__[[/]]
        > [!Note]
        > 仅输出内容到 Stdout，若未设置账户则完全静默
  description:
    en: Print the account currently in use
    zh-CN: 直接输出当前使用的账户
