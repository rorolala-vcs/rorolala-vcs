_version: 2

account:
  help:
    en: |
        Query or switch the available accounts on this machine

        **Usage**: rola account <SUBCOMMAND|ACCOUNT>
        **Flags**:
            --vault, -v    Also show the accounts in the current Vault
        **Commands**:
            ls             List the available accounts on this machine
            current        Print the account currently in use

        List the account names found in every scope
        When an account is given, set it as the current account
    zh-CN: |
        查询或切换本机的可用账户

        **用法**：rola account <子命令|账户名>
        **标识**：
            --vault, -v    同时显示当前所在保险库的账户
        **命令**：
            ls             列出本机可用账户
            current        直接输出当前使用的账户

        列出所有作用域中能找到的账户名
        若指定账户，则设置为当前账户

  cmd_account_description:
    en: Query or switch the available accounts on this machine
    zh-CN: 查询或切换本机的可用账户

  result_none:
    en: There are no available accounts on this machine
    zh-CN: 本机没有任何可用的账户

  result_current:
    en: "%{name} (CURRENT)"
    zh-CN: "%{name}（当前）"

  result_set:
    en: Set the machine's account to %{name}, recorded in %{path}
    zh-CN: 设置本机账户为 %{name}，记录在 %{path}

  err_not_found:
    en: "No account found: %{name}, please check the spelling"
    zh-CN: "未发现账户：%{name}，请检查拼写是否正确"

  err_not_found_help:
    en: |
      Run `rola account` to see the existing accounts, or you can use `rola key --generate` to make a new account key
    zh-CN: |
      运行 `rola account` 查看已有账户，你也可以使用 `rola key --generate` 来生成新的账户密钥

  err_no_user_dir:
    en: Cannot determine the directory where Rorolala keeps user files
    zh-CN: 无法确定 Rorolala 保存用户文件的目录

  err_no_user_dir_help:
    en: |
        Recording an account needs the local data directory, but this machine does not name it
        Please set `XDG_DATA_HOME`
    zh-CN: |
        记录账户需要本地数据目录，但本机未指明该目录
        请设置 `XDG_DATA_HOME`

account_ls:
  help:
    en: |
        List the available accounts on this machine

        **Usage**: rola account ls
        **Flags**:
            --vault, -v    Also show the accounts in the current Vault

        This command has the same effect as `rola account`
    zh-CN: |
        列出本机可用账户

        **用法**：rola account ls
        **标识**：
            --vault, -v    同时显示当前所在保险库的账户

        该命令效果和 `rola account` 一致

  description:
    en: List the available accounts on this machine
    zh-CN: 列出本机可用账户

account_current:
  help:
    en: |
        Print the account currently in use

        **Usage**: `rola account current`

        Print only the content to Stdout, and stay completely silent when no account is set
    zh-CN: |
        直接输出当前使用的账户

        **用法**：`rola account current`

        仅输出内容到 Stdout，若未设置账户则完全静默
  description:
    en: Print the account currently in use
    zh-CN: 直接输出当前使用的账户
