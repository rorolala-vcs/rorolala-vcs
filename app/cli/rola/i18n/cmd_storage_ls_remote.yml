_version: 2

storage_ls_remote_storaged:
  help:
    en: |
        List the objects the other end's store holds

        **Usage**: `rola storage ls-remote-storaged [VAULT]`
        **Flags**:
            --json        Output in JSON format
            --offline     This command needs to reach the Vault, and does not run when offline

        Connect to the Vault and list the objects the other end's store holds, one hash per line
        The Vault argument points to the Vault to connect to, and the Workspace default is used when not given
    zh-CN: |
        列出对端仓库持有的对象

        **用法**：rola storage ls-remote-storaged [保险库]
        **标识**：
            --json       以 JSON 格式输出
            --offline    本命令需要访问保险库，离线时不执行

        连上保险库，列出对端仓库持有的对象，每行一个哈希
        保险库参数指向要连接的保险库，不填则用工作区默认的保险库

  description:
    en: List the objects the other end's store holds
    zh-CN: 列出对端仓库持有的对象

storage_ls_remote_manifests:
  help:
    en: |
        List the content the other end's store keeps in chunks

        **Usage**: `rola storage ls-remote-manifests [VAULT]`
        **Flags**:
            --json        Output in JSON format
            --offline     This command needs to reach the Vault, and does not run when offline

        Connect to the Vault and list the content the other end's store keeps in chunks, each line named `manifest:<digest>`
        The Vault argument points to the Vault to connect to, and the Workspace default is used when not given
    zh-CN: |
        列出对端仓库分块保存的内容

        **用法**：rola storage ls-remote-manifests [保险库]
        **标识**：
            --json       以 JSON 格式输出
            --offline    本命令需要访问保险库，离线时不执行

        连上保险库，列出对端仓库分块保存的内容，每行名为 `manifest:<摘要>`
        保险库参数指向要连接的保险库，不填则用工作区默认的保险库

  description:
    en: List the content the other end's store keeps in chunks
    zh-CN: 列出对端仓库分块保存的内容

storage_sync_hashes:
  help:
    en: |
        Make the stores at both ends hold the hashes named

        **Usage**: `rola storage sync-hashes <HASH>... [VAULT]`
        **Flags**:
            --json        Output in JSON format
            --offline     This command needs to reach the Vault, and does not run when offline

        Make the stores at both ends hold the given hashes, carrying only objects one end holds, in whichever direction the holder is
        A hash can be written as hex, or with a `blake3:` or `manifest:` prefix
        The last argument, when it does not read as a hash, points to the Vault to connect to, and the Workspace default is used when not given
    zh-CN: |
        让两端的仓库持有指定的哈希

        **用法**：rola storage sync-hashes <哈希>... [保险库]
        **标识**：
            --json       以 JSON 格式输出
            --offline    本命令需要访问保险库，离线时不执行

        让两端的仓库持有给定的哈希，只搬运仅一端持有的对象，方向随持有方而定
        哈希可写作十六进制，或带 `blake3:`、`manifest:` 前缀
        最后一个参数不读作哈希时指向要连接的保险库，不填则用工作区默认的保险库

  description:
    en: Make the stores at both ends hold the hashes named
    zh-CN: 让两端的仓库持有指定的哈希

  result_synced:
    en: The stores at both ends now hold the hashes named
    zh-CN: 两端仓库现在持有指定的哈希

  err_bad_hash:
    en: "`%{hash}` is not a valid hash"
    zh-CN: "`%{hash}` 不是合法的哈希"

  err_bad_hash_help:
    en: |
        Please give a hex hash, or a hash in the form `blake3:<hex>` or `manifest:<hex>`
    zh-CN: |
        请给出十六进制哈希，或 `blake3:<hex>`、`manifest:<hex>` 形式的哈希
