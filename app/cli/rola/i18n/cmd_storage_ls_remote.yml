_version: 2

storage_ls_remote_storaged:
  help:
    en: |
        List the objects the store at the other end holds

        **Usage**: `rola storage ls-remote-storaged [VAULT] [--json]`

        It is `rola storage ls-storaged` asked of the other end: where that lists the store the run
        is inside, this reaches the Vault and lists what *its* store holds, one key per line. Nothing
        changes — the Vault is asked and answers.

        `VAULT` names the Vault to reach, as `rola storage sync-all` reads it, with none naming the
        one the Workspace reaches for by default.
    zh-CN: |
        列出对端仓库持有的对象

        **用法**：`rola storage ls-remote-storaged [VAULT] [--json]`

        即 `rola storage ls-storaged` 问向对端：那条命令列出本次运行所在仓库持有的对象，而这条连上保险库、
        列出**它**的仓库持有的对象，每行一个哈希。什么都不改变——只是询问保险库并得到回答。

        `VAULT` 指向要连接的保险库，读法与 `rola storage sync-all` 相同；不填则用工作区默认的那个。

  description:
    en: List the objects the store at the other end holds
    zh-CN: 列出对端仓库持有的对象

storage_ls_remote_manifests:
  help:
    en: |
        List the content the store at the other end keeps cut

        **Usage**: `rola storage ls-remote-manifests [VAULT] [--json]`

        It is `rola storage ls-manifests` asked of the other end: what is printed is named
        `manifest:<digest>`, the same as there, so a line read here can be handed straight to
        `rola storage extract-file`. Nothing changes — the Vault is asked and answers.

        `VAULT` names the Vault to reach, as `rola storage sync-all` reads it, with none naming the
        one the Workspace reaches for by default.
    zh-CN: |
        列出对端仓库切分保存的内容

        **用法**：`rola storage ls-remote-manifests [VAULT] [--json]`

        即 `rola storage ls-manifests` 问向对端：打印出来的是 `manifest:<digest>` 形式，与那边一样，
        因此这里读到的一行可以直接交给 `rola storage extract-file`。什么都不改变——只是询问保险库并得到回答。

        `VAULT` 指向要连接的保险库，读法与 `rola storage sync-all` 相同；不填则用工作区默认的那个。

  description:
    en: List the content the store at the other end keeps cut
    zh-CN: 列出对端仓库切分保存的内容

storage_sync_hashes:
  help:
    en: |
        Make the stores at both ends hold the keys named

        **Usage**: `rola storage sync-hashes <HASH>... [VAULT] [--json]`

        Where `rola storage sync-all` carries everything either end holds, this carries only the keys
        it is given — a full sync narrowed to a list. Each argument is a hash, read as hex or with
        `blake3:` or `manifest:` in front of it, and what crosses is what only one end holds, in
        whichever direction that is.

        The last argument, when it does not read as a hash, names the Vault to reach, with none
        naming the one the Workspace reaches for by default. Only what was named changes, so the run
        does not ask first.
    zh-CN: |
        让两端的仓库持有指定的哈希

        **用法**：`rola storage sync-hashes <HASH>... [VAULT] [--json]`

        `rola storage sync-all` 搬运两端各自持有的全部内容，而这条只搬运给定的哈希——即缩小到一份清单的
        全量同步。每个参数是一个哈希，可以是十六进制，也可以带 `blake3:` 或 `manifest:` 前缀；只有某一端持有
        的才会被搬运，方向随持有方而定。

        最后一个参数若不读作哈希，则用它指向要连接的保险库；不填则用工作区默认的那个。只有被点名的对象会
        改变，因此本命令不先行确认。

  description:
    en: Make the stores at both ends hold the keys named
    zh-CN: 让两端的仓库持有指定的哈希

  result_synced:
    en: The two stores now hold the keys named
    zh-CN: 两端的仓库已持有指定的哈希

  err_bad_hash:
    en: "`%{hash}` is not a hash"
    zh-CN: "`%{hash}` 不是哈希"

  err_bad_hash_help:
    en: |
        Please give a hash as hex, or as `blake3:<hex>` or `manifest:<hex>`
    zh-CN: |
        请给出十六进制哈希，或 `blake3:<hex>`、`manifest:<hex>` 形式的哈希
