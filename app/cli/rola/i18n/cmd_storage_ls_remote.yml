_version: 2

storage_ls_remote_storaged:
  help:
    en: |
        # List the objects the other end's store holds
        **Usage**: rola storage [[GREEN]]__ls-remote-storaged__[[/]] [VAULT]
        **Flags**:
             __--json__       Output in JSON format
             __--offline__    This command needs to reach the Vault, and does not run when offline
    zh-CN: |
        # 列出对端仓库持有的对象
        **用法**：rola storage [[GREEN]]__ls-remote-storaged__[[/]] [保险库]
        **标识**：
             __--json__       以 JSON 格式输出
             __--offline__    本命令需要访问保险库，离线时不执行

  description:
    en: List the objects the other end's store holds
    zh-CN: 列出对端仓库持有的对象

storage_ls_remote_manifests:
  help:
    en: |
        # List the content the other end's store keeps in chunks
        **Usage**: rola storage [[GREEN]]__ls-remote-manifests__[[/]] [VAULT]
        **Flags**:
             __--json__       Output in JSON format
             __--offline__    This command needs to reach the Vault, and does not run when offline
    zh-CN: |
        # 列出对端仓库分块保存的内容
        **用法**：rola storage [[GREEN]]__ls-remote-manifests__[[/]] [保险库]
        **标识**：
             __--json__       以 JSON 格式输出
             __--offline__    本命令需要访问保险库，离线时不执行

  description:
    en: List the content the other end's store keeps in chunks
    zh-CN: 列出对端仓库分块保存的内容

storage_sync_hashes:
  help:
    en: |
        # Make the stores at both ends hold the hashes named
        **Usage**: rola storage [[GREEN]]__sync-hashes__[[/]] <HASH>... [VAULT]
        **Flags**:
             __--json__       Output in JSON format
             __--offline__    This command needs to reach the Vault, and does not run when offline
    zh-CN: |
        # 让两端的仓库持有指定的哈希
        **用法**：rola storage [[GREEN]]__sync-hashes__[[/]] <哈希>... [保险库]
        **标识**：
             __--json__       以 JSON 格式输出
             __--offline__    本命令需要访问保险库，离线时不执行

  description:
    en: Make the stores at both ends hold the hashes named
    zh-CN: 让两端的仓库持有指定的哈希

  result_synced:
    en: The stores at both ends now hold the hashes named
    zh-CN: 两端仓库现在持有指定的哈希

  err_bad_hash:
    en: "`%{hash}` is not a valid hash"
    zh-CN: "`%{hash}` 不是合法的哈希"

  err_bad_hash_help:
    en: |
        Please give a hex hash, or a hash in the form `blake3:<hex>` or `manifest:<hex>`
    zh-CN: |
        请给出十六进制哈希，或 `blake3:<hex>`、`manifest:<hex>` 形式的哈希
