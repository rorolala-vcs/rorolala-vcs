_version: 2

cmd_layout_fetch:
  help:
    en: |
      # Bring a Vault's Layout here as a read-only copy
      **Usage**: rola layout [[GREEN]]__fetch__[[/]] [VAULT] [--with <ANY>...] [--layout <LAYOUT>] [--recursive | --shallow] [--no-ignore-rules] [--offline] [--concurrency <N>]
      **Flags**:
           __--with__ <ANY>...      Bring the content of the entries, variants or versions these paths, UUIDs or hashes name
           __--layout__ <LAYOUT>    Read the words in this Layout, `truth@VAULT` being the copy a fetch left
           __--recursive__          Follow each version back to its root and bring the whole chain
           __--shallow__            Bring only the version each entry names, which is the default
           __--no-ignore-rules__    Fetch only the Layout, leaving the Vault's ignore rules unfetched
           __--offline__            This command needs to reach the Vault, and does not run when offline
           __--concurrency__ <N>    Carry the content N units at a time (default 4)

    zh-CN: |
      # 取回保险库的布局只读副本
      **用法**：rola layout [[GREEN]]__fetch__[[/]] [保险库] [--with <ANY>...] [--layout <LAYOUT>] [--recursive | --shallow] [--no-ignore-rules] [--offline] [--concurrency <N>]
      **标识**：
           __--with__ <ANY>...      取回这些路径、UUID 或哈希所命名的条目、变体或版本的内容
           __--layout__ <LAYOUT>    在这些布局中读取上面的词，`truth@保险库` 是取回的副本
           __--recursive__          把每个版本回溯到根，连同整条链一起取回
           __--shallow__            只取回每个条目命中的版本，默认如此
           __--no-ignore-rules__    只取回布局，不取保险库的忽略规则
           __--offline__            本命令需要访问保险库，离线时不执行
           __--concurrency__ <N>    每次同时搬运 N 份内容（默认 4）

  description:
    en: Bring a Vault's Layout here as a read-only copy
    zh-CN: 取回保险库的布局只读副本

  result_fetched:
    en: "The Layout of `%{vault}` was fetched to `%{path}`"
    zh-CN: "`%{vault}` 的布局已取回到 `%{path}`"
