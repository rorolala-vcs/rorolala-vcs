_version: 2

cmd_layout_fetch:
  complete:
    no_ignore_rules:
      en: Fetch only the Layout, leaving the Vault's ignore rules unfetched
      zh-CN: 只取回布局，不取保险库的忽略规则
  help:
    en: |
        # Bring a Vault's Layout here as a read-only copy
        **Usage**: rola layout [[GREEN]]__fetch__[[/]] [VAULT]
        **Flags**:
             __--no-ignore-rules__    Fetch the Layout without the Vault's ignore rules

    zh-CN: |
        # 取回保险库的布局只读副本
        **用法**：rola layout [[GREEN]]__fetch__[[/]] <保险库>
        **标识**：
             __--no-ignore-rules__    只取回布局，不取保险库的忽略规则
  description:
    en: Bring a Vault's Layout here as a read-only copy
    zh-CN: 取回保险库的布局只读副本

  result_fetched:
    en: "The Layout of `%{vault}` was fetched to `%{path}`"
    zh-CN: "`%{vault}` 的布局已取回到 `%{path}`"
