_version: 2

retrack:
  complete:
    only_index:
      en: Only move the record, leave the file on disk as it is
      zh-CN: 只移动记录，磁盘上的文件保持原样
    deny_jump:
      en: Refuse a version or an entry that is not on the way to what the path records
      zh-CN: 拒绝不在通往当前记录路径上的版本或条目
    fork:
      en: Give the file's entry a fresh Uuid, holding what it records now
      zh-CN: 给文件的条目换一个新的 Uuid，保持一致所记录的内容
  help:
    en: |
        Record a version, or another entry, for a file's path

        **Usage**: rola retrack <PATH> [TARGET]
        **Flags**:
            --only-index         Move the record and leave the file on disk as it is
            --deny-jump          Refuse a version or an entry that is not on the way to what the path records
            --fork               Give the file's entry a fresh Uuid, holding what it records now
            --force              Discard unrecorded changes or end a merge, and forcibly switch the content
            --offline            Do not reach for a Vault: use only what is already here
            --concurrency <N>    Carry the content N units at a time (default 4)
    zh-CN: |
        为文件的路径记录一个版本，或另一个条目

        **用法**：rola retrack <路径> [目标]
        **标识**：
            --only-index         只移动记录，磁盘上的文件保持原样
            --deny-jump          拒绝不在通往当前记录路径上的版本或条目
            --fork               给文件的条目换一个新的 Uuid，保持一致所记录的内容
            --force              丢弃未记录的改动或结束合并，强制切换内容
            --offline            不连接保险库，只使用本地已有的内容与版本
            --concurrency <N>    每次同时搬运 N 份内容（默认 4）

  description:
    en: Record a version, or another entry, for a file's path
    zh-CN: 为文件的路径记录一个版本，或另一个条目

  result_retracked:
    en: "path %{path} retracked to %{version}"
    zh-CN: "路径 %{path} 已回退至 %{version}"

  result_retracked_index:
    en: "path %{path} retracked to %{version}, index only"
    zh-CN: "路径 %{path} 已回退至 %{version}（仅索引）"

  result_unchanged:
    en: "path %{path} is already at %{version}"
    zh-CN: "路径 %{path} 已处于 %{version}"

  result_unchanged_switched:
    en: "path %{path} is already at %{version}, content switched"
    zh-CN: "路径 %{path} 已处于 %{version}（内容已切换）"

  result_uuid_forked:
    en: "path %{path} now records `%{to}`, at %{version}"
    zh-CN: "路径 %{path} 现记录 `%{to}`，版本为 %{version}"

  result_uuid_switched:
    en: "path %{path} now records `%{to}` at %{version}, content switched (`%{from}` was recorded)"
    zh-CN: "路径 %{path} 现记录 `%{to}`，版本为 %{version}，内容已切换（原记录为 `%{from}`）"

  result_uuid_kept:
    en: "path %{path} now records `%{to}` at %{version}, file left as it is (`%{from}` was recorded)"
    zh-CN: "路径 %{path} 现记录 `%{to}`，版本为 %{version}，文件保持原样（原记录为 `%{from}`）"

  err_no_file:
    en: Please name the file whose record is to be set
    zh-CN: 请指定要设置记录的文件

  err_no_file_help:
    en: |
        Please name the single file whose record is to be set; see `rola retrack --help` for usage
    zh-CN: |
        请指定要设置记录的单个文件，用法见 `rola retrack --help`

  err_many_words:
    en: "`rola retrack` takes one file and one target, but %{count} were named"
    zh-CN: "`rola retrack` 只接受一个文件和一个目标，却指定了 %{count} 个"

  err_many_words_help:
    en: |
        Please name one file, and the version or entry it is to record when one is to be named
    zh-CN: |
        请只指定一个文件，并在需要时给出它要记录的版本或条目

  err_flags:
    en: "The requirements of `--force` and `--only-index` contradict each other"
    zh-CN: "`--force` 与 `--only-index` 的要求相互矛盾"

  err_flags_help:
    en: |
        Please use `--force` to discard the file's current content and switch, or `--only-index` to only move the record and leave the file as it is
    zh-CN: |
        请用 `--force` 丢弃文件现有内容并切换，或用 `--only-index` 只移动记录、保持文件不变

  err_fork_target:
    en: "`--fork` gives the entry a new Uuid, and a target names one it is to record: only one of them may be given"
    zh-CN: "`--fork` 给条目换新的 Uuid，而目标指定它要记录的条目：两者只能给出其一"

  err_fork_target_help:
    en: |
        Use `--fork` to give the entry a fresh Uuid with what it records now,
        or name the version or entry the path is to record
    zh-CN: |
        用 `--fork` 让条目在当前记录的基础上换一个新的 Uuid，
        或给出该路径要记录的版本或条目

  err_modified:
    en: "`%{path}` has changes never recorded"
    zh-CN: "`%{path}` 有从未记录的改动"

  err_modified_help:
    en: |
        Please record them with `rola track`, or add `--force` to discard them and switch the content, or add `--only-index` to only move the record and leave them in place
    zh-CN: |
        请用 `rola track` 记录它们，或加 `--force` 丢弃它们并切换内容，或加 `--only-index` 只移动记录、把它们留在原处

  err_merging:
    en: "`%{path}` has the variant `%{variant}` waiting to be joined into it"
    zh-CN: "`%{path}` 有变体 `%{variant}` 等待合并进来"

  err_merging_help:
    en: |
        Please record this merge with `rola track`, or add `--force` to end the merge, remove the variant file and switch the content
        `--only-index` cannot end a merge
    zh-CN: |
        请用 `rola track` 记录这次合并，或加 `--force` 结束合并、删除变体文件并切换内容
        `--only-index` 无法结束合并

  err_not_local:
    en: "`%{path}` is not a local path; `rola retrack` only takes a file in this Workspace"
    zh-CN: "`%{path}` 不是本地路径，`rola retrack` 只接受本工作区中的文件"

  err_not_local_help:
    en: |
        `Uuid`, hash and remote names are read by other commands, not this one
    zh-CN: |
        `Uuid`、哈希与远程名称由其它命令读取，而不是本命令

  err_outside_workspace:
    en: "`%{path}` is not inside this Workspace"
    zh-CN: "`%{path}` 不在本工作区之内"

  err_inside_data:
    en: "`%{path}` is part of the Workspace's own data, not its work content"
    zh-CN: "`%{path}` 属于工作区自身的数据，而非其工作内容"

  err_inside_data_help:
    en: |
        Please name files that sit inside the Workspace and are not under `.rola`
    zh-CN: |
        请指定位于工作区内、且不在 `.rola` 之下的文件

  err_not_recorded:
    en: "The Layout records no entry at `%{path}`"
    zh-CN: "布局没有在 `%{path}` 记录任何条目"

  err_not_recorded_help:
    en: |
        Only a path the Layout records has a record to set
        `rola entries` can list them
    zh-CN: |
        只有布局记录过的路径才有记录可设置
        `rola entries` 可列出它们

  err_nothing:
    en: "`%{path}` was never recorded, and there is no version to go back to"
    zh-CN: "`%{path}` 从未被记录过，没有可回退的版本"

  err_nothing_help:
    en: |
        Please record it first with `rola track`
    zh-CN: |
        请先用 `rola track` 记录它

  err_not_a_target:
    en: "`%{target}` is not something a path can record"
    zh-CN: "`%{target}` 不是路径可以记录的内容"

  err_not_a_target_help:
    en: |
        A target is a step count `~N`, a version number `N`, a version's hash, a `Uuid`, or a path of the Vault's Layout
    zh-CN: |
        目标可以是步数 `~N`、版本号 `N`、版本的哈希、`Uuid`，或保险库布局中的路径

  err_target_dash:
    en: "`%{target}` is a step count written with a dash, which the command line reads as a flag"
    zh-CN: "`%{target}` 是以 `-` 开头的步数，命令行会把它当成标志"

  err_target_dash_help:
    en: |
        Please write the step count as `~N`: `~1` is one version back, which is also what naming no target does
    zh-CN: |
        请把步数写成 `~N`：`~1` 是回退一个版本，与不给目标时相同

  err_out_of_chain:
    en: "`%{target}` is outside the range of the version chain `%{path}` is at"
    zh-CN: "`%{target}` 超出了 `%{path}` 所在版本链的范围"

  err_out_of_chain_help:
    en: |
        `rola status <PATH>` can draw the version chain and the number each version carries
    zh-CN: |
        用 `rola status <路径>` 可以画出该版本链与各版本的编号

  err_not_a_version:
    en: "`%{target}` is not a version in this index"
    zh-CN: "`%{target}` 不是本索引中的版本"

  err_not_a_version_help:
    en: |
        Please give the hash of a **Version**
        `rola status <PATH>` prints the versions a file has been at
    zh-CN: |
        请给出 **版本** 的哈希
        `rola status <路径>` 会打印该文件经历过的版本

  err_not_ancestor:
    en: "`%{target}` is not on the way back from the version `%{path}` is at, and this run was asked not to jump"
    zh-CN: "`%{target}` 不在 `%{path}` 当前版本的回退路径上，而本运行被要求不要跳转"

  err_not_ancestor_help:
    en: |
        Please remove `--deny-jump` if the record is to be set to that version
    zh-CN: |
        若确需把记录设为该版本，请去掉 `--deny-jump`

  err_entry_no_vault:
    en: "`%{entry}` is a path, and the Layout tracks no Vault, so no Vault's Layout can be read for it"
    zh-CN: "`%{entry}` 是路径，而布局未跟踪任何保险库，没有可供读取的保险库布局"

  err_entry_no_vault_help:
    en: |
        Please name the Vault with `rola layout set-track`, or give the entry's Uuid instead
    zh-CN: |
        请用 `rola layout set-track` 指定保险库，或改用条目的 Uuid

  err_entry_not_upstream:
    en: "The Layout of `%{vault}` names no path `%{entry}`"
    zh-CN: "`%{vault}` 的布局中没有路径 `%{entry}`"

  err_entry_not_upstream_help:
    en: |
        Please check the path, and fetch the Vault's Layout again in case it has moved on
    zh-CN: |
        请检查该路径，并重新取回保险库的布局，以防它已更新

  err_entry_unknown_uuid:
    en: "No Layout here or upstream holds the entry `%{uuid}`"
    zh-CN: "本地与上游的布局都没有条目 `%{uuid}`"

  err_entry_unknown_uuid_help:
    en: |
        Please fetch the Vault's Layout with `rola layout fetch` so its entries are here to read,
        or give the file a new Uuid with `--fork`
    zh-CN: |
        请用 `rola layout fetch` 取回保险库的布局，使其中条目可供读取，
        或用 `--fork` 给文件换一个新的 Uuid

  err_entry_same_uuid:
    en: "The path already records the entry `%{uuid}`"
    zh-CN: "该路径已经记录了条目 `%{uuid}`"

  err_entry_same_uuid_help:
    en: |
        Recording the entry the path records already is no change
        Please name the entry the file is to be recorded as
    zh-CN: |
        记录该路径本来就记录的条目并非改变
        请给出文件改而记录的条目

  err_entry_named:
    en: "The entry `%{uuid}` is recorded under `%{path}` already"
    zh-CN: "条目 `%{uuid}` 已记录在 `%{path}` 之下"

  err_entry_named_help:
    en: |
        An entry is at one path, so the path that records it has to let go first
        Run `rola layout path remove` on that path, then try again
    zh-CN: |
        一个条目只位于一个路径，须先让记录它的路径放手
        请先对该路径运行 `rola layout path remove`，然后重试

  err_entry_no_version:
    en: "The entry `%{uuid}` records no version, so there is nothing to switch to"
    zh-CN: "条目 `%{uuid}` 没有记录任何版本，没有可切换的对象"

  err_entry_no_version_help:
    en: |
        An entry no version was recorded for is one whose content was never submitted
        Please record the file the entry belongs to with `rola track`, or give the file a new Uuid with `--fork`
    zh-CN: |
        未记录版本的条目就是内容从未提交过的条目
        请用 `rola track` 记录该条目所属的文件，或用 `--fork` 给文件换一个新的 Uuid

  err_switch_not_on_chain:
    en: "The version `%{path}` records is not on the way to the one its new entry records, and this run was asked not to jump"
    zh-CN: "`%{path}` 记录的版本不在通往其新条目版本的路径上，而本运行被要求不要跳转"

  err_switch_not_on_chain_help:
    en: |
        The two versions are on different chains, so the file holds work the new entry does not
        Remove `--deny-jump` to switch the content anyway, add `--force` to discard unrecorded changes as well, or use `--only-index` to record the entry and leave the file as it is
    zh-CN: |
        两个版本位于不同的链上，文件所持有的内容并不属于新条目
        去掉 `--deny-jump` 即可切换内容，再加 `--force` 一并丢弃未记录的改动，或用 `--only-index` 只记录条目、保持文件原样

  err_no_store:
    en: This run has no store to take the content from
    zh-CN: 本运行没有可用于取出内容的仓库

  err_no_index:
    en: This run has no version control index to read the version from
    zh-CN: 本运行没有可用于读取版本的版本控制索引

  err_no_vault:
    en: The Layout tracks no Vault, so the version cannot be brought here
    zh-CN: 布局未跟踪任何保险库，无法取回该版本

  err_failed:
    en: "The record could not be set: %{reason}"
    zh-CN: "无法设置记录：%{reason}"

  err_failed_help:
    en: |
        Please check that the store, the index and the Layout are writable, then try again
    zh-CN: |
        请检查仓库、索引与布局是否可写，然后重试

  result_tree:
    en: "Tree `%{path}` records version %{version} now"
    zh-CN: "树 `%{path}` 现在记录的版本是 %{version}"
  err_tree_unsupported:
    en: A tree is only retracked to a version
    zh-CN: 树只能回退到某个版本
  err_tree_unsupported_help:
    en: Name a step count, a version number or a version hash
    zh-CN: 请给出步数、版本号或版本哈希
  err_tree_dirty:
    en: "Tree `%{path}` holds work that was never recorded"
    zh-CN: "树 `%{path}` 有从未记录的改动"
  err_tree_dirty_help:
    en: Record or discard the work first, or give `--force` to write over it
    zh-CN: 请先记录或放弃这些改动，或用 `--force` 覆盖它们
