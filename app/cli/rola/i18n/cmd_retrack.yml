_version: 2

retrack:
  complete:
    until:
      en: "Specify where the version pointer goes back to: a level, a version, or a Vault"
      zh-CN: 指定版本指针回退到的位置：层级、版本或保险库
    only_index:
      en: Only move the pointer, leave the file on disk as it is
      zh-CN: 只移动指针，磁盘上的文件保持原样
    allow_jump:
      en: Allow jumping to a version not on the way back, including one only the Vault holds
      zh-CN: 允许跳到不在回退路径上的版本，包括仅上游持有的版本
  help:
    en: |
        Move a file's recorded version back in the Layout

        **Usage**: `rola retrack <PATH>`
        **Flags**:
            --until <TARGET>    Where the version pointer goes back to, one version back by default
            --only-index        Only move the pointer, leave the file on disk as it is
            --allow-jump        Allow jumping to a version not on the way back, including one only the Vault holds
            --force             Discard unrecorded changes or end a merge, and forcibly switch the content
            --offline           Do not reach for a Vault: use only what is already here
            --concurrency <N>   Carry the content over N connections at once (default 4)

        Move back the version pointer `PATH` records in the Layout, and that version's content is written back over the file with the pointer
        `PATH` must be a local path the Layout records, and `--until` names where it goes back to, one version back by default
        A version this index does not hold is brought from the Vault the Layout tracks before the pointer moves; `--offline` refuses that
        `--only-index` only moves the pointer and does not touch the file on disk
        `--force` says the opposite, and cannot be given together
    zh-CN: |
        回退文件在布局中记录的版本

        **用法**：rola retrack <路径>
        **标识**：
            --until <目标>      版本指针回退到的位置，默认回退一个版本
            --only-index        只移动指针，磁盘上的文件保持原样
            --allow-jump        允许跳到不在回退路径上的版本，包括仅上游持有的版本
            --force             丢弃未记录的改动或结束合并，强制切换内容
            --offline           不连接保险库，只使用本地已有的内容与版本
            --concurrency <N>   用 N 条连接同时传输内容（默认 4）

        将 `路径` 在布局中记录的版本指针回退，该版本的内容会随指针写回文件
        `路径` 必须是布局记录过的本地路径，`--until` 指定回退到的位置，默认回退一个版本
        本地索引没有的版本会先从布局所跟踪的保险库取回，再移动指针；`--offline` 时拒绝这样做
        `--only-index` 只移动指针、不碰磁盘上的文件
        `--force` 与它语义相反，不能同时给出

  description:
    en: Move a file's recorded version back
    zh-CN: 回退文件记录的版本

  result_retracked:
    en: "path %{path} retracked to %{version}"
    zh-CN: "路径 %{path} 已回退至 %{version}"

  result_retracked_index:
    en: "path %{path} retracked to %{version}, index only"
    zh-CN: "路径 %{path} 已回退至 %{version}（仅索引）"

  result_unchanged:
    en: "path %{path} is already at %{version}"
    zh-CN: "路径 %{path} 已处于 %{version}"

  result_unchanged_switched:
    en: "path %{path} is already at %{version}, content switched"
    zh-CN: "路径 %{path} 已处于 %{version}（内容已切换）"

  err_no_file:
    en: Please name the file whose version is to be moved back
    zh-CN: 请指定要回退版本的文件

  err_no_file_help:
    en: |
        Please name the single file whose version pointer is to move; see `rola retrack --help` for usage
    zh-CN: |
        请指定要移动版本指针的单个文件，用法见 `rola retrack --help`

  err_many_files:
    en: "`rola retrack` moves one file at a time, but %{count} were named"
    zh-CN: "`rola retrack` 一次只能回退一个文件，却指定了 %{count} 个"

  err_many_files_help:
    en: |
        Please name exactly one file
        Run the command once for each file whose pointer is to move
    zh-CN: |
        请只指定一个文件
        每个要移动指针的文件各运行一次

  err_flags:
    en: "The requirements of `--force` and `--only-index` contradict each other"
    zh-CN: "`--force` 与 `--only-index` 的要求相互矛盾"

  err_flags_help:
    en: |
        Please use `--force` to discard the file's current content and switch, or `--only-index` to only move the pointer and leave the file as it is
    zh-CN: |
        请用 `--force` 丢弃文件现有内容并切换，或用 `--only-index` 只移动指针、保持文件不变

  err_modified:
    en: "`%{path}` has changes never recorded"
    zh-CN: "`%{path}` 有从未记录的改动"

  err_modified_help:
    en: |
        Please record them with `rola track`, or add `--force` to discard them and switch the content, or add `--only-index` to only move the pointer and leave them in place
    zh-CN: |
        请用 `rola track` 记录它们，或加 `--force` 丢弃它们并切换内容，或加 `--only-index` 只移动指针、把它们留在原处

  err_merging:
    en: "`%{path}` has the variant `%{variant}` waiting to be joined into it"
    zh-CN: "`%{path}` 有变体 `%{variant}` 等待合并进来"

  err_merging_help:
    en: |
        Please record this merge with `rola track`, or add `--force` to end the merge, remove the variant file and switch the content
        `--only-index` cannot end a merge
    zh-CN: |
        请用 `rola track` 记录这次合并，或加 `--force` 结束合并、删除变体文件并切换内容
        `--only-index` 无法结束合并

  err_not_local:
    en: "`%{path}` is not a local path; `rola retrack` only takes a file in this Workspace"
    zh-CN: "`%{path}` 不是本地路径，`rola retrack` 只接受本工作区中的文件"

  err_not_local_help:
    en: |
        `Uuid`, hash and remote names are read by other commands, not this one
    zh-CN: |
        `Uuid`、哈希与远程名称由其它命令读取，而不是本命令

  err_outside_workspace:
    en: "`%{path}` is not inside this Workspace"
    zh-CN: "`%{path}` 不在本工作区之内"

  err_inside_data:
    en: "`%{path}` is part of the Workspace's own data, not its work content"
    zh-CN: "`%{path}` 属于工作区自身的数据，而非其工作内容"

  err_inside_data_help:
    en: |
        Please name files that sit inside the Workspace and are not under `.rola`
    zh-CN: |
        请指定位于工作区内、且不在 `.rola` 之下的文件

  err_not_recorded:
    en: "The Layout records no entry at `%{path}`"
    zh-CN: "布局没有在 `%{path}` 记录任何条目"

  err_not_recorded_help:
    en: |
        Only a path the Layout records has a version pointer to move
        `rola entries` can list them
    zh-CN: |
        只有布局记录过的路径才有版本指针可移动
        `rola entries` 可列出它们

  err_nothing:
    en: "`%{path}` was never recorded, and there is no version to go back to"
    zh-CN: "`%{path}` 从未被记录过，没有可回退的版本"

  err_nothing_help:
    en: |
        Please record it first with `rola track`
    zh-CN: |
        请先用 `rola track` 记录它

  err_not_a_level:
    en: "`%{until}` is not a version to go back to"
    zh-CN: "`%{until}` 不是可以回退到的版本"

  err_not_a_level_help:
    en: |
        `--until` accepts `-1`, `~N`, a version number `N`, a version's hash, or a Vault's name
        A level that begins with `-` goes with the flag: `--until=-1`
    zh-CN: |
        `--until` 接受 `-1`、`~N`、版本号 `N`、版本的哈希，或保险库名
        以 `-` 开头的层级要跟标志写在一起：`--until=-1`

  err_out_of_chain:
    en: "`%{until}` is outside the range of the version chain `%{path}` is at"
    zh-CN: "`%{until}` 超出了 `%{path}` 所在版本链的范围"

  err_out_of_chain_help:
    en: |
        `rola status <PATH>` can draw the version chain and the number each version carries
    zh-CN: |
        用 `rola status <PATH>` 可以画出该版本链与各版本的编号

  err_not_a_version:
    en: "`%{until}` is not a version in this index"
    zh-CN: "`%{until}` 不是本索引中的版本"

  err_not_a_version_help:
    en: |
        Please give the hash of a **Version**
        `rola status <PATH>` prints the versions a file has been at
    zh-CN: |
        请给出 **版本** 的哈希
        `rola status <路径>` 会打印该文件经历过的版本

  err_not_ancestor:
    en: "Going back from the version `%{path}` is now at cannot reach `%{until}`"
    zh-CN: "从 `%{path}` 当前版本往回走不到 `%{until}`"

  err_not_ancestor_help:
    en: |
        If the pointer really must move to that version, add `--allow-jump`
    zh-CN: |
        确需移动指针到该版本，请加上 `--allow-jump`

  err_upstream:
    en: "The Vault `%{vault}` records no version for `%{path}`"
    zh-CN: "保险库 `%{vault}` 没有为 `%{path}` 记录任何版本"

  err_upstream_help:
    en: |
        Please fetch its Layout with `rola layout fetch` and confirm it records the file
    zh-CN: |
        请用 `rola layout fetch` 取回其布局，并确认其中记录了该文件

  err_no_store:
    en: This run has no store to take the content from
    zh-CN: 本运行没有可用于取出内容的仓库

  err_no_index:
    en: This run has no version control index to read the version from
    zh-CN: 本运行没有可用于读取版本的版本控制索引

  err_no_vault:
    en: The Layout tracks no Vault, so the version cannot be brought here
    zh-CN: 布局未跟踪任何保险库，无法取回该版本

  err_failed:
    en: "The version pointer could not be moved: %{reason}"
    zh-CN: "无法移动版本指针：%{reason}"

  err_failed_help:
    en: |
        Please check that the store, the index and the Layout are writable, then try again
    zh-CN: |
        请检查仓库、索引与布局是否可写，然后重试
