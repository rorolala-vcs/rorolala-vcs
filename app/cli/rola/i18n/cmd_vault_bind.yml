_version: 2

vault_bind:
  complete:
    set_default:
      en: Also set the name as the Vault the Workspace reaches for by default
      zh-CN: 同时设为工作区默认使用的保险库
  help:
    en: |
        Bind a name to a Vault address

        **Usage**: rola vault bind <NAME> <ADDR>
        **Flags**:
            --set-default    Also set the name as the Vault the Workspace reaches for by default

        Binding the same name again changes what it means
        The address may be a host and a port, such as `127.0.0.1:7000`, or a full link `rola://<host>[:<port>]/<sub-vault>`
    zh-CN: |
        将名字绑定到保险库地址

        **用法**：rola vault bind <名字> <地址>
        **标识**：
            --set-default    同时把该名字设为工作区默认使用的保险库

        重复绑定同一个名字即修改其含义
        地址可以是主机与端口，如 `127.0.0.1:7000`，也可以是完整链接 `rola://<host>[:<port>]/<sub-vault>`

  cmd_vault_bind_description:
    en: Bind a name to a Vault address
    zh-CN: 将名字绑定到保险库地址

  result_bound:
    en: Bound %{name} to %{address}
    zh-CN: 已将 %{name} 绑定到 %{address}

  result_changed:
    en: Changed %{name} from %{previous} to %{address}
    zh-CN: 已将 %{name} 从 %{previous} 改为 %{address}

  err_address_missing:
    en: An address is required
    zh-CN: 缺少保险库地址

  err_address_missing_help:
    en: |
        Please give a Vault address, for example `rola vault bind origin 127.0.0.1:7000` or `rola bind 127.0.0.1:7000`
    zh-CN: |
        请给出保险库地址，例如 `rola vault bind origin 127.0.0.1:7000` 或 `rola bind 127.0.0.1:7000`

  err_address_invalid:
    en: "`%{address}` is not an address"
    zh-CN: "`%{address}` 不是有效的保险库地址"

  err_address_invalid_help:
    en: |
        Please write it as a host and a port, such as `127.0.0.1:7000` or `localhost:7000`, or as a link, such as `rola://127.0.0.1:7000/alpha`
    zh-CN: |
        请写成主机与端口，例如 `127.0.0.1:7000` 或 `localhost:7000`，也可写成链接，例如 `rola://127.0.0.1:7000/alpha`
