_version: 2

entries:
  complete:
    remote:
      en: Read the Vault's own Layout instead of the one being worked in
      zh-CN: 读取保险库自己的布局，而非当前工作的布局
  help:
    en: |
        List the paths a Layout names, one per line

        **Usage**: rola entries
        **Flags**:
            --remote    Read the Vault's own Layout instead of the one being worked in

        By default, read the Layout currently in use
        Use `--remote` to read the **already cached** remote Layout
    zh-CN: |
        列出布局命名的路径，一行一个

        **用法**：rola entries
        **标识**：
            --remote    读取保险库自己的布局，而非当前工作的布局

        默认读取当前使用的布局
        使用 `--remote` 读取 **已经缓存** 的远程布局

  description:
    en: List the paths a Layout names
    zh-CN: 列出布局命名的路径

  err_no_track:
    en: The Layout being worked in tracks no Vault
    zh-CN: 当前使用的布局没有追踪任何保险库

  err_no_track_help:
    en: |
        Please name one with `rola layout set-track <LAYOUT> <VAULT>`, then try again
    zh-CN: |
        请用 `rola layout set-track <布局> <保险库>` 指定一个保险库，然后重试
