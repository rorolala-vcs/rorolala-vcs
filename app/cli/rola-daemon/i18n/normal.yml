_version: 2

listen:
  help:
    en: |
        Serve this Vault as its daemon

        **Usage**: `rola-daemon listen`

        The Vault the current directory is inside is served: the daemon binds the port in
        `vault.toml` — 7717 unless the Vault says otherwise — and runs every action a
        Workspace asks for. It stops on Ctrl-C.
    zh-CN: |
        作为本保险库的守护进程持续服务

        **用法**：`rola-daemon listen`

        服务当前目录所在的保险库：守护进程绑定 `vault.toml` 中的端口（默认为 7717），
        并执行工作区请求的每一个动作。按 Ctrl-C 停止。

  cmd_listen_description:
    en: Serve this Vault as a daemon
    zh-CN: 作为守护进程服务本保险库

  err_vault_not_exist:
    en: Vault does not exist
    zh-CN: 保险库不存在

  err_vault_not_exist_help:
    en: |
        Please check whether this directory has been initialized using `rola create` or `rola init`
    zh-CN: |
        请检查该目录是否已经使用 `rola create` 或 `rola init` 初始化

  err_config_unreadable:
    en: Failed to read the vault configuration at %{path}
    zh-CN: 无法读取位于 %{path} 的保险库配置

  err_config_unreadable_help:
    en: |
        Please check that the vault configuration file exists and is readable
    zh-CN: |
        请检查保险库配置文件是否存在且可读

  result_stopped:
    en: Daemon stopped
    zh-CN: 守护进程已停止
