[package]
name = "rola-daemon"
version.workspace = true
edition.workspace = true

[dependencies]
librorolala.workspace = true
rorolala-cli-setups.workspace = true
rorolala-daemon.workspace = true
rorolala-errors.workspace = true
rorolala-utils-cli-theme.workspace = true
rorolala-utils-configure.workspace = true
rorolala-utils-constants.workspace = true
rorolala-utils-lazyffi.workspace = true
rorolala-utils-location.workspace = true
rorolala-vault.workspace = true
colored.workspace = true
mingling.workspace = true
rust-i18n.workspace = true
serde.workspace = true
serde_json.workspace = true

# The program's own icon, linked into the Windows executable and nowhere else: the resource
# compiler is the platform's, so the build script reaches for this only where there is one. The icon
# itself is drawn by `rorolala-utils-icons`'s build script, which is depended on so that it has run
# before this program's build script links one in.
[target.'cfg(windows)'.build-dependencies]
embed-resource.workspace = true
rorolala-utils-icons.workspace = true
