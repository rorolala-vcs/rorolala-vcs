_version: 2

# What the File System browser says. Every key is namespaced by the plugin's identity — the id with
# dots underscored — which is the convention that keeps two plugins' keys apart.

rorolala_file_system:
  name:
    en: File System
    zh-CN: 文件系统
  directories:
    en: Directories
    zh-CN: 目录
  tree:
    en: Folder Tree
    zh-CN: 文件导览
  navigation:
    en: Navigation
    zh-CN: 导航

  # What the table's columns are headed. The permissions column is not shown where the system carries
  # no such thing, so its key is only ever asked for on a system that has one.
  column_icon:
    en: Icon
    zh-CN: 图标
  column_name:
    en: Name
    zh-CN: 名字
  column_permissions:
    en: Permissions
    zh-CN: 权限
  column_modified:
    en: Modified
    zh-CN: 修改时间
  column_size:
    en: Size
    zh-CN: 大小

  root:
    en: Root
    zh-CN: 根目录
  set_base:
    en: Set as Base
    zh-CN: 设为基准
  collapse_all:
    en: Collapse All
    zh-CN: 全部折叠
  computer:
    en: This PC
    zh-CN: 此电脑

  open:
    en: Open
    zh-CN: 打开
  reveal:
    en: Show in File Manager
    zh-CN: 在文件管理器中显示
  copy_path:
    en: Copy Path
    zh-CN: 复制路径
  refresh:
    en: Refresh
    zh-CN: 刷新

  not_a_directory:
    en: "`%{path}` is not a directory"
    zh-CN: "`%{path}` 不是目录"
