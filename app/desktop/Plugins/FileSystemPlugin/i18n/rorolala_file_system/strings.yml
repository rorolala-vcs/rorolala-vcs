_version: 2

# What the File System browser says. Every key is namespaced by the plugin's identity — the id with
# dots underscored — which is the convention that keeps two plugins' keys apart.

rorolala_file_system:
  name:
    en: File System
    zh-CN: 文件系统
  directories:
    en: Directories
    zh-CN: 目录
  tree:
    en: Folder Tree
    zh-CN: 文件导览

  # What the table's columns are headed. The permissions column is not shown where the system carries
  # no such thing, so its key is only ever asked for on a system that has one.
  column_icon:
    en: Icon
    zh-CN: 图标
  column_name:
    en: Name
    zh-CN: 名字
  column_permissions:
    en: Permissions
    zh-CN: 权限
  column_modified:
    en: Modified
    zh-CN: 修改时间
  column_size:
    en: Size
    zh-CN: 大小

  # What a listing says where there is nothing in the directory to read.
  empty:
    en: This folder is empty
    zh-CN: 此文件夹为空

  # What the switch in a listing's corner says: whether what the rules hide is shown, drawn fainter. It is a
  # question of its own rather than a rule like the ones below — the rules say what is hidden, this says
  # whether the user is looking at it.
  hidden:
    en: Show hidden
    zh-CN: 显示隐藏项

  # What the dropdown beside the switch says and holds: which rules hide what, each of them a box the user
  # ticks. What each rule hides is on the branch below, because a dependent plugin offers one of its own
  # beside them and a listing's label is the name of whichever is in force.
  hidden_none:
    en: Nothing hidden
    zh-CN: 不隐藏
  hidden_many:
    en: "%{count} hide rules"
    zh-CN: "%{count} 条隐藏规则"

  # What each hide rule hides, and the name of the setting the choice is kept in. The names are the user's
  # words for the rules rather than the type names, because they are what a listing and the preference panel
  # show.
  hides:
    providers:
      en: Hide rules
      zh-CN: 隐藏规则
    dot_file:
      en: Hide files whose name begins with a dot
      zh-CN: 隐藏 . 开头的文件
    dot_dir:
      en: Hide directories whose name begins with a dot
      zh-CN: 隐藏 . 开头的目录
    windows_hidden:
      en: Hide what Windows marks as hidden
      zh-CN: 隐藏 Windows 隐藏文件

  # What the toggle beside it says: whether this dock follows the location the whole File System is looking
  # at, or is looked at on its own.
  sync:
    en: Sync
    zh-CN: 同步

  root:
    en: Root
    zh-CN: 根目录
  set_base:
    en: Set as Base
    zh-CN: 设为基准
  collapse_all:
    en: Collapse All
    zh-CN: 全部折叠
  computer:
    en: This PC
    zh-CN: 此电脑

  open:
    en: Open
    zh-CN: 打开
  reveal:
    en: Show in File Manager
    zh-CN: 在文件管理器中显示
  copy_path:
    en: Copy Path
    zh-CN: 复制路径
  copy:
    en: Copy
    zh-CN: 复制
  cut:
    en: Cut
    zh-CN: 剪切
  paste:
    en: Paste
    zh-CN: 粘贴

  # Removing is the one thing that cannot be taken back, so it is the one thing the plain key asks about. The
  # question is worded here and shown by the host, which is what keeps a plugin from building a window.
  delete:
    en: Delete
    zh-CN: 删除
  delete_one:
    en: "Delete `%{name}`? This cannot be undone."
    zh-CN: "确定删除 `%{name}` 吗？此操作不可撤销。"
  delete_many:
    en: "Delete the %{count} selected items? This cannot be undone."
    zh-CN: "确定删除选中的 %{count} 项吗？此操作不可撤销。"

  # Renaming edits the name where the entry is drawn, so the menu and the key both lead to the same box.
  rename:
    en: Rename
    zh-CN: 重命名

  # A new folder is made with a name that is free, and the row it makes is where the user types the name
  # they wanted: the plugin cannot ask for one, since the host's dialog carries no field.
  new_folder:
    en: New folder
    zh-CN: 新建文件夹
  new_folder_name:
    en: New folder
    zh-CN: 新建文件夹

  # What a file operation says when the command it ran did not finish cleanly. The command's own error
  # stream goes under this heading, unphrased: the program is the user's, and its words are its own.
  command_failed:
    en: The command did not finish
    zh-CN: 命令未能完成

  # What the file operations are carried out with. The commands are the system's tools rather than this
  # program's, which is why they are settings: a system that keeps them elsewhere, or a user who prefers
  # another, says so here. The four are filled together by choosing a preset, or each by hand.
  setting:
    operations:
      en: File operations
      zh-CN: 文件操作
    # What the presets above the four commands are called. Windows and Unix are this plugin's own; a
    # dependent plugin adds its own beside them, and Custom is always last — the way to set each command
    # by hand, shown whenever the four match none of the presets.
    preset:
      windows:
        en: Windows file operations
        zh-CN: Windows 文件操作
      unix:
        en: Unix & Linux file operations
        zh-CN: Unix & Linux 文件操作
      custom:
        en: Custom
        zh-CN: 自定义
    copy:
      en: Copy command
      zh-CN: 复制命令
    move:
      en: Move command
      zh-CN: 移动命令
    remove_dirs:
      en: Remove directory command
      zh-CN: 删除目录命令
    remove_files:
      en: Remove file command
      zh-CN: 删除文件命令
  refresh:
    en: Refresh
    zh-CN: 刷新

  not_a_directory:
    en: "`%{path}` is not a directory"
    zh-CN: "`%{path}` 不是目录"

  # What the conflict window says when a name is already taken. The window is shown over the host's main
  # window (Section 7.5), so the words are the plugin's while the window is the host's.
  conflict:
    title:
      en: File conflict
      zh-CN: 文件冲突
    message:
      en: "Writing `%{source}` to `%{target}` would overwrite something already there."
      zh-CN: "把 `%{source}` 写入 `%{target}` 会覆盖那里已有的内容。"
    # What is said where the thing the name is taken by is the thing being written, which is what copying an
    # entry into the directory it already sits in is. Replacing has no meaning there, so the window does not
    # offer it.
    itself:
      en: "`%{name}` is what is being written, and where it would go is where it already is: a second of it goes beside it, under a new name."
      zh-CN: "`%{name}` 就是要写入的东西，而它要去的地方就是它自己所在之处：它的副本会落到旁边的一个新名字下。"
    apply_remaining:
      en: Apply to the remaining %{count}
      zh-CN: 对剩余的 %{count} 项同样处理
    replace:
      en: Replace
      zh-CN: 替换
    skip:
      en: Skip
      zh-CN: 跳过
    rename:
      en: Rename
      zh-CN: 重命名
    cancel:
      en: Cancel
      zh-CN: 取消
