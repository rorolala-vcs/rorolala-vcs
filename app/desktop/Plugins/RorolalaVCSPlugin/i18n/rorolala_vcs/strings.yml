_version: 2

# What the Rorolala plugin says. What it adds to the browser is one preset to the File System
# plugin's settings and one column to its listing, and what it shows of its own is its three docks;
# its words are the plugin's name, that preset's name, what a lock reads as, what each of the docks
# is called, and every line the Overview draws — which is the reading `rola status` makes, said in
# that command's own words. Every key is namespaced by the plugin's identity — the id with dots
# underscored.

rorolala_vcs:
  name:
    en: Rorolala VCS
    zh-CN: Rorolala 版本管理

  # What the plugin's three docks are called where the Window menu lists them. They are the views of
  # the work, each named for what it will show rather than for what it shows today.
  dock:
    overview:
      en: Overview
      zh-CN: 总览
    workspace:
      en: Workspace
      zh-CN: 工作区
    version_graph:
      en: Version Graph
      zh-CN: 版本图

  # What each of the three says while the directory the tree is rooted at is not one a Workspace
  # holds: there is nothing under such a place for them to show, and a blank view of the work would
  # read as a work with nothing in it. The base is the File System plugin's, which is why the words
  # name a base directory rather than the work.
  not_a_workspace:
    en: The current base directory is not a Rorolala Workspace
    zh-CN: 当前基础目录并非 Rorolala Workspace

  # What the Overview says while a Workspace holds the base and still answers nothing: a Workspace that
  # works in no Layout and one whose work cannot be read both come to this, and neither is the base
  # being somewhere else. What the reason was is in the log; what the window can say is that there is
  # nothing to show.
  status_unreadable:
    en: The state of the work under the current base directory could not be read
    zh-CN: 无法读取当前基础目录下工作的状态

  # What the Overview draws. These are the panel's own words rather than the command line's: what a
  # command prints is a report meant to be read once and acted on by typing, and what a panel says is
  # meant to be looked at. So there is no mention of a command here, and the reading behind it is the
  # command line's only in what it found, not in how it is said.
  #
  # The panel is one table of the changes: a row is one thing the reading says about one path, and the
  # three columns are what each path's state is — the kind of change it is and what became of its
  # content, one pill each — where it comes from, and where it goes. A cell is empty where there is
  # nothing on that side of the change, which is what makes a lost path and an untagged one read apart:
  # the one comes from somewhere and goes nowhere, and the other the reverse.
  #
  # What the table cannot show is said in the middle of the dock, in one line: that there is nothing to
  # confirm, or that a work there is could not be read.
  status:
    clean:
      en: Nothing to confirm
      zh-CN: 没有要确认的内容

    # What the command in the dock's own strip offers: read the work again now, rather than wait for the
    # reading the dock makes by itself — which is what a reader wants after saving in another program.
    refresh:
      en: Refresh
      zh-CN: 刷新

    # What the columns are called, which is the band over the rows. The first is what each path's state is —
    # the kind of change it is and what became of its content, one pill each — and the other two are the
    # paths a change is between, one of which is empty where the change has no such side.
    column_state:
      en: State
      zh-CN: 状态
    column_from:
      en: From
      zh-CN: 从
    column_to:
      en: To
      zh-CN: 至

    # What kind of change a row is. A change of content alone has no kind and says so by being blank:
    # what happened to it is in the last column, which is the one every row has something in.
    kind_lost:
      en: Lost
      zh-CN: 丢失
    kind_untagged:
      en: Untagged
      zh-CN: 未标记
    kind_rename_weak:
      en: Rename (likely)
      zh-CN: 重命名（可能）
    kind_rename_strong:
      en: Rename (certain)
      zh-CN: 重命名（一定）
    kind_merge:
      en: Merge
      zh-CN: 合并

    # What became of a row's content.
    change_modified:
      en: Changed
      zh-CN: 修改
    change_unchanged:
      en: Unchanged
      zh-CN: 未修改
    change_wrong_unowned:
      en: "Wrong change: not yours"
      zh-CN: 错误修改（不持有）
    change_wrong_base:
      en: "Wrong change: base has moved"
      zh-CN: 错误修改（基准版本错误）

    # What a merge says in the last column: the variant waiting, where its file went when it moved, and
    # why a merge cannot go on. A merge has no content change of its own — what settles it is the two
    # files being joined — so the column carries what the row would otherwise have to leave out.
    merge_variant:
      en: "variant "
      zh-CN: 变体
    merge_moved:
      en: moved to %{path}
      zh-CN: 移动至 %{path}
    merge_broken:
      en: "cannot go on: "
      zh-CN: "无法继续："

    # Why a merge cannot go on. The reason is what the reading found; the words for it are this panel's,
    # and the value is the variant, as the hex it is named by, or the path its file lies at.
    broken_no_target:
      en: the file it is for is no longer named by the Layout
      zh-CN: 它要并入的文件已不再被布局命名
    broken_no_place:
      en: nowhere here can hold its variant file
      zh-CN: 本地没有可以放置其变体文件的位置
    broken_file_gone:
      en: the variant file %{path} is gone
      zh-CN: 变体文件 %{path} 已不存在
    broken_no_index:
      en: there is no index to read the variant from
      zh-CN: 没有可读取该变体的索引
    broken_no_variant:
      en: the index does not hold that variant
      zh-CN: 索引中没有该变体
    broken_unreadable:
      en: the variant file could not be read
      zh-CN: 无法读取该变体文件
    broken_changed:
      en: the variant file no longer holds the variant's content
      zh-CN: 该变体文件已不再持有变体的内容
    broken_unknown:
      en: this build does not know why it cannot go on
      zh-CN: 本版本不知道它为何无法继续

  # What the preset is called where the File System plugin's settings offer it: Rorolala's own file
  # operations, the commands of `rola fs-ops`.
  setting:
    preset:
      en: Rorolala file operations
      zh-CN: Rorolala 文件操作

  # What the Ownership column is headed. The column is only there where Rorolala answers — a
  # directory inside a Workspace whose Layout tracks a Vault — and what it says about one entry is
  # below, a held entry's holder being a name rather than a phrase and so not translated at all.
  column_ownership:
    en: Ownership
    zh-CN: 所有权

  # What the Upstream column is headed: where the Vault names the entry the work names here. The
  # column is only there where Rorolala answers, and it says nothing about an entry the Vault's copy
  # does not name — one this side has never told it of.
  column_upstream:
    en: Upstream
    zh-CN: 上游

  # What one file of the work is, in a word. These are what the mark beside a name says when the pointer
  # rests on it rather than what is written in a column: a file is in one of a handful of states, and which
  # one is read from the colour of the mark before any word of it is read. The words are the listing's own
  # rather than the Overview's, which says more where there is room for a reason: here a change that is
  # wrong says only that it is wrong, and a file that stands as it was recorded has nothing at all.
  state:
    untagged:
      en: Untagged
      zh-CN: 未标记
    modified:
      en: Changed
      zh-CN: 修改
    wrong:
      en: Wrong change
      zh-CN: 错误修改
    renamed:
      en: Renamed
      zh-CN: 被重命名
    renamed_likely:
      en: Possibly renamed
      zh-CN: 可能被重命名
    merging:
      en: Merging
      zh-CN: 合并中

  ownership:
    mine:
      en: You
      zh-CN: 你

    # What the corner of a lock says when the pointer rests on it. A corner is a picture, so the name goes
    # in a phrase here rather than standing alone as it does in the column.
    held_by:
      en: Held by %{holder}
      zh-CN: 由 %{holder} 持有

  # What an entry's menu offers about who holds it. What is claimed is one file, or everything under a
  # directory — the command line takes a directory recursively — so the two are said apart. The forced
  # pair is shown while Shift is held: what it does is past the checks the plain pair makes, which is
  # worth saying twice, in the words and in the red the look gives it.
  ownership_menu:
    hold_file:
      en: Take ownership of this file
      zh-CN: 获得文件的所有权
    give_file:
      en: Give up ownership of this file
      zh-CN: 放弃文件的所有权
    hold_file_forced:
      en: Force taking ownership of this file
      zh-CN: 强制获得文件的所有权
    give_file_forced:
      en: Force giving up ownership of this file
      zh-CN: 强制放弃文件的所有权
    hold_directory:
      en: Take ownership of everything in this folder
      zh-CN: 获得目录下所有条目的所有权
    give_directory:
      en: Give up ownership of everything in this folder
      zh-CN: 放弃目录下所有条目的所有权
    hold_directory_forced:
      en: Force taking ownership of everything in this folder
      zh-CN: 强制获得目录下所有条目的所有权
    give_directory_forced:
      en: Force giving up ownership of everything in this folder
      zh-CN: 强制放弃目录下所有条目的所有权

  # What the menu says when the command it ran did not finish, and when there is no command to run.
  # Several entries are one run that is allowed to be partly done, so the words allow for some of it
  # having been changed and some refused; which of them, and why, is the command's own to say. This
  # window is only told which `rola` to run by the run that opened it, so a window opened on its own
  # has none to reach for.
  ownership_failed:
    en: Ownership could not be changed for everything chosen
    zh-CN: 所选条目的所有权未能全部更改
  ownership_unknown:
    en: This window was not opened by `rola`, so it does not know which one to run
    zh-CN: 本窗口不是由 `rola` 打开的，因此不知道要运行哪一个
