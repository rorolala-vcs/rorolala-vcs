_version: 2

# What the Rorolala plugin says. What it adds to the browser is one preset to the File System
# plugin's settings and one column to its listing, and what it shows of its own is its three docks;
# its words are the plugin's name, that preset's name, what a lock reads as, what each of the docks
# is called, and every line the Overview draws — which is the reading `rola status` makes, said in
# that command's own words. Every key is namespaced by the plugin's identity — the id with dots
# underscored.

rorolala_vcs:
  name:
    en: Rorolala VCS
    zh-CN: Rorolala 版本管理

  # What the plugin's three docks are called where the Window menu lists them. They are the views of
  # the work, each named for what it will show rather than for what it shows today.
  dock:
    overview:
      en: Overview
      zh-CN: 总览
    workspace:
      en: Workspace
      zh-CN: 工作区
    version_graph:
      en: Version Graph
      zh-CN: 版本图
    accounts:
      en: Accounts
      zh-CN: 账户管理

  # What the Version Graph says when it has nothing to draw: no file has been clicked yet, or the
  # file that was has no chain of versions recorded for it. The two are different answers — one is
  # waiting for a click and the other is the click's whole answer — so they are two keys.
  version_graph:
    no_file:
      en: Click a file in Directories to see its version history
      zh-CN: 在“目录”中点击一个文件以查看其版本历史
    no_history:
      en: This file has no version history
      zh-CN: 该文件没有版本历史

    # What stands in place of the graph when the choice holds several files: one chain is one file's,
    # and a choice of many has no one chain to draw. The row under it still acts on the choice.
    many_files:
      en: The version graph is hidden when multiple files are selected
      zh-CN: 多个文件选择时将隐藏版本图

    # What the switch in the graph's corner is hovered for: it shows the variants the chain draws
    # nowhere, asked of the command line since the graph's own reading reaches only what a link reaches.
    show_unjoined:
      en: Show unjoined variants
      zh-CN: 显示未闭合的变体

    # What a right-click on a node offers: the index's name for it, copied whole. Versions and
    # variants are words of their own, so the two are two items rather than one.
    copy_version_hash:
      en: Copy version hash
      zh-CN: 复制版本哈希
    copy_variant_hash:
      en: Copy variant hash
      zh-CN: 复制变体哈希

    # What a right-click on a version offers besides the hash: moving the file's recorded version to
    # the node it was opened on. The plain one writes that version's content back over the file as
    # well, so it is confirmed first; the second moves the record and leaves the work alone.
    retrack:
      en: Retrack
      zh-CN: 重新追踪
    retrack_only_index:
      en: Retrack (version only)
      zh-CN: 重新追踪（仅版本）
    retrack_confirm_title:
      en: Retrack this file?
      zh-CN: 要重新追踪该文件吗？
    retrack_confirm_message:
      en: "`%{file}` will be replaced with the content of version %{version}. Confirm?"
      zh-CN: "`%{file}` 的内容将被替换为版本 %{version} 的内容。请确认。"
    retrack_failed:
      en: The file could not be retracked
      zh-CN: 未能重新追踪该文件

    # What the row under the graph offers: a message for the version an unrecorded edit would make,
    # and the button that records it. The field is always there; the button is pressable only while
    # the file on screen has an edit and something was written for it. A graph whose work and Vault
    # have parted asks for Shift as well, and says so on the button.
    track:
      en: TRACK
      zh-CN: 追踪
    track_hint:
      en: Message for the new version
      zh-CN: 新版本的说明
    track_tip:
      en: Record the unrecorded change as a new version
      zh-CN: 将未记录的修改记录为新版本
    track_diverged:
      en: some chosen changes have parted from the Vault's chain and will be confirmed first
      zh-CN: 选中的部分修改已与保险库的链分叉，追踪前会再次确认
    track_diverged_title:
      en: Track changes that parted from the Vault?
      zh-CN: 要追踪已与保险库分叉的修改吗？
    track_diverged_message:
      en: "Tracking these files makes versions the Vault's chain does not carry: %{files}. Confirm?"
      zh-CN: "追踪以下文件会创建保险库链中不包含的版本：%{files}。请确认。"
    track_failed:
      en: The file could not be tracked
      zh-CN: 未能追踪该文件

    # What a right-click on an unjoined variant offers: making it the merge waiting on the file. It is
    # offered only while the file is not already in a merge, since a second one has nowhere to go.
    join_variant:
      en: Join Variant
      zh-CN: 合并该变体
    join_failed:
      en: The variant could not be joined
      zh-CN: 未能合并该变体

    # What a right-click on the ??? node offers: dropping the change the working file holds and
    # putting it back to the version the Layout names. Nothing else holds that content, so it is
    # always asked first.
    delete_changes:
      en: Delete Changes
      zh-CN: 删除变更
    delete_changes_confirm_title:
      en: Delete the unrecorded changes?
      zh-CN: 要删除未记录的修改吗？
    delete_changes_confirm_message:
      en: "`%{file}` will be put back to the version the Layout records. Confirm?"
      zh-CN: "`%{file}` 将还原到布局记录的版本。请确认。"
    delete_changes_failed:
      en: The changes could not be deleted
      zh-CN: 未能删除变更

    # What a right-click on a variant drawn as work under way offers: ending the merge that variant is
    # waiting for. Both end it the same way — the variant file goes and the record with it — and differ
    # in what the main file is left holding: the plain one puts it back to the version the Layout names,
    # the other leaves the work as it is. The variant file is the merge's, not the file's, so the
    # question names the main file the reader right-clicked beside.
    cancel_merge:
      en: Cancel Merge
      zh-CN: 取消合并
    cancel_merge_keep:
      en: Cancel Merge (Keep Content)
      zh-CN: 取消合并（保留内容）
    cancel_merge_confirm_title:
      en: Cancel the merge?
      zh-CN: 要取消合并吗？
    cancel_merge_confirm_message:
      en: "The variant waiting for `%{file}` will be taken away, and `%{file}` will be put back to the version the Layout records. Confirm?"
      zh-CN: "将移除等待 `%{file}` 的变体，并把 `%{file}` 还原到布局记录的版本。请确认。"
    cancel_merge_keep_confirm_message:
      en: "The variant waiting for `%{file}` will be taken away, and the unrecorded work in `%{file}` will be kept. Confirm?"
      zh-CN: "将移除等待 `%{file}` 的变体，`%{file}` 中未记录的内容将保留。请确认。"
    cancel_merge_failed:
      en: The merge could not be cancelled
      zh-CN: 未能取消合并

    # What the Vault's version says on hover when the version itself is not in this index: a fetch
    # brings the Vault's Layout and never its versions, so there is a hash to name but no chain or
    # words to draw.
    upstream_unknown:
      en: This version is recorded by the Vault, but it is not in the local index
      zh-CN: 该版本由上游记录，但不在本地索引中

  # What each of the three says while the directory the tree is rooted at is not one a Workspace
  # holds: there is nothing under such a place for them to show, and a blank view of the work would
  # read as a work with nothing in it. The base is the File System plugin's, which is why the words
  # name a base directory rather than the work.
  not_a_workspace:
    en: The current base directory is not a Rorolala Workspace
    zh-CN: 当前基础目录并非 Rorolala Workspace

  # What the Overview says while a Workspace holds the base and still answers nothing: a Workspace that
  # works in no Layout and one whose work cannot be read both come to this, and neither is the base
  # being somewhere else. What the reason was is in the log; what the window can say is that there is
  # nothing to show.
  status_unreadable:
    en: The state of the work under the current base directory could not be read
    zh-CN: 无法读取当前基础目录下工作的状态

  # What the Overview draws. These are the panel's own words rather than the command line's: what a
  # command prints is a report meant to be read once and acted on by typing, and what a panel says is
  # meant to be looked at. So there is no mention of a command here, and the reading behind it is the
  # command line's only in what it found, not in how it is said.
  #
  # The panel is one table of the changes: a row is one thing the reading says about one path, and the
  # three columns are what each path's state is — the kind of change it is and what became of its
  # content, one pill each — where it comes from, and where it goes. A cell is empty where there is
  # nothing on that side of the change, which is what makes a lost path and an untagged one read apart:
  # the one comes from somewhere and goes nowhere, and the other the reverse.
  #
  # What the table cannot show is said in the middle of the dock, in one line: that there is nothing to
  # confirm, or that a work there is could not be read.
  status:
    clean:
      en: Nothing to confirm
      zh-CN: 没有要确认的内容

    # What the command in the dock's own strip offers: read the work again now, rather than wait for the
    # reading the dock makes by itself — which is what a reader wants after saving in another program. What it
    # brings first is the Vault's Layout, so that what it reads is what upstream holds now.
    refresh:
      en: Refresh
      zh-CN: 刷新

    # What the columns are called, which is the band over the rows. The first is what each path's state is —
    # the kind of change it is and what became of its content, one pill each — and the other two are the
    # paths a change is between, one of which is empty where the change has no such side.
    column_state:
      en: State
      zh-CN: 状态
    column_from:
      en: From
      zh-CN: 从
    column_to:
      en: To
      zh-CN: 至
    # What the column of buttons is called. Every row has it and most rows have something in it, so the band
    # names it rather than leaving it to be guessed at from the buttons below it.
    column_operations:
      en: Operations
      zh-CN: 操作

    # What kind of change a row is. A change of content alone has no kind and says so by being blank:
    # what happened to it is in the last column, which is the one every row has something in.
    #
    # These are what a pill is hovered for rather than what is written on it, since what is written on it is
    # one or two letters: each is the whole of what those letters mean, which is the state's name and the
    # reason for it, because a reader who has stopped at a pill is asking what it is.
    kind_lost:
      en: The record names it, but it is really not there.
      zh-CN: 在记录当中，该条目存在，但实际不存在。
    kind_untagged:
      en: The record does not name it, but it is really there.
      zh-CN: 在记录当中，该条目不存在，但实际存在。
    kind_rename_weak:
      en: A lost and an untagged one that may be a move, which has to be confirmed.
      zh-CN: 产生了一对丢失和未标记，可能为一组移动，需要确认。
    kind_rename_strong:
      en: A lost and an untagged one whose content matches, so it is a move.
      zh-CN: 产生了一对丢失和未标记，它们内容一致，推断为移动。
    kind_merge:
      en: A variant is waiting to be joined in.
      zh-CN: 有一个变体等待合并。

    # What a sync would do about a path, which is the last group of the table: a file that is in step with nothing
    # wrong about it is still one a sync would send or fetch, and a reader wants to know which before pressing it.
    # The letters are the pill's, and what is held here is what it is hovered for.
    #
    # The two that carry a count are said with it where the index can count the versions between the two sides, and
    # without it otherwise: what the Vault is at is ordinarily a version this side never fetched, so the count is the
    # ordinary exception rather than the rule, and a zero would read as being in step.
    kind_send:
      en: This file's version is ahead of upstream. Sync to bring it into step with upstream.
      zh-CN: 该文件的当前版本领先于上游，同步以和上游保持一致
    kind_receive:
      en: This file's version is behind upstream. Sync to bring it into step with upstream.
      zh-CN: 该文件的当前版本落后于上游，同步以和上游保持一致
    kind_create:
      en: The entry is new here. Sync to bring it into step with upstream.
      zh-CN: 该文件为新建条目，同步以和上游保持一致
    kind_diverged:
      en: The two versions have diverged from each other. A forced sync in that direction settles it.
      zh-CN: 版本产生了分叉，定向强制同步以解决冲突
    sync_ahead:
      en: This file's version is %{count} version(s) ahead of upstream. Sync to bring it into step with upstream.
      zh-CN: 该文件的当前版本领先于上游 %{count} 个版本，同步以和上游保持一致
    sync_behind:
      en: This file's version is %{count} version(s) behind upstream. Sync to bring it into step with upstream.
      zh-CN: 该文件的当前版本落后于上游 %{count} 个版本，同步以和上游保持一致

    # What became of a row's content.
    change_modified:
      en: Its content has changed.
      zh-CN: 文件内容产生了变化。
    change_wrong_unowned:
      en: Its content has changed, and it is not yours to change.
      zh-CN: 文件内容产生了变化，但是你不持有它，所以无权修改。
    change_wrong_base:
      en: Its content has changed, but the version it is based on does not match.
      zh-CN: 文件内容产生了变化，但是它的基准版本并不匹配。

    # What a merge says in the last column: why a merge cannot go on. A merge has no content change of its
    # own — what settles it is the two files being joined — so the column carries what the row would
    # otherwise have to leave out. Where the variant file moved to is not among these, because the row's
    # own columns say where the two files are: a variant file is read from where the tree holds it.
    merge_broken:
      en: "cannot go on: "
      zh-CN: "无法继续："

    # Why a merge cannot go on. The reason is what the reading found; the words for it are this panel's,
    # and the value is the variant, as the hex it is named by, or the path its file lies at.
    broken_no_target:
      en: the file it is for is no longer named by the Layout
      zh-CN: 它要并入的文件已不再被布局命名
    broken_no_place:
      en: nowhere here can hold its variant file
      zh-CN: 本地没有可以放置其变体文件的位置
    broken_file_gone:
      en: the variant file %{path} is gone
      zh-CN: 变体文件 %{path} 已不存在
    broken_no_index:
      en: there is no index to read the variant from
      zh-CN: 没有可读取该变体的索引
    broken_no_variant:
      en: the index does not hold that variant
      zh-CN: 索引中没有该变体
    broken_unreadable:
      en: the variant file could not be read
      zh-CN: 无法读取该变体文件
    broken_changed:
      en: the variant file no longer holds the variant's content
      zh-CN: 该变体文件已不再持有变体的内容
    broken_unknown:
      en: this build does not know why it cannot go on
      zh-CN: 本版本不知道它为何无法继续

  # What the preset is called where the File System plugin's settings offer it: Rorolala's own file
  # operations, the commands of `rola fs-ops`.
  setting:
    preset:
      en: Rorolala file operations
      zh-CN: Rorolala 文件操作

    # What the four colours a state is drawn in are called where they are chosen. They are hexes, and the
    # plugin reads them as colours: what a state is coloured is the state, so what is offered is the colour
    # itself rather than a name for it.
    state:
      untagged:
        en: "State: not recorded yet"
        zh-CN: 状态：尚未记录
      underway:
        en: "State: under way"
        zh-CN: 状态：进行中
      wrong:
        en: "State: must not be recorded"
        zh-CN: 状态：不可记录
      moved:
        en: "State: named elsewhere"
        zh-CN: 状态：被命名在别处

  # What the Owner column is headed: who holds the entry, which is what the column says about one. The name
  # a held entry wears is a name rather than a phrase and so is not translated at all.
  column_ownership:
    en: Owner
    zh-CN: 持有者

  # What the Upstream column is headed: where the Vault names the entry the work names here. The
  # column is only there where Rorolala answers, and it says nothing about an entry the Vault's copy
  # does not name — one this side has never told it of.
  column_upstream:
    en: Upstream
    zh-CN: 上游

  # What the Standing column is headed: how far the version recorded for the entry is from the one the Vault
  # records. It is a number rather than a word — `+2` for two versions this side has that upstream has not
  # been told of, `-1` for one upstream has that this side has not fetched — so what the sign means is said
  # here rather than in the column.
  column_standing:
    en: Standing
    zh-CN: 领先

  # What the cell of that column says when the pointer rests on it, and what a tile's badge says when it does:
  # one answer about one file, so the two read alike. What it says is what the count means and what to do about
  # it, since a number in a listing is a fact a reader has to know how to act on; the count is the one the cell
  # holds, written out in words.
  #
  # The count is not always there: a fetch brings the Vault's Layout and never its versions, so being behind is
  # ordinarily a direction with no distance, and what is said is the direction alone. Being behind is being
  # behind — how far is added to the sentence when the count is known, rather than a note about what is not.
  # Being ahead always has one, since the chain that says so is this side's own.
  standing:
    ahead:
      en: This file's version is %{count} version(s) ahead of upstream. Sync to share it with others.
      zh-CN: 该文件的当前版本领先于上游 %{count} 个版本，同步以共享给他人
    behind:
      en: This file's version is %{count} version(s) behind upstream. Sync to get the new content.
      zh-CN: 该文件的当前版本落后于上游 %{count} 个版本，同步以获得新内容
    behind_untold:
      en: This file's version is behind upstream. Sync to get the new content.
      zh-CN: 该文件的当前版本落后于上游，同步以获得新内容
    apart:
      en: This file's version is based on one upstream does not share.
      zh-CN: 该文件的当前版本基线和上游不一致

  # What one file of the work is, and what is said when the pointer rests on the mark that says it. The words
  # are the Overview's own — see `status` above — because the two are one answer about one state, and a reader
  # who has learnt what a badge means has learnt what the panel's pill means too. What is left here is the one
  # thing the panel knows and a state does not: which of the two ways a change is wrong is read from the lists
  # the reading holds, and this is the answer for a change whose reason is neither of them.
  state:
    wrong:
      en: Wrong change
      zh-CN: 错误修改

  # What a variant file is called, and what is said about it. A variant file is one the Layout does not
  # name — it holds content waiting to be joined into a file the Layout does name — so it has no name of
  # its own in either Layout, and what names it is the variant it holds.
  variant:
    # What the Upstream column says where the file is one: a column that would name the path the Vault
    # names it by names the variant instead, since that is the one thing about the file there is to say.
    named:
      en: "Variant: %{variant}"
      zh-CN: "变体：%{variant}"

    # What a merge in progress says when the pointer rests on it: the pill of a merge row, and the badge a
    # variant file's tile wears. The head of the hash is what a person recognises a variant by, and the
    # whole of it is in the Overview's reading for anything that wants it.
    pending:
      en: The variant %{variant} is being merged in
      zh-CN: 该变体 %{variant} 正在合并中

  # What the Overview's sync strip says and does. The three buttons are the command line's three directions,
  # so what each is called is what it carries rather than what it is: a reader who knows `rola sync --up-only`
  # knows the first button, and the words that name a direction are the command's own.
  #
  # `forced` is said on a button when the key that changes a run is held, and `more` is the last button of the
  # row: what a run is to leave out. The three choices under it are named for what is carried rather than for
  # the flag that leaves it out, since a box a user ticks is what a sync does.
  sync:
    up:
      en: Upload only
      zh-CN: 仅上传
    down:
      en: Update only
      zh-CN: 仅更新
    both:
      en: Sync both ways
      zh-CN: 双向同步
    forced:
      en: history may be changed (Shift held)
      zh-CN: 可改写历史（按住 Shift）
    more:
      en: What the sync is to leave out
      zh-CN: 同步要跳过的部分
    index:
      en: Sync the index
      zh-CN: 同步索引
    layout:
      en: Sync the Layout
      zh-CN: 同步布局
    storage:
      en: Sync the storage
      zh-CN: 同步存储
    confirm_title:
      en: Sync with something left out?
      zh-CN: 要跳过一部分来同步吗？
    failed:
      en: The sync could not be finished
      zh-CN: 同步未能完成
    plan_failed:
      en: The sync plan failed
      zh-CN: 同步计划失败
    no_program:
      en: This window was not opened by the command line, so it cannot run one.
      zh-CN: 这个窗口不是由命令行打开的，因此无法运行命令。
    plan_unreadable:
      en: What a sync would carry could not be read.
      zh-CN: 无法读出一次同步要搬什么。
    direction_needs_layout:
      en: Needs the Layout; a sync that leaves it out carries both ways
      zh-CN: 需要同步布局；不读布局的同步只能双向

    # What is said before a sync that leaves something out, one line per way of leaving it out and per
    # direction: what is left behind still gets written, and which part it was decides what becomes
    # inconsistent — a version the index does not hold, content the storage does not, a Layout that does not
    # say which of them a version belongs to. The ways that leave the Layout out say one thing whichever way
    # the run goes, since nothing about the Vault's Layout moves either way.
    warn_no_index_up:
      en: The Layout and the storage are synced, but not the index — so what is uploaded is written into the Vault's Layout and its storage while neither goes into the Vault's index. Confirm?
      zh-CN: 同步布局和仓库，但不同步索引，这会使上传的版本写进保险库布局、内容进保险库仓库，却都不进保险库索引，请确认。
    warn_no_index_down:
      en: The Layout and the storage are synced, but not the index — so the update fails where the local index lacks the Vault's version object. Confirm?
      zh-CN: 同步布局和仓库，但不同步索引，这会使下拉因本地索引缺少保险库的版本对象而失败，请确认。
    warn_no_index_both:
      en: The Layout and the storage are synced, but not the index — so what is uploaded does not go into the Vault's index, and the update fails where the local index lacks a version object. Confirm?
      zh-CN: 同步布局和仓库，但不同步索引，这会使上传的内容不进保险库索引、下拉因本地索引缺版本对象而失败，请确认。
    warn_no_storage_up:
      en: The Layout and the index are synced, but not the storage — so the Vault's Layout and index record a version whose content the Vault does not hold. Confirm?
      zh-CN: 同步布局和索引，但不同步仓库，这会使保险库布局与索引记下一个仓库里没有内容的版本，请确认。
    warn_no_storage_down:
      en: The Layout and the index are synced, but not the storage — so entries whose content is not here fail to update, and the Layout version is not advanced. Confirm?
      zh-CN: 同步布局和索引，但不同步仓库，这会使内容不在本地的下拉条目失败、布局版本不再推进，请确认。
    warn_no_storage_both:
      en: The Layout and the index are synced, but not the storage — so the Vault records a version whose content it does not hold, and the update fails where the local storage lacks the content. Confirm?
      zh-CN: 同步布局和索引，但不同步仓库，这会使保险库记下仓库里没有的版本、下拉因本地仓库缺内容而失败，请确认。
    warn_no_layout:
      en: The index and the storage are synced, but not the Layout — so everything in the local index is uploaded, the Vault's Layout does not move, and there is no check for overwriting. Confirm?
      zh-CN: 同步索引和仓库，但不同步布局，这会使本地索引里的全部内容被上传、保险库布局不动、没有覆盖检查，请确认。
    warn_layout_only_up:
      en: Only the Layout is synced — so the Vault's Layout records a version whose content was never uploaded, and neither the index nor the storage moves. Confirm?
      zh-CN: 仅同步布局，这会使保险库布局记下未上传内容的版本、索引与仓库都不动，请确认。
    warn_layout_only_down:
      en: Only the Layout is synced — so the update fails where the local storage lacks the content, and neither the index nor the storage moves. Confirm?
      zh-CN: 仅同步布局，这会使下拉因本地仓库缺内容而失败、索引与仓库都不动，请确认。
    warn_layout_only_both:
      en: Only the Layout is synced — so the Vault records a version whose content it does not hold, the update fails where the local storage lacks the content, and neither the index nor the storage moves. Confirm?
      zh-CN: 仅同步布局，这会使保险库记下没有内容的版本、下拉因本地仓库缺内容而失败，索引与仓库都不动，请确认。
    warn_index_only:
      en: Only the index is synced — so the two sides' indexes swap objects while neither the Layout nor the storage moves. Confirm?
      zh-CN: 仅同步索引，这会使两侧索引互换对象、布局与仓库都不动，请确认。
    warn_storage_only:
      en: Only the storage is synced — so everything in the local index is uploaded while neither the Vault's index nor its Layout moves. Confirm?
      zh-CN: 仅同步仓库，这会使本地索引里的全部内容被上传、保险库索引与布局都不动，请确认。
    warn_nothing:
      en: The Layout, the index and the storage are all left out — so this run changes nothing at all. Confirm?
      zh-CN: 不同步布局、索引和仓库，这会使本次运行不做任何改动，请确认。

  # What the dock's own refresh does besides reading the work again: it brings the Vault's Layout here, so that
  # what the columns and the reading say is what the Vault holds now rather than what it held when the copy was
  # last fetched. The fetch is the command line's, and what is said when it cannot be finished is this dock's.
  fetch:
    failed:
      en: The Vault's Layout could not be fetched
      zh-CN: 未能取回保险库布局

  # What the work's own menu offers: the upstream as a place, which is not a dock of this plugin's but an address the
  # browser opens. The root is the Layout of the Vault the work tracks — what this work is the upstream of — and the
  # two lists are a step away, so a work that tracks nothing still has somewhere to go.
  menu:
    workspace:
      en: Workspace
      zh-CN: 工作区
    root:
      en: Upstream root
      zh-CN: 上游根目录
    layouts:
      en: Layouts
      zh-CN: 布局
    vaults:
      en: Vaults
      zh-CN: 保险库
    upstream:
      en: Upstream entries
      zh-CN: 上游条目

  # What the upstream place says. It is read a level at a time — the Vaults the Workspace knows, the Layouts it works
  # in, and one Layout's entries — so the title says where in the address the reader is, and a level that cannot be
  # read says which of the ways it could not be. The commands are the command line's, and what it said is shown as it
  # said it: the words of a failure are the one thing this side does not know better.
  place:
    title:
      en: Upstream entries
      zh-CN: 上游条目
    vaults_title:
      en: "Upstream entries: Vaults"
      zh-CN: "上游条目：保险库"
    layouts_title:
      en: "Upstream entries: Layouts"
      zh-CN: "上游条目：布局"
    vault_title:
      en: "Upstream entries: %{vault}"
      zh-CN: "上游条目：%{vault}"
    layout_title:
      en: "Upstream entries: the Layout %{layout}"
      zh-CN: "上游条目：布局 %{layout}"
    inside:
      en: "Upstream entries: %{vault} / %{prefix}"
      zh-CN: "上游条目：%{vault} / %{prefix}"
    inside_layout:
      en: "Upstream entries: the Layout %{layout} / %{prefix}"
      zh-CN: "上游条目：布局 %{layout} / %{prefix}"
    vaults_failed:
      en: The Vaults this Workspace knows could not be read
      zh-CN: 无法读取此工作区已知的保险库
    layouts_failed:
      en: The Layouts of this Workspace could not be read
      zh-CN: 无法读取此工作区的布局
    not_workspace:
      en: This directory is not inside a Rorolala Workspace
      zh-CN: 此目录不在 Rorolala 工作区内
    not_fetched:
      en: The Layout of `%{vault}` has not been fetched here yet
      zh-CN: 尚未在此取回 `%{vault}` 的布局
    failed:
      en: The copy could not be read
      zh-CN: 无法读取副本
    failed_title:
      en: What the command line said
      zh-CN: 命令行的输出
    read_again:
      en: Read again
      zh-CN: 重新读取
    fetch:
      en: Fetch the Vault's Layout
      zh-CN: 取回保险库的布局
    checkin:
      en: Bring in
      zh-CN: 签入
    checkin_failed:
      en: The checkin from `%{vault}` did not finish
      zh-CN: 来自 `%{vault}` 的签入未能完成
    # What a checkin asks when not everything it was given can come in as it stands: what is in the way, and what may
    # be done about it. The counts are the plan's — one line per kind of thing in the way, so a drag of nine rows says
    # how many are already here under another name and how many cannot land at all.
    checkin_question:
      en: Some of this checkin does not fit
      zh-CN: 本次签入有一部分放不下
    checkin_elsewhere:
      en: "%{count} entries are already in this Layout under another path"
      zh-CN: "已有 %{count} 个条目以其他路径存在于当前布局中"
    checkin_taken:
      en: "%{count} entries cannot land where the Vault names them, because something else is already there"
      zh-CN: "有 %{count} 个条目无法落在保险库指定的位置，因为那里已有其他内容"
    checkin_here:
      en: "%{count} entries are already here, where the Vault names them"
      zh-CN: "有 %{count} 个条目已经就在保险库指定的位置上"
    checkin_move:
      en: Move local files (%{count})
      zh-CN: 移动本地文件（%{count}）
    checkin_partial:
      en: Bring in the rest (leave %{count} out)
      zh-CN: 签入其余条目（放弃 %{count} 个）
    checkin_abandon:
      en: Abandon this checkin
      zh-CN: 放弃本次签入
    checkin_moved_title:
      en: Local files moved
      zh-CN: 本地文件已移动
    checkin_moved:
      en: "%{count} local files were moved to the paths the Vault names"
      zh-CN: "%{count} 个本地文件已移动到保险库指定的路径"
    checkin_abandoned_title:
      en: Part of the checkin was left out
      zh-CN: 部分签入已放弃
    checkin_abandoned:
      en: "%{count} entries were left out of this checkin"
      zh-CN: "本次签入放弃了 %{count} 个条目"
    column_uuid:
      en: Uuid
      zh-CN: UUID
    column_owner:
      en: Owner
      zh-CN: 持有人
    copy_path:
      en: Copy the upstream path
      zh-CN: 复制上游路径
    copy_path_layout:
      en: Copy the path
      zh-CN: 复制路径
    path_title:
      en: The path upstream names it by
      zh-CN: 上游为它记录的路径
    path_title_layout:
      en: The path this Layout names it by
      zh-CN: 此布局为它记录的路径
    held:
      en: Already here
      zh-CN: 已在此
    held_title:
      en: This entry is already in the Layout being worked in
      zh-CN: 该条目已在当前布局中
    held_at:
      en: "It is named here at: %{path}"
      zh-CN: "它在此处记录为：%{path}"
    no_program:
      en: Nothing was done
      zh-CN: 未执行任何操作
    no_program_why:
      en: "`rola` could not be run here, so the work was not touched"
      zh-CN: "`rola` 无法在此运行，因此没有改动工作"
    # What a move that did not happen says: which entry, and — where the copy names one — who holds it, because an entry
    # held by another account is the usual reason the Vault refuses one. The reason itself is the command's own words
    # where it wrote any, and this one where it did not.
    move_refused_held:
      en: "`%{path}` could not be moved — %{holder} holds it"
      zh-CN: "`%{path}` 无法移动——它由 %{holder} 持有"
    move_refused:
      en: "`%{path}` could not be moved"
      zh-CN: "`%{path}` 无法移动"
    move_refused_why:
      en: "`%{to}` was not written: the Layout still names the entry where it was. An entry another account holds can be moved only by that account, or by an administrator of the Vault."
      zh-CN: "没有写入 `%{to}`：布局仍把条目记在原处。由他人持有的条目，只有持有人或保险库管理员才能移动。"

    # What the root of the place opens at, and what it says when there is no Vault to open: the work's own upstream is
    # the Vault the Layout being worked in tracks, and the Workspace's default Vault where it tracks none.
    no_root_title:
      en: No upstream layout to open
      zh-CN: 没有可打开的上游布局
    no_root:
      en: This Workspace has no default Vault, so there is no upstream Layout to show
      zh-CN: 此工作区没有默认保险库，无法查看上游布局
    unknown:
      en: Nothing here answers for `%{segment}`
      zh-CN: 没有插件应答 `%{segment}`

    # What a drop that moved nothing says, in this place's own words: the reasons are the Layout's — already there, a
    # path taken, a copy still being read — and none of them is something the browser could work out. The row that was
    # dropped on is the one whose answer it is, and the words are shown the moment the drag is let go.
    refused_not_a_drag:
      en: This is not something the upstream place can take
      zh-CN: 这不是上游地点能够接收的内容
    refused_not_a_folder:
      en: A list is not a folder — open it and drop into one of the things it lists
      zh-CN: 列表不是文件夹：请打开它，再放到它列出的某一项上
    refused_a_folder:
      en: "A folder is not moved: drop it on a directory to bring in what stands under it"
      zh-CN: "文件夹不会被移动：把它放到目录上即可签入其中的条目"
    refused_another_layout:
      en: An entry is moved within one Layout, and this one is of another
      zh-CN: 条目只能在同一布局内移动，而它属于另一个布局
    refused_reading:
      en: The copy this place reads is being read, or was never fetched, so nothing can be moved in it yet
      zh-CN: 此地读取的副本正在读取中，或尚未取回，暂时不能在其中移动条目
    refused_gone:
      en: The Layout no longer names this entry at that path
      zh-CN: 布局已不再在该路径上命名这条目
    refused_same:
      en: "`%{path}` is already under that folder"
      zh-CN: "`%{path}` 已经在该文件夹下"
    refused_taken:
      en: "Something is already named `%{path}`"
      zh-CN: "`%{path}` 已经有别的内容"
    refused_generic:
      en: The entry cannot be moved there
      zh-CN: 无法把该条目移到此处

  # What the Overview's progress panel says of the commands this plugin runs: a card per command, named for
  # what the command does, and a bar per task the command reports. A task that names itself is read by that
  # name, and one that does not is read by the direction its work moves — or as simply working.
  progress:
    checkin:
      en: Bringing entries in
      zh-CN: 正在签入条目
    path_move:
      en: Moving the entry upstream
      zh-CN: 正在移动上游条目
    sync:
      en: Syncing
      zh-CN: 同步数据
    fetch:
      en: Fetching the Layout
      zh-CN: 取回布局
    hold:
      en: Taking ownership
      zh-CN: 申请所有权
    giveup:
      en: Giving up ownership
      zh-CN: 放弃所有权
    retrack:
      en: Retracking
      zh-CN: 重新追踪
    track:
      en: Tracking
      zh-CN: 追踪新版本
    join:
      en: Joining
      zh-CN: 合并变体
    restore:
      en: Restoring
      zh-CN: 还原内容
    unmerge:
      en: Cancelling the merge
      zh-CN: 取消合并
    row_up:
      en: Uploading
      zh-CN: 上传中
    row_down:
      en: Updating
      zh-CN: 更新中
    working:
      en: Working…
      zh-CN: 处理中……

  # The Accounts dock: which account the work acts as, and what may be done about them. The rows are the
  # accounts `rola account` lists, and what a row offers is a run of `rola` — naming the account the work acts
  # as, making a pair, exporting a public key, taking a pair away. The two names `rola account` reads as its own
  # words cannot be an account, which is why making a pair under one of them is refused.
  accounts:
    refresh:
      en: Read the accounts again
      zh-CN: 重新读取账户
    name_watermark:
      en: New account name
      zh-CN: 新账户名
    create:
      en: Create
      zh-CN: 创建
    none:
      en: There are no accounts on this machine
      zh-CN: 本机没有任何账户
    current:
      en: Current
      zh-CN: 当前
    use:
      en: Use
      zh-CN: 使用
    export:
      en: Export public key
      zh-CN: 导出公钥
    export_title:
      en: Save the public key
      zh-CN: 保存公钥
    remove:
      en: Remove
      zh-CN: 移除
    remove_title:
      en: Remove this account?
      zh-CN: 要移除该账户吗？
    remove_message:
      en: "The key pair of `%{name}` will be deleted, and the identity it is cannot be got back. Confirm?"
      zh-CN: "`%{name}` 的密钥对将被删除，其身份无法找回。请确认。"
    forbidden:
      en: "`%{name}` is a command of `rola account`, so it cannot be an account name"
      zh-CN: "`%{name}` 是 `rola account` 的子命令，不能作为账户名"
    no_key:
      en: "No key file was found for `%{name}`"
      zh-CN: "没有找到 `%{name}` 的密钥文件"
    no_picker:
      en: This platform offers no file picker, so the key cannot be saved
      zh-CN: 当前平台没有文件选择面板，无法保存密钥
    no_program:
      en: This window was not opened by the command line, so it cannot run one
      zh-CN: 本窗口不是由命令行打开的，因此无法运行命令
    failed_list:
      en: The accounts could not be listed
      zh-CN: 无法列出账户
    failed_use:
      en: The account could not be made current
      zh-CN: 无法设为当前账户
    failed_create:
      en: The account could not be created
      zh-CN: 无法创建账户
    failed_export:
      en: The public key could not be saved
      zh-CN: 无法保存公钥
    failed_remove:
      en: The account could not be removed
      zh-CN: 无法移除账户

  # What the Overview offers to do about a row, one line each: what a button says and what it is hovered for
  # are the same words, since a button's label is what it does. Every one of them is a mode of `rola align`,
  # except taking ownership, which is `rola hold` — the same command the grid's own menu runs, so that the two
  # ways into it do one thing rather than two.
  operations:
    rebuild:
      en: Rebuild
      zh-CN: 重建文件
    restore_move:
      en: Undo
      zh-CN: 还原移动
    restore_content:
      en: Restore
      zh-CN: 还原内容
    confirm_rename:
      en: Confirm
      zh-CN: 确定重命名
    confirm_lost:
      en: Confirm
      zh-CN: 确认
    connect:
      en: Connect
      zh-CN: 连接至
    take_ownership:
      en: Hold
      zh-CN: 获取所有权
    cancel_merge:
      en: Cancel
      zh-CN: 取消该合并

    # What the two sides of a connection say while one is being made, in place of what they do. The button that
    # began it is waiting, and each one it could be finished on is an answer: three dots rather than a word,
    # because there is nothing to say yet, and 「组合」 rather than 「连接至」 again, because the second press is
    # not asking the same question as the first.
    connecting:
      en: "..."
      zh-CN: "…"
    pair:
      en: Pair
      zh-CN: 组合

    # What is said when a run could not be made at all, which is a window that was opened without the command
    # line beside it rather than a command that failed. What a command said about its own failure is its own
    # words and is shown as they are.
    failed:
      en: The operation could not be run
      zh-CN: 操作无法执行

    # The one operation that is asked about before it runs, because putting content back writes over what the
    # file holds now and what was changed between the two is work no command can recover; and the other one
    # that is, because cancelling a merge takes a file away, and the content it held is not kept anywhere else.
    restore_confirm_title:
      en: Restore content?
      zh-CN: 要还原内容吗？
    restore_confirm_message:
      en: "`%{path}` will be overwritten with the version the Layout records. What it holds now cannot be recovered."
      zh-CN: "`%{path}` 会被布局所记录的版本覆盖。它现在的内容无法找回。"
    cancel_merge_confirm_title:
      en: Cancel this merge?
      zh-CN: 要取消该合并吗？
    cancel_merge_confirm_message:
      en: "The variant file `%{path}` will be deleted and the merge ended. The file it was to be joined into is left as it holds now."
      zh-CN: "变体文件 `%{path}` 会被删除，合并到此结束。它原本要并入的文件则维持现状。"

  ownership:
    mine:
      en: You
      zh-CN: 你

    # What the badge of a lock says when the pointer rests on it, which is the whole of what holding a file
    # means to the person reading it: whether they may edit it, and on whose word. The words the column holds
    # are a name or nothing, so the sentence is the badge's own — and the column and the badge are two views of
    # one answer, which is why what they say is stated here rather than in the column's cell.
    #
    # The holder's name is the one value the phrase leaves a place for, and the phrase for the reader's own
    # file names nobody: "you" is not somebody else's name, and a lock that said "held by you" would be a lock
    # read as though it were another account's.
    mine_hover:
      en: You hold this file, so you can edit it
      zh-CN: 你正持有该文件，可编辑
    held_by:
      en: "%{holder} holds this file, so you cannot edit it"
      zh-CN: 该文件由 %{holder} 持有，无法编辑

  # What an entry's menu offers about who holds it. What is claimed is one file, or everything under a
  # directory — the command line takes a directory recursively — so the two are said apart. The forced
  # pair is shown while Shift is held: what it does is past the checks the plain pair makes, which is
  # worth saying twice, in the words and in the red the look gives it.
  ownership_menu:
    hold_file:
      en: Take ownership of this file
      zh-CN: 获得文件的所有权
    give_file:
      en: Give up ownership of this file
      zh-CN: 放弃文件的所有权
    hold_file_forced:
      en: Force taking ownership of this file
      zh-CN: 强制获得文件的所有权
    give_file_forced:
      en: Force giving up ownership of this file
      zh-CN: 强制放弃文件的所有权
    hold_directory:
      en: Take ownership of everything in this folder
      zh-CN: 获得目录下所有条目的所有权
    give_directory:
      en: Give up ownership of everything in this folder
      zh-CN: 放弃目录下所有条目的所有权
    hold_directory_forced:
      en: Force taking ownership of everything in this folder
      zh-CN: 强制获得目录下所有条目的所有权
    give_directory_forced:
      en: Force giving up ownership of everything in this folder
      zh-CN: 强制放弃目录下所有条目的所有权

  # What the menu says when the command it ran did not finish, and when there is no command to run.
  # Several entries are one run that is allowed to be partly done, so the words allow for some of it
  # having been changed and some refused; which of them, and why, is the command's own to say. This
  # window is only told which `rola` to run by the run that opened it, so a window opened on its own
  # has none to reach for.
  ownership_failed:
    en: Ownership could not be changed for everything chosen
    zh-CN: 所选条目的所有权未能全部更改
  ownership_unknown:
    en: This window was not opened by `rola`, so it does not know which one to run
    zh-CN: 本窗口不是由 `rola` 打开的，因此不知道要运行哪一个
