_version: 2

# What the window itself says. The keys are the same shape as the command line's, and a file here
# is read by the same reader, so what is written here and what is written there are written alike.

window:
  title:
    en: Rorolala Desktop
    zh-CN: Rorolala 桌面
  # What a window that is one dock is called: the dock, and which program it is a window of. The dock's own
  # name is the one its tab would have carried, and the program's is beside it so that a window of a dock's
  # own is still recognisably this program's.
  titled:
    en: "%{dock} — Rorolala Desktop"
    zh-CN: "%{dock} — Rorolala 桌面"
  minimize:
    en: Minimize
    zh-CN: 最小化
  maximize:
    en: Maximize
    zh-CN: 最大化
  restore:
    en: Restore
    zh-CN: 还原
  close:
    en: Close
    zh-CN: 关闭
