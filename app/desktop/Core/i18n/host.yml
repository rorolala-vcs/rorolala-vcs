_version: 2

# What the host itself says: the menu bar, the two kernel docks, and the notices it raises. The keys
# are the same shape as the command line's, and a file here is read by the same reader.
#
# A key that is a leaf and a key that is a step on the way to another cannot both exist under one
# name, so a menu's label key is a leaf of its own and the items under that menu are stated under a
# separate branch. The top-level menus a plugin adds to are declared by whichever of the two owns
# them: `menu.window` here, and the File System's own under its keys, since a menu nothing holds is a
# menu that should not be drawn.

window:
  notice:
    en: Notice
    zh-CN: 提示
  dismiss:
    en: Dismiss
    zh-CN: 知道了
  dialog:
    confirm:
      en: Confirm
      zh-CN: 确认
    cancel:
      en: Cancel
      zh-CN: 取消

menu:
  window:
    en: Window
    zh-CN: 窗口
  # What the Window menu holds besides the docks, which the window is built with rather than registered
  # under a key of its own: the way back to the main window, and what a dock's own tab offers.
  window_items:
    open_main:
      en: Open Main Window
      zh-CN: 打开主窗口
    # Offered by a window that is one dock, and only there: what it moves is the dock that window holds,
    # which is the one thing about a window of a dock's own that the main window does not already have.
    move_to_main:
      en: Move Back to Main Window
      zh-CN: 移动回主窗口
  dock:
    own_window:
      en: Move to Own Window
      zh-CN: 切换到独立窗口
    close:
      en: Close
      zh-CN: 关闭

dock:
  plugin_manager:
    en: Plugin Manager
    zh-CN: 插件管理器
  log:
    en: Log
    zh-CN: 日志
  preferences:
    en: Preferences
    zh-CN: 偏好设置

core:
  name:
    en: Core
    zh-CN: 核心
  empty_log:
    en: Nothing has been logged yet.
    zh-CN: 暂无日志。
  setting:
    # What is one colour whatever the window is drawn in, and the two variants' own ten grounds. The
    # ten are named for what a surface is rather than for the field they came from, because the field
    # name is a shape and this is what a person is choosing. The two variants are a step of their own
    # rather than `light` and `dark`, because those two names are already the appearance's options: one
    # key cannot be both a leaf and a step on the way to another.
    general:
      en: Both Looks
      zh-CN: 通用
    look:
      light:
        en: Light Look
        zh-CN: 亮色
      dark:
        en: Dark Look
        zh-CN: 暗色
    bright:
      en: Face
      zh-CN: 面
    mid:
      en: Ground
      zh-CN: 底
    dark:
      en: Hollow
      zh-CN: 凹
    front:
      en: Ink
      zh-CN: 前景
    splitter:
      en: Line
      zh-CN: 分隔线
    mode:
      en: Appearance
      zh-CN: 明暗模式
    # The three the appearance may be, under a step of their own rather than beside the row that names
    # them: the field is `core.setting.mode` and these are answered from `core.setting.appearance.<mode>`.
    appearance:
      system:
        en: Follow system
        zh-CN: 跟随系统
      light:
        en: Light
        zh-CN: 亮色
      dark:
        en: Dark
        zh-CN: 暗色
    primary:
      en: Primary colour
      zh-CN: 主色
    accent:
      en: Accent colour
      zh-CN: 强调色
    immediate:
      en: Takes effect at once.
      zh-CN: 立即生效。

setting:
  none:
    en: Nothing to set here.
    zh-CN: 这里没有可设置的项。
  reset:
    en: Reset
    zh-CN: 还原
  default:
    en: "Default: %{value}"
    zh-CN: "默认：%{value}"
  restart:
    en: Takes effect on the next start.
    zh-CN: 下次启动时生效。

plugin_manager:
  plugins:
    en: Plugins
    zh-CN: 插件
  problems:
    en: Problems
    zh-CN: 问题
  error:
    en: ERROR
    zh-CN: 错误
  fault:
    missing:
      en: "Depends on `%{dependency}`, which was not found."
      zh-CN: "依赖 `%{dependency}` 未找到。"
    disabled:
      en: "Depends on `%{dependency}`, which is disabled."
      zh-CN: "依赖 `%{dependency}` 已停用。"
    later:
      en: "Depends on `%{dependency}`, which comes after it."
      zh-CN: "依赖 `%{dependency}` 排在本插件之后。"
    unavailable:
      en: "Depends on `%{dependency}`, which cannot be enabled."
      zh-CN: "依赖 `%{dependency}` 无法启用。"
  not_loaded:
    en: not loaded
    zh-CN: 未加载
  next_start:
    en: Enabling, disabling and ordering take effect on the next start.
    zh-CN: 启用、禁用与排序在下次启动时生效。

log:
  level:
    en: Level
    zh-CN: 级别
  source:
    en: Source
    zh-CN: 来源
  message:
    en: Message
    zh-CN: 消息
  count:
    en: Count
    zh-CN: 次数
  clear:
    en: Clear
    zh-CN: 清空
