_version: 2

# What the host itself says: the menu bar, the two kernel docks, and the notices it raises. The keys
# are the same shape as the command line's, and a file here is read by the same reader.
#
# A key that is a leaf and a key that is a step on the way to another cannot both exist under one
# name, so a menu's label key is a leaf of its own and the items under that menu are stated under a
# separate branch. The menu path a plugin adds to is the label key, `menu.file` and `menu.window`.

