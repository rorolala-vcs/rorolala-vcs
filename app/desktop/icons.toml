# The pictures the Desktop draws, which is the one file adding one means editing.
#
# What is drawn is Google's Material Design icons, from the maintained mirror of the set. The set is not
# vendored: it is a shallow clone under `THIRD-PARTY/`, which git ignores, and every picture is drawn from
# that clone by `./run.sh icons` — so what is drawn is what the pinned commit holds, and another picture is
# another name below rather than another file copied into a plugin.
#
# The pictures are committed, so a build needs neither the clone nor a renderer: only drawing them does, and
# `export` draws them first, so what ships is always drawn from the pin. The license the set is under is
# copied into each directory the pictures are drawn into, so that what travels with a plugin says where its
# artwork came from.

[material]
url = "https://github.com/material-icons/material-icons"

# The whole of what "the icon set" means here: there is no history to travel, so another set is another
# clone, and the upstream is archived — this is expected to stay where it is.
commit = "af0ed9c0e1276bad43c4d6ca8e8aaa283e425195"

# One set per project, which is also where the pictures are drawn — the project's own `icons/` — and the
# namespace the keys are generated into.
#
# `key` is what a picture is handed over under, and the icon library is one namespace of them: a plugin's
# keys are its own, so two plugins may each contribute a `lock` without either being the other's.
#
# A project is a plugin unless it says otherwise, which is the word below: `source` is where it sits from
# the root of the tree. The host is not a plugin, so its set names where it is.

[[set]]
plugin = "FileSystemPlugin"
key = "rorolala_file_system"

# The toolbar's own pictures. `visibility` and `visibility_off` are the switch that shows what the rules
# hide — an eye, and an eye struck through — and `link` and `link_off` are whether a dock follows the whole
# or looks at a directory of its own; `arrow_back`, `arrow_forward`, `arrow_upward` and `refresh` are the
# four ways a browser moves, and `home` is the way back to the top of the platform, which is a place and
# not a direction: it is offered by the menu rather than by the toolbar, and a house is what the set draws
# a place a user starts from with.
#
# The rest are what an entry's menu is read by: `launch` opens it or shows it where the system keeps it,
# `file_copy` copies it or its path, `content_cut` cuts it, `content_paste` pastes onto it, `delete` removes
# it, `local_offer` renames it, and `create_new_folder` makes a directory beside it.
icons = [
    "visibility",
    "visibility_off",
    "link",
    "link_off",
    "arrow_back",
    "arrow_forward",
    "arrow_upward",
    "refresh",
    "home",
    "launch",
    "file_copy",
    "content_cut",
    "content_paste",
    "delete",
    "local_offer",
    "create_new_folder",
]

[[set]]
plugin = "RorolalaVCSPlugin"
key = "rorolala_vcs"

# What an entry's lock is drawn with, and what taking and letting go of one is: `lock` is somebody else
# holding it and is also what claiming it wears, `lock_open` is letting go of it, and `create` — the set's
# pencil — is the reader holding it, since holding it is what makes it theirs to change.
# `lock` and `lock_open` are what taking ownership and letting it go wear in an entry's menu, `create` is
# the pencil that marks the reader's own, and the last three are how a command's own report is read: what it
# said went wrong, what it said to be careful of, and what it said could be done about it. `refresh` is what
# reading the work again wears in the Overview's own strip, which is what the file browser's toolbar wears
# for the same thing: the two are one mark, and each plugin draws its own rather than reaching for the
# other's.
#
# `upload` and `download` are how a file stands beside upstream: the version recorded for it is ahead of
# what the Vault was told of, or behind it, and the arrows say which way the work would have to move to be
# in step — nothing is uploaded or downloaded by them, so the mark is of a direction rather than of an
# action. `call_split` is the third answer: the two sides have each moved on, so neither is based on the
# other and there is no direction the work could move in to settle it.
#
# `merge` is what a variant file waiting to be joined wears: the set draws two lines coming together into
# one, which is what the file is for — its content is to become part of the file beside it.
#
# The last four are what a file's own state is worn as on a tile, where there is no column to draw a dot in:
# `add` for a file the Layout does not name, `edit_note` for one whose content has changed or is waiting to
# be joined — a pencil over lines, which is the nearest this set has to an edited line, since its `edit` is
# the very picture `create` is and that one is already the lock's — `arrow_right_alt` for one that moved,
# and `priority_high` for a change that must not be recorded.
icons = [
    "lock",
    "create",
    "lock_open",
    "error",
    "warning",
    "live_help",
    "refresh",
    "upload",
    "download",
    "call_split",
    "merge",
    "add",
    "edit_note",
    "arrow_right_alt",
    "priority_high",
]

[[set]]
plugin = "RorolalaDesktop"
source = "app/desktop/Core"
key = "rorolala"

# The window's own buttons: the row at the top of the window wears them, and they are the program's
# pictures rather than the desktop's, because the title bar they sit in is the program's too.
#
# `minimize` is the set's bar, `close` its cross, `crop_square` the hollow square a window is drawn as
# while it is not maximized, and `filter_none` the two squares — one behind the other — that say pressing
# it puts the window back the size it was. Nothing here is `fullscreen` or `open_in_full`: this window
# has no full-screen button, and a picture for one would be a picture nothing wears.
icons = ["minimize", "crop_square", "filter_none", "close"]
