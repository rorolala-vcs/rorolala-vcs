# The pictures the product draws (the Desktop program's, its plugins', and the launcher's) which is the
# one file adding one means editing.
#
# What is drawn is Phosphor Icons, from `phosphor-icons/core`. The set is not vendored: it is a shallow
# clone under `THIRD_PARTY/`, which git ignores, and every picture is drawn from that clone by
# `cargo dev icons`, so what is drawn is what the pinned commit holds, and another picture is another name
# below rather than another file copied into a plugin.
#
# The pictures are committed, so a build needs neither the clone nor a renderer: only drawing them does, and
# `export` draws them first, so what ships is always drawn from the pin. The license the set is under is
# copied into each directory the pictures are drawn into, so that what travels with a plugin says where its
# artwork came from.

[phosphor]
url = "https://github.com/phosphor-icons/core"

# The whole of what "the icon set" means here: there is no history to travel, so another set is another
# clone. A commit rather than a branch, because a branch is a moving answer and a picture drawn from a
# different set every day is a picture that changes without a commit.
commit = "2b75f3ad12b420c9504ef05df8d2564a28f8500e"

# The weight every picture is drawn at: `thin`, `light`, `regular`, `bold`, `fill` or `duotone`. `regular`
# is the family's default, and its hollow shapes stay readable at the size a row and a window button wear
# them, which is what the maximize and the restore pictures are.
weight = "regular"

# One set per project, which is also where the pictures are drawn, the project's own `icons/`, and the
# namespace the keys are generated into.
#
# `key` is what a picture is handed over under, and the icon library is one namespace of them: a plugin's
# keys are its own, so two plugins may each contribute a `lock` without either being the other's.
#
# A project is a plugin unless it says otherwise, which is the word below: `source` is where it sits from
# the root of the tree. The host is not a plugin, so its set names where it is.

[[set]]
plugin = "FileSystemPlugin"
key = "rorolala_file_system"

# The toolbar's own pictures. `eye` and `eye-slash` are the switch that shows what the rules hide and
# `link` and `link-break` are whether a dock follows the whole or looks at a directory of its own;
# `arrow-left`, `arrow-right`, `arrow-up` and `arrow-clockwise` are the four ways a browser moves, and
# `house` is the way back to the top of the platform, which is a place and not a direction: it is offered
# by the menu rather than by the toolbar, and a house is what the set draws a place a user starts from
# with.
#
# `circle`, `radio-button` and `dot` are the three states a hide rule's popup draws: shown, gray and
# hidden. `dots-three-vertical` opens that popup, beside the eye in the toolbar's own group. `option` is
# what the top-level Operations menu wears: the glyph the keyboard's Option key carries, which is what a
# menu of optional behaviours is.
# The rest are what an entry's menu is read by: `arrow-square-out` opens it or shows it where the system
# keeps it, `copy` copies it or its path, `scissors` cuts it, `clipboard` pastes onto it, `trash` removes
# it, `tag` renames it, and `folder-plus` makes a directory beside it. `plus` is the mark a category of new
# things wears, which is the same picture the VCS plugin draws for the same word rather than a second one
# copied here.
icons = [
    "eye",
    "eye-slash",
    "circle",
    "radio-button",
    "dot",
    "dots-three-vertical",
    "option",
    "link",
    "link-break",
    "arrow-left",
    "arrow-right",
    "arrow-up",
    "arrow-clockwise",
    "house",
    "arrow-square-out",
    "copy",
    "scissors",
    "clipboard",
    "trash",
    "tag",
    "folder-plus",
    "plus",
    # The pictures the two docks this plugin registers are drawn as: the directory browser's folder and the
    # tree's nodes. What a registration names is worn by the item that opens the dock in the Window menu and at
    # the left of the dock's tab.
    "folder",
    "tree-structure",
]

[[set]]
plugin = "RorolalaVCSPlugin"
key = "rorolala_vcs"

# What an entry's lock is drawn with, and what taking and letting go of one is: `lock` is somebody else
# holding it and is also what claiming it wears, `lock-open` is letting go of it, and `pencil`, the set's
# pencil, is the reader holding it, since holding it is what makes it theirs to change.
# `lock` and `lock-open` are what taking ownership and letting it go wear in an entry's menu, `pencil` is
# the mark that says the reader's own, and the last three are how a command's own report is read: what it
# said went wrong, what it said to be careful of, and what it said could be done about it. `arrow-clockwise`
# is what reading the work again wears in the Overview's own strip, which is what the file browser's toolbar
# wears for the same thing: the two are one mark, and each plugin draws its own rather than reaching for the
# other's.
#
# `arrow-up` and `arrow-down` are how a file stands beside upstream: the version recorded for it is ahead of
# what the Vault was told of, or behind it, and the arrows say which way the work would have to move to be
# in step, nothing is uploaded or downloaded by them, so the mark is of a direction rather than of an
# action. `git-fork` is the third answer: the two sides have each moved on, so neither is based on the
# other and there is no direction the work could move in to settle it.
#
# `git-merge` is what a variant file waiting to be joined wears: the set draws two lines coming together
# into one, which is what the file is for, its content is to become part of the file beside it.
#
# The last four are what a file's own state is worn as on a tile, where there is no column to draw a dot in:
# `plus` for a file the Layout does not name, `note-pencil` for one whose content has changed or is waiting
# to be joined, a pencil over a page, `arrow-right` for one that moved, and `exclamation-mark` for a change
# that must not be recorded.
#
# `cloud-arrow-up`, `cloud-arrow-down` and `arrows-clockwise` are the three sync buttons in the Overview's
# strip, and they are the cloud's own arrows rather than the `arrow-up`/`arrow-down` above so that the two
# are told apart at a glance: what stands beside a file is a direction, and what is pressed is an exchange
# with the Vault that carries data both ways. The order they are read in is the command line's (up, then
# down, then both) and `arrows-clockwise` is the two arrows that turn into each other, which is what both
# is.
#
# `dots-three-vertical` is the button that opens what the three of them are told to leave out: three
# vertical beads, which is what this set draws for a menu of a few more choices.
#
# `copy` is what the Version Graph's node menu wears: two sheets, one in front of the other, which is the
# set's mark for copying something and the same picture the browser's own copy uses.
#
# `eye` and `eye-slash` are the switch in the Overview's strip that shows what the ignore rules govern,
# which is the browser's own pair for showing what its rules hide, drawn again here so that each plugin's
# keys stay its own.
icons = [
    "lock",
    "pencil",
    "lock-open",
    "warning-circle",
    "warning",
    "question",
    "arrow-clockwise",
    "eye",
    "eye-slash",
    "arrow-up",
    "arrow-down",
    "git-fork",
    "git-merge",
    "plus",
    "note-pencil",
    "arrow-right",
    "exclamation-mark",
    "cloud-arrow-up",
    "cloud-arrow-down",
    "arrows-clockwise",
    "dots-three-vertical",
    "copy",
    # `list-bullets` is the switch in the Version Graph's corner that reads one file's chain as a list of
    # versions: lines with a bead before each, which is what the drawing becomes.
    "list-bullets",
    # `tree` is what a rola-tree's folder icon wears, in the colour the tree's own id names: the set draws one
    # tree, which is what the directory is rather than what is in it.
    "tree",
    # What a path in a tree wears for how much of its work is staged: a full circle for all of it, a circle
    # with a bead for some, and an empty circle for none.
    "check-circle",
    "radio-button",
    "circle",
    # The pictures the docks this plugin registers are drawn as, which is what the Window menu lists each of
    # them by and what the left of its tab wears: the Overview is a list with its lines ticked, a reading of
    # the work that is done rather than a task, the Workspace is the work as a case, the Version Graph is two
    # arrows parting from one point, a change that goes one way through one file rather than a chart, and the
    # Accounts are the person the work acts as.
    "list-checks",
    "briefcase",
    "arrows-split",
    "user-circle-gear",
    # A badge is drawn on a tile at a dozen pixels, where the regular weight's thin strokes close up, so
    # each picture a badge wears is drawn again at bold under a key of its own. The regular keys above stay
    # what a menu, a progress capsule and a dock header wear, and only the badge producers name these.
    { key = "plus-bold", name = "plus", weight = "bold" },
    { key = "note-pencil-bold", name = "note-pencil", weight = "bold" },
    { key = "exclamation-mark-bold", name = "exclamation-mark", weight = "bold" },
    { key = "arrow-right-bold", name = "arrow-right", weight = "bold" },
    { key = "check-circle-bold", name = "check-circle", weight = "bold" },
    { key = "radio-button-bold", name = "radio-button", weight = "bold" },
    { key = "circle-bold", name = "circle", weight = "bold" },
    { key = "arrow-up-bold", name = "arrow-up", weight = "bold" },
    { key = "arrow-down-bold", name = "arrow-down", weight = "bold" },
    { key = "git-fork-bold", name = "git-fork", weight = "bold" },
    { key = "git-merge-bold", name = "git-merge", weight = "bold" },
    { key = "pencil-bold", name = "pencil", weight = "bold" },
    { key = "lock-bold", name = "lock", weight = "bold" },
    # What a restore wears in the Overview: putting the local copy back is discarding the change, and the
    # trash says so. Bold because it is drawn small, on the action buttons beside the rows.
    { key = "trash-bold", name = "trash", weight = "bold" },
]

[[set]]
plugin = "GitVCSPlugin"
key = "rorolala_git"

# The pictures this plugin draws: the mark a material wears when what it holds is not what the
# project's lock records, the down arrow the Open item wears, the same one the VCS plugin's Upstream item
# draws, and the arrow the restore's menu item wears. All are the artwork the VCS plugin draws for the same
# words, drawn here again so that this plugin's keys are its own, the way every set is one project's.
icons = [
    "note-pencil",
    "arrow-down",
    "arrow-clockwise",
    # `git-branch` is the top-level Git menu, and `app-window` is its Open item, which opens the git-rola
    # view rather than a version of one file.
    "git-branch",
    "app-window",
    # The picture a material wears when it is out of step with the lock is a tile badge, so it is drawn
    # again at bold under its own key. See the VCS set for why.
    { key = "note-pencil-bold", name = "note-pencil", weight = "bold" },
]

[[set]]
plugin = "RorolalaDesktop"
source = "app/desktop/Core"
key = "rorolala"

# The window's own buttons: the row at the top of the window wears them, and they are the program's
# pictures rather than the desktop's, because the title bar they sit in is the program's too.
#
# `minus` is the set's bar, `x` its cross, `square` the hollow square a window is drawn as while it is not
# maximized, and `copy-simple` the two squares, one behind the other, that say pressing it puts the window
# back the size it was. Nothing here is `corners-out` or `arrows-out-simple`: this window has no
# full-screen button, and a picture for one would be a picture nothing wears.
#
# The last three are the kernel's own docks, the ones the program itself registers rather than a plugin: the
# Plugin Manager is a puzzle piece, the Log is a list, and the Preferences are a machine's own gear. They are
# the program's pictures for the same reason the buttons above are, the docks are the kernel's, and each is
# worn by the item that opens its dock in the Window menu and at the left of the dock's tab.
#
# `rows` is the three bars the title row's button wears: the row no longer draws a menu bar, and the one
# button that opens it needs a picture that says so without a word. `hand` is the open hand beside it that a
# window of one dock is dragged back to the main window by, which is what taking hold of a thing rather than
# pressing it looks like.
icons = [
    "minus",
    "square",
    "copy-simple",
    "x",
    "puzzle-piece",
    "list",
    "gear",
    # `app-window` is the Window menu, which lists the docks and the way back to the main window.
    "app-window",
    "rows",
    "hand",
]

[[set]]
plugin = "TerminalPlugin"
key = "rorolala_terminal"

# The picture of this plugin's one dock, which is what the Window menu lists it by and what its tab wears: the
# set draws a window with a prompt in it, which is the shell's own mark rather than a picture of this program's.
icons = ["terminal-window"]

[[set]]
plugin = "SightPlugin"
key = "rorolala_sight"

# The pictures the preview dock draws. `eye` is the dock's own mark and the picture Auto falls back to;
# `info` is the corner tool that shows what the preview is made of; `text-t`, `image`, `cube` and `file` name
# the previewers in the folded list, with `arrows-left-right` for the diff and the two notices. The image
# previewer's tool dock adds the two rotation arrows, `compass` for putting the picture upright and
# `frame-corners` for resetting the view.
icons = ["eye", "info", "text-t", "image", "cube", "file", "arrows-left-right", "warning-circle", "x-circle", "arrow-counter-clockwise", "arrow-clockwise", "compass", "frame-corners"]

[[set]]
plugin = "RorolalaLauncher"
source = "app/launcher"
key = "rola_launcher"

# The launcher's own pictures, which are the buttons its window offers: the account it greets a person by,
# the Workspace it makes, the one it imports, a folder being opened, which is what choosing a directory that
# already holds a Workspace is, and the language its text is read in.
#
# The window's frame is the Desktop program's own, so the marks on it are that set's and are not stated
# again here: what is drawn for this project is only what its own window offers.
icons = ["user-circle", "plus-circle", "folder-open", "translate"]
