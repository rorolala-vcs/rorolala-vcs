[workspace]
resolver = "3"
members = [
    "app/cli/rola",
    "app/cli/setups",
    "modules/auth",
    "modules/protocol",
    "modules/vault",
    "modules/workspace"
]

[workspace.package]
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Members
librorolala = { path = "." }
rola = { path = "app/cli/rola" }
rorolala-auth = { path = "modules/auth" }
rorolala-cli-setups = { path = "app/cli/setups" }
rorolala-protocol = { path = "modules/protocol" }
rorolala-vault = { path = "modules/vault" }
rorolala-workspace = { path = "modules/workspace" }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[package]
name = "librorolala"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rorolala-auth.workspace = true
rorolala-protocol.workspace = true
rorolala-vault.workspace = true
rorolala-workspace.workspace = true

[build-dependencies]
serde_json.workspace = true
