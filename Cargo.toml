[workspace]
resolver = "3"
members = [
    "app/cli/rola",
    "app/cli/rola-daemon",
    "app/cli/setups",
    "app/ffi",
    "dev/bindgen",
    "modules/auth",
    "modules/daemon",
    "modules/errors",
    "modules/protocol",
    "modules/protocol-macros",
    "modules/storage",
    "modules/vault",
    "modules/workspace",
    "utils/cli-theme",
    "utils/configure",
    "utils/configure-macros",
    "utils/constants",
    "utils/lazyffi",
    "utils/lazyffi-core",
    "utils/lazyffi-macros",
    "utils/location",
    "utils/sandbox"
]

[workspace.package]
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Members
librorolala = { path = "." }
rola = { path = "app/cli/rola" }
rola-daemon = { path = "app/cli/rola-daemon" }
rorolala-auth = { path = "modules/auth" }
rorolala-cli-setups = { path = "app/cli/setups" }
rorolala-daemon = { path = "modules/daemon" }
rorolala-dev-bindgen = { path = "dev/bindgen" }
rorolala-errors = { path = "modules/errors" }
rorolala-ffi = { path = "app/ffi" }
rorolala-protocol = { path = "modules/protocol" }
rorolala-protocol-macros = { path = "modules/protocol-macros" }
rorolala-storage = { path = "modules/storage" }
rorolala-utils-cli-theme = { path = "utils/cli-theme" }
rorolala-utils-configure = { path = "utils/configure" }
rorolala-utils-configure-macros = { path = "utils/configure-macros" }
rorolala-utils-constants = { path = "utils/constants" }
rorolala-utils-lazyffi = { path = "utils/lazyffi" }
rorolala-utils-lazyffi-core = { path = "utils/lazyffi-core" }
rorolala-utils-lazyffi-macros = { path = "utils/lazyffi-macros" }
rorolala-utils-location = { path = "utils/location" }
rorolala-utils-sandbox = { path = "utils/sandbox" }
rorolala-vault = { path = "modules/vault" }
rorolala-workspace = { path = "modules/workspace" }

# CLI Framework
mingling = { version = "0.5.3", features = [
    "picker",
    "comp",
    "pathf",
] }

# Argument picking, on its own. The version has to be the one `mingling` resolves to, or the
# `SinglePickable` implemented against it would not be the trait `mingling::picker` reaches
# for and the two would be different traits with one name.
arg-picker = "0.3.2"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
toml = "0.8.23"
bincode2 = "2.0.1"

# Compression
lz4 = "1.28.1"
zstd = "0.13.3"

# CLI Rendering
bat = { version = "0.26.1", default-features = false, features = ["regex-fancy"] }
colored = "3.1.1"
console = "0.16.6"
prettytable-rs = { version = "0.10.0", default-features = false }
unicode-width = "0.2.2"

# Internationalization
rust-i18n = "4.2.2"

# Cryptography
blake3 = "1.8.3"
chacha20poly1305 = "0.10.1"
ed25519-dalek = "2.2.0"
hkdf = "0.12.4"
ml-kem = { version = "0.3.2", features = ["getrandom"] }
sha2 = "0.10.9"
x25519-dalek = { version = "2.0.1", features = ["getrandom"] }

# Filesystem
dirs = "6.0.0"

# Proc macro
annotate-snippets = "0.12.16"
just_fmt = "0.2.1"
just_template = "0.2.1"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
syn = { version = "3.0.5", features = ["full"] }

# Async Runtime
tokio = { version = "1.53.1", features = [
    "fs",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
] }

[package]
name = "librorolala"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rorolala-auth.workspace = true
rorolala-daemon.workspace = true
rorolala-errors.workspace = true
rorolala-protocol.workspace = true
rorolala-storage.workspace = true
rorolala-utils-constants.workspace = true
rorolala-utils-lazyffi.workspace = true
rorolala-utils-location.workspace = true
rorolala-vault.workspace = true
rorolala-workspace.workspace = true

[build-dependencies]
rorolala-dev-bindgen.workspace = true
serde_json.workspace = true
