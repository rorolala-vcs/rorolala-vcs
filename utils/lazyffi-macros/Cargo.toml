[package]
name = "rorolala-utils-lazyffi-macros"
version.workspace = true
edition.workspace = true

[lib]
proc-macro = true

[dependencies]
just_fmt.workspace = true
rorolala-utils-lazyffi-core.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

# `rorolala-utils-lazyffi` re-exports this crate, so depending on it is a cycle —
# which cargo allows for a dev-dependency, and which is what lets the example on the
# attribute itself be compiled rather than ignored.
[dev-dependencies]
rorolala-utils-lazyffi.workspace = true
